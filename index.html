<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#22392f">
<meta name="apple-mobile-web-app-title" content="Notes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" id="app-favicon" type="image/svg+xml" href="icons/icon-192.png">
<title>Notes</title>

<!--
  ===========================================================================
  NOTES — MOBILE APP (Single File, keine Dependencies)
  ===========================================================================
  Für Claude Code: Diese Datei ist eine eigenständige Mobile-App, kein
  responsives Desktop-Layout. Architektur:

  1) DATEN   — localStorage-Key "mdnotes.v1", kompatibel zur Desktop-Version:
               { folders:[{id,name,parentId}], notes:[{id,folderId,text,
                 createdAt,updatedAt,props:{status,due}}], trash:[], ui:{} }
               Titel einer Notiz = erste Zeile des Texts (ohne "# ").

  2) NAVIGATION — Zwei Ebenen, wie in nativen Apps:
               a) Tabs (#tabs): heute | notizen | board | suche  → showTab(id)
               b) Push-Screens (Stack über den Tabs): push({title, build})
                  schiebt einen Screen von rechts herein, pop() zurück.
                  Zurück-Geste/Hardware-Back wird über history.state bedient.

  3) SHEETS  — sheet({title, items}) = Bottom-Sheet mit Aktionen,
               confirmSheet(...) für destruktive Aktionen.

  4) EDITOR  — Markdown-Quelltext in <textarea> + Vorschau-Umschalter,
               Formatier-Leiste sitzt über der Tastatur (visualViewport).

  5) STYLING — CSS-Variablen; Themes in THEMES (6 Tokens pro Palette).

  Konventionen: Alles anfassbare ≥44px, Transitions
  cubic-bezier(.32,.72,0,1), Safe-Area-Insets überall, 100dvh statt 100vh.
  ===========================================================================
-->

<style>
:root{
  --bg:#2b4a3b; --surface:#315443; --surface-2:#3a6150; --line:#3f6553;
  --text:#eaf1e4; --muted:#93ad9b; --faint:#6d8a78;
  --accent:#dcee8a; --accent-ink:#22392f; --signal:#ef7d5f; --gold:#dcab52;
  --sans:"Avenir Next",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  /* Als Home-Bildschirm-App (display: standalone) meldet iOS diese Werte manchmal
     unzuverlässig: oben zu klein (Inhalt rutscht unter die Statusleiste), unten zu
     groß (unnötig viel Leerraum über der Home-Anzeige). Ein Mindestwert oben und ein
     Höchstwert unten fangen beide Richtungen ab: die Statusleiste ist auf jedem
     aktuellen iPhone mindestens 44pt hoch (Dynamic-Island-Geräte mehr, das bleibt
     erhalten), die Home-Anzeige-Reserve ist auf jedem Gerät mit Home-Anzeige exakt
     34pt (Geräte ohne Home-Anzeige melden echte 0, die bleiben ebenfalls erhalten). */
  --safe-t:max(env(safe-area-inset-top,0px), 44px);
  --safe-b:min(env(safe-area-inset-bottom,0px), 34px);
  --tab-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);}
body{
  font-family:var(--sans);color:var(--text);font-size:16px;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  user-select:none;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none;-webkit-user-select:text;user-select:text;}
::placeholder{color:var(--faint);}

#app{position:fixed;inset:0;display:flex;flex-direction:column;}

/* ---------- Tab-Ebene ---------- */
#tabviews{position:absolute;inset:0;bottom:0;}
.tabview{
  position:absolute;inset:0;display:none;flex-direction:column;
  padding-bottom:calc(var(--tab-h) + var(--safe-b));
}
.tabview.on{display:flex;}
.scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 0 28px;
}

/* ---------- Typografie-Signatur: gesperrte Versal-Mikrolabels ----------
   Das Kennzeichen dieses Stils: jede Angabe bekommt ein winziges, weit
   gesperrtes Label in Versalien, der Wert steht darunter auf einer feinen
   Linie — wie Felder auf einem Formular. */
.lbl{
  font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);line-height:1.2;
}
.lbl.accent{color:var(--accent);}
.lbl.sig{color:var(--signal);}

/* ---------- Kopfbereich ---------- */
.nav{
  flex:none;padding:calc(var(--safe-t) + 10px) 18px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  transition:padding .2s var(--ease),box-shadow .2s;
}
.nav h1{margin:0;font-size:32px;font-weight:600;letter-spacing:-.02em;transition:font-size .18s var(--ease);}
.nav .sub{font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.nav.compact h1{font-size:20px;}
.nav.compact{padding-bottom:10px;box-shadow:0 1px 0 var(--line);}
.nav-actions{display:flex;gap:2px;align-items:center;}
.iconbtn{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:background .15s,transform .12s;
}
.iconbtn:active{background:var(--surface);transform:scale(.92);}
.iconbtn svg{width:21px;height:21px;}
.iconbtn.accent{color:var(--accent);}
/* Sync-Anzeige: ohne sie bleibt ein fehlender oder fehlgeschlagener Abgleich unsichtbar
   — die Aufgabenliste wäre dann einfach leer, ohne dass man den Grund sieht. */
.syncdot{position:relative;}
.syncdot::after{
  content:"";position:absolute;right:6px;top:7px;width:8px;height:8px;border-radius:50%;
  background:var(--faint);border:2px solid var(--bg);
}
.syncdot.idle::after{background:var(--accent);}
.syncdot.pending::after,.syncdot.syncing::after{background:var(--gold);}
.syncdot.error::after{background:var(--signal);}
.hintbox{
  margin:0 18px;padding:16px 18px;border:1px dashed var(--line);border-radius:16px;
  display:flex;flex-direction:column;gap:10px;align-items:flex-start;
}
.hintbox .txt{font-size:14px;line-height:1.5;color:var(--muted);}
.hintbox button{
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:9px 16px;
}

/* Fortschrittsband unter dem Kopf (Anteil erledigt / in Arbeit / offen) */
.topbar-meter{display:flex;align-items:center;gap:8px;padding:0 18px 12px;flex:none;box-shadow:0 1px 0 var(--line);}
.topbar-meter .dot{width:8px;height:8px;border-radius:50%;background:var(--signal);flex:none;}
.topbar-meter .seg-line{flex:1;height:7px;border-radius:4px;background:var(--line);}
.topbar-meter .seg-line.a{background:var(--accent);}
.topbar-meter .seg-line.b{background:color-mix(in srgb,var(--accent) 55%,var(--line));}

/* ---------- Bausteine ---------- */
.section{padding:26px 18px 0;}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:0 2px 12px;
}
.section-head .h{font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--text);}
.section-head .sub{font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:5px;}
.section-head .link{color:var(--accent);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;}
.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;}
.card:active{background:var(--surface-2);}
.card + .card{margin-top:12px;}
.empty{color:var(--faint);font-size:14px;padding:20px;text-align:center;}
.badge{
  font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
}

/* Feld: Label oben, Wert darunter auf feiner Linie */
.fields{display:flex;gap:26px;margin-top:14px;}
.fld{min-width:62px;}
.fld .v{
  font-size:15.5px;margin-top:5px;padding-bottom:6px;border-bottom:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.fld .v.due{color:var(--signal);font-family:var(--mono);font-size:15px;}
.fld .v.mono{font-family:var(--mono);font-size:14.5px;}

/* Dünner Fortschrittsbalken mit vorangestelltem Status-Label */
.meterrow{display:flex;align-items:center;gap:14px;margin-top:16px;}
.meter{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s var(--ease);}
.meterrow .cnt{font-size:11.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums;}

/* Status-Segmente (Offen · In Arbeit · Blockiert · Erledigt) */
.statusbar{display:flex;gap:10px;margin-top:18px;}
.statusbar > div{flex:1;min-width:0;}
.statusbar .bar{height:20px;border-radius:5px;border:1px solid var(--line);}
.statusbar .on .bar{background:var(--accent);border-color:var(--accent);}
.statusbar .cap{margin-top:9px;font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);}
.statusbar .on .cap{color:var(--text);font-weight:700;}
.statusbar .note{margin-top:3px;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Verlauf-Timeline */
.tl{position:relative;padding-left:24px;}
.tl::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1px;background:var(--line);}
.tl-item{position:relative;padding:9px 0;}
.tl-item .dot{position:absolute;left:-24px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--faint);}
.tl-item.now .dot{background:var(--accent);}
.tl-item.sig .dot{background:var(--signal);border-radius:3px;}
.tl-item.first .dot{background:none;border:1.5px solid var(--faint);}
.tl-item .tl-t{font-size:16px;font-weight:600;}
.tl-item.sig .tl-t{color:var(--signal);}
.tl-item .tl-d{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:3px;}

/* Listenzeilen */
.rowwrap{position:relative;overflow:hidden;background:var(--signal);}
.rowwrap + .rowwrap .row::before{
  content:"";position:absolute;left:18px;right:0;top:0;height:1px;background:var(--line);
}
.row{
  position:relative;z-index:1;display:block;padding:16px 18px;background:var(--surface);
  transition:transform .22s var(--ease),background .12s;
}
.row.pressed{background:var(--surface-2);}
.row .head{display:flex;align-items:center;gap:12px;}
.row .ico{width:22px;flex:none;color:var(--muted);display:flex;align-items:center;justify-content:center;}
.row .ico svg{width:20px;height:20px;}
.row .ico.gold{color:var(--gold);}
.row .ico.accent{color:var(--accent);}
.row .txt{flex:1;min-width:0;}
.row .t{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .s{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.row .meta{font-size:12px;color:var(--faint);flex:none;font-family:var(--mono);}
.row .chev{width:8px;height:8px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(-45deg);flex:none;}
.row .circle{
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex:none;
  display:flex;align-items:center;justify-content:center;transition:all .16s var(--ease);
}
.row .circle:active{transform:scale(.86);}
.row .circle svg{width:12px;height:12px;opacity:0;color:var(--accent-ink);}
.row.done .circle{background:var(--accent);border-color:var(--accent);}
.row.done .circle svg{opacity:1;}
.row.done .t{color:var(--faint);}
.rowwrap .del{
  position:absolute;z-index:0;right:0;top:0;bottom:0;width:88px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
}

/* Aufgaben (Checklisten-Zeilen aus dem Notiztext) */
.task{display:flex;align-items:flex-start;gap:13px;padding:15px 18px;background:var(--surface);}
.task + .task{box-shadow:inset 0 1px 0 var(--line);}
.check{
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;transition:all .16s var(--ease);
}
.check:active{transform:scale(.86);}
.check svg{width:12px;height:12px;opacity:0;color:var(--accent-ink);}
.task.done .check{background:var(--accent);border-color:var(--accent);}
.task.done .check svg{opacity:1;}
.task .tt{flex:1;font-size:16px;line-height:1.4;font-weight:600;}
.task.done .tt{color:var(--faint);text-decoration:line-through;}
.task .src{
  display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-top:6px;
}

/* Segmented Control */
.seg{display:flex;padding:0 18px;margin:16px 0 0;gap:10px;}
.seg button{
  flex:1;padding:0 0 10px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);border-bottom:2px solid var(--line);transition:color .18s,border-color .18s;
}
.seg button.on{color:var(--text);border-bottom-color:var(--accent);}
.seg .n{font-size:10.5px;opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums;}

/* Suche */
.searchbar{padding:6px 18px 12px;flex:none;}
.searchbar .field{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:0 14px;height:46px;
}
.searchbar svg{width:18px;height:18px;color:var(--faint);flex:none;}
.searchbar input{flex:1;font-size:16px;}

/* Heute */
.hero{padding:4px 18px 0;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;}
.stat .n{font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;}
.stat .n.accent{color:var(--accent);}
.stat .l{font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:10px;}
.daily .body{font-size:15px;line-height:1.5;color:var(--muted);max-height:76px;overflow:hidden;margin-top:8px;white-space:pre-wrap;}

/* ---------- Tab-Bar (mit „+" in der Mitte statt schwebendem Knopf) ---------- */
#tabs{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);
  display:flex;align-items:stretch;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);transition:transform .22s var(--ease);
}
body.kb #tabs{transform:translateY(130%);}
#tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--faint);font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
}
#tabs button svg{width:22px;height:22px;transition:transform .12s;}
#tabs button.on{color:var(--accent);}
#tabs button:active svg{transform:scale(.9);}
#tabs button.plus{color:var(--accent);gap:0;}
#tabs button.plus svg{width:30px;height:30px;}
#tabs button.plus:active svg{transform:scale(.82);}

/* ---------- Push-Screens ---------- */
.push{
  position:absolute;inset:0;z-index:40;background:var(--bg);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .32s var(--ease);
  box-shadow:-14px 0 40px rgba(0,0,0,.3);
}
.push.in{transform:translateX(0);}
.push-nav{
  flex:none;display:flex;align-items:center;gap:6px;
  padding:calc(var(--safe-t) + 10px) 12px 12px;border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.push-nav.scrolled{border-bottom-color:var(--line);}
.push-nav .title{
  flex:1;text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;
}
.back{
  display:flex;align-items:center;gap:4px;color:var(--accent);height:38px;padding:0 6px;
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
}
.back svg{width:16px;height:16px;}
.push .scroll{padding-bottom:calc(var(--safe-b) + 28px);}
/* Titelzeile eines Push-Screens: große Überschrift + Kategorie darunter */
.push-title{padding:6px 18px 0;}
.push-title h2{margin:0;font-size:30px;font-weight:600;letter-spacing:-.02em;}
.push-title .cat{display:flex;align-items:center;gap:7px;margin-top:10px;color:var(--muted);}
.push-title .cat svg{width:15px;height:15px;}

/* Editor — Live-Markdown (wie in der Desktop-Quelle: die Syntax bleibt im
   Text stehen und wird nur in der Cursor-Zeile eingeblendet). */
.ed-meta{
  padding:2px 18px 12px;display:flex;gap:8px;align-items:center;
  font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.ed-meta .mico{display:flex;flex:none;}
.ed-meta .mico svg{width:15px;height:15px;}
#editor{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:6px 18px calc(var(--safe-b) + 46vh);
  font-size:17px;line-height:1.62;white-space:pre-wrap;word-break:break-word;
  outline:none;-webkit-user-select:text;user-select:text;caret-color:var(--accent);
}
#editor:empty::before{content:attr(data-placeholder);color:var(--faint);}
/* Die Zeilen-Spans bleiben inline (wie in der Quelle) — die Zeilenumbrüche
   kommen aus den "\n" im Text, die die Cursor-Rechnung braucht.
   Überschriften ab ## bekommen die Versal-Label-Optik des Stils: gesperrt,
   gedämpft, mit feiner Trennlinie darüber. text-transform ist rein visuell,
   der Text im DOM bleibt unverändert — Cursor- und Offset-Rechnung merken
   davon nichts. */
.line-title{display:inline-block;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.2;}
.line-h1{display:inline-block;font-size:23px;font-weight:600;letter-spacing:-.015em;line-height:1.3;margin-top:.6em;}
.line-h2,.line-h3,.line-h4,.line-h5,.line-h6{
  display:inline-block;width:100%;box-sizing:border-box;
  font-size:11.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  border-top:1px solid var(--line);margin-top:1.5em;padding-top:1.4em;line-height:1.4;
}
.line-h2.line-title,.line-h3.line-title{border-top:none;margin-top:0;padding-top:0;}
.line-h1 .marker{color:var(--accent);opacity:.55;font-weight:600;}
.line-h2 .marker,.line-h3 .marker,.line-h4 .marker{color:var(--accent);opacity:.6;}
.line-quote{color:var(--muted);font-style:italic;box-shadow:inset 3px 0 0 var(--line);padding-left:12px;}
.line-hr{display:inline-block;width:100%;color:transparent;background:linear-gradient(var(--line),var(--line)) center / 100% 1px no-repeat;}
.line-code-fence{color:var(--faint);font-family:var(--mono);font-size:14.5px;}
.line-code{font-family:var(--mono);font-size:14.5px;background:rgba(127,127,127,.14);
  box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:2px 8px;border-radius:6px;}
.line-list{display:inline-block;padding-left:1.4em;}
.line-list .marker{color:var(--accent);opacity:.75;}
.line-sub{margin-left:1.3em;}
.line-sub .marker{color:var(--accent);opacity:.6;}
.marker{color:var(--faint);font-weight:400;font-style:normal;}
/* font-size:0 statt display:none — die Zeichen bleiben für Cursor und Range im DOM */
.marker-hide{font-size:0;}
.line-cursor .marker-hide{font-size:inherit;}
#editor strong{font-weight:700;}
#editor em{font-style:italic;}
#editor del{opacity:.6;}
.md-code{font-family:var(--mono);font-size:14.5px;background:rgba(127,127,127,.14);padding:2px 6px;border-radius:5px;}
.md-link{color:var(--accent);text-decoration:none;}
.md-url{color:var(--faint);}
.md-wikilink{color:var(--accent);}
.md-wikilink.missing{color:var(--muted);text-decoration:underline dotted;}
.md-tag{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:6px;padding:0 6px;}
/* Aufgaben: Pille mit rundem Kästchen, direkt im Text abhakbar */
.line-checkbox{
  display:inline-block;width:100%;box-sizing:border-box;margin:5px 0;padding:11px 16px 11px 13px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);font-size:16.5px;line-height:1.4;font-weight:600;
}
.line-checkbox > .marker:first-child{font-size:0;}
.line-checkbox .md-checkbox{font-size:0;padding:0;margin-right:12px;vertical-align:middle;}
.line-checkbox .md-checkbox::before{
  content:"";display:inline-block;width:21px;height:21px;border-radius:50%;
  border:1.5px solid var(--faint);vertical-align:middle;transition:background .15s,border-color .15s;
}
.line-checkbox.checked{color:var(--faint);}
.line-checkbox.checked .md-checkbox::before{
  background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface);
}

/* Tastatur-Toolbar */
#kbbar{
  position:absolute;left:0;right:0;bottom:0;z-index:45;display:none;
  gap:4px;padding:7px 8px calc(7px + var(--safe-b));
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
#kbbar::-webkit-scrollbar{display:none;}
#kbbar.on{display:flex;}
#kbbar button{
  flex:none;min-width:44px;height:38px;padding:0 12px;border-radius:10px;background:var(--bg);
  font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:center;
}
#kbbar button:active{background:var(--accent);color:var(--accent-ink);}
#kbbar .sp{flex:1;min-width:8px;}
#kbbar .done{color:var(--accent);font-weight:700;}

/* ---------- Bottom-Sheet ---------- */
#scrim{
  position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .24s var(--ease);
}
#scrim.on{opacity:1;pointer-events:auto;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:51;
  background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:8px 10px calc(var(--safe-b) + 10px);
  transform:translateY(102%);transition:transform .3s var(--ease);
  max-height:88dvh;overflow-y:auto;box-shadow:0 -12px 40px rgba(0,0,0,.4);
}
.sheet.on{transform:translateY(0);}
.grab{width:38px;height:4px;border-radius:2px;background:var(--faint);margin:2px auto 12px;opacity:.5;}
.sheet-title{
  text-align:center;font-size:10.5px;font-weight:600;color:var(--muted);padding:0 0 12px;
  letter-spacing:.16em;text-transform:uppercase;
}
.sheet-item{
  display:flex;align-items:center;gap:14px;min-height:54px;padding:10px 14px;border-radius:14px;font-size:16px;font-weight:600;
}
.sheet-item:active{background:var(--surface-2);}
.sheet-item svg{width:20px;height:20px;color:var(--muted);flex:none;}
.sheet-item.danger,.sheet-item.danger svg{color:var(--signal);}
.sheet-item .val{
  margin-left:auto;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;
}
.sheet-cancel{
  margin-top:10px;text-align:center;min-height:52px;color:var(--muted);
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--bg);
}
.sheet-input{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:14px;font-size:16px;margin:4px 0 10px;
}
.sheet-primary{
  width:100%;min-height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);
  font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;
}
.sheet-primary:active{opacity:.8;}
.swatches{display:flex;gap:10px;padding:6px 8px 12px;}
.swatch{flex:1;aspect-ratio:1.5;border-radius:14px;border:2px solid transparent;position:relative;overflow:hidden;}
.swatch.on{border-color:var(--accent);}
.swatch i{position:absolute;right:8px;bottom:8px;width:14px;height:14px;border-radius:50%;}

/* Toast */
#toast{
  position:absolute;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 22px);transform:translate(-50%,16px);
  z-index:60;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  padding:12px 20px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:all .24s var(--ease);
}
#toast.on{opacity:1;transform:translate(-50%,0);}
</style>

<body>

<div id="app">
  <div id="tabviews">
    <section class="tabview on" id="tab-aufgaben"></section>
    <section class="tabview" id="tab-notizen"></section>
  </div>

  <nav id="tabs"></nav>
  <div id="scrim"></div>
  <div id="toast"></div>
</div>

<script>
(function(){
"use strict";

/* ========================= 1. Daten ========================= */
const KEY = "mdnotes.v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function seed(){
  const f = uid(), now = Date.now();
  return {
    folders:[{id:f,name:"Notizen",parentId:null}],
    notes:[
      {id:uid(),folderId:f,createdAt:now,updatedAt:now,props:{status:"doing"},
       text:"Willkommen\n\nDas hier ist deine mobile Notiz-App. Tippe unten rechts auf **+** für eine neue Notiz.\n\n- [ ] Erste Aufgabe anlegen\n- [ ] Notiz in den Status *Aktiv* schieben\n- [x] App geöffnet\n\nAufgaben schreibst du als `- [ ]` — sie erscheinen automatisch auf **Heute** und im **Board**.\n\nTags wie #ideen sortieren quer durch alle Notizen, [[Wiki-Links]] verbinden Notizen."},
      {id:uid(),folderId:f,createdAt:now-864e5,updatedAt:now-864e5,props:{},
       text:"Einkauf\n\n- [ ] Kaffee\n- [ ] Haferflocken\n- [ ] Olivenöl"}
    ],
    trash:[], ui:{}
  };
}
let store;
try{ store = JSON.parse(localStorage.getItem(KEY)) || seed(); }catch(e){ store = seed(); }
store.folders ||= []; store.notes ||= []; store.trash ||= []; store.ui ||= {};
store.notes.forEach(n => { n.props ||= {}; });

let saveT;
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
function save(){ clearTimeout(saveT); saveT = setTimeout(persist, 180); scheduleSync(); }

/* ---- Ableitungen ---- */
const titleOf = n => (n.text.split("\n")[0] || "").replace(/^#+\s*/,"").trim() || "Ohne Titel";
const bodyOf  = n => n.text.split("\n").slice(1).join("\n").trim();
const previewOf = n => bodyOf(n).replace(/[#*`>\-\[\]]/g," ").replace(/\s+/g," ").trim().slice(0,90);
const folderName = id => (store.folders.find(f=>f.id===id)||{}).name || "Ohne Ordner";
const byRecent = (a,b) => b.updatedAt - a.updatedAt;

function relTime(ts){
  const d = Date.now()-ts, m = 60000, h = 36e5, day = 864e5;
  if(d < m) return "gerade";
  if(d < h) return Math.floor(d/m)+" Min";
  if(d < day) return Math.floor(d/h)+" Std";
  if(d < 7*day) return Math.floor(d/day)+" Tg";
  return new Date(ts).toLocaleDateString("de-DE",{day:"2-digit",month:"short"});
}
function allTasks(){
  const out = [];
  store.notes.forEach(n => n.text.split("\n").forEach((l,i)=>{
    const m = /^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/.exec(l);
    if(m) out.push({noteId:n.id, line:i, done:m[1].toLowerCase()==="x", text:m[2].trim(), note:n});
  }));
  return out;
}
function toggleTask(t){
  const n = store.notes.find(x=>x.id===t.noteId); if(!n) return;
  const lines = n.text.split("\n");
  lines[t.line] = lines[t.line].replace(/\[( |x|X)\]/, t.done ? "[ ]" : "[x]");
  n.text = lines.join("\n"); n.updatedAt = Date.now(); save();
}
function newNote(folderId){
  const n = {id:uid(), folderId: folderId || (store.folders[0]||{}).id || null,
             createdAt:Date.now(), updatedAt:Date.now(), text:"", props:{}};
  store.notes.unshift(n); save(); return n;
}
function trashNote(n){
  store.notes = store.notes.filter(x=>x.id!==n.id);
  store.trash.unshift({...n, deletedAt:Date.now()});
  save();
}
function tagsOf(n){ return [...new Set((n.text.match(/(^|\s)#([\wÄÖÜäöüß/-]+)/g)||[]).map(s=>s.trim().slice(1)))]; }

/* ========================= 1b. Account & Sync (Supabase, plain fetch) =========
   Identisch zur Desktop-Version: gleiche Supabase-Zugangsdaten, gleiche Tabellen,
   gleiches Last-Write-Wins-Verfahren über updatedAt, gleiche Tombstones für
   Löschungen. So landen Notizen von hier auch auf dem Mac und umgekehrt. */
const SYNC_CFG_KEY = "mdnotes.sync.cfg", SYNC_SESSION_KEY = "mdnotes.sync.session", SYNC_STATE_KEY = "mdnotes.sync.state";
function readJson(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function writeJson(k, v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const sync = {
  cfg: readJson(SYNC_CFG_KEY),
  session: readJson(SYNC_SESSION_KEY),
  state: readJson(SYNC_STATE_KEY) || { lastPull:0, known:{} },
  status:"off", message:"", timer:null, busy:false, again:false,
  ui: { email:"", codeSent:false, info:"", error:"" }
};
let lastEditAt = 0;

function syncEnabled(){ return !!(sync.cfg && sync.cfg.url && sync.cfg.key && sync.session); }
/* Wolkensymbol im Kopf beider Tabs, der Punkt daran zeigt den Abgleich:
   grau = kein Konto, gelb = läuft, grün = aktuell, rot = Fehler. Tippen öffnet das Konto. */
function syncDotBtn(){
  return el("button",{class:"iconbtn syncdot "+(syncEnabled() ? sync.status : "off"),
    html:I.cloud, title:"Konto & Sync", onclick:openAccount});
}
function setSyncStatus(status, message){
  sync.status = status; sync.message = message || "";
  document.querySelectorAll(".syncdot").forEach(b=>{
    b.className = "iconbtn syncdot " + (syncEnabled() ? status : "off");
  });
  const st = document.getElementById("sync-status-mobile");
  if(st){
    const label = { idle:"Synchronisiert", pending:"Änderungen ausstehend", syncing:"Synchronisiere…", error:"Sync-Fehler" }[status] || "";
    st.textContent = label + (message ? ": " + message : "");
    st.style.color = status === "error" ? "var(--signal)" : "var(--muted)";
  }
}
function saveSyncState(){ writeJson(SYNC_STATE_KEY, sync.state); }
function normalizeSupabaseUrl(url){
  return url.trim().replace(/\/(rest|auth|storage|realtime|functions)\/v1.*$/i, "").replace(/\/+$/, "");
}
function baseUrl(){ return normalizeSupabaseUrl(sync.cfg.url); }
async function apiFetch(path, opts){
  opts = opts || {};
  if(sync.session && sync.session.expires_at - Date.now() < 60000) await refreshSession();
  const headers = Object.assign({ "apikey": sync.cfg.key, "Content-Type": "application/json" }, opts.headers || {});
  if(sync.session && !opts.noAuth) headers["Authorization"] = "Bearer " + sync.session.access_token;
  const res = await fetch(baseUrl() + path, { method: opts.method || "GET", headers, body: opts.body });
  if(!res.ok){
    let msg = res.status + "";
    try{ const j = await res.json(); msg += " " + (j.msg || j.message || j.error_description || j.error || j.hint || JSON.stringify(j)).slice(0,160); }catch(e){}
    throw new Error(msg);
  }
  if(res.status === 204) return null;
  const ct = res.headers.get("content-type") || "";
  return ct.includes("json") ? res.json() : res.text();
}
function setSession(s, email){
  sync.session = {
    access_token: s.access_token, refresh_token: s.refresh_token,
    expires_at: Date.now() + ((s.expires_in || 3600) * 1000),
    email: email || (s.user && s.user.email) || (sync.session && sync.session.email) || ""
  };
  writeJson(SYNC_SESSION_KEY, sync.session);
}
async function refreshSession(){
  const res = await fetch(baseUrl() + "/auth/v1/token?grant_type=refresh_token", {
    method:"POST", headers:{ "apikey": sync.cfg.key, "Content-Type":"application/json" },
    body: JSON.stringify({ refresh_token: sync.session.refresh_token })
  });
  if(!res.ok){ logoutSync(true); throw new Error("Sitzung abgelaufen – bitte neu anmelden."); }
  setSession(await res.json());
}
async function sendLoginCode(email){
  await apiFetch("/auth/v1/otp", { method:"POST", noAuth:true, body: JSON.stringify({ email, create_user:true }) });
}
async function verifyLoginCode(email, token){
  const s = await apiFetch("/auth/v1/verify", { method:"POST", noAuth:true, body: JSON.stringify({ type:"email", email, token }) });
  setSession(s, email);
  sync.state = { lastPull:0, known:{} };
  saveSyncState();
}
function logoutSync(silent){
  if(sync.session && !silent){ apiFetch("/auth/v1/logout", { method:"POST" }).catch(()=>{}); }
  sync.session = null; writeJson(SYNC_SESSION_KEY, null);
  sync.state = { lastPull:0, known:{} }; saveSyncState();
  setSyncStatus("off");
}
function scheduleSync(){
  if(!syncEnabled()) return;
  setSyncStatus("pending");
  clearTimeout(sync.timer);
  sync.timer = setTimeout(syncNow, 1500);
}
async function syncNow(){
  if(!syncEnabled()) return;
  if(sync.busy){ sync.again = true; return; }
  sync.busy = true;
  setSyncStatus("syncing");
  try{
    await pullChanges();
    await pushChanges();
    setSyncStatus("idle", sync.legacy ? "alte DB-Struktur – Migration aus schema.sql ausführen" : "");
  }catch(e){
    setSyncStatus("error", e.message);
    toast("Sync-Fehler: " + e.message);
  }finally{
    sync.busy = false;
    if(sync.again){ sync.again = false; scheduleSync(); }
  }
}
async function pushChanges(){
  const known = sync.state.known, now = Date.now();
  const notes = store.notes.filter(n => (known["n:"+n.id] || 0) < (n.updatedAt || 1));
  const folders = store.folders.filter(f => (known["f:"+f.id] || 0) < (f.updatedAt || 1));
  if(folders.length){
    await apiFetch("/rest/v1/folders?on_conflict=user_id,id", { method:"POST", headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(folders.map(f=>({ id:f.id, parent_id:f.parentId||null, name:f.name, collapsed:!!f.collapsed, updated_at:f.updatedAt||1, deleted_at:null }))) });
    folders.forEach(f => known["f:"+f.id] = f.updatedAt || 1);
  }
  if(notes.length){
    const rows = notes.map(n=>{
      const r = { id:n.id, folder_id:n.folderId||null, text:n.text, created_at:n.createdAt||now, updated_at:n.updatedAt||1, deleted_at:null };
      if(!sync.legacy){ r.source = n.source || null; r.edited_by = n.editedBy || null; r.props = n.props || null; }
      return r;
    });
    try{
      await apiFetch("/rest/v1/notes?on_conflict=user_id,id", { method:"POST", headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
    }catch(e){
      if(!sync.legacy && /column|source|edited_by/i.test(e.message)){
        sync.legacy = true;
        rows.forEach(r => { delete r.source; delete r.edited_by; delete r.props; });
        await apiFetch("/rest/v1/notes?on_conflict=user_id,id", { method:"POST", headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
      } else throw e;
    }
    notes.forEach(n => known["n:"+n.id] = n.updatedAt || 1);
  }
  const noteIds = new Set(store.notes.map(n=>n.id)), folderIds = new Set(store.folders.map(f=>f.id));
  for(const key of Object.keys(known)){
    const id = key.slice(2), isNote = key.startsWith("n:");
    if(isNote ? noteIds.has(id) : folderIds.has(id)) continue;
    await apiFetch("/rest/v1/" + (isNote ? "notes" : "folders") + "?id=eq." + encodeURIComponent(id), { method:"PATCH",
      headers:{ "Prefer":"return=minimal" }, body: JSON.stringify({ deleted_at: now, updated_at: now }) });
    delete known[key];
  }
  saveSyncState();
}
async function pullChanges(){
  const since = sync.state.lastPull, known = sync.state.known;
  const q = "?select=*&updated_at=gt." + since + "&order=updated_at.asc";
  const [folders, notes] = await Promise.all([ apiFetch("/rest/v1/folders" + q), apiFetch("/rest/v1/notes" + q) ]);
  let maxTs = since, changed = false, currentChanged = false;
  folders.forEach(r=>{
    maxTs = Math.max(maxTs, r.updated_at);
    const local = store.folders.find(f=>f.id===r.id);
    if(r.deleted_at){
      if(local && (local.updatedAt||0) <= r.updated_at){ store.folders = store.folders.filter(f=>f.id!==r.id); delete known["f:"+r.id]; changed = true; }
      return;
    }
    if(!local){ store.folders.push({ id:r.id, name:r.name, parentId:r.parent_id, collapsed:!!r.collapsed, updatedAt:r.updated_at }); changed = true; }
    else if((local.updatedAt||0) < r.updated_at){ Object.assign(local, { name:r.name, parentId:r.parent_id, collapsed:!!r.collapsed, updatedAt:r.updated_at }); changed = true; }
    else return;
    known["f:"+r.id] = r.updated_at;
  });
  notes.forEach(r=>{
    maxTs = Math.max(maxTs, r.updated_at);
    const local = store.notes.find(n=>n.id===r.id);
    if(r.deleted_at){
      if(local && (local.updatedAt||0) <= r.updated_at){
        store.notes = store.notes.filter(n=>n.id!==r.id); delete known["n:"+r.id]; changed = true;
        if(edNote && edNote.id === r.id) edNote = null;
      }
      return;
    }
    if(!local){ store.notes.push({ id:r.id, folderId:r.folder_id, text:r.text, createdAt:r.created_at, updatedAt:r.updated_at, source:r.source||undefined, editedBy:r.edited_by||undefined, props:r.props||{} }); changed = true; }
    else if((local.updatedAt||0) < r.updated_at){
      Object.assign(local, { folderId:r.folder_id, text:r.text, updatedAt:r.updated_at, source:r.source||local.source, editedBy:r.edited_by||local.editedBy, props:r.props||local.props });
      changed = true;
      if(local === edNote) currentChanged = true;
    }
    else return;
    known["n:"+r.id] = r.updated_at;
  });
  sync.state.lastPull = maxTs;
  saveSyncState();
  if(!changed) return;
  persist();
  if(edNote){
    if(!store.notes.some(n=>n.id===edNote.id)) pop();
    else if(currentChanged && Date.now() - lastEditAt > 3000){
      const off = Math.min(getCaretOffset(edEl), edNote.text.length);
      edPrev = [];
      renderInto(edNote.text);
      setCaretOffset(edEl, off);
      if(edOnChange) edOnChange();
    }
  }
  renderers[curTab] && renderers[curTab]();
}
setInterval(()=>{ if(syncEnabled() && !sync.busy && sync.status !== "pending") syncNow(); }, 20000);
window.addEventListener("online", ()=> syncNow());
window.addEventListener("focus", ()=>{ if(syncEnabled() && !sync.busy) syncNow(); });

function openAccount(){
  push((scr, nav)=>{
    const sc = el("div",{class:"scroll"});
    const draw = ()=>{
      sc.innerHTML = "";
      const u = sync.ui;
      const wrap = el("div",{class:"section", style:"padding-top:10px;display:flex;flex-direction:column;gap:10px"});
      if(!sync.cfg){
        const urlInp = el("input",{class:"sheet-input", placeholder:"Supabase URL (https://xyz.supabase.co)"});
        const keyInp = el("input",{class:"sheet-input", placeholder:"Anon Key"});
        wrap.append(urlInp, keyInp,
          el("button",{class:"sheet-primary", text:"Verbinden", onclick:()=>{
            const url = urlInp.value.trim(), key = keyInp.value.trim();
            if(!/^https:\/\/.+/.test(url) || key.length < 20){ toast("Bitte URL und Key prüfen"); return; }
            sync.cfg = { url: normalizeSupabaseUrl(url), key }; writeJson(SYNC_CFG_KEY, sync.cfg); draw();
          }}),
          el("div",{style:"color:var(--faint);font-size:13px", text:"Gleiche Zugangsdaten wie in der Desktop-Version (SETUP-SUPABASE.md)."})
        );
      } else if(!sync.session){
        const emailInp = el("input",{class:"sheet-input", type:"email", placeholder:"E-Mail", value:u.email||""});
        wrap.append(emailInp);
        if(!u.codeSent){
          wrap.append(el("button",{class:"sheet-primary", text:"Anmelde-Code senden", onclick: async ()=>{
            u.email = emailInp.value.trim(); u.error = ""; u.info = "";
            if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u.email)){ u.error = "Bitte eine gültige E-Mail eingeben."; draw(); return; }
            try{ await sendLoginCode(u.email); u.codeSent = true; u.info = "Code verschickt – bitte E-Mail prüfen."; }
            catch(e){ u.error = e.message; }
            draw();
          }}));
        } else {
          const tokenInp = el("input",{class:"sheet-input", inputmode:"numeric", placeholder:"6-stelliger Code"});
          wrap.append(tokenInp,
            el("button",{class:"sheet-primary", text:"Anmelden", onclick: async ()=>{
              const token = tokenInp.value.trim().replace(/\s+/g,""); u.error = "";
              if(!token){ u.error = "Bitte den Code eingeben."; draw(); return; }
              try{ await verifyLoginCode(u.email, token); u.codeSent = false; u.info = ""; toast("Angemeldet"); draw(); setSyncStatus("pending"); syncNow(); }
              catch(e){ u.error = e.message; draw(); }
            }}),
            el("button",{class:"sheet-cancel", text:"Andere E-Mail", onclick:()=>{ u.codeSent=false; u.error=""; u.info=""; draw(); }})
          );
        }
        if(u.error || u.info) wrap.append(el("div",{style:"font-size:13px;color:"+(u.error?"var(--signal)":"var(--muted)"), text:u.error||u.info}));
        wrap.append(el("div",{class:"sheet-cancel", text:"Verbindung entfernen", onclick:()=>{ logoutSync(true); sync.cfg=null; writeJson(SYNC_CFG_KEY,null); draw(); }}));
      } else {
        wrap.append(
          el("div",{style:"font-size:15px", html:"Angemeldet als <b>"+esc(sync.session.email||"")+"</b>"}),
          el("div",{id:"sync-status-mobile", style:"font-size:13px;color:var(--muted)"}),
          el("button",{class:"sheet-primary", text:"Jetzt synchronisieren", onclick:()=>{ setSyncStatus("pending"); syncNow(); }}),

function el(tag, attrs, kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(k === "class") e.className = v;
    else if(k === "html") e.innerHTML = v;
    else if(k === "text") e.textContent = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(v != null) e.setAttribute(k, v);
  }
  (Array.isArray(kids)?kids:kids?[kids]:[]).filter(Boolean).forEach(k=>
    e.appendChild(typeof k === "string" ? document.createTextNode(k) : k));
  return e;
}

/* Push-Stack */
const stack = [];
function push(build, opts){
  const scr = el("section",{class:"push"});
  const nav = el("div",{class:"push-nav"},[
    el("button",{class:"back",onclick:pop},[el("span",{html:I.back}), el("span",{text:"Zurück"})]),
    el("div",{class:"title",text:(opts&&opts.title)||""}),
    (opts && opts.action) ? opts.action : el("div",{style:"width:78px"})
  ]);
  scr.appendChild(nav);
  const content = build(scr, nav);
  if(content) scr.appendChild(content);
  document.getElementById("app").appendChild(scr);
  void scr.offsetWidth;                 // Reflow erzwingen, damit die Transition läuft
  scr.classList.add("in");
  stack.push({scr, onPop: opts && opts.onPop});
  history.pushState({depth:stack.length}, "");
  return scr;
}
/* Nur ein Weg zurück: jede Zurück-Aktion läuft über history.back(),
   popstate entfernt den Screen — so kann nie doppelt gepoppt werden. */
function pop(){ if(stack.length) history.back(); }
function popNow(){
  const top = stack.pop(); if(!top) return;
  top.onPop && top.onPop();
  top.scr.classList.remove("in");
  setTimeout(()=>top.scr.remove(), 360);
  renderers[curTab] && renderers[curTab]();
}
window.addEventListener("popstate", ()=>{
  closeSheet();

});
