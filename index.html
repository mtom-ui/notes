  const n1 = toks[i + 1], n2 = toks[i + 2];
  const isNoun = t => t && !t.start && /^[A-ZÄÖÜ]/.test(t.w) && !WC_NONE.has(t.w.toLowerCase());
  if(WC_ADJ_INFL.test(lw) && n1 && n1.gapPlain && (isNoun(n1) || (WC_ADJ_INFL.test(n1.w) && /^[a-zäöüß]/.test(n1.w) && n2 && n2.gapPlain && isNoun(n2)))) return "adj";
  // Gebeugtes ge-Partizip = Adjektiv: „abgeschlossene", „gebrachten"
  const stem = lw.replace(/(?:e|en|er|es|em)$/, "");
  if(stem !== lw && /ge[a-zäöüß]{2,}(?:t|en)$/.test(stem) && WC_PARTICIPLE.test(stem)) return "adj";
  if(WC_PARTICIPLE.test(lw)) return "verb";
  if(/^(?:be|er|ver|ent|zer|ge|an|auf|aus|ein)[a-zäöüß]+ig(?:en|t|te|ten)$/.test(lw)) return "verb";   // erledigen, bestätigt
  if(WC_ADJ_SUFFIX.test(lw)) return "adj";
  const prev = toks[i - 1];
  if(prev && WC_PRED.has(prev.w.toLowerCase()) && !WC_VERB_END.test(lw)) return "adj";             // „ist klar"
  if(/[a-zäöüß]{3,}er$/.test(lw)) return "adj";                                                    // besser, schneller
  if(WC_VERB_END.test(lw)) return "verb";
  return "adv";
}

// Wörter einer Zeile mit Wortart: [{ at, w, cls }] — oder null für eine englische Zeile
function wordTokens(t){
  // Tokens: Wörter (mit Bindestrich), HTML-Entities und Platzhalter (\x01N\x02) — die letzten beiden bleiben unberührt
  const toks = [];
  const re = new RegExp("&[#a-z0-9]+;|\\x01\\d+\\x02|["+W+"]+(?:-["+W+"]+)*", "g");
  let m, last = 0, plainCount = 0, enCount = 0;
  while((m = re.exec(t))){
    const gap = t.slice(last, m.index), word = /^[A-Za-zÄÖÜäöüß]/.test(m[0]) && !/\d$/.test(t.slice(0, m.index));
    const tok = { w: m[0], at: m.index, word, gapPlain: !/[.!?:;,()"„“]/.test(gap),
                  start: !toks.length || /[.!?:]/.test(gap) || (toks.length && !toks[toks.length - 1].word && /[.!?:]\s*$/.test(gap)) };
    if(word){ plainCount++; if(WC_EN.has(m[0].toLowerCase())) enCount++; }
    toks.push(tok); last = m.index + m[0].length;
  }
  if(enCount >= 2 && enCount * 4 >= plainCount) return null;                    // englische Zeile: auslassen
  const words = toks.filter(x => x.word);
  // Füll-Wendungen zuerst: alle Wörter der Wendung bekommen „fill"
  const fill = new Set();
  words.forEach((tok, i) => WC_FILL_PHRASES.forEach(ph => {
    if(ph.every((p, k) => words[i + k] && words[i + k].w.toLowerCase() === p && (k === 0 || words[i + k].gapPlain)))
      ph.forEach((_, k) => fill.add(i + k));
  }));
  return words.map((tok, i) => ({ at: tok.at, w: tok.w, cls: fill.has(i) ? "fill" : wordClass(tok, i, words, tok.start) }));
}
// Rückfall ohne Highlight API: Wörter als <span class="wc-…"> in den Zeilentext
function applyWordClasses(t){
  const toks = wordTokens(t);
  if(!toks) return t;
  let out = "", pos = 0;
  toks.forEach(tok => {
    out += t.slice(pos, tok.at) + (tok.cls ? '<span class="wc-'+tok.cls+'">'+tok.w+'</span>' : tok.w);
    pos = tok.at + tok.w.length;
  });
  return out + t.slice(pos);
}

/* Wortarten über die CSS Highlight API (Chrome 105+, Safari 17.2+): die Farben liegen als Ranges über
   dem Text, ohne ihn in tausende Spans zu zerlegen. Mit Spans musste der Browser bei jedem Tastendruck
   den Umbruch der ganzen Notiz neu rechnen (8.500 Wörter: 31 ms pro Taste), so sind es ~6 ms.
   Ein MutationObserver färbt jede neu gerenderte Zeile nach und räumt die Ranges ersetzter Zeilen ab. */
const WC_USE_HL = !!(window.CSS && CSS.highlights && window.Highlight);
const wcHl = {}, wcLineRanges = new WeakMap();
const WC_KEYS = ["noun","verb","adj","adv","conj","fill"];
if(WC_USE_HL) WC_KEYS.forEach(k => { wcHl[k] = new Highlight(); });
function wcClearLine(line){
  const rs = wcLineRanges.get(line);
  if(rs){ rs.forEach(([k, r]) => wcHl[k].delete(r)); wcLineRanges.delete(line); }
}
function wcApplyLine(line){
  wcClearLine(line);
  if(!line.classList || !line.classList.contains("line") || /line-(?:code|table|hr|title|tsep)/.test(line.className)) return;
  // Text der Zeile ohne Markdown-Zeichen, Code und URLs; übersprungene Stücke zählen als Leerzeichen
  const parts = []; let text = "";
  const tw = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
  while(tw.nextNode()){
    const n = tw.currentNode, p = n.parentElement;
    if(p && p.closest(".marker, code, .md-url, .md-tag")){ text += " "; continue; }
    parts.push({ n, start: text.length }); text += n.nodeValue;
  }
  const toks = wordTokens(text);
  if(!toks) return;
  const at = off => { let i = parts.length - 1; while(i > 0 && parts[i].start > off) i--; return parts[i]; };
  const list = [];
  toks.forEach(tok => {
    if(!tok.cls) return;
    const a = at(tok.at), b = at(tok.at + tok.w.length - 1);
    if(!a || !b) return;
    // StaticRange statt Range: live Ranges müsste der Browser bei jeder Textänderung alle nachführen
    const r = new StaticRange({ startContainer: a.n, startOffset: tok.at - a.start, endContainer: b.n, endOffset: tok.at + tok.w.length - b.start });
    wcHl[tok.cls].add(r); list.push([tok.cls, r]);
  });
  wcLineRanges.set(line, list);
}
function wcRefreshAll(){
  if(!WC_USE_HL) return;
  WC_KEYS.forEach(k => wcHl[k].clear());
  if(wordClassesOn() && edEl) edEl.querySelectorAll(":scope > .line").forEach(wcApplyLine);
  applyWcHidden();
}
// Jede neu gerenderte Zeile im offenen Editor nachfärben, ersetzte Zeilen abräumen
let wcObs = null;
function wcWatch(ed){
  if(!WC_USE_HL) return;
  if(wcObs) wcObs.disconnect();
  wcObs = new MutationObserver(muts => {
    if(!wordClassesOn()) return;
    muts.forEach(m => {
      m.removedNodes.forEach(n => { if(n.nodeType === 1) wcClearLine(n); });
      m.addedNodes.forEach(n => { if(n.nodeType === 1) wcApplyLine(n); });
    });
  });
  wcObs.observe(ed, { childList:true });
}
const WC_LEGEND = [["noun","Nomen","--st-weak"],["verb","Verben","--st-passive"],["adj","Adjektive","--st-filler"],
  ["adv","Adverbien","--st-repeat"],["conj","Konjunktionen","--st-nominal"],["fill","Füllwörter","--faint"]];
const wordClassesOn = () => !!store.ui.wordClasses;
const wcHidden = () => store.ui.wcHidden || [];
function applyWcHidden(){
  WC_LEGEND.forEach(([k]) => document.body.classList.toggle("wc-off-" + k, wcHidden().includes(k)));
  if(WC_USE_HL) WC_KEYS.forEach(k => { if(wcHidden().includes(k) || !wordClassesOn()) CSS.highlights.delete("wc-" + k); else CSS.highlights.set("wc-" + k, wcHl[k]); });
}
function rerenderEditor(){ if(edEl && edNote){ const off = getCaretOffset(edEl); edPrev = []; renderInto(edNote.text); if(document.activeElement === edEl) setCaretOffset(edEl, off); } wcRefreshAll(); }
function wcSheet(){
  const dot = v => '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5.5" fill="var(' + v + ')"/></svg>';
  sheet({title:"Wortarten", items:[
    {label: wordClassesOn() ? "Ausschalten" : "Einschalten", icon:I.check, keepOpen:true,
      onTap:()=>{ store.ui.wordClasses = !wordClassesOn(); save(); rerenderEditor(); wcSheet(); }},
    ...(wordClassesOn() ? WC_LEGEND.map(([k, label, v]) => ({ label, icon: dot(v), value: wcHidden().includes(k) ? "aus" : "an", keepOpen:true,
      onTap:()=>{ const h = wcHidden(); store.ui.wcHidden = h.includes(k) ? h.filter(x => x !== k) : h.concat(k); save(); applyWcHidden(); wcSheet(); } })) : [])
  ]});
}

function renderInline(raw){
  let t = escapeHtml(raw);
  const stash = [];
  const put = html => { stash.push(html); return "\u0001" + (stash.length-1) + "\u0002"; };

  t = t.replace(/`([^`]+)`/g, (m, code) =>
    put('<span class="marker marker-hide">`</span><code class="md-code">'+code+'</code><span class="marker marker-hide">`</span>'));
  t = t.replace(/\[\[([^\[\]\n]+?)\]\]/g, (m, title) => {
    const missing = !findNoteByTitle(title.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">"));
    return put('<span class="marker marker-hide">[[</span><span class="md-wikilink'+(missing?" missing":"")+'">'+title+'</span><span class="marker marker-hide">]]</span>');
  });
  // Bild-Syntax vor der Link-Regel, sonst würde die "[alt](url)" aus "![alt](url)" herausgreifen.
  // Die Bildunterschrift ist der Standard-Markdown-„Titel" (in Anführungszeichen) — Tippen aufs
  // Bild fragt danach (editImageCaption weiter unten).
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]*)(?:\s+"([^"]*)")?\)/g, (m, alt, url, title) => {
    const pending = /^img:[a-z0-9]+$/.test(url);
    const rawMd = "![" + unescapeHtmlEntities(alt) + "](" + unescapeHtmlEntities(url) + (title !== undefined ? ' "' + unescapeHtmlEntities(title) + '"' : "") + ")";
    const shown = pending
      ? '<span class="md-image-pending"><i class="spin"></i>'+(alt || "Bild wird hochgeladen…")+'</span>'
      : '<span class="md-image-wrap" data-md="'+escAttr(rawMd)+'"><img class="md-image" src="'+url+'" alt="'+alt+'" loading="lazy"><span class="md-caption">'+(title || '')+'</span></span>';
    let hidden = '<span class="marker marker-hide">![</span><span class="marker md-url marker-hide">'+alt+'</span><span class="marker marker-hide">](</span><span class="md-url marker-hide">'+url+'</span>';
    if(title !== undefined) hidden += '<span class="marker marker-hide"> "</span><span class="marker md-url marker-hide">'+title+'</span><span class="marker marker-hide">"</span>';
    hidden += '<span class="marker marker-hide">)</span>';
    return put(hidden + shown);
  });
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, txt, url) =>
    put('<span class="marker marker-hide">[</span><a class="md-link" href="'+url+'" target="_blank" rel="noopener">'+txt+'</a><span class="marker marker-hide">](</span><span class="md-url marker-hide">'+url+'</span><span class="marker marker-hide">)</span>'));
  t = t.replace(/(\*\*|__)([^\s].*?)\1/g, (m, mark, inner) =>
    put('<span class="marker marker-hide">'+mark+'</span><strong>'+inner+'</strong><span class="marker marker-hide">'+mark+'</span>'));
  t = t.replace(/(~~)([^\s].*?)\1/g, (m, mark, inner) =>
    put('<span class="marker marker-hide">'+mark+'</span><del>'+inner+'</del><span class="marker marker-hide">'+mark+'</span>'));
  t = t.replace(/(\*|_)([^\s*_].*?)\1/g, (m, mark, inner) =>
    put('<span class="marker marker-hide">'+mark+'</span><em>'+inner+'</em><span class="marker marker-hide">'+mark+'</span>'));
  t = t.replace(TAG_RE, (m, pre, tag) => pre + put('<span class="md-tag" data-tag="'+tag.toLowerCase()+'">#'+tag+'</span>'));
  if(wordClassesOn() && !WC_USE_HL) t = applyWordClasses(t);

  return t.replace(/\u0001(\d+)\u0002/g, (m, i) => stash[+i]);
}

function renderLine(raw, idx, state){
  const titleClass = idx === 0 ? " line-title" : "";
  let m;
  if(/^```/.test(raw)){
    state.inCode = !state.inCode;
    return '<span class="line line-code-fence" data-line="'+idx+'"><span class="marker">'+escapeHtml(raw)+'</span></span>';
  }
  if(state.inCode) return '<span class="line line-code" data-line="'+idx+'">'+(raw === "" ? ZWS : escapeHtml(raw))+'</span>';
  if(state.tw && state.tw[idx]) return renderTableLine(raw, idx, state.tw[idx], titleClass);
  if((m = /^(#{1,6})(\s+)(.*)$/.exec(raw)))
    return '<span class="line line-h'+m[1].length+titleClass+'" data-line="'+idx+'"><span class="marker marker-hide">'+escapeHtml(m[1]+m[2])+'</span>'+renderInline(m[3])+'</span>';
  if((m = /^>(\s?)(.*)$/.exec(raw)))
    return '<span class="line line-quote'+titleClass+'" data-line="'+idx+'"><span class="marker marker-hide">'+escapeHtml(">"+m[1])+'</span>'+renderInline(m[2])+'</span>';
  if((m = /^(\s*[-*]\s)\[([ xX])\](\s.*)$/.exec(raw))){
    const checked = m[2].toLowerCase() === "x";
    return '<span class="line line-list line-checkbox'+(checked?" checked":"")+titleClass+'" data-line="'+idx+'"><span class="marker">'+escapeHtml(m[1])+'</span><span class="md-checkbox" data-line="'+idx+'">'+escapeHtml("["+m[2]+"]")+'</span>'+renderInline(m[3])+'</span>';
  }
  if((m = /^(\s*[-*]\s)(.*)$/.exec(raw)))
    // The bullet's own marker is font-size:0 (the dot comes from ::before instead), so an empty
    // item would leave no visible-sized text node for the caret to render in.
    return '<span class="line line-list line-bullet'+titleClass+'" data-line="'+idx+'"><span class="marker">'+escapeHtml(m[1])+'</span>'+(m[2] === "" ? ZWS : renderInline(m[2]))+'</span>';
  if((m = /^(\s*\d+\.\s)(.*)$/.exec(raw)))
    return '<span class="line line-list'+titleClass+'" data-line="'+idx+'"><span class="marker">'+escapeHtml(m[1])+'</span>'+renderInline(m[2])+'</span>';
  if((m = /^(\s+[ivxlcdm]+\.\s)(.*)$/.exec(raw)) && parseListLine(raw))
    return '<span class="line line-list line-sub'+titleClass+'" data-line="'+idx+'"><span class="marker">'+escapeHtml(m[1])+'</span>'+renderInline(m[2])+'</span>';
  if(raw.trim().length > 0 && /^(-{3,}|\*{3,}|_{3,})$/.test(raw.trim()))
    return '<span class="line line-hr" data-line="'+idx+'">'+escapeHtml(raw)+'</span>';
  return '<span class="line'+titleClass+'" data-line="'+idx+'">'+(raw === "" ? ZWS : renderInline(raw))+'</span>';
}

/* ---- Listen: Aufzählung, Nummern und i/ii/iii-Unterpunkte ---- */
const ROMAN_MAP = [[1000,"m"],[900,"cm"],[500,"d"],[400,"cd"],[100,"c"],[90,"xc"],[50,"l"],[40,"xl"],[10,"x"],[9,"ix"],[5,"v"],[4,"iv"],[1,"i"]];
function intToRoman(n){ let out=""; for(const [v,s] of ROMAN_MAP){ while(n>=v){ out+=s; n-=v; } } return out; }
function romanToInt(s){
  const vals={i:1,v:5,x:10,l:50,c:100,d:500,m:1000}; let total=0;
  for(let i=0;i<s.length;i++){ const cur=vals[s[i]], next=vals[s[i+1]]||0; total += cur<next ? -cur : cur; }
  return total;
}
function parseListLine(line){
  let m;
  if((m = /^(\s*)([-*]\s)(\[[ xX]\]\s)?(.*)$/.exec(line)))
    return {indent:m[1],type:"bullet",sym:m[2][0],check:m[3]||"",num:0,marker:m[1]+m[2]+(m[3]||""),content:m[4]};
  if((m = /^(\s*)(\d+)\.\s(.*)$/.exec(line)))
    return {indent:m[1],type:"number",sym:"",check:"",num:parseInt(m[2],10),marker:m[1]+m[2]+". ",content:m[3]};
  if((m = /^(\s+)([ivxlcdm]+)\.\s(.*)$/.exec(line))){
    const n = romanToInt(m[2]);
    if(n > 0 && intToRoman(n) === m[2])
      return {indent:m[1],type:"roman",sym:"",check:"",num:n,marker:m[1]+m[2]+". ",content:m[3]};
  }
  return null;
}
function makeMarker(indent, type, sym, num, check){
  if(type === "bullet") return indent + sym + " " + check;
  if(type === "number") return indent + num + ". ";
  return indent + intToRoman(num) + ". ";
}
function renumberLists(lines){
  let counters = {};
  return lines.map(line=>{
    const li = parseListLine(line);
    if(!li){ if(line.trim() !== "") counters = {}; return line; }
    const k = li.indent.length;
    Object.keys(counters).forEach(key=>{ if(+key > k) delete counters[key]; });
    if(li.type === "bullet"){ counters[k] = {type:"bullet",num:0}; return line; }
    const prev = counters[k];
    const num = prev && prev.type === li.type ? prev.num + 1 : 1;
    counters[k] = {type:li.type,num};
    return num === li.num ? line : makeMarker(li.indent, li.type, li.sym, num, "") + li.content;
  });
}
function parentListItem(lines, idx, indentLen){
  for(let i=idx-1;i>=0;i--){
    const li = parseListLine(lines[i]);
    if(li && li.indent.length < indentLen) return li;
    if(!li && lines[i].trim() !== "") break;
  }
  return null;
}
function siblingListItem(lines, idx, indentLen){
  for(let i=idx-1;i>=0;i--){
    const li = parseListLine(lines[i]);
    if(li && li.indent.length === indentLen) return li;
    if(li && li.indent.length < indentLen) return null;
    if(!li && lines[i].trim() !== "") return null;
  }
  return null;
}
function lineStartsOf(lines){
  const starts = []; let acc = 0;
  for(let i=0;i<lines.length;i++){ starts.push(acc); acc += lines[i].length + 1; }
  return starts;
}
function lineIndexAndColAt(lines, lineStarts, off){
  for(let i=0;i<lines.length;i++){ if(off <= lineStarts[i] + lines[i].length) return {line:i, col: off - lineStarts[i]}; }
  const last = lines.length - 1;
  return {line:last, col: lines[last].length};
}

/* ========================= 6. Editor-Screen ========================= */
let edEl = null, edNote = null, edPrev = [], edOnChange = null;

function inCodeBeforeLine(lines, idx){
  let inCode = false;
  for(let i=0;i<idx;i++) if(/^```/.test(lines[i])) inCode = !inCode;
  return inCode;
}
/* Tabellen: Spaltenbreiten je Tabelle (in Zeichen, gedeckelt), damit die Zellen untereinander stehen.
   Der Text bleibt 1:1 erhalten (Pipes nur unsichtbar) — Cursor und Bearbeiten funktionieren wie sonst. */
const TABLE_RE = /^\s*\|.*\|\s*$/, TABLE_SEP_RE = /^\s*\|[\s:|-]+\|\s*$/;
const tableCells = raw => raw.trim().replace(/^\||\|$/g, "").split("|");
function tableLayout(lines){
  const tw = {};
  let inCode = false, i = 0;
  while(i < lines.length){
    if(/^```/.test(lines[i])){ inCode = !inCode; i++; continue; }
    if(inCode || !TABLE_RE.test(lines[i])){ i++; continue; }
    const start = i, widths = [];
    while(i < lines.length && TABLE_RE.test(lines[i])){
      if(!TABLE_SEP_RE.test(lines[i])) tableCells(lines[i]).forEach((c, k) => { widths[k] = Math.min(18, Math.max(widths[k] || 3, c.trim().length)); });
      i++;
    }
    for(let k = start; k < i; k++) tw[k] = { widths, head: k === start && i - start > 1 && TABLE_SEP_RE.test(lines[start + 1]) };
  }
  return tw;
}
function renderTableLine(raw, idx, t, titleClass){
  if(TABLE_SEP_RE.test(raw)) return '<span class="line line-tsep" data-line="'+idx+'"><span class="marker">'+escapeHtml(raw)+'</span></span>';
  const lead = raw.match(/^\s*\|/)[0], trail = raw.match(/\|\s*$/)[0];
  const cells = raw.slice(lead.length, raw.length - trail.length).split("|");
  let html = '<span class="marker tpipe">'+escapeHtml(lead)+'</span>';
  cells.forEach((c, k) => {
    html += '<span class="tcell" style="min-width:calc('+((t.widths[k] || 3) * 0.62)+'em + 18px)">'+(c === "" ? ZWS : renderInline(c))+'</span>';
    html += '<span class="marker tpipe">'+escapeHtml(k < cells.length - 1 ? "|" : trail)+'</span>';
  });
  return '<span class="line line-table'+(t.head ? " line-thead" : "")+titleClass+'" data-line="'+idx+'">'+html+'</span>';
}
function fullRebuild(lines){
  const state = {inCode:false, tw: tableLayout(lines)};
  let html = "";
  lines.forEach((l, i) => {
    // Trennzeile |---| unsichtbar an die Kopfzeile hängen (samt Zeilenumbruch, der dort per nowrap
    // zusammenfällt) — sonst bliebe unter dem Tabellenkopf eine leere Zeile stehen.
    if(state.tw[i] && i > 0 && state.tw[i - 1] && state.tw[i - 1].head && TABLE_SEP_RE.test(l)){
      html = html.replace(/<\/span>$/, '<span class="tsep-in" data-line="'+i+'">'+escapeHtml("\n" + l)+'</span></span>');
      return;
    }
    html += (i ? "\n" : "") + renderLine(l, i, state);
  });
  edEl.innerHTML = html;
}
/* Für jede Überschrift die Kette der übergeordneten (Zeile 0 ist der Notiztitel und zählt nicht mit,
   Codeblöcke auch nicht). Läuft nach jedem Rendern über alle, weil eine geänderte Überschrift die Pfade
   aller folgenden ändert. Gleiche Logik wie am Desktop. */
function updateHeadingPaths(lines){
  const stack = [];
  let inCode = false;
  lines.forEach((raw, i) => {
    if(/^```/.test(raw)){ inCode = !inCode; return; }
    if(inCode || i === 0) return;
    const m = /^(#{1,6})\s+(.*)$/.exec(raw);
    if(!m) return;
    const level = m[1].length;
    while(stack.length && stack[stack.length - 1].level >= level) stack.pop();
    const path = stack.map(h => h.title).join("  ›  ");
    const el = edEl.querySelector('.line[data-line="'+i+'"]');
    if(el){ if(path) el.setAttribute("data-path", path); else el.removeAttribute("data-path"); }
    stack.push({ level, title: m[2].replace(/[*_`]/g, "").trim() || "…" });
  });
}
function renderInto(text){
  const lines = text.split("\n");
  let full = lines.length !== edPrev.length;
  if(!full) for(let i=0;i<lines.length;i++){
    if(lines[i] === edPrev[i]) continue;
    if(/^```/.test(lines[i]) || /^```/.test(edPrev[i])){ full = true; break; }
    if(TABLE_RE.test(lines[i]) || TABLE_RE.test(edPrev[i] || "")){ full = true; break; }   // Spaltenbreiten hängen an der ganzen Tabelle
  }
  if(full){ fullRebuild(lines); edPrev = lines; updateHeadingPaths(lines); return; }
  for(let i=0;i<lines.length;i++){
    if(lines[i] === edPrev[i]) continue;
    const tmp = document.createElement("div");
    tmp.innerHTML = renderLine(lines[i], i, {inCode: inCodeBeforeLine(lines, i)});
    const old = edEl.querySelector('.line[data-line="'+i+'"]');
    if(old) old.replaceWith(tmp.firstChild);
  }
  edPrev = lines;
  updateHeadingPaths(lines);
}

/* ---- Cursor-Position als Zeichen-Offset (überlebt das Neu-Rendern) ---- */
function getCaretOffset(el){
  const sel = window.getSelection();
  if(!sel.rangeCount) return 0;
  const range = sel.getRangeAt(0);
  if(!el.contains(range.startContainer)) return 0;
  const pre = range.cloneRange();
  pre.selectNodeContents(el); pre.setEnd(range.endContainer, range.endOffset);
  return cleanText(pre.toString()).length;
}
function getSelectionOffsets(el){
  const sel = window.getSelection();
  if(!sel.rangeCount || !el.contains(sel.getRangeAt(0).startContainer)) return {start:0,end:0};
  const range = sel.getRangeAt(0);
  const a = range.cloneRange(); a.selectNodeContents(el); a.setEnd(range.startContainer, range.startOffset);
  const b = range.cloneRange(); b.selectNodeContents(el); b.setEnd(range.endContainer, range.endOffset);
  return {start: cleanText(a.toString()).length, end: cleanText(b.toString()).length};
}
function locateOffset(el, offset){

    acceptNode(n){
      if(n.nodeType === 3) return NodeFilter.FILTER_ACCEPT;
      if(n.nodeType === 1 && n.classList && n.classList.contains("line") && n.childNodes.length === 0) return NodeFilter.FILTER_ACCEPT;
      return NodeFilter.FILTER_SKIP;
    }
  });
  let remaining = offset, node = null, nodeOffset = 0, found = false, lastText = null;
  while(walker.nextNode()){
    const n = walker.currentNode;
    if(n.nodeType === 3){
      const placeholder = n.textContent === ZWS;
      const len = placeholder ? 0 : n.textContent.length;
      if(placeholder){ if(remaining === 0){ node=n; nodeOffset=0; found=true; break; } continue; }
      lastText = n;
      if(remaining < len){ node=n; nodeOffset=remaining; found=true; break; }
      remaining -= len;
    } else if(remaining === 0){ node=n; nodeOffset=0; found=true; break; }
  }
  if(!found && remaining === 0 && lastText){ node = lastText; nodeOffset = lastText.textContent.length; found = true; }
  return {node, nodeOffset, found};
}

  else range.setStart(el, 0);

}
function currentLineIndex(){
  const before = cleanText(edEl.textContent).slice(0, getCaretOffset(edEl));
  return (before.match(/\n/g) || []).length;
}
function updateCursorLine(){
  if(!edEl) return;

  const idx = currentLineIndex();
  const prev = edEl.querySelector(".line-cursor");
  if(prev && parseInt(prev.dataset.line,10) === idx) return;

}

/* ---- Schreiben: der Text ist die Quelle, das DOM wird daraus neu gebaut ---- */
// Re-runs list renumbering on whatever text is about to be committed, not just after Enter/Tab —
// deleting a list line (Backspace/Delete/selection, all of which just fire a plain browser
// "input" event) skipped renumbering entirely before, leaving gaps like "1. 2. 4.".
function renumberListsPreservingCaret(text, offset){
  const lines = text.split("\n");
  const fixed = renumberLists(lines);
  if(fixed.every((l,i)=>l===lines[i])) return { text, offset };
  const starts = lineStartsOf(lines);
  const { line, col } = lineIndexAndColAt(lines, starts, offset);
  const delta = fixed[line].length - lines[line].length;
  let off = 0;
  for(let i=0;i<line;i++) off += fixed[i].length + 1;
  return { text: fixed.join("\n"), offset: off + Math.max(0, col + delta) };
}
function commitText(newText, caretOffset){
  if(!edNote) return;
  ({ text: newText, offset: caretOffset } = renumberListsPreservingCaret(newText, caretOffset));
  renderInto(newText);
  setCaretOffset(edEl, caretOffset);
  edNote.text = newText; edNote.updatedAt = Date.now(); edNote.editedBy = "user"; lastEditAt = Date.now(); save();
  if(edOnChange) edOnChange();
  updateCursorLine();
  keepCaretVisible();
}
function commitLines(lines, caretLine, caretCol){
  const fixed = renumberLists(lines);
  const delta = fixed[caretLine].length - lines[caretLine].length;
  let off = 0; for(let i=0;i<caretLine;i++) off += fixed[i].length + 1;
  commitText(fixed.join("\n"), off + Math.max(0, caretCol + delta));
}
function insertTextAtCaret(text){
  const {start, end} = getSelectionOffsets(edEl);
  const full = cleanText(edEl.textContent);
  commitText(full.slice(0,start) + text + full.slice(end), start + text.length);
}
/* Enter setzt eine Liste fort; auf einem leeren Punkt beendet es sie. */
function handleEnter(){
  const {start, end} = getSelectionOffsets(edEl);
  const lines = cleanText(edEl.textContent).split("\n");
  const pos = lineIndexAndColAt(lines, lineStartsOf(lines), start);
  const line = lines[pos.line];
  const li = start === end ? parseListLine(line) : null;
  if(!li || pos.col < li.marker.length){ insertTextAtCaret("\n"); return; }
  const newLines = lines.slice();
  if(li.content.trim() === ""){
    const parent = parentListItem(lines, pos.line, li.indent.length);
    newLines[pos.line] = parent
      ? makeMarker(parent.indent, parent.type, parent.sym, parent.num + 1, parent.check ? "[ ] " : "")
      : "";
    commitLines(newLines, pos.line, newLines[pos.line].length);
    return;
  }
  const next = li.type === "bullet"
    ? makeMarker(li.indent, "bullet", li.sym, 0, li.check ? "[ ] " : "")
    : makeMarker(li.indent, li.type, li.sym, li.num + 1, "");
  newLines.splice(pos.line, 1, line.slice(0, pos.col), next + line.slice(pos.col));
  commitLines(newLines, pos.line + 1, next.length);
}
/* Einrücken macht aus einem Punkt einen i./ii./iii.-Unterpunkt. */
function indentLines(outdent){
  const {start, end} = getSelectionOffsets(edEl);
  const lines = cleanText(edEl.textContent).split("\n");
  const starts = lineStartsOf(lines);
  const a = lineIndexAndColAt(lines, starts, start), b = lineIndexAndColAt(lines, starts, end);
  const newLines = lines.slice(), colDelta = {};
  for(let i=a.line;i<=b.line;i++){
    const old = newLines[i], li = parseListLine(old);
    let line;
    if(outdent){
      const m = /^ {1,2}/.exec(old);
      const removed = m ? m[0].length : 0;
      line = old.slice(removed);
      if(li && li.type === "roman" && removed){
        const indent = li.indent.slice(removed);
        const sib = siblingListItem(newLines, i, indent.length);
        const type = sib ? sib.type : (indent.length > 0 ? "roman" : "bullet");
        line = makeMarker(indent, type, sib ? sib.sym : "-", 1, "") + li.content;
      }
    } else {
      line = "  " + old;
      if(li && li.type !== "roman" && !li.check) line = makeMarker("  " + li.indent, "roman", "", 1, "") + li.content;
    }
    newLines[i] = line; colDelta[i] = line.length - old.length;
  }
  commitLines(newLines, b.line, b.col + colDelta[b.line]);
}
function keepCaretVisible(){
  if(!edEl || document.activeElement !== edEl) return;
  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  const r = sel.getRangeAt(0).cloneRange(); r.collapse(true);
  let rect = r.getBoundingClientRect();
  if(!rect || (!rect.height && !rect.width)){
    const cur = edEl.querySelector('.line[data-line="'+currentLineIndex()+'"]');
    rect = cur && cur.getBoundingClientRect();
  }
  if(!rect) return;
  const box = edEl.getBoundingClientRect(), pad = 90;
  if(rect.bottom > box.bottom - pad) edEl.scrollTop += rect.bottom - (box.bottom - pad);
  else if(rect.top < box.top + 24) edEl.scrollTop -= (box.top + 24) - rect.top;
}

        {label:"Wortarten", icon:I.search, value: wordClassesOn() ? "an" : "aus", onTap:wcSheet},
        {label:"Als Text teilen", icon:I.share, onTap:()=>shareNote(note)},
        isTicket(note)
          ? {label:"Ticket löschen", icon:I.trash, danger:true, onTap:()=>{
              confirmSheet("Ticket löschen?","Löschen",()=>{ removeTicket(note); pop(); toast("Ticket gelöscht"); });
            }}
          : {label:"In den Papierkorb", icon:I.trash, danger:true, onTap:()=>{
              confirmSheet("Notiz löschen?","Löschen",()=>{ trashNote(note); pop(); toast("In den Papierkorb"); });
            }}
      ].filter(Boolean)})})
    ]));

    drawMeta();
    const edWrap = el("div",{class:"ed-wrap"+(isTicket(note)?" ticket":""),
                              style:"flex:1;display:flex;flex-direction:column;min-height:0"},
      isTicket(note) ? [searchBarEl, meta, ed, tkPanel] : [searchBarEl, meta, ed]);
    /* Lesefortschritt wie am Desktop: Linie unten, wächst mit dem Scrollen, nur wenn es etwas zu scrollen gibt */
    const prog = el("div",{class:"scroll-prog"});
    const progHost = el("div",{style:"position:relative;flex:1;display:flex;flex-direction:column;min-height:0"},[edWrap, prog]);
    scr.appendChild(progHost);
    const scroller = isTicket(note) ? edWrap : ed;
    let progRaf = 0;
    const updateProg = () => { progRaf = 0;
      const max = scroller.scrollHeight - scroller.clientHeight;
      prog.classList.toggle("on", max > 24);
      prog.style.transform = "scaleX(" + (max > 0 ? Math.min(1, scroller.scrollTop / max) : 0) + ")"; };
    scroller.addEventListener("scroll", () => { if(!progRaf) progRaf = requestAnimationFrame(updateProg); }, { passive:true });
    setTimeout(updateProg, 400);
    renderInto(note.text || "");
    if(isTicket(note)) renderTicketPanel();

    /* Einfügen immer als reiner Text (wie am Desktop): Der Browser würde aus Mail/Safari HTML-Absätze
       einsetzen, und textContent verschluckt deren Umbrüche — mehrere Absätze landeten in einer Zeile. */
    ed.addEventListener("paste", e=>{
      const text = e.clipboardData && e.clipboardData.getData("text/plain");
      if(!text || edNote !== note) return;
      e.preventDefault();
      const sel = window.getSelection();
      if(!sel.rangeCount) return;
      const r = sel.getRangeAt(0), pre = document.createRange();
      pre.selectNodeContents(ed); pre.setEnd(r.startContainer, r.startOffset);
      const start = cleanText(pre.toString()).length;
      pre.setEnd(r.endContainer, r.endOffset);
      const end = cleanText(pre.toString()).length;
      const cur = cleanText(ed.textContent), clean = text.replace(/\r\n?/g, "\n");
      commitText(cur.slice(0, start) + clean + cur.slice(end), start + clean.length);
    });
    ed.addEventListener("input", ()=>{
      if(edNote !== note) return;
      commitText(cleanText(ed.textContent), getCaretOffset(ed));
      if(searchOpen && searchQuery2) runSearch();
    });
    ed.addEventListener("keydown", e=>{
      if(e.isComposing) return;
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); handleEnter(); return; }
      if(e.key === "Tab"){ e.preventDefault(); indentLines(e.shiftKey); }
    });
    /* Software-Tastaturen melden Enter oft nur als beforeinput. */
    ed.addEventListener("beforeinput", e=>{
      if(e.inputType === "insertParagraph" || e.inputType === "insertLineBreak"){ e.preventDefault(); handleEnter(); }
    });
    /* Aufgabe direkt im Text abhaken. */
    ed.addEventListener("pointerdown", e=>{
      const cb = e.target.closest(".md-checkbox"); if(!cb) return;
      e.preventDefault();
      const idx = parseInt(cb.dataset.line, 10);
      const lines = note.text.split("\n");
      lines[idx] = lines[idx].replace(/\[( |x|X)\]/, (m, ch)=> ch === " " ? "[x]" : "[ ]");
      commitText(lines.join("\n"), getCaretOffset(ed));
      const ln = ed.querySelector('.line[data-line="' + idx + '"]');   // Haken wischt ein, Kreis pulsiert
      if(ln){ ln.classList.add("just"); setTimeout(()=>ln.classList.remove("just"), 450); }
      if(navigator.vibrate) navigator.vibrate(8);
    });
    ed.addEventListener("click", e=>{
      const imgWrap = e.target.closest(".md-image-wrap");
      if(imgWrap){ e.preventDefault(); editImageCaption(imgWrap, note); return; }
      const tag = e.target.closest(".md-tag");
      if(tag){
        e.preventDefault();
        searchQ = "#" + tag.dataset.tag;
        pop();
        setTimeout(openSearch, 260);
        return;
      }
      const wl = e.target.closest(".md-wikilink");
      if(wl){
        e.preventDefault();
        const target = findNoteByTitle(wl.textContent);
        if(target){ pop(); setTimeout(()=>openNote(target), 240); }
        else toast("Notiz „"+wl.textContent+"“ gibt es nicht");
      }
    });
    ed.addEventListener("focus", ()=>{ kb.classList.add("on"); updateCursorLine(); });
    ed.addEventListener("blur", ()=>{ clearCursorLine(); setTimeout(()=>kb.classList.remove("on"), 80); });
    function onSel(){ if(edEl === ed) updateCursorLine(); }
    document.addEventListener("selectionchange", onSel);

    /* Formatier-Leiste über der Tastatur — ersetzt die Tasten, die eine
       Software-Tastatur nicht hat (Tab/Shift+Tab) und die Desktop-Kürzel. */
    const kb = el("div",{id:"kbbar"});
    const wrapSel = (before, after) => {
      const {start, end} = getSelectionOffsets(ed);
      const full = cleanText(ed.textContent);
      commitText(full.slice(0,start) + before + full.slice(start,end) + (after||"") + full.slice(end),
                 start + before.length + (end - start));
    };
    const linePrefix = pre => {
      const {start} = getSelectionOffsets(ed);
      const lines = cleanText(ed.textContent).split("\n");
      const pos = lineIndexAndColAt(lines, lineStartsOf(lines), start);
      const li = parseListLine(lines[pos.line]);
      const bare = li ? lines[pos.line].slice(li.marker.length) : lines[pos.line].replace(/^(#{1,6}\s|>\s?)/,"");
      const newLines = lines.slice();
      newLines[pos.line] = pre + bare;
      commitLines(newLines, pos.line, newLines[pos.line].length - bare.length + Math.max(0, pos.col - (lines[pos.line].length - bare.length)));
    };
    [["✓", ()=>linePrefix("- [ ] ")],
     ["•", ()=>linePrefix("- ")],
     ["1.", ()=>linePrefix("1. ")],
     ["H1", ()=>linePrefix("# ")],
     ["H2", ()=>linePrefix("## ")],
     ["›", ()=>linePrefix("> ")],
     ["B", ()=>wrapSel("**","**")],
     ["/", ()=>wrapSel("*","*")],
     ["`", ()=>wrapSel("`","`")],
     ["[[", ()=>wrapSel("[[","]]")],
     ["#", ()=>wrapSel("#","")],
     ["—", ()=>insertTextAtCaret("\n---\n")],
     ["⇥", ()=>indentLines(false)],
     ["⇤", ()=>indentLines(true)]
    ].forEach(([label, fn])=>{
      kb.appendChild(el("button",{text:label, onpointerdown:e=>e.preventDefault(), onclick:fn}));
    });
    kb.appendChild(el("div",{class:"sp"}));
    kb.appendChild(el("button",{class:"done",text:"Fertig",onpointerdown:e=>e.preventDefault(),onclick:()=>ed.blur()}));
    scr.appendChild(kb);

    if(!note.text) setTimeout(()=>{ ed.focus(); setCaretOffset(ed, 0); }, 380);
    ref.cleanup = ()=>{
      document.removeEventListener("selectionchange", onSel);
      clearSearchHits();
      if(edEl === ed){ edEl = null; edNote = null; edOnChange = null; wcRefreshAll(); }
      // „+" getippt und ohne Eingabe wieder zu: nichts zurücklassen (der Sync räumt schon Hochgeladenes mit ab)
      const untouched = !String(note.text || "").trim() &&
        (!isTicket(note) || (!note.due && !(note.tags||[]).length && !(note.subtasks||[]).length));
      if(untouched){
        if(isTicket(note)) store.tickets = store.tickets.filter(x => x !== note);
        else store.notes = store.notes.filter(x => x !== note);
        save();
      }
      /* Wie am Desktop braucht ein Ticket ein Kürzel oder einen Termin — sonst taucht es in keiner Gruppe
         und keinem Tag auf. Statt das Zurückgehen zu blockieren, fragt ein Blatt gleich danach. */
      else if(isTicket(note) && store.tickets.includes(note) && !note.due && !(note.tags||[]).length && tStatus(note) !== "Erledigt"){
        setTimeout(()=>{
          const after = ()=> renderers[curTab] && renderers[curTab]();
          const today = dayKey();
          sheet({title:"„" + titleOf(note) + "“ braucht Kürzel oder Termin", items:[
            {label:"Heute", value:fmtDay(today), onTap:()=>{ setTicketDue(note, today); after(); }},
            {label:"Morgen", value:fmtDay(shiftDay(today,1)), onTap:()=>{ setTicketDue(note, shiftDay(today,1)); after(); }},
            {label:"Anderer Termin…", onTap:()=>dueSheet(note, after)},
            {label:"Kürzel wählen…", onTap:()=>tagSheet(note, after)}
          ]});
        }, 420);
      }
    };
    return null;
  }, {title:"", onPop:()=>ref.cleanup && ref.cleanup()});
}
function moveSheet(note, after){
  sheet({title:"Ordner", items:[
    ...store.folders.map(f=>({label:f.name, icon: note.folderId===f.id ? I.check : I.folder,
      onTap:()=>{ note.folderId=f.id; note.updatedAt=Date.now(); save(); after && after(); toast("Verschoben nach "+f.name); }})),
    {label:"Neuer Ordner…", icon:I.plus, onTap:()=>promptSheet("Neuer Ordner","", "Name", n=>{
      const f = {id:uid(),name:n,parentId:null}; store.folders.push(f);
      note.folderId = f.id; save(); after && after(); toast("Ordner angelegt");
    })}
  ]});
}
async function shareNote(note){
  const text = note.text;
  if(navigator.share){ try{ await navigator.share({title:titleOf(note), text}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(text); toast("In die Zwischenablage kopiert"); }
  catch(e){ toast("Teilen nicht verfügbar"); }
}

/* ========================= 7. Tab: Tickets =========================
   Zeigt die Tickets (Tabelle „tickets", angelegt am Mac oder über Claude) nach
   Fälligkeitstag gruppiert — plus alte Aufgaben-Notizen, solange es sie noch gibt.
   Kürzel (mehrere möglich) gehören über TAG_GROUPS zu einer Gruppe. */
const STATUSES = ["Offen", "In Arbeit", "Blockiert", "Erledigt"];
const TAG_GROUPS = [
  { id:"myo",           name:"MYO",           tags:["sls","fin","mkt","ops","sf","bizdev","prod","andere"] },
  { id:"privat",        name:"Privat",        tags:["ehe","solo"] },
  { id:"wiederkehrend", name:"Wiederkehrend", tags:["geburtstage","arbeit"] }
];
const isTask = n => !!(n && n.props && n.props.type === "task");
const groupOfTag = tag => TAG_GROUPS.find(g => g.tags.includes(String(tag||"").toLowerCase())) || null;
const groupOfTicket = n => tTags(n).map(groupOfTag).find(Boolean) || null;
const inTicketGroup = (n, gid) => tTags(n).some(k => (groupOfTag(k)||{}).id === gid);
function allTickets(){
  const ids = new Set(store.tickets.map(t => t.id));
  return store.tickets.concat(store.notes.filter(n => isTask(n) && !ids.has(n.id)));
}
function dayKey(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function shiftDay(key, days){
  const [y,m,d] = key.split("-").map(Number);
  const dt = new Date(y, m-1, d + days);
  return dayKey(dt);
}
function fmtDay(key){
  const [y,m,d] = key.split("-").map(Number);
  return String(d).padStart(2,"0") + "." + String(m).padStart(2,"0") + ".";
}
/* Überschrift eines Tagesabschnitts: die nächsten Tage bekommen einen Namen,
   alles danach Wochentag + Datum. */
function dayHeading(key){
  const today = dayKey();
  if(key === "none") return { title:"Ohne Termin", sub:"kein Datum gesetzt" };
  if(key < today)    return { title:"Überfällig",  sub:"seit " + fmtDay(key) };
  if(key === today)  return { title:"Heute",       sub:fmtDay(key) };
  if(key === shiftDay(today, 1)) return { title:"Morgen", sub:fmtDay(key) };
  const [y,m,d] = key.split("-").map(Number);
  return { title: new Date(y, m-1, d).toLocaleDateString("de-DE",{weekday:"long"}), sub:fmtDay(key) };
}

let taskGroup = "";          // "" = alle Gruppen
let showDone = false;

renderers.aufgaben = function(){
  const v = tabviews.aufgaben; v.innerHTML = "";
  const nav = el("div",{class:"nav"},[
    el("div",{},[
      el("div",{class:"sub",text:new Date().toLocaleDateString("de-DE",{weekday:"long", day:"numeric", month:"long"})}),
      el("h1",{text:"Tickets"})
    ]),
    el("div",{class:"nav-actions"},[
      el("button",{class:"iconbtn",html:I.search,onclick:openSearch}),
      el("button",{class:"iconbtn"+(showDone?" accent":""),html:I.eye,onclick:()=>{ showDone = !showDone; renderers.aufgaben(); }}),
      syncDotBtn(),
      el("button",{class:"iconbtn",html:I.gear,onclick:settingsSheet})
    ])
  ]);

  const all = allTickets();
  const visible = all.filter(n => showDone || tStatus(n) !== "Erledigt")
                     .filter(n => !taskGroup || inTicketGroup(n, taskGroup));

  /* Filterleiste: Gruppen als Reiter, mit Anzahl */
  const counts = {};
  TAG_GROUPS.forEach(g => counts[g.id] = all.filter(n =>
    (showDone || tStatus(n) !== "Erledigt") && inTicketGroup(n, g.id)).length);
  const openAll = all.filter(n => showDone || tStatus(n) !== "Erledigt").length;
  const seg = el("div",{class:"seg","data-ptrack":"taskgroup"});
  [{id:"", name:"Alle", n:openAll}].concat(TAG_GROUPS.map(g=>({id:g.id, name:g.name, n:counts[g.id]})))
    .forEach(g => seg.appendChild(el("button",{class: taskGroup===g.id ? "on":"", onclick:()=>{ taskGroup = g.id; renderers.aufgaben(); }},
      [el("span",{text:g.name}), el("span",{class:"n","data-sn":"seg:"+g.id,text:String(g.n)})])));

  const sc = el("div",{class:"scroll"});
  v.append(nav, seg, sc); attachCollapse(sc, nav);

  /* Nach Tagen bündeln: überfällige Tage zuerst, dann heute und die Zukunft,
     ganz am Ende die Aufgaben ohne Termin. */
  const buckets = {};
  visible.forEach(n => { const k = tDue(n) || "none"; (buckets[k] = buckets[k] || []).push(n); });
  const keys = Object.keys(buckets).filter(k => k !== "none").sort();
  if(buckets.none) keys.push("none");

  if(!keys.length){
    if(!all.length && !syncEnabled()){
      sc.appendChild(el("div",{class:"section"},[el("div",{class:"hintbox"},[
        el("div",{class:"txt",text:"Dieses Gerät ist noch nicht mit deinem Konto verbunden — deshalb sind hier keine Tickets vom Mac zu sehen."}),
        el("button",{text:"Konto verbinden",onclick:openAccount})
      ])]));
      return;
    }
    sc.appendChild(el("div",{class:"section"},[el("div",{class:"group"},[
      el("div",{class:"empty",text: all.length ? "In dieser Gruppe ist nichts offen." : "Noch keine Tickets. Am Mac oder über Claude anlegen."})])]));
    return;
  }
  /* Alle überfälligen Tage laufen unter einer gemeinsamen Überschrift. */
  const today = dayKey();
  const overdue = keys.filter(k => k !== "none" && k < today);
  const rest = keys.filter(k => k === "none" || k >= today);
  if(overdue.length){
    const items = overdue.reduce((a,k)=>a.concat(buckets[k]), []);
    sc.appendChild(daySection("Überfällig", "seit " + fmtDay(overdue[0]) + " · " + items.length, items));
  }
  rest.forEach(k => {
    const h = dayHeading(k);
    sc.appendChild(daySection(h.title, h.sub + " · " + buckets[k].length, buckets[k]));
  });
};

function daySection(title, sub, notes){
  const sec = el("div",{class:"section"});
  // Gruppenkopf wie in der Ticket-Liste am Desktop: klein, gesperrt, Anzahl rechts
  sec.appendChild(el("div",{class:"tgroup"},[el("span",{text:title}), el("span",{class:"c",text:String(notes.length)})]));
  const g = el("div",{class:"group"});
  notes.forEach(n => g.appendChild(taskNoteRow(n, ()=>renderers.aufgaben(), { byDay:true })));
  sec.appendChild(g);
  return sec;
}

/* Ticketzeile: Titel, Kategorie-Symbol, darunter die Felder „Fällig"/„Kürzel"
   und der Status mit Fortschritt der Unteraufgaben. Kompakter als eine
   Notizzeile, ohne Schnell-Erledigen-Kreis — Status ändert sich nur im
   Ticket selbst, nicht versehentlich beim Durchscrollen der Liste. */
// opts.byDay: Zeile steht unter einem Tageskopf — das Datum steckt dann schon in der Überschrift und
// fällt weg; nur unter „Überfällig" bleibt es stehen (dort sind mehrere Tage gemischt).
function taskNoteRow(n, refresh, opts = {}){
  const wrap = el("div",{class:"rowwrap"});
  const st = tStatus(n), done = st === "Erledigt";
  const subs = isTicket(n) ? (n.subtasks || []) : allTasks().filter(t=>t.noteId===n.id);
  const subsDone = subs.filter(t=>t.done).length;
  const due = tDue(n), today = dayKey();
  const dueCls = done || !due ? "" : due < today ? " over" : due === today ? " today" : "";
  /* Wie die Karten am Desktop: Titel, darunter eine Meta-Zeile — Kürzel, Datum, Status (nur wenn nicht
     „Offen"), rechts „2/3" (nur wenn es etwas aussagt). Keine Labels, kein Balken, keine Gruppen-Icons. */
  const row = el("div",{class:"row trow"+(done?" done":"")},[
    el("div",{class:"t",text:titleOf(n)}),
    el("div",{class:"tmeta"},[
      ...tTags(n).map(k => el("span",{class:"tagchip",text:k})),
      opts.byDay && !(due && due < today && !done) ? null :
        el("span",{class:"due"+dueCls,text: !due ? "ohne Termin" : due === today ? "heute" : fmtDay(due)}),
      st !== "Offen" ? el("span",{class:"st-chip s-"+st.toLowerCase().replace(/\s/g,""),text:st}) : null,
      subs.length && (subs.length > 1 || subsDone > 0) ? el("span",{class:"kprog","data-sn":"row:"+n.id,text:subsDone+"/"+subs.length}) : null
    ])
  ]);
  row.addEventListener("click", ()=>openNote(n));
  row.addEventListener("touchstart", ()=>row.classList.add("pressed"), {passive:true});
  ["touchend","touchmove","touchcancel"].forEach(ev=>row.addEventListener(ev, ()=>row.classList.remove("pressed"), {passive:true}));
  wrap.appendChild(row);
  swipeRow(wrap, row, ()=>{ removeTicket(n); toast(isTicket(n) ? "Ticket gelöscht" : "In den Papierkorb"); refresh && refresh(); });
  return wrap;
}

/* ========================= 8. Tab: Notizen ========================= */
renderers.notizen = function(){
  const v = tabviews.notizen; v.innerHTML = "";
  const nav = el("div",{class:"nav"},[
    // gleiche Kopfhöhe wie Tickets (dort steht das Datum darüber) — sonst springt der Titel beim Tab-Wechsel
    el("div",{},[el("div",{class:"sub",text:new Date().toLocaleDateString("de-DE",{weekday:"long", day:"numeric", month:"long"})}),
      el("h1",{text:"Notizen"})]),
    el("div",{class:"nav-actions"},[
      el("button",{class:"iconbtn",html:I.search,onclick:openSearch}),
      el("button",{class:"iconbtn",html:I.folder,onclick:()=>promptSheet("Neuer Ordner","","Name",n=>{
        store.folders.push({id:uid(),name:n,parentId:null}); save(); renderers.notizen(); })}),
      syncDotBtn(),
      el("button",{class:"iconbtn",html:I.gear,onclick:settingsSheet})
    ])
  ]);
  const sc = el("div",{class:"scroll"});
  v.append(nav, sc); attachCollapse(sc, nav);

  /* Ordnerbaum wie in der Desktop-Seitenleiste (renderSideTree): Ordner alphabetisch und beliebig tief,
     ihre Notizen darin, darunter die Notizen ohne Ordner. Antippen klappt auf/zu (ohne Neuzeichnen, damit
     die Animation läuft) — derselbe Zustand folder.collapsed wie am Mac, er wird mitsynchronisiert. */
  sc.appendChild(el("div",{class:"section"},[
    el("div",{class:"tgroup"},[el("span",{text:"Ordner"}), el("span",{class:"c",text:String(store.notes.length)})]),
    noteTree()
  ]));

  /* Tags als Pillen (Desktop: Notizen-Übersicht) */
  const tagMap = {};
  store.notes.forEach(n=>tagsOf(n).forEach(t=>tagMap[t]=(tagMap[t]||0)+1));
  const tags = Object.keys(tagMap).sort();
  if(tags.length) sc.appendChild(el("div",{class:"section"},[
    el("div",{class:"tgroup"},[el("span",{text:"Tags"}), el("span",{class:"c",text:String(tags.length)})]),
    el("div",{class:"ntags"}, tags.map(t => el("button",{class:"ntag",
      onclick:()=>openList("#"+t, store.notes.filter(n=>tagsOf(n).includes(t)))},
      [el("span",{text:"#"+t}), el("span",{class:"c",text:String(tagMap[t])})])))
  ]));

  /* Zuletzt geändert — schneller Zugriff unterwegs, im selben Zeilenstil wie der Baum */
  const recent = store.notes.slice().sort(byRecent).slice(0, 5);
  if(recent.length) sc.appendChild(el("div",{class:"section"},[
    el("div",{class:"tgroup"},[el("span",{text:"Zuletzt geändert"})]),
    el("div",{class:"ntree"}, recent.map((n, i) => treeNoteRow(n, i, relTime(n.updatedAt))))
  ]));
  if(!store.notes.length && !store.folders.length) sc.appendChild(el("div",{class:"empty",text:"Noch nichts. Tipp auf +."}));
};

/* Langer Druck = Kontextmenü (Desktop: Rechtsklick). Danach wird der normale Tipp verschluckt. */
function longPress(node, fn){
  let t = null;
  node.addEventListener("touchstart", ()=>{ node.classList.add("pressed");
    t = setTimeout(()=>{ t = null; node.dataset.lp = "1"; node.classList.remove("pressed"); if(navigator.vibrate) navigator.vibrate(12); fn(); }, 480); }, {passive:true});
  ["touchend","touchmove","touchcancel"].forEach(ev => node.addEventListener(ev, ()=>{ clearTimeout(t); node.classList.remove("pressed"); }, {passive:true}));
  node.addEventListener("contextmenu", e=>{ e.preventDefault(); fn(); });
}
const lpSwallow = node => { if(node.dataset.lp){ delete node.dataset.lp; return true; } return false; };
function treeNoteRow(n, i, meta){

    {label:"Öffnen", icon:I.doc, onTap:()=>openNote(n)},

  ]}));

function treeFolder(f, i){
  const byName = (a,b) => a.name.localeCompare(b.name, "de"), byTitle = (a,b) => titleOf(a).localeCompare(titleOf(b), "de");
  const subs = store.folders.filter(x => x.parentId === f.id).sort(byName);
  const notes = store.notes.filter(n => n.folderId === f.id).sort(byTitle);
  const wrap = el("div",{class:"sfolder"+(f.collapsed ? "" : " is-open"),style:"--i:"+i});
  const head = el("div",{class:"srow sfold"},[
    el("span",{class:"tico",html:TREE_ICO.chev}), el("span",{class:"tico",html:TREE_ICO.fold}),
    el("span",{class:"sname",text:f.name}), el("span",{class:"scount",text: notes.length ? String(notes.length) : ""})]);
  head.addEventListener("click", ()=>{

function noteTree(){

/* Ordner löschen: der Ordner samt Unterordnern verschwindet, die Notizen darin landen im Papierkorb
   (von dort wiederherstellbar). Der Sync überträgt das Löschen wie am Desktop. */
function folderAndDescendants(id){
  const out = [id];
  for(let i = 0; i < out.length; i++) store.folders.forEach(x => { if(x.parentId === out[i]) out.push(x.id); });
  return out;
}
/* Notizen eines Ordners samt aller Unterordner — für die Anzahl neben einer
   Ordnerkachel, damit sie zeigt, was wirklich drinsteckt. */
function notesInFolderTree(id){
  const ids = folderAndDescendants(id);
  return store.notes.filter(n => ids.includes(n.folderId));
}
function deleteFolderSheet(f){
  const ids = folderAndDescendants(f.id);
  const notes = store.notes.filter(n => ids.includes(n.folderId));
  const subs = ids.length - 1;
  const what = [notes.length ? notes.length + (notes.length === 1 ? " Notiz" : " Notizen") + " in den Papierkorb" : "",
                subs ? subs + (subs === 1 ? " Unterordner" : " Unterordner") + " mit" : ""].filter(Boolean).join(", ");
  confirmSheet("„" + f.name + "“ löschen?" + (what ? " (" + what + ")" : ""), "Ordner löschen", ()=>{
    notes.forEach(n => trashNote(n));
    store.folders = store.folders.filter(x => !ids.includes(x.id));
    save(); pop(); if(curTab === "notizen") renderers.notizen(); toast("Ordner gelöscht");
  });
}

/* ========================= 11. Einstellungen ========================= */
/* Dieselben Paletten wie am Desktop (notes.html, THEMES) — gleiche Rohfarben, gleiche
   Ableitung der gedämpften Töne, damit beide Apps bei gleicher Wahl gleich aussehen. */
/* Farbsystem wie am Desktop (notes.html seit 3.9): monochrom, Hell/Dunkel plus frei wählbarer Akzent —
   gleiche Rohwerte, gleiche Kontrastregeln, damit beide Apps bei gleicher Wahl gleich aussehen. */
const GRAYSCALE = {
  dark:  { bg:"#1c1c1e", raised:"#242426", surface2:"#323234", line:"#38383a", text:"#f0f0f0", signal:"#ff6b5c" },
  light: { bg:"#ffffff", raised:"#ffffff", surface2:"#ffffff", line:"#dcdcdc", text:"#1c1c1e", signal:"#c62d24" }
};
const DEFAULT_ACCENT = "#8a8a8e";
const ACCENT_SWATCHES = ["#8a8a8e", "#5e8df0", "#4fb06e", "#e0a73a", "#d9596a", "#9a6fe0", "#3fb0c4"];
const HEX_RE = /^#[0-9a-f]{6}$/i;
// Alte Paletten (bis 3.7) → Hell/Dunkel + Akzent, genau wie am Desktop
const LEGACY_THEMES = {
  fern:{dark:true,accent:"#dcee8a"}, salbei:{dark:false,accent:"#195c3a"}, flieder:{dark:false,accent:"#6a1bd1"},
  mandarine:{dark:false,accent:"#1f4499"}, sonne:{dark:false,accent:"#2e4bc4"}, papier:{dark:false,accent:"#3f6f4f"},
  navy:{dark:true,accent:"#7fa8e6"}, terrakotta:{dark:false,accent:"#9c3a17"}, tiefsee:{dark:false,accent:"#155a68"},
  billabong:{dark:true,accent:"#aed0c9"}, bordeaux:{dark:true,accent:"#d9a35a"}
};
function currentColorMode(){
  const m = store.ui.colorMode;
  if(m === "light" || m === "dark") return m;
  const l = LEGACY_THEMES[store.ui.theme];
  return l ? (l.dark ? "dark" : "light") : "dark";
}
function currentAccent(){
  const a = store.ui.accent;
  if(a && HEX_RE.test(a)) return a;
  const l = LEGACY_THEMES[store.ui.theme];
  return l ? l.accent : DEFAULT_ACCENT;
}
function relLum(hex){
  const c = [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=> v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4));
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
/* Dasselbe Stapel-Symbol wie die Desktop-App: drei versetzte Quadrate in drei
   Abstufungen der Akzentfarbe, zur Laufzeit aus dem aktiven Theme gebaut. */
function mixHex(a, b, amount){
  const p = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const [r1,g1,b1] = p(a), [r2,g2,b2] = p(b), m = (x,y)=>Math.round(x+(y-x)*amount);
  return "#" + [m(r1,r2),m(g1,g2),m(b1,b2)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function stackIconSVG(t){
  // Cards sized/offset so the whole stack sits with equal 3-unit margin on all four sides of
  // the 24-unit box (was 3 top, 1 bottom — the back card crowded the bottom edge).
  const back = mixHex(t.accent, t.bg, 0.65), mid = mixHex(t.accent, t.bg, 0.35);
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">'
    + '<rect x="3" y="8" width="13" height="13" rx="4" fill="'+back+'"/>'
    + '<rect x="5.5" y="5.5" width="13" height="13" rx="4" fill="'+mid+'"/>'
    + '<rect x="8" y="3" width="13" height="13" rx="4" fill="'+t.accent+'"/>'
    + '</svg>';
}
function wcagContrast(a, b){ const x = relLum(a), y = relLum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
// Mischt fg Richtung bg, aber nur so weit, dass mindestens `min` Kontrast bleibt
function mixWithContrast(fg, bg, amount, min){
  for(let w = amount; w > 0; w -= 0.02){ const c = mixHex(fg, bg, w); if(wcagContrast(c, bg) >= min) return c; }
  return fg;
}
// Akzent als Schrift: ein neutraler Akzent würde Aktives blasser zeigen als Inaktives → Textfarbe;
// bunte Akzente nur so weit Richtung Text ziehen, bis 4,5:1 erreicht ist
function accentTextFor(accent, text, bg){
  const c = [1,3,5].map(i=>parseInt(accent.slice(i,i+2),16));
  if(Math.max(...c) - Math.min(...c) < 24) return text;
  for(let w = 0; w <= 1; w += 0.05){ const m = mixHex(accent, text, w); if(wcagContrast(m, bg) >= 4.5) return m; }
  return text;
}
function applyTheme(){
  const mode = currentColorMode(), accent = currentAccent();
  const t = Object.assign({ accent }, GRAYSCALE[mode]), r = document.documentElement.style, dark = mode === "dark";
  const link = document.getElementById("app-favicon");
  if(link) link.setAttribute("href", "data:image/svg+xml," + encodeURIComponent(stackIconSVG(t)));
  /* Kacheln (Ordner, Notizen, Tickets) haben dieselbe Farbe wie der Hintergrund — abgegrenzt nur
     durch die feine Linie. Ausdrücklicher Wunsch, gilt in Hell und Dunkel. */
  r.setProperty("--bg", t.bg); r.setProperty("--surface", t.bg);
  r.setProperty("--surface-2", mixHex(t.bg, t.text, dark ? 0.07 : 0.05));
  r.setProperty("--line", t.line); r.setProperty("--text", t.text);
  // Erhöhte Flächen (aktive Pille) mit Schatten statt Rand — dieselben Werte wie am Desktop
  r.setProperty("--raised", t.raised);
  r.setProperty("--hover", "color-mix(in srgb, " + t.text + " " + (dark ? 8 : 5) + "%, transparent)");
  r.setProperty("--shadow-sm", dark ? "0 1px 2px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.045) inset" : "0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.04)");
  r.setProperty("--signal-soft", "color-mix(in srgb, " + t.signal + " " + (dark ? 22 : 15) + "%, transparent)");
  r.setProperty("--muted", mixWithContrast(t.text, t.bg, dark ? 0.36 : 0.28, 4.5));
  r.setProperty("--faint", mixWithContrast(t.text, t.bg, dark ? 0.56 : 0.44, 4.5));
  r.setProperty("--accent", t.accent);
  r.setProperty("--task-bg", mixHex(t.bg, t.accent, dark ? 0.16 : 0.09));
  r.setProperty("--accent-soft", "color-mix(in srgb, " + t.accent + " " + (dark ? 20 : 14) + "%, transparent)");
  r.setProperty("--code-bg", "color-mix(in srgb, " + t.text + " " + (dark ? 9 : 5) + "%, transparent)");
  r.setProperty("--task-bg-done", mixHex(t.bg, t.accent, dark ? 0.08 : 0.045));
  r.setProperty("--accent-text", accentTextFor(t.accent, t.text, t.bg));
  r.setProperty("--accent-ink", wcagContrast(t.bg, t.accent) >= wcagContrast(t.text, t.accent) ? t.bg : t.text);
  r.setProperty("--signal", t.signal);
  // Wortarten-Farben (wie am Desktop)
  r.setProperty("--st-filler", dark ? "#e6b84a" : "#c48a00"); r.setProperty("--st-weak", dark ? "#f08a55" : "#d9662a");
  r.setProperty("--st-passive", dark ? "#6fb0ff" : "#2f7fd6"); r.setProperty("--st-repeat", dark ? "#cf8ae6" : "#a64fc4");
  r.setProperty("--st-nominal", dark ? "#7fd9b0" : "#1f9e6e");
  applyWcHidden();
  r.setProperty("--gold", mixWithContrast(t.text, t.bg, dark ? 0.36 : 0.28, 4.5));   // früher Goldton, jetzt monochrom
  document.documentElement.style.colorScheme = dark ? "dark" : "light";
  const meta = document.querySelector('meta[name="theme-color"]'); if(meta) meta.content = t.bg;
  store.ui.colorMode = mode; store.ui.accent = accent; delete store.ui.theme; save();
}
applyTheme();

function settingsSheet(){
  const tick = () => { if(navigator.vibrate) navigator.vibrate(8); };
  const modeSeg = el("div",{class:"mode-seg"});
  const accRow = el("div",{class:"acc-row"});
  function drawPicker(){
    const mode = currentColorMode(), acc = currentAccent();
    modeSeg.innerHTML = ""; accRow.innerHTML = "";
    [["dark","Dunkel"],["light","Hell"]].forEach(([k,label]) => modeSeg.appendChild(el("button",{class: mode===k ? "on" : "",
      onclick:()=>{ tick(); store.ui.colorMode = k; applyTheme(); drawPicker(); }},
      [el("i",{style:"background:"+GRAYSCALE[k].bg}), el("span",{text:label})])));
    ACCENT_SWATCHES.forEach(c => accRow.appendChild(el("button",{class:"acc"+(c===acc?" on":""), "aria-label":"Akzent "+c,
      onclick:()=>{ tick(); store.ui.accent = c; applyTheme(); drawPicker(); }}, [el("i",{style:"background:"+c})])));
    const custom = !ACCENT_SWATCHES.includes(acc);
    const input = el("input",{type:"color", value: custom ? acc : DEFAULT_ACCENT});
    input.addEventListener("input", ()=>{ store.ui.accent = input.value; applyTheme(); });
    input.addEventListener("change", ()=>{ tick(); drawPicker(); });
    accRow.appendChild(el("label",{class:"acc custom"+(custom?" on":""), "aria-label":"Eigene Farbe"},
      [el("i",{style: custom ? "background:"+acc : ""}), input]));
    requestAnimationFrame(()=>syncPill("mode", modeSeg));   // gleitende Markierung wie am Desktop
  }
  drawPicker();
  sheet({title:"Einstellungen", items:[
    {custom: el("div",{class:"set-label",text:"Darstellung"})},
    {custom: modeSeg},
    {custom: el("div",{class:"set-label",text:"Akzentfarbe"})},
    {custom: accRow},
    {label:"Konto & Sync", icon:I.gear, value: sync.session ? sync.session.email : "nicht verbunden", onTap:openAccount},
    {label:"Papierkorb", icon:I.trash, value:String(store.trash.length), onTap:openTrash},
    {label:"Daten exportieren", icon:I.share, onTap:exportData},
    {label:"Alle Notizen als Text", icon:I.doc, onTap:exportText}
  ]});
}
function openTrash(){
  push((scr, nav)=>{
    const sc = el("div",{class:"scroll"});
    const draw = ()=>{
      sc.innerHTML = "";
      const g = el("div",{class:"group"});
      store.trash.forEach(n=>{
        // Wie am Desktop: Titel, Herkunft, wann — darunter direkt „Wiederherstellen" und „Entfernen"
        const row = el("div",{class:"row nrow trow2"},[
          el("span",{class:"tico",html:TREE_ICO.note}),
          el("div",{class:"nmain"},[
            el("div",{class:"t",text:titleOf(n)}),
            el("div",{class:"nprev",text: folderName(n.folderId) + " · gelöscht " + relTime(n.deletedAt||n.updatedAt)}),
            el("div",{class:"tacts"},[
              el("button",{text:"Wiederherstellen",onclick:e=>{ e.stopPropagation();
                store.trash = store.trash.filter(x=>x.id!==n.id);
                delete n.deletedAt; store.notes.unshift(n); save(); draw(); toast("Wiederhergestellt"); }}),
              el("button",{class:"danger",text:"Entfernen",onclick:e=>{ e.stopPropagation();
                confirmSheet("Endgültig löschen?","Endgültig löschen",()=>{ store.trash = store.trash.filter(x=>x.id!==n.id); save(); draw(); toast("Gelöscht"); }); }})
            ])
          ])
        ]);
        g.appendChild(el("div",{class:"rowwrap"},[row]));
      });
      if(!store.trash.length) g.appendChild(el("div",{class:"empty",text:"Papierkorb ist leer."}));
      sc.appendChild(el("div",{class:"section",style:"padding-top:6px"},[g]));
      if(store.trash.length) sc.appendChild(el("div",{class:"section"},[
        el("button",{class:"sheet-primary",style:"background:var(--signal);color:#fff",text:"Papierkorb leeren",
          onclick:()=>confirmSheet("Papierkorb leeren?","Alles löschen",()=>{ store.trash=[]; save(); draw(); })})]));
    };
    draw(); attachCollapse(sc, nav);
    return sc;
  }, {title:"Papierkorb"});
}
function download(name, text, type){
  const a = el("a",{href:URL.createObjectURL(new Blob([text],{type:type||"text/plain"})), download:name});
  document.body.appendChild(a); a.click(); a.remove();
  toast("Export gestartet");
}
function exportData(){ download("notes-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(store,null,2), "application/json"); }
function exportText(){
  download("notes-"+new Date().toISOString().slice(0,10)+".md",
    store.notes.slice().sort(byRecent).map(n=>n.text).join("\n\n---\n\n"), "text/markdown");
}

/* ========================= 12. Globales ========================= */
/* Tastatur: Tab-Bar ausblenden, Editor-Leiste andocken */
const vv = window.visualViewport;
if(vv){
  const onVV = ()=>{
    const gap = window.innerHeight - vv.height - vv.offsetTop;
    document.body.classList.toggle("kb", gap > 140);
    const bar = document.getElementById("kbbar");
    if(bar) bar.style.bottom = Math.max(0, gap) + "px";
  };
  vv.addEventListener("resize", onVV); vv.addEventListener("scroll", onVV);

/* Doppeltipp-Zoom unterbinden (App-Gefühl) */
let lastTouch = 0;
document.addEventListener("touchend", e=>{
  const now = Date.now();
  if(now - lastTouch < 300 && !e.target.closest("textarea,input,.preview")) e.preventDefault();
  lastTouch = now;
}, {passive:false});

showTab("aufgaben");

/* Sichtbare Fläche nachmessen. Als Home-Bildschirm-App endet die Seite bei neueren iOS-Versionen
   teils schon über der Home-Anzeige — dann wäre die eigene Reserve dafür doppelt und unten klaffte
   ein Loch. Ist die Seite um so viel kürzer als der Bildschirm, entfällt die Reserve. Die Werte stehen
   unter Konto & Sync, falls es auf einem Gerät doch nicht passt. */
let viewportInfo = "";
function measureViewport(){
  const probe = document.createElement("div");
  probe.style.cssText = "position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)";
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe), top = Math.round(parseFloat(cs.paddingTop) || 0), bottom = Math.round(parseFloat(cs.paddingBottom) || 0);
  probe.remove();
  const standalone = !!navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  const gap = Math.round(screen.height - window.innerHeight);
  const r = document.documentElement.style;
  /* iOS 26 als Home-Bildschirm-App: Die Seite reicht oben unter die Statusleiste, iOS zieht deren Höhe
     aber trotzdem von der Seitenhöhe ab (gemessen: Bildschirm 956, Seite 894, oben 62). Die Seite endet
     dann 62pt über dem Bildschirmrand, darunter klafft ein leerer Streifen. Abhilfe: die App selbst auf
     volle Bildschirmhöhe strecken; der Abstand zur Home-Anzeige (unten) bleibt dabei erhalten. */
  const stretched = standalone && top > 0 && Math.abs(gap - top) <= 4;
  if(stretched) r.setProperty("--app-h", screen.height + "px"); else r.removeProperty("--app-h");
  r.removeProperty("--safe-b");
  viewportInfo = "Bildschirm " + screen.width + "×" + screen.height + " · Seite " + window.innerWidth + "×" + window.innerHeight +
    " · oben " + top + " · unten " + bottom + (standalone ? " · Home-Bildschirm" : " · Browser") + (stretched ? " · auf Bildschirmhöhe gestreckt" : "");
}
measureViewport();
window.addEventListener("resize", measureViewport);
window.addEventListener("orientationchange", ()=> setTimeout(measureViewport, 300));

/* Selbst-Aktualisierung: Als Home-Bildschirm-App bleibt die Seite im Speicher und GitHub Pages
   erlaubt 10 Minuten Cache — ein neuer Stand käme sonst erst nach Beenden der App an. Beim Öffnen und
   jedes Mal, wenn die App wieder in den Vordergrund kommt, wird die Version online (am Cache vorbei)
   mit der eigenen verglichen; ist sie neuer, lädt die App neu — aber nie mitten im Schreiben. */
(function(){
  const mine = (document.querySelector('meta[name="app-version"]') || {}).content;
  if(!mine || location.protocol === "file:") return;
  let pending = false;
  async function check(){
    try{
      const res = await fetch(location.pathname + "?v=" + Date.now(), { cache:"no-store" });
      const m = /<meta name="app-version" content="([^"]+)"/.exec(await res.text());
      if(m && m[1] !== mine) pending = true;
    }catch(e){}
    reloadIfIdle();
  }
  function reloadIfIdle(){
    if(!pending || edNote || document.visibilityState !== "visible") return;
    if(sessionStorage.getItem("reloadedFor") === mine) return;   // nie in eine Schleife laufen
    sessionStorage.setItem("reloadedFor", mine);
    location.replace(location.pathname + "?v=" + Date.now());   // Adresse mit Zeitstempel: am Cache vorbei
  }
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") check(); });
  window.addEventListener("popstate", ()=> setTimeout(reloadIfIdle, 400));   // nach dem Schließen einer Notiz
  check();
})();
})();
</script>
