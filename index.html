/* Swipe-to-delete für Listenzeilen */
function swipeRow(wrap, inner, onDelete){
  let x0=0, y0=0, dx=0, active=false, open=false;
  const delBtn = el("div",{class:"del",text:"Löschen",onclick:(e)=>{e.stopPropagation(); onDelete();}});
  wrap.appendChild(delBtn);
  inner.addEventListener("touchstart", e=>{
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; active = true;
    inner.style.transition = "none";
  }, {passive:true});
  inner.addEventListener("touchmove", e=>{
    if(!active) return;
    const cx = e.touches[0].clientX - x0, cy = e.touches[0].clientY - y0;
    if(Math.abs(cy) > Math.abs(cx)){ active=false; inner.style.transition=""; inner.style.transform = open?"translateX(-88px)":""; return; }
    dx = Math.min(0, cx + (open ? -88 : 0));
    inner.style.transform = "translateX(" + Math.max(dx, -120) + "px)";
  }, {passive:true});
  inner.addEventListener("touchend", ()=>{
    if(!active) return; active = false;
    inner.style.transition = "";
    open = dx < -44;
    inner.style.transform = open ? "translateX(-88px)" : "";
  });
}

/* ========================= 5. Live-Markdown ==========================
   Direkt aus der Desktop-Quelle übernommen: Der Notiztext IST das Dokument
   (eine Textzeile = ein .line-Span). Die Syntax bleibt im Text stehen und
   wird nur in der Zeile eingeblendet, in der der Cursor steht (.marker-hide).
   Kein Vorschau-Modus, kein zweiter Renderer.
   ===================================================================== */
const ZWS = "\u200b";
const cleanText = s => s.replace(/\u200b/g, "");
const escapeHtml = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const TAG_RE = /(^|[\s(])#([\p{L}_][\p{L}\p{N}_\-\/]*)/gu;
const findNoteByTitle = t => store.notes.find(n => titleOf(n).toLowerCase() === String(t).trim().toLowerCase());

function renderInline(raw){
  let t = escapeHtml(raw);
  const stash = [];
  const put = html => { stash.push(html); return "\u0001" + (stash.length-1) + "\u0002"; };

  t = t.replace(/`([^`]+)`/g, (m, code) =>
    put('<span class="marker marker-hide">`</span><code class="md-code">'+code+'</code><span class="marker marker-hide">`</span>'));
  t = t.replace(/\[\[([^\[\]\n]+?)\]\]/g, (m, title) => {
    const missing = !findNoteByTitle(title.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">"));
    return put('<span class="marker marker-hide">[[</span><span class="md-wikilink'+(missing?" missing":"")+'">'+title+'</span><span class="marker marker-hide">]]</span>');
  });
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, txt, url) =>
    put('<span class="marker marker-hide">[</span><a class="md-link" href="'+url+'" target="_blank" rel="noopener">'+txt+'</a><span class="marker marker-hide">](</span><span class="md-url marker-hide">'+url+'</span><span class="marker marker-hide">)</span>'));
  t = t.replace(/(\*\*|__)([^\s].*?)\1/g, (m, mark, inner) =>
    put('<span class="marker marker-hide">'+mark+'</span><strong>'+inner+'</strong><span class="marker marker-hide">'+mark+'</span>'));
  t = t.replace(/(~~)([^\s].*?)\1/g, (m, mark, inner) =>
    put('<span class="marker marker-hide">'+mark+'</span><del>'+inner+'</del><span class="marker marker-hide">'+mark+'</span>'));
  t = t.replace(/(\*|_)([^\s*_].*?)\1/g, (m, mark, inner) =>
    put('<span class="marker marker-hide">'+mark+'</span><em>'+inner+'</em><span class="marker marker-hide">'+mark+'</span>'));
  t = t.replace(TAG_RE, (m, pre, tag) => pre + put('<span class="md-tag" data-tag="'+tag.toLowerCase()+'">#'+tag+'</span>'));

  return t.replace(/\u0001(\d+)\u0002/g, (m, i) => stash[+i]);
}

function renderLine(raw, idx, state){
  const titleClass = idx === 0 ? " line-title" : "";
  let m;
  if(/^```/.test(raw)){
    state.inCode = !state.inCode;
    return '<span class="line line-code-fence" data-line="'+idx+'"><span class="marker">'+escapeHtml(raw)+'</span></span>';
  }
  if(state.inCode) return '<span class="line line-code" data-line="'+idx+'">'+(raw === "" ? ZWS : escapeHtml(raw))+'</span>';
  if((m = /^(#{1,6})(\s+)(.*)$/.exec(raw)))
    return '<span class="line line-h'+m[1].length+titleClass+'" data-line="'+idx+'"><span class="marker marker-hide">'+escapeHtml(m[1]+m[2])+'</span>'+renderInline(m[3])+'</span>';
  if((m = /^>(\s?)(.*)$/.exec(raw)))
    return '<span class="line line-quote'+titleClass+'" data-line="'+idx+'"><span class="marker">'+escapeHtml(">"+m[1])+'</span>'+renderInline(m[2])+'</span>';
  if((m = /^(\s*[-*]\s)\[([ xX])\](\s.*)$/.exec(raw))){
    const checked = m[2].toLowerCase() === "x";
    return '<span class="line line-list line-checkbox'+(checked?" checked":"")+titleClass+'" data-line="'+idx+'"><span class="marker">'+escapeHtml(m[1])+'</span><span class="md-checkbox" data-line="'+idx+'">'+escapeHtml("["+m[2]+"]")+'</span>'+renderInline(m[3])+'</span>';
  }
  if((m = /^(\s*[-*]\s)(.*)$/.exec(raw)))
    return '<span class="line line-list'+titleClass+'" data-line="'+idx+'"><span class="marker">'+escapeHtml(m[1])+'</span>'+renderInline(m[2])+'</span>';
  if((m = /^(\s*\d+\.\s)(.*)$/.exec(raw)))
    return '<span class="line line-list'+titleClass+'" data-line="'+idx+'"><span class="marker">'+escapeHtml(m[1])+'</span>'+renderInline(m[2])+'</span>';
  if((m = /^(\s+[ivxlcdm]+\.\s)(.*)$/.exec(raw)) && parseListLine(raw))
    return '<span class="line line-list line-sub'+titleClass+'" data-line="'+idx+'"><span class="marker">'+escapeHtml(m[1])+'</span>'+renderInline(m[2])+'</span>';
  if(raw.trim().length > 0 && /^(-{3,}|\*{3,}|_{3,})$/.test(raw.trim()))
    return '<span class="line line-hr" data-line="'+idx+'">'+escapeHtml(raw)+'</span>';
  return '<span class="line'+titleClass+'" data-line="'+idx+'">'+(raw === "" ? ZWS : renderInline(raw))+'</span>';
}

/* ---- Listen: Aufzählung, Nummern und i/ii/iii-Unterpunkte ---- */
const ROMAN_MAP = [[1000,"m"],[900,"cm"],[500,"d"],[400,"cd"],[100,"c"],[90,"xc"],[50,"l"],[40,"xl"],[10,"x"],[9,"ix"],[5,"v"],[4,"iv"],[1,"i"]];
function intToRoman(n){ let out=""; for(const [v,s] of ROMAN_MAP){ while(n>=v){ out+=s; n-=v; } } return out; }
function romanToInt(s){
  const vals={i:1,v:5,x:10,l:50,c:100,d:500,m:1000}; let total=0;
  for(let i=0;i<s.length;i++){ const cur=vals[s[i]], next=vals[s[i+1]]||0; total += cur<next ? -cur : cur; }
  return total;
}
function parseListLine(line){
  let m;
  if((m = /^(\s*)([-*]\s)(\[[ xX]\]\s)?(.*)$/.exec(line)))
    return {indent:m[1],type:"bullet",sym:m[2][0],check:m[3]||"",num:0,marker:m[1]+m[2]+(m[3]||""),content:m[4]};
  if((m = /^(\s*)(\d+)\.\s(.*)$/.exec(line)))
    return {indent:m[1],type:"number",sym:"",check:"",num:parseInt(m[2],10),marker:m[1]+m[2]+". ",content:m[3]};
  if((m = /^(\s+)([ivxlcdm]+)\.\s(.*)$/.exec(line))){
    const n = romanToInt(m[2]);
    if(n > 0 && intToRoman(n) === m[2])
      return {indent:m[1],type:"roman",sym:"",check:"",num:n,marker:m[1]+m[2]+". ",content:m[3]};
  }
  return null;
}
function makeMarker(indent, type, sym, num, check){
  if(type === "bullet") return indent + sym + " " + check;
  if(type === "number") return indent + num + ". ";
  return indent + intToRoman(num) + ". ";
}
function renumberLists(lines){
  let counters = {};
  return lines.map(line=>{
    const li = parseListLine(line);
    if(!li){ if(line.trim() !== "") counters = {}; return line; }
    const k = li.indent.length;
    Object.keys(counters).forEach(key=>{ if(+key > k) delete counters[key]; });
    if(li.type === "bullet"){ counters[k] = {type:"bullet",num:0}; return line; }
    const prev = counters[k];
    const num = prev && prev.type === li.type ? prev.num + 1 : 1;
    counters[k] = {type:li.type,num};
    return num === li.num ? line : makeMarker(li.indent, li.type, li.sym, num, "") + li.content;
  });
}
function parentListItem(lines, idx, indentLen){
  for(let i=idx-1;i>=0;i--){
    const li = parseListLine(lines[i]);
    if(li && li.indent.length < indentLen) return li;
    if(!li && lines[i].trim() !== "") break;
  }
  return null;
}
function siblingListItem(lines, idx, indentLen){
  for(let i=idx-1;i>=0;i--){
    const li = parseListLine(lines[i]);
    if(li && li.indent.length === indentLen) return li;
    if(li && li.indent.length < indentLen) return null;
    if(!li && lines[i].trim() !== "") return null;
  }
  return null;
}
function lineStartsOf(lines){
  const starts = []; let acc = 0;
  for(let i=0;i<lines.length;i++){ starts.push(acc); acc += lines[i].length + 1; }
  return starts;
}
function lineIndexAndColAt(lines, lineStarts, off){
  for(let i=0;i<lines.length;i++){ if(off <= lineStarts[i] + lines[i].length) return {line:i, col: off - lineStarts[i]}; }
  const last = lines.length - 1;
  return {line:last, col: lines[last].length};
}

/* ========================= 6. Editor-Screen ========================= */
let edEl = null, edNote = null, edPrev = [], edOnChange = null;

function inCodeBeforeLine(lines, idx){
  let inCode = false;
  for(let i=0;i<idx;i++) if(/^```/.test(lines[i])) inCode = !inCode;
  return inCode;
}
function fullRebuild(lines){
  const state = {inCode:false};
  edEl.innerHTML = lines.map((l,i)=>renderLine(l,i,state)).join("\n");
}
function renderInto(text){
  const lines = text.split("\n");
  let full = lines.length !== edPrev.length;
  if(!full) for(let i=0;i<lines.length;i++){
    if(lines[i] === edPrev[i]) continue;
    if(/^```/.test(lines[i]) || /^```/.test(edPrev[i])){ full = true; break; }
  }
  if(full){ fullRebuild(lines); edPrev = lines; return; }
  for(let i=0;i<lines.length;i++){
    if(lines[i] === edPrev[i]) continue;
    const tmp = document.createElement("div");
    tmp.innerHTML = renderLine(lines[i], i, {inCode: inCodeBeforeLine(lines, i)});
    const old = edEl.querySelector('.line[data-line="'+i+'"]');
    if(old) old.replaceWith(tmp.firstChild);
  }
  edPrev = lines;
}

/* ---- Cursor-Position als Zeichen-Offset (überlebt das Neu-Rendern) ---- */
function getCaretOffset(el){
  const sel = window.getSelection();
  if(!sel.rangeCount) return 0;
  const range = sel.getRangeAt(0);
  if(!el.contains(range.startContainer)) return 0;
  const pre = range.cloneRange();
  pre.selectNodeContents(el); pre.setEnd(range.endContainer, range.endOffset);
  return cleanText(pre.toString()).length;
}
function getSelectionOffsets(el){
  const sel = window.getSelection();
  if(!sel.rangeCount || !el.contains(sel.getRangeAt(0).startContainer)) return {start:0,end:0};
  const range = sel.getRangeAt(0);
  const a = range.cloneRange(); a.selectNodeContents(el); a.setEnd(range.startContainer, range.startOffset);
  const b = range.cloneRange(); b.selectNodeContents(el); b.setEnd(range.endContainer, range.endOffset);
  return {start: cleanText(a.toString()).length, end: cleanText(b.toString()).length};
}
function locateOffset(el, offset){
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode(n){
      if(n.nodeType === 3) return NodeFilter.FILTER_ACCEPT;
      if(n.nodeType === 1 && n.classList && n.classList.contains("line") && n.childNodes.length === 0) return NodeFilter.FILTER_ACCEPT;
      return NodeFilter.FILTER_SKIP;
    }
  });
  let remaining = offset, node = null, nodeOffset = 0, found = false, lastText = null;
  while(walker.nextNode()){
    const n = walker.currentNode;
    if(n.nodeType === 3){
      const placeholder = n.textContent === ZWS;
      const len = placeholder ? 0 : n.textContent.length;
      if(placeholder){ if(remaining === 0){ node=n; nodeOffset=0; found=true; break; } continue; }
      lastText = n;
      if(remaining < len){ node=n; nodeOffset=remaining; found=true; break; }
      remaining -= len;
    } else if(remaining === 0){ node=n; nodeOffset=0; found=true; break; }
  }
  if(!found && remaining === 0 && lastText){ node = lastText; nodeOffset = lastText.textContent.length; found = true; }
  return {node, nodeOffset, found};
}
function setCaretOffset(el, offset){
  const {node, nodeOffset, found} = locateOffset(el, offset);
  const sel = window.getSelection(), range = document.createRange();
  if(found) range.setStart(node, nodeOffset);
  else if(el.lastChild){ range.selectNodeContents(el); range.collapse(false); }
  else range.setStart(el, 0);
  range.collapse(true);
  sel.removeAllRanges(); sel.addRange(range);
}
function currentLineIndex(){
  const before = cleanText(edEl.textContent).slice(0, getCaretOffset(edEl));
  return (before.match(/\n/g) || []).length;
}
function updateCursorLine(){
  if(!edEl) return;
  if(document.activeElement !== edEl){ clearCursorLine(); return; }
  const idx = currentLineIndex();
  const prev = edEl.querySelector(".line-cursor");
  if(prev && parseInt(prev.dataset.line,10) === idx) return;
  if(prev) prev.classList.remove("line-cursor");
  const cur = edEl.querySelector('.line[data-line="'+idx+'"]');
  if(cur) cur.classList.add("line-cursor");
}
function clearCursorLine(){
  if(edEl) edEl.querySelectorAll(".line-cursor").forEach(s=>s.classList.remove("line-cursor"));
}

/* ---- Schreiben: der Text ist die Quelle, das DOM wird daraus neu gebaut ---- */
function commitText(newText, caretOffset){
  if(!edNote) return;
  renderInto(newText);
  setCaretOffset(edEl, caretOffset);
  edNote.text = newText; edNote.updatedAt = Date.now(); edNote.editedBy = "user"; lastEditAt = Date.now(); save();
  if(edOnChange) edOnChange();
  updateCursorLine();
  keepCaretVisible();
}
function commitLines(lines, caretLine, caretCol){
  const fixed = renumberLists(lines);
  const delta = fixed[caretLine].length - lines[caretLine].length;
  let off = 0; for(let i=0;i<caretLine;i++) off += fixed[i].length + 1;
  commitText(fixed.join("\n"), off + Math.max(0, caretCol + delta));
}
function insertTextAtCaret(text){
  const {start, end} = getSelectionOffsets(edEl);
  const full = cleanText(edEl.textContent);
  commitText(full.slice(0,start) + text + full.slice(end), start + text.length);
}
/* Enter setzt eine Liste fort; auf einem leeren Punkt beendet es sie. */
function handleEnter(){
  const {start, end} = getSelectionOffsets(edEl);
  const lines = cleanText(edEl.textContent).split("\n");
  const pos = lineIndexAndColAt(lines, lineStartsOf(lines), start);
  const line = lines[pos.line];
  const li = start === end ? parseListLine(line) : null;
  if(!li || pos.col < li.marker.length){ insertTextAtCaret("\n"); return; }
  const newLines = lines.slice();
  if(li.content.trim() === ""){
    const parent = parentListItem(lines, pos.line, li.indent.length);
    newLines[pos.line] = parent
      ? makeMarker(parent.indent, parent.type, parent.sym, parent.num + 1, parent.check ? "[ ] " : "")
      : "";
    commitLines(newLines, pos.line, newLines[pos.line].length);
    return;
  }
  const next = li.type === "bullet"
    ? makeMarker(li.indent, "bullet", li.sym, 0, li.check ? "[ ] " : "")
    : makeMarker(li.indent, li.type, li.sym, li.num + 1, "");
  newLines.splice(pos.line, 1, line.slice(0, pos.col), next + line.slice(pos.col));
  commitLines(newLines, pos.line + 1, next.length);
}
/* Einrücken macht aus einem Punkt einen i./ii./iii.-Unterpunkt. */
function indentLines(outdent){
  const {start, end} = getSelectionOffsets(edEl);
  const lines = cleanText(edEl.textContent).split("\n");
  const starts = lineStartsOf(lines);
  const a = lineIndexAndColAt(lines, starts, start), b = lineIndexAndColAt(lines, starts, end);
  const newLines = lines.slice(), colDelta = {};
  for(let i=a.line;i<=b.line;i++){
    const old = newLines[i], li = parseListLine(old);
    let line;
    if(outdent){
      const m = /^ {1,2}/.exec(old);
      const removed = m ? m[0].length : 0;
      line = old.slice(removed);
      if(li && li.type === "roman" && removed){
        const indent = li.indent.slice(removed);
        const sib = siblingListItem(newLines, i, indent.length);
        const type = sib ? sib.type : (indent.length > 0 ? "roman" : "bullet");
        line = makeMarker(indent, type, sib ? sib.sym : "-", 1, "") + li.content;
      }
    } else {
      line = "  " + old;
      if(li && li.type !== "roman" && !li.check) line = makeMarker("  " + li.indent, "roman", "", 1, "") + li.content;
    }
    newLines[i] = line; colDelta[i] = line.length - old.length;
  }
  commitLines(newLines, b.line, b.col + colDelta[b.line]);
}
function keepCaretVisible(){
  if(!edEl || document.activeElement !== edEl) return;
  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  const r = sel.getRangeAt(0).cloneRange(); r.collapse(true);
  let rect = r.getBoundingClientRect();
  if(!rect || (!rect.height && !rect.width)){
    const cur = edEl.querySelector('.line[data-line="'+currentLineIndex()+'"]');
    rect = cur && cur.getBoundingClientRect();
  }
  if(!rect) return;
  const box = edEl.getBoundingClientRect(), pad = 90;
  if(rect.bottom > box.bottom - pad) edEl.scrollTop += rect.bottom - (box.bottom - pad);
  else if(rect.top < box.top + 24) edEl.scrollTop -= (box.top + 24) - rect.top;
}

function openNote(note){
  const ref = {};
  push((scr, nav)=>{
    const meta = el("div",{class:"ed-meta"});
    const ed = el("div",{id:"editor", contenteditable:"true", spellcheck:"false",
                         autocorrect:"off", autocapitalize:"sentences",
                         "data-placeholder":"Titel – dann Enter und losschreiben…"});
    edEl = ed; edNote = note; edPrev = [];

    const noteStatus = () => note.props.status || "Offen";
    /* Kategorie-Zeile unter dem Titel: Symbol + Ordnername in Versalien,
       dahinter der Status als Pille (wie in der Vorlage). */
    function drawMeta(){
      meta.innerHTML = "";
      meta.appendChild(el("span",{class:"mico",html:I.folder}));
      meta.appendChild(el("span",{text:folderName(note.folderId)}));
      meta.appendChild(el("span",{class:"badge",text:noteStatus(),onclick:statusSheet,
        style:"margin-left:auto"}));
    }
    edOnChange = drawMeta;
    function statusSheet(){
      sheet({title:"Status", items:STATUSES.map(k=>({
        label:k, icon: noteStatus()===k ? I.check : I.board,
        onTap:()=>{ note.props.status = k; note.updatedAt = Date.now(); save(); drawMeta(); toast("Status: "+k); }
      }))});
    }

    nav.querySelector(".title").textContent = "Notiz";
    nav.querySelector(".back span:last-child").textContent = "Fertig";
    nav.lastChild.replaceWith(el("div",{style:"display:flex;gap:2px"},[
      el("button",{class:"iconbtn",html:I.more,onclick:()=>sheet({items:[
        {label:"Status ändern", icon:I.board, onTap:statusSheet},
        {label:"In Ordner verschieben", icon:I.move, onTap:()=>moveSheet(note, drawMeta)},
        {label:"Als Text teilen", icon:I.share, onTap:()=>shareNote(note)},
        {label:"In den Papierkorb", icon:I.trash, danger:true, onTap:()=>{
          confirmSheet("Notiz löschen?","Löschen",()=>{ trashNote(note); pop(); toast("In den Papierkorb"); });
        }}
      ]})})
    ]));

    drawMeta();
    scr.appendChild(el("div",{style:"flex:1;display:flex;flex-direction:column;min-height:0"},[meta, ed]));
    renderInto(note.text || "");

    ed.addEventListener("input", ()=>{
      if(edNote !== note) return;
      commitText(cleanText(ed.textContent), getCaretOffset(ed));
    });
    ed.addEventListener("keydown", e=>{
      if(e.isComposing) return;
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); handleEnter(); return; }
      if(e.key === "Tab"){ e.preventDefault(); indentLines(e.shiftKey); }
    });
    /* Software-Tastaturen melden Enter oft nur als beforeinput. */
    ed.addEventListener("beforeinput", e=>{
      if(e.inputType === "insertParagraph" || e.inputType === "insertLineBreak"){ e.preventDefault(); handleEnter(); }
    });
    /* Aufgabe direkt im Text abhaken. */
    ed.addEventListener("pointerdown", e=>{
      const cb = e.target.closest(".md-checkbox"); if(!cb) return;
      e.preventDefault();
      const idx = parseInt(cb.dataset.line, 10);
      const lines = note.text.split("\n");
      lines[idx] = lines[idx].replace(/\[( |x|X)\]/, (m, ch)=> ch === " " ? "[x]" : "[ ]");
      commitText(lines.join("\n"), getCaretOffset(ed));
      if(navigator.vibrate) navigator.vibrate(8);
    });
    ed.addEventListener("click", e=>{
      const tag = e.target.closest(".md-tag");
      if(tag){
        e.preventDefault();
        searchQ = "#" + tag.dataset.tag;
        pop();
        setTimeout(openSearch, 260);
        return;
      }
      const wl = e.target.closest(".md-wikilink");
      if(wl){
        e.preventDefault();
        const target = findNoteByTitle(wl.textContent);
        if(target){ pop(); setTimeout(()=>openNote(target), 240); }
        else toast("Notiz „"+wl.textContent+"“ gibt es nicht");
      }
    });
    ed.addEventListener("focus", ()=>{ kb.classList.add("on"); updateCursorLine(); });
    ed.addEventListener("blur", ()=>{ clearCursorLine(); setTimeout(()=>kb.classList.remove("on"), 80); });
    function onSel(){ if(edEl === ed) updateCursorLine(); }
    document.addEventListener("selectionchange", onSel);

    /* Formatier-Leiste über der Tastatur — ersetzt die Tasten, die eine
       Software-Tastatur nicht hat (Tab/Shift+Tab) und die Desktop-Kürzel. */
    const kb = el("div",{id:"kbbar"});
    const wrapSel = (before, after) => {
      const {start, end} = getSelectionOffsets(ed);
      const full = cleanText(ed.textContent);
      commitText(full.slice(0,start) + before + full.slice(start,end) + (after||"") + full.slice(end),
                 start + before.length + (end - start));
    };
    const linePrefix = pre => {
      const {start} = getSelectionOffsets(ed);
      const lines = cleanText(ed.textContent).split("\n");
      const pos = lineIndexAndColAt(lines, lineStartsOf(lines), start);
      const li = parseListLine(lines[pos.line]);
      const bare = li ? lines[pos.line].slice(li.marker.length) : lines[pos.line].replace(/^(#{1,6}\s|>\s?)/,"");
      const newLines = lines.slice();
      newLines[pos.line] = pre + bare;
      commitLines(newLines, pos.line, newLines[pos.line].length - bare.length + Math.max(0, pos.col - (lines[pos.line].length - bare.length)));
    };
    [["✓", ()=>linePrefix("- [ ] ")],
     ["•", ()=>linePrefix("- ")],
     ["1.", ()=>linePrefix("1. ")],
     ["H1", ()=>linePrefix("# ")],
     ["H2", ()=>linePrefix("## ")],
     ["›", ()=>linePrefix("> ")],
     ["B", ()=>wrapSel("**","**")],
     ["/", ()=>wrapSel("*","*")],
     ["`", ()=>wrapSel("`","`")],
     ["[[", ()=>wrapSel("[[","]]")],
     ["#", ()=>wrapSel("#","")],
     ["—", ()=>insertTextAtCaret("\n---\n")],
     ["⇥", ()=>indentLines(false)],
     ["⇤", ()=>indentLines(true)]
    ].forEach(([label, fn])=>{
      kb.appendChild(el("button",{text:label, onpointerdown:e=>e.preventDefault(), onclick:fn}));
    });
    kb.appendChild(el("div",{class:"sp"}));
    kb.appendChild(el("button",{class:"done",text:"Fertig",onpointerdown:e=>e.preventDefault(),onclick:()=>ed.blur()}));
    scr.appendChild(kb);

    if(!note.text) setTimeout(()=>{ ed.focus(); setCaretOffset(ed, 0); }, 380);
    ref.cleanup = ()=>{
      document.removeEventListener("selectionchange", onSel);
      if(edEl === ed){ edEl = null; edNote = null; edOnChange = null; }
    };
    return null;
  }, {title:"", onPop:()=>ref.cleanup && ref.cleanup()});
}
function moveSheet(note, after){
  sheet({title:"Ordner", items:[
    ...store.folders.map(f=>({label:f.name, icon: note.folderId===f.id ? I.check : I.folder,
      onTap:()=>{ note.folderId=f.id; note.updatedAt=Date.now(); save(); after && after(); toast("Verschoben nach "+f.name); }})),
    {label:"Neuer Ordner…", icon:I.plus, onTap:()=>promptSheet("Neuer Ordner","", "Name", n=>{
      const f = {id:uid(),name:n,parentId:null}; store.folders.push(f);
      note.folderId = f.id; save(); after && after(); toast("Ordner angelegt");
    })}
  ]});
}
async function shareNote(note){
  const text = note.text;
  if(navigator.share){ try{ await navigator.share({title:titleOf(note), text}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(text); toast("In die Zwischenablage kopiert"); }
  catch(e){ toast("Teilen nicht verfügbar"); }
}

/* ========================= 7. Tab: Aufgaben =========================
   Zeigt die Aufgaben-Notizen (props.type === "task", angelegt am Mac oder über
   Claude) nach Fälligkeitstag gruppiert. Dasselbe Datenmodell wie die Desktop-
   Version: props.due (YYYY-MM-DD), props.status aus STATUSES, props.tag als
   Kürzel, das über TAG_GROUPS zu einer Gruppe gehört. */
const STATUSES = ["Offen", "In Arbeit", "Blockiert", "Erledigt"];
const TAG_GROUPS = [
  { id:"myo",           name:"MYO",           tags:["sls","fin","mkt","ops","sf","bizdev","prod","andere"] },
  { id:"privat",        name:"Privat",        tags:["ehe","solo"] },
  { id:"wiederkehrend", name:"Wiederkehrend", tags:["geburtstage","arbeit"] }
];
const isTask = n => !!(n && n.props && n.props.type === "task");
const groupOfTag = tag => TAG_GROUPS.find(g => g.tags.includes(String(tag||"").toLowerCase())) || null;
function dayKey(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function shiftDay(key, days){
  const [y,m,d] = key.split("-").map(Number);
  const dt = new Date(y, m-1, d + days);
  return dayKey(dt);
}
function fmtDay(key){
  const [y,m,d] = key.split("-").map(Number);
  return String(d).padStart(2,"0") + "." + String(m).padStart(2,"0") + ".";
}
/* Überschrift eines Tagesabschnitts: die nächsten Tage bekommen einen Namen,
   alles danach Wochentag + Datum. */
function dayHeading(key){
  const today = dayKey();
  if(key === "none") return { title:"Ohne Termin", sub:"kein Datum gesetzt" };
  if(key < today)    return { title:"Überfällig",  sub:"seit " + fmtDay(key) };
  if(key === today)  return { title:"Heute",       sub:fmtDay(key) };
  if(key === shiftDay(today, 1)) return { title:"Morgen", sub:fmtDay(key) };
  const [y,m,d] = key.split("-").map(Number);
  return { title: new Date(y, m-1, d).toLocaleDateString("de-DE",{weekday:"long"}), sub:fmtDay(key) };
}

let taskGroup = "";          // "" = alle Gruppen
let showDone = false;

renderers.aufgaben = function(){
  const v = tabviews.aufgaben; v.innerHTML = "";
  const nav = el("div",{class:"nav"},[
    el("div",{},[
      el("div",{class:"sub",text:new Date().toLocaleDateString("de-DE",{weekday:"long", day:"numeric", month:"long"})}),
      el("h1",{text:"Aufgaben"})
    ]),
    el("div",{class:"nav-actions"},[
      el("button",{class:"iconbtn",html:I.search,onclick:openSearch}),
      el("button",{class:"iconbtn"+(showDone?" accent":""),html:I.eye,onclick:()=>{ showDone = !showDone; renderers.aufgaben(); }}),
      syncDotBtn(),
      el("button",{class:"iconbtn",html:I.gear,onclick:settingsSheet})
    ])
  ]);

  const all = store.notes.filter(isTask);
  const visible = all.filter(n => showDone || n.props.status !== "Erledigt")
                     .filter(n => !taskGroup || (groupOfTag(n.props.tag)||{}).id === taskGroup);

  /* Filterleiste: Gruppen als Reiter, mit Anzahl */
  const counts = {};
  TAG_GROUPS.forEach(g => counts[g.id] = all.filter(n =>
    (showDone || n.props.status !== "Erledigt") && (groupOfTag(n.props.tag)||{}).id === g.id).length);
  const openAll = all.filter(n => showDone || n.props.status !== "Erledigt").length;
  const seg = el("div",{class:"seg"});
  [{id:"", name:"Alle", n:openAll}].concat(TAG_GROUPS.map(g=>({id:g.id, name:g.name, n:counts[g.id]})))
    .forEach(g => seg.appendChild(el("button",{class: taskGroup===g.id ? "on":"", onclick:()=>{ taskGroup = g.id; renderers.aufgaben(); }},
      [el("span",{text:g.name}), el("span",{class:"n",text:String(g.n)})])));

  const sc = el("div",{class:"scroll"});
  v.append(nav, seg, sc); attachCollapse(sc, nav);

  /* Nach Tagen bündeln: überfällige Tage zuerst, dann heute und die Zukunft,
     ganz am Ende die Aufgaben ohne Termin. */
  const buckets = {};
  visible.forEach(n => { const k = n.props.due || "none"; (buckets[k] = buckets[k] || []).push(n); });
  const keys = Object.keys(buckets).filter(k => k !== "none").sort();
  if(buckets.none) keys.push("none");

  if(!keys.length){
    if(!all.length && !syncEnabled()){
      sc.appendChild(el("div",{class:"section"},[el("div",{class:"hintbox"},[
        el("div",{class:"txt",text:"Dieses Gerät ist noch nicht mit deinem Konto verbunden — deshalb sind hier keine Aufgaben vom Mac zu sehen."}),
        el("button",{text:"Konto verbinden",onclick:openAccount})
      ])]));
      return;
    }
    sc.appendChild(el("div",{class:"section"},[el("div",{class:"group"},[
      el("div",{class:"empty",text: all.length ? "In dieser Gruppe ist nichts offen." : "Noch keine Aufgaben. Am Mac oder über Claude anlegen."})])]));
    return;
  }
  /* Alle überfälligen Tage laufen unter einer gemeinsamen Überschrift. */
  const today = dayKey();
  const overdue = keys.filter(k => k !== "none" && k < today);
  const rest = keys.filter(k => k === "none" || k >= today);
  if(overdue.length){
    const items = overdue.reduce((a,k)=>a.concat(buckets[k]), []);
    sc.appendChild(daySection("Überfällig", "seit " + fmtDay(overdue[0]) + " · " + items.length, items));
  }
  rest.forEach(k => {
    const h = dayHeading(k);
    sc.appendChild(daySection(h.title, h.sub + " · " + buckets[k].length, buckets[k]));
  });
};

function daySection(title, sub, notes){
  const sec = el("div",{class:"section"});
  sec.appendChild(sectionHead(title, sub));
  const g = el("div",{class:"group"});
  notes.forEach(n => g.appendChild(taskNoteRow(n, ()=>renderers.aufgaben())));
  sec.appendChild(g);
  return sec;
}

/* Aufgabenzeile: Häkchen-Kreis, Titel, Kategorie-Symbol, darunter die Felder
   „Fällig"/„Kategorie" und der Status mit Fortschritt der Unteraufgaben. */
function taskNoteRow(n, refresh){
  const wrap = el("div",{class:"rowwrap"});
  const done = n.props.status === "Erledigt";
  const subs = allTasks().filter(t=>t.noteId===n.id);
  const subsDone = subs.filter(t=>t.done).length;
  const overdue = n.props.due && n.props.due < dayKey() && !done;
  const group = groupOfTag(n.props.tag);

  const row = el("div",{class:"row"+(done?" done":"")},[
    el("div",{class:"head"},[
      el("div",{class:"circle",html:I.check,onclick:e=>{
        e.stopPropagation();
        n.props.status = done ? "Offen" : "Erledigt";
        n.updatedAt = Date.now(); save();
        if(navigator.vibrate) navigator.vibrate(8);
        row.classList.toggle("done");
        setTimeout(()=>refresh && refresh(), 260);
      }}),
      el("div",{class:"txt"},[el("div",{class:"t",text:titleOf(n)})]),
      el("div",{class:"ico "+(group && group.id==="privat" ? "accent" : "gold"),
                html: group && group.id==="privat" ? I.heart : I.case})
    ]),
    el("div",{class:"fields"},[
      el("div",{class:"fld"},[
        el("div",{class:"lbl",text:"Fällig"}),
        el("div",{class:"v mono"+(overdue?" due":""),text: n.props.due ? fmtDay(n.props.due) : "—"})
      ]),
      el("div",{class:"fld",style:"flex:1;min-width:0"},[
        el("div",{class:"lbl",text:"Kategorie"}),
        el("div",{class:"v",text: (n.props.tag || "").toUpperCase() || folderName(n.folderId)})
      ])
    ]),
    el("div",{class:"meterrow"},[
      el("span",{class:"lbl",text: n.props.status || "Offen"}),
      el("span",{class:"meter"},[el("i",{style:"width:"+Math.round((subs.length ? subsDone/subs.length : (done?1:.06))*100)+"%"})]),
      subs.length ? el("span",{class:"cnt",text:subsDone+"/"+subs.length+" erledigt"}) : null
    ])
  ]);
  row.addEventListener("click", ()=>openNote(n));
  row.addEventListener("touchstart", ()=>row.classList.add("pressed"), {passive:true});
  ["touchend","touchmove","touchcancel"].forEach(ev=>row.addEventListener(ev, ()=>row.classList.remove("pressed"), {passive:true}));
  wrap.appendChild(row);
  swipeRow(wrap, row, ()=>{ trashNote(n); toast("In den Papierkorb"); refresh && refresh(); });
  return wrap;
}


function linkRow(icon, title, count, onTap, tone){
  const row = el("div",{class:"row"},[
    el("div",{class:"head"},[
      el("div",{class:"ico "+(tone||""),html:icon}),
      el("div",{class:"txt"},[el("div",{class:"t",text:title})]),
      el("div",{class:"meta",text:String(count)}),
      el("div",{class:"chev"})
    ])
  ]);
  row.addEventListener("click", onTap);
  row.addEventListener("touchstart", ()=>row.classList.add("pressed"), {passive:true});
  ["touchend","touchmove","touchcancel"].forEach(ev=>row.addEventListener(ev, ()=>row.classList.remove("pressed"), {passive:true}));
  return el("div",{class:"rowwrap"},[row]);
}

/* Abschnittskopf im Stil der Vorlage: große Überschrift, darunter ein
   gesperrtes Versal-Label, rechts optional eine Aktion. */
function sectionHead(title, sub, link){
  return el("div",{class:"section-head"},[
    el("div",{},[
      el("div",{class:"h",text:title}),
      sub ? el("div",{class:"sub",text:sub}) : null
    ]),
    link ? el("span",{class:"link",text:link.label,onclick:link.onTap}) : null
  ]);
}

function taskRow(t, refresh){
  const row = el("div",{class:"task"+(t.done?" done":"")});
  row.appendChild(el("div",{class:"check",html:I.check,onclick:e=>{
    e.stopPropagation(); toggleTask(t); if(navigator.vibrate) navigator.vibrate(8);
    row.classList.toggle("done"); setTimeout(refresh, 260);
  }}));
  row.appendChild(el("div",{class:"tt"},[
    el("span",{text:t.text}),
    el("span",{class:"src",text:titleOf(t.note)})
  ]));
  row.addEventListener("click", ()=>openNote(t.note));
  return row;
}

/* Notizzeile im Stil der Vorlage: Titel mit Kategorie-Symbol, darunter die
   Felder als Formularzeile, darunter der Fortschritt der Checklisten-Einträge.
   Aufgaben-Status steht bewusst nur an echten Aufgaben (siehe taskNoteRow) —
   sonst würde die Notizliste ein Feld anzeigen, das es dort nicht gibt. */
function noteRow(n, refresh){
  const wrap = el("div",{class:"rowwrap"});
  const tasks = allTasks().filter(t=>t.noteId===n.id);
  const doneN = tasks.filter(t=>t.done).length;

  const row = el("div",{class:"row"},[
    el("div",{class:"head"},[
      el("div",{class:"txt"},[el("div",{class:"t",text:titleOf(n)})]),
      el("div",{class:"ico "+(n.folderId?"gold":"accent"),html:n.folderId?I.folder:I.doc}),
      el("div",{class:"chev"})
    ]),
    el("div",{class:"fields"},[
      el("div",{class:"fld"},[
        el("div",{class:"lbl",text:"Geändert"}),
        el("div",{class:"v mono",text:relTime(n.updatedAt)})
      ]),
      el("div",{class:"fld",style:"flex:1;min-width:0"},[
        el("div",{class:"lbl",text:"Kategorie"}),
        el("div",{class:"v",text:folderName(n.folderId)})
      ])
    ]),
    tasks.length ? el("div",{class:"meterrow"},[
      el("span",{class:"lbl",text:"Aufgaben"}),
      el("span",{class:"meter"},[el("i",{style:"width:"+Math.round(doneN/tasks.length*100)+"%"})]),
      el("span",{class:"cnt",text:doneN+"/"+tasks.length+" erledigt"})
    ]) : null
  ]);
  row.addEventListener("click", ()=>openNote(n));
  row.addEventListener("touchstart", ()=>row.classList.add("pressed"), {passive:true});
  ["touchend","touchmove","touchcancel"].forEach(ev=>row.addEventListener(ev, ()=>row.classList.remove("pressed"), {passive:true}));
  wrap.appendChild(row);
  swipeRow(wrap, row, ()=>{ trashNote(n); toast("In den Papierkorb"); refresh && refresh(); });
  return wrap;
}

/* ========================= 8. Tab: Notizen ========================= */
renderers.notizen = function(){
  const v = tabviews.notizen; v.innerHTML = "";
  const nav = el("div",{class:"nav"},[
    el("div",{},[el("h1",{text:"Notizen"})]),
    el("div",{class:"nav-actions"},[
      el("button",{class:"iconbtn",html:I.search,onclick:openSearch}),
      el("button",{class:"iconbtn",html:I.folder,onclick:()=>promptSheet("Neuer Ordner","","Name",n=>{
        store.folders.push({id:uid(),name:n,parentId:null}); save(); renderers.notizen(); })}),
      syncDotBtn(),
      el("button",{class:"iconbtn",html:I.gear,onclick:settingsSheet})
    ])
  ]);
  const sc = el("div",{class:"scroll"});
  v.append(nav, sc); attachCollapse(sc, nav);

  /* Ordner */
  const secF = el("div",{class:"section"});
  secF.appendChild(sectionHead("Ordner", store.folders.length + " Ordner"));
  const gF = el("div",{class:"group"});
  store.folders.forEach(f=>{
    const count = store.notes.filter(n=>n.folderId===f.id).length;
    gF.appendChild(linkRow(I.folder, f.name, count, ()=>openFolder(f), "gold"));
  });
  const un = store.notes.filter(n=>!n.folderId || !store.folders.some(f=>f.id===n.folderId));
  if(un.length){
    gF.appendChild(linkRow(I.folder, "Ohne Ordner", un.length, ()=>openFolder({id:null,name:"Ohne Ordner"}), "gold"));
  }
  secF.appendChild(gF); sc.appendChild(secF);

  /* Tags */
  const tagMap = {};
  store.notes.forEach(n=>tagsOf(n).forEach(t=>tagMap[t]=(tagMap[t]||0)+1));
  const tags = Object.keys(tagMap).sort();
  if(tags.length){
    const secT = el("div",{class:"section"});
    secT.appendChild(sectionHead("Tags", tags.length + " Tags"));
    const gT = el("div",{class:"group"});
    tags.forEach(t=>{
      gT.appendChild(linkRow(I.tag, "#"+t, tagMap[t],
        ()=>openList("#"+t, store.notes.filter(n=>tagsOf(n).includes(t))), "accent"));
    });
    secT.appendChild(gT); sc.appendChild(secT);
  }

  /* Alle Notizen */
  const secN = el("div",{class:"section"});
  secN.appendChild(sectionHead("Alle Notizen", store.notes.length + " Stück"));
  const gN = el("div",{class:"group"});
  store.notes.slice().sort(byRecent).forEach(n=>gN.appendChild(noteRow(n, ()=>renderers.notizen())));
  if(!store.notes.length) gN.appendChild(el("div",{class:"empty",text:"Noch nichts. Tipp auf +."}));
  secN.appendChild(gN); sc.appendChild(secN);
};

function openFolder(f){
  push((scr, nav)=>{
    const sc = el("div",{class:"scroll"});
    const draw = ()=>{
      sc.innerHTML = "";
      const list = store.notes.filter(n => f.id ? n.folderId===f.id : (!n.folderId || !store.folders.some(x=>x.id===n.folderId))).sort(byRecent);
      const g = el("div",{class:"group"});
      list.forEach(n=>g.appendChild(noteRow(n, draw)));
      if(!list.length) g.appendChild(el("div",{class:"empty",text:"Ordner ist leer."}));
      sc.appendChild(el("div",{class:"section",style:"padding-top:6px"},[g]));
    };
    draw();
    attachCollapse(sc, nav);
    return sc;
  }, {title:f.name, action: el("button",{class:"iconbtn accent",html:I.plus,onclick:()=>openNote(newNote(f.id))})});
}
function openList(title, notes){
  push((scr, nav)=>{
    const sc = el("div",{class:"scroll"});
    const g = el("div",{class:"group"});
    notes.sort(byRecent).forEach(n=>g.appendChild(noteRow(n)));
    if(!notes.length) g.appendChild(el("div",{class:"empty",text:"Nichts gefunden."}));
    sc.appendChild(el("div",{class:"section",style:"padding-top:6px"},[g]));
    attachCollapse(sc, nav);
    return sc;
  }, {title});
}

/* ========================= 9. Suche (über das Lupensymbol oben) ========================= */
let searchQ = "";
function openSearch(){
  push((scr, nav)=>{
    const input = el("input",{id:"q", type:"search", placeholder:"Notizen, Aufgaben, Tags…", autocomplete:"off", value:searchQ});
    const bar = el("div",{class:"searchbar"},[
      el("div",{class:"field"},[el("span",{html:I.search}), input])
    ]);
    const sc = el("div",{class:"scroll", id:"results"});
    const draw = ()=>drawResults(sc);
    input.addEventListener("input", ()=>{ searchQ = input.value; draw(); });
    scr.appendChild(bar);
    draw();
    attachCollapse(sc, nav);
    setTimeout(()=>input.focus(), 340);
    return sc;
  }, {title:"Suche"});
}
function drawResults(sc){
  sc.innerHTML = "";
  const q = searchQ.trim().toLowerCase();
  if(!q){
    const recent = store.notes.slice().sort(byRecent).slice(0,8);
    const g = el("div",{class:"group"});
    recent.forEach(n=>g.appendChild(noteRow(n, ()=>drawResults(sc))));
    sc.appendChild(el("div",{class:"section",style:"padding-top:6px"},[
      sectionHead("Zuletzt", "bearbeitet"), g]));
    return;
  }
  const notes = store.notes.filter(n=>n.text.toLowerCase().includes(q)).sort(byRecent);
  const tasks = allTasks().filter(t=>t.text.toLowerCase().includes(q));
  if(notes.length){
    const g = el("div",{class:"group"});
    notes.forEach(n=>g.appendChild(noteRow(n, ()=>drawResults(sc))));
    sc.appendChild(el("div",{class:"section",style:"padding-top:6px"},[
      sectionHead("Notizen", notes.length + " Treffer"), g]));
  }
  if(tasks.length){
    const g = el("div",{class:"group"});
    tasks.slice(0,20).forEach(t=>g.appendChild(taskRow(t, ()=>drawResults(sc))));
    sc.appendChild(el("div",{class:"section"},[
      sectionHead("Aufgaben", tasks.length + " Treffer"), g]));
  }
  if(!notes.length && !tasks.length){
    sc.appendChild(el("div",{class:"section"},[el("div",{class:"group"},[
      el("div",{class:"empty",text:'Nichts zu „'+searchQ+'" gefunden.'})])]));
    sc.appendChild(el("div",{class:"section"},[el("button",{class:"sheet-primary",text:"Notiz anlegen",onclick:()=>{
      const n = newNote(); n.text = searchQ + "\n\n"; save(); pop(); setTimeout(()=>openNote(n), 240);
    }})]));
  }
}


/* ========================= 11. Einstellungen ========================= */
const THEMES = {
  fern:  {bg:"#2b4a3b",surface:"#315443",s2:"#3a6150",line:"#3f6553",text:"#eaf1e4",muted:"#93ad9b",faint:"#6d8a78",accent:"#dcee8a",ink:"#22392f"},
  nacht: {bg:"#16181d",surface:"#1f2229",s2:"#282c35",line:"#333844",text:"#e7e9ee",muted:"#9aa0ad",faint:"#666d7b",accent:"#b9c6ff",ink:"#16181d"},
  papier:{bg:"#f6f3ec",surface:"#ffffff",s2:"#efeadf",line:"#e2dcd0",text:"#23211d",muted:"#6f6a61",faint:"#a09a8e",accent:"#3f6f4f",ink:"#ffffff"}
};
/* Dasselbe Stapel-Symbol wie die Desktop-App: drei versetzte Quadrate in drei
   Abstufungen der Akzentfarbe, zur Laufzeit aus dem aktiven Theme gebaut. */
function mixHex(a, b, amount){
  const p = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const [r1,g1,b1] = p(a), [r2,g2,b2] = p(b), m = (x,y)=>Math.round(x+(y-x)*amount);
  return "#" + [m(r1,r2),m(g1,g2),m(b1,b2)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function stackIconSVG(t){
  const back = mixHex(t.accent, t.bg, 0.65), mid = mixHex(t.accent, t.bg, 0.35);
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">'
    + '<rect x="2" y="9" width="14" height="14" rx="4" fill="'+back+'"/>'
    + '<rect x="5" y="6" width="14" height="14" rx="4" fill="'+mid+'"/>'
    + '<rect x="8" y="3" width="14" height="14" rx="4" fill="'+t.accent+'"/>'
    + '</svg>';
}
function applyTheme(name){
  const t = THEMES[name] || THEMES.fern, r = document.documentElement.style;
  const link = document.getElementById("app-favicon");
  if(link) link.setAttribute("href", "data:image/svg+xml," + encodeURIComponent(stackIconSVG(t)));
  r.setProperty("--bg",t.bg); r.setProperty("--surface",t.surface); r.setProperty("--surface-2",t.s2);
  r.setProperty("--line",t.line); r.setProperty("--text",t.text); r.setProperty("--muted",t.muted);
  r.setProperty("--faint",t.faint); r.setProperty("--accent",t.accent); r.setProperty("--accent-ink",t.ink);
  const meta = document.querySelector('meta[name="theme-color"]'); if(meta) meta.content = t.bg;
  store.ui.theme = name; save();
}
applyTheme(store.ui.theme || "fern");

function settingsSheet(){
  const sw = el("div",{class:"swatches"});
  Object.keys(THEMES).forEach(k=>{
    const t = THEMES[k];
    const b = el("div",{class:"swatch"+(store.ui.theme===k?" on":""), style:"background:"+t.bg,
      onclick:()=>{ applyTheme(k); sw.querySelectorAll(".swatch").forEach(x=>x.classList.remove("on")); b.classList.add("on"); }},
      [el("i",{style:"background:"+t.accent})]);
    sw.appendChild(b);
  });
  sheet({title:"Einstellungen", items:[
    {custom: sw},
    {label:"Konto & Sync", icon:I.gear, value: sync.session ? sync.session.email : "nicht verbunden", onTap:openAccount},
    {label:"Papierkorb", icon:I.trash, value:String(store.trash.length), onTap:openTrash},
    {label:"Daten exportieren", icon:I.share, onTap:exportData},
    {label:"Alle Notizen als Text", icon:I.doc, onTap:exportText}
  ]});
}
function openTrash(){
  push((scr, nav)=>{
    const sc = el("div",{class:"scroll"});
    const draw = ()=>{
      sc.innerHTML = "";
      const g = el("div",{class:"group"});
      store.trash.forEach(n=>{
        const row = el("div",{class:"row"},[
          el("div",{class:"ico",html:I.doc}),
          el("div",{class:"txt"},[el("div",{class:"t",text:titleOf(n)}),
            el("div",{class:"s",text:"gelöscht "+relTime(n.deletedAt||n.updatedAt)})]),
          el("button",{class:"iconbtn",html:I.more,onclick:e=>{ e.stopPropagation();
            sheet({title:titleOf(n), items:[
              {label:"Wiederherstellen", icon:I.check, onTap:()=>{
                store.trash = store.trash.filter(x=>x.id!==n.id);
                delete n.deletedAt; store.notes.unshift(n); save(); draw(); toast("Wiederhergestellt");
              }},
              {label:"Endgültig löschen", icon:I.trash, danger:true, onTap:()=>{
                store.trash = store.trash.filter(x=>x.id!==n.id); save(); draw(); toast("Gelöscht");
              }}
            ]});
          }})
        ]);
        g.appendChild(el("div",{class:"rowwrap"},[row]));
      });
      if(!store.trash.length) g.appendChild(el("div",{class:"empty",text:"Papierkorb ist leer."}));
      sc.appendChild(el("div",{class:"section",style:"padding-top:6px"},[g]));
      if(store.trash.length) sc.appendChild(el("div",{class:"section"},[
        el("button",{class:"sheet-primary",style:"background:var(--signal);color:#fff",text:"Papierkorb leeren",
          onclick:()=>confirmSheet("Papierkorb leeren?","Alles löschen",()=>{ store.trash=[]; save(); draw(); })})]));
    };
    draw(); attachCollapse(sc, nav);
    return sc;
  }, {title:"Papierkorb"});
}
function download(name, text, type){
  const a = el("a",{href:URL.createObjectURL(new Blob([text],{type:type||"text/plain"})), download:name});
  document.body.appendChild(a); a.click(); a.remove();
  toast("Export gestartet");
}
function exportData(){ download("notes-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(store,null,2), "application/json"); }
function exportText(){
  download("notes-"+new Date().toISOString().slice(0,10)+".md",
    store.notes.slice().sort(byRecent).map(n=>n.text).join("\n\n---\n\n"), "text/markdown");
}

/* ========================= 12. Globales ========================= */
/* Tastatur: Tab-Bar ausblenden, Editor-Leiste andocken */
const vv = window.visualViewport;
if(vv){
  const onVV = ()=>{
    const gap = window.innerHeight - vv.height - vv.offsetTop;
    document.body.classList.toggle("kb", gap > 140);
    const bar = document.getElementById("kbbar");
    if(bar) bar.style.bottom = Math.max(0, gap) + "px";
  };
  vv.addEventListener("resize", onVV); vv.addEventListener("scroll", onVV);
}
/* Doppeltipp-Zoom unterbinden (App-Gefühl) */
let lastTouch = 0;
document.addEventListener("touchend", e=>{
  const now = Date.now();
  if(now - lastTouch < 300 && !e.target.closest("textarea,input,.preview")) e.preventDefault();
  lastTouch = now;
}, {passive:false});

showTab("aufgaben");
})();
</script>
