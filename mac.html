  .nl-section{ font-size: var(--fs-xs); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); padding: 16px 8px 6px; }
  .nl-path{ font-size: var(--fs-s); color:var(--text-faint); }
  #tree .nl-path{ flex:none; max-width:30%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nl-when{ flex:none; width:86px; text-align:right; font-size: var(--fs-xs); color:var(--text-faint); }

  /* ---------- Bewegung: ein System für die ganze App ----------
     Eine Kurve, drei Dauern. Alles, was sich bewegt, benutzt diese Werte — sonst fühlt sich jede
     Stelle ein bisschen anders an, und genau das wirkt unfertig. */
  :root{ --ease: cubic-bezier(.2,.8,.2,1); --ease-out: cubic-bezier(.16,1,.3,1);
         --dur-s: .12s; --dur-m: .22s; --dur-l: .34s; }
  @keyframes viewin{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:none; } }
  @keyframes popin{ from{ opacity:0; transform: translateY(-4px) scale(.97); } to{ opacity:1; transform:none; } }
  @keyframes settle{ 0%{ transform: scale(1.04); box-shadow: 0 10px 24px rgba(0,0,0,.18); } 100%{ transform:none; box-shadow:none; } }
  @keyframes bump{ 0%{ transform:scale(1); } 40%{ transform:scale(1.35); } 100%{ transform:scale(1); } }
  #settings-pop.open, #ctx-menu.open, #template-pop.open, .cal-pop.open{ animation: popin var(--dur-m) var(--ease-out); transform-origin: top right; }
  #ctx-menu.open{ transform-origin: top left; }
  #palette.open .palette-box{ animation: popin var(--dur-m) var(--ease-out); transform-origin: top center; }
  /* Knöpfe geben beim Drücken minimal nach */
  button, .pill, .fpill, .d2-q, .d2-nav, .topbar-btn, .icon-btn, .tcheck, .row.home-row {
    transition-property: background-color, border-color, color, box-shadow, opacity, transform;
    transition-duration: var(--dur-s); transition-timing-function: var(--ease); }
  button:active, .pill:active, .fpill:active, .d2-q:active, .d2-nav:active, .topbar-btn:active, .icon-btn:active, .row.home-row:active{ transform: scale(.96); }
  .tcheck:active{ transform: scale(.86); }
  .settle{ animation: settle var(--dur-l) var(--ease-out); }  /* Sliding Number: Fenster genau eine Ziffer hoch, Spalte rollt mit leichtem Überschwingen (Feder) */
  .sn-d{ display:inline-block; height:1.2em; line-height:1.2em; overflow:hidden; vertical-align:bottom; }
  .sn-s{ display:inline-block; line-height:1.2em; vertical-align:bottom; white-space:pre; }
  .sn-col{ display:block; }
  .sn-col.go{ transition: transform .6s cubic-bezier(.3,1.45,.55,1); }
  .sn-col i{ display:block; height:1.2em; font-style:normal; text-align:center; }
  /* iPad-Zeiger: eigener Pfeil, der sich über Bedienelementen in deren Form verwandelt.
     html.ipc blendet den Systemzeiger aus; html.ipc-native holt ihn über Text/Eingaben zurück. */
  html.ipc:not(.ipc-native), html.ipc:not(.ipc-native) *{ cursor:none !important; }
  #ipc{ position:fixed; inset:0; pointer-events:none; z-index:2147483000; }
  #ipc .ipc-arrow{ position:absolute; left:0; top:0; width:22px; height:22px; opacity:0;
    transition: opacity .15s var(--ease), scale .2s var(--ease-out); transform-origin: 4px 3px; }
  #ipc .ipc-arrow path{ fill: var(--bg); stroke: var(--text-muted); stroke-width:2.3; stroke-linejoin:round; }
  #ipc.on .ipc-arrow{ opacity:1; }
  #ipc.morph .ipc-arrow, #ipc.native .ipc-arrow{ opacity:0; scale:.5; }
  #ipc.down .ipc-arrow{ scale:.85; }
  #ipc .ipc-hl{ position:absolute; left:0; top:0; width:0; height:0; opacity:0; border-radius:10px;
    background: color-mix(in srgb, var(--text) 10%, transparent);
    transition: left .26s cubic-bezier(.3,1.25,.5,1), top .26s cubic-bezier(.3,1.25,.5,1),
                width .26s cubic-bezier(.3,1.25,.5,1), height .26s cubic-bezier(.3,1.25,.5,1),
                border-radius .2s var(--ease), opacity .16s var(--ease), translate .12s linear, scale .14s var(--ease-out); }
  #ipc.morph .ipc-hl{ opacity:1; }
  #ipc.down .ipc-hl{ scale:.96; }
  /* Der Zeiger IST die Hover-Fläche — eigene Hover-Hintergründe würden sich sonst doppeln */
  html.ipc .shov{ display:none; }
  /* .ipc-t = das Element, in das sich der Zeiger gerade verwandelt hat; zu große Elemente behalten ihr Hover */
  html.ipc .row.ipc-t:hover:not(.selected):not(.on), html.ipc .opt.ipc-t:hover:not(.active), html.ipc .topbar-btn.ipc-t:hover:not(.active),
  html.ipc .icon-btn.ipc-t:hover, html.ipc .side-btn.ipc-t:hover, html.ipc .pill.ipc-t:hover:not(.on):not(.primary),
  html.ipc .d2-nav.ipc-t:hover, html.ipc .fpill.ipc-t:hover:not(.on), html.ipc .kcard.ipc-t:hover{ background: transparent; }
  /* Karten: leichte Tiefe beim Überfahren statt nur einer Flächenfarbe */
  .kcard, .trow, .pcard{ transition: background-color var(--dur-s) var(--ease), box-shadow var(--dur-m) var(--ease), transform var(--dur-m) var(--ease); }
  .kcard:hover{ background: var(--hover); }
  .pcard:hover{ box-shadow: var(--shadow-sm); }
  @media (prefers-reduced-motion: reduce){
    #settings-pop.open, #ctx-menu.open, #template-pop.open, .cal-pop.open, #palette.open .palette-box, .settle { animation:none; }
    button:active, .pill:active, .fpill:active, .kcard:hover{ transform:none; }
  }

  /* ---------- Dialog: Notiz oder Ticket über der aktuellen Seite ---------- */
  #dialog{ display:none; position:fixed; inset:0; z-index:40; padding: 4vh 3vw; align-items:center; justify-content:center;
    background: rgba(0,0,0,.34); backdrop-filter: blur(6px) saturate(.9); -webkit-backdrop-filter: blur(6px) saturate(.9); }
  body.dialog-open #dialog{ display:flex; animation: dlgfade var(--dur-m) var(--ease-out); }
  .dlg-box{ width:min(1240px, 100%); height:min(92vh, 1040px); display:flex; flex-direction:column; overflow:hidden;
    background: var(--bg); border:1px solid var(--border); border-radius:18px; box-shadow: 0 30px 80px rgba(0,0,0,.35);
    animation: dlgpop var(--dur-m) var(--ease-out); }
  @keyframes dlgfade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes dlgpop{ from{ transform: translateY(10px) scale(.985); opacity:.5; } to{ transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce){ body.dialog-open #dialog, .dlg-box{ animation:none; } }
  .dlg-exit{ position:fixed; inset:0; z-index:41; pointer-events:none; background: rgba(0,0,0,.34);
    backdrop-filter: blur(6px) saturate(.9); -webkit-backdrop-filter: blur(6px) saturate(.9);
    animation: dlgfade .18s ease-in reverse forwards; }
  .dlg-exit .dlg-box{ animation: dlgpop .18s ease-in reverse forwards; }
  .dlg-head{ display:flex; align-items:center; gap:6px; padding: 12px 14px 6px 22px; flex:none; }
  .dlg-head .breadcrumb{ padding-left:0; }
  #dlg-top{ flex:none; padding: 4px 28px 14px; font-family: var(--editor-font); border-bottom:1px solid var(--border); }
  #dlg-top:empty{ display:none; }
  #dlg-top #fields{ max-width:none; padding:0; }
  .dlg-body{ flex:1; min-height:0; display:flex; position:relative; }
  /* Lesefortschritt (animate-ui „Scroll Progress“): Linie unten am Textbereich, wächst mit dem Scrollen.
     Nur sichtbar, wenn sich der Text überhaupt scrollen lässt. */
  #scroll-prog{ position:absolute; bottom:0; left:0; right:0; height:2px; z-index:3; pointer-events:none;
    background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); opacity:0;
    transition: opacity .25s ease, transform .12s linear; }
  #scroll-prog.on{ opacity:1; }
  @media (prefers-reduced-motion: reduce){ #scroll-prog{ transition:none; } }
  #dlg-history{ display:none; }
  .dlg-foot{ flex:none; display:flex; align-items:center; gap:6px; padding: 10px 16px 12px 18px; border-top:1px solid var(--border); font-size: var(--fs-s); font-family: var(--ui-font); }
  .dlg-foot:empty{ display:none; }
  /* Notizen öffnen im Hauptbereich (Phase 3): derselbe Editor, aber als festes Panel unter der oberen
     Leiste statt als schwebender Dialog. Die Kopfzeile des Editors rückt in die obere Leiste (zwischen
     Vor/Zurück und Einstellungen), damit es nur eine Kopfzeile gibt. Tickets bleiben Dialoge. */
  body.note-open #dialog{ position:absolute; top:50px; left:0; right:0; bottom:0; z-index:20; padding:0;
    background: var(--bg); backdrop-filter:none; -webkit-backdrop-filter:none; animation: viewin var(--dur-m) var(--ease-out); }
  body.note-open .dlg-box{ width:100%; height:100%; border:none; border-radius:0; box-shadow:none; overflow:visible; animation:none; }
  body.note-open .dlg-head{ position:absolute; top:-50px; left:118px; right:76px; height:50px; padding:0; z-index:2; }
  body.note-open #topbar #breadcrumb{ visibility:hidden; }
  body.note-open.focus-mode #dialog{ position:fixed; top:0; z-index:40; }
  body.note-open.focus-mode .dlg-head{ position:static; height:auto; padding: 12px 14px 6px 22px; }
  body.focus-mode #dialog{ padding:0; background: var(--bg); }
  body.focus-mode .dlg-box{ width:100%; height:100%; border:none; border-radius:0; box-shadow:none; }
  @media (max-width: 760px){ #dialog{ padding:0; } .dlg-box{ height:100%; border-radius:0; border:none; } body.ticket-open #dlg-history, #outline{ display:none; } }

  /* Ticket-Dialog: Termin/Kürzel und Status oben, Verlauf links, Beschreibung Mitte, Unteraufgaben/Updates rechts */
  body.ticket-open #btn-outline, body.ticket-open #btn-typewriter, body.ticket-open #btn-focus,
  body.ticket-open #wordcount, body.ticket-open #stylecount, body.ticket-open #note-id-row, body.ticket-open #btn-lesen{ display:none; }
  body.ticket-open #dlg-history{ display:flex; flex-direction:column; width:220px; flex:none; min-height:0; padding: 16px 6px 12px 20px; border-right:1px solid var(--border); }
  body.ticket-open #outline{ width:340px; min-width:340px; padding-top:16px; }
  body.ticket-open.outline-hidden #outline{ margin-right:0; opacity:1; pointer-events:auto; }
  body.ticket-open #editor-wrap{ align-items:stretch; }
  body.ticket-open #editor{ max-width:none; padding: 10px 32px 30vh; font-size:17px; }   /* gleiche Schreibgröße wie in Notizen und mobil */
  body.ticket-open #title-input{ max-width:none; padding: 18px 32px 0; font-size: calc(17px * 1.65); }
  /* Status-Schalter oben im Ticket (Baustein aus tools/status-schalter.js), darunter Termin, Kürzel und Hinweis */
  .tk-head{ margin-bottom:14px; }
  .tk-hint{ margin-left:auto; font-size: var(--fs-xs); color: var(--text-faint); white-space:nowrap; }
  .done-strike{ position:fixed; z-index:5; height:2px; border-radius:2px; background: var(--text-muted); transform-origin:0 50%;
    pointer-events:none; animation: doneStrike .38s .12s cubic-bezier(.65,0,.35,1) both; }
  @keyframes doneStrike{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
  @media (prefers-reduced-motion: reduce){ .done-strike{ animation:none; } }
  .tk-meta{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .tk-due{ display:inline-flex; align-items:center; gap:7px; padding:5px 10px 5px 8px; margin-left:-8px; border-radius:8px; cursor:pointer;
    font-size: var(--fs-s); color: var(--text); font-variant-numeric: tabular-nums; user-select:none; transition: background var(--dur-s) var(--ease); }
  .tk-due:hover{ background: var(--hover); }
  .tk-due svg{ width:15px; height:15px; color: var(--text-muted); }
  .tk-due .chev{ width:11px; height:11px; color: var(--text-faint); transition: transform .38s cubic-bezier(.22,1,.36,1); }
  .tk-due.open .chev{ transform: rotate(90deg); }
  .tk-due.over{ color: var(--signal); } .tk-due.over svg{ color: var(--signal); }
  .tk-due.none{ color: var(--text-muted); }
  .tk-dueexp > .expand-body{ display:grid; grid-template-rows: minmax(0, 0fr); transition: grid-template-rows .38s cubic-bezier(.22,1,.36,1); }
  .tk-dueexp.is-open > .expand-body{ grid-template-rows: minmax(0, 1fr); }
  .tk-dueexp > .expand-body > .expand-inner{ overflow:hidden; min-height:0; }
  @media (prefers-reduced-motion: reduce){ .tk-dueexp > .expand-body, .tk-due .chev{ transition:none; } }
  .sec-head{ display:flex; align-items:center; gap:9px; font-size: var(--fs-s); color: var(--text-muted); padding: 2px 2px 12px; }
  .sec-head .tp-count{ margin-left:auto; font-size: var(--fs-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .tk-kind{ font-size: var(--fs-xs); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); }
  .tk-kind.series{ color:var(--accent-text); cursor:pointer; text-transform:none; letter-spacing:0; font-size: var(--fs-s); font-weight:600; }
  .tk-kind.series:hover{ text-decoration:underline; }
  .tk-tags{ display:flex; align-items:center; gap:5px; flex-wrap:wrap; }  /* Tagesband im Ticket-Dialog: immer sichtbar, fester Fünf-Wochen-Ausschnitt */
  .due2{ margin-top:10px; outline:none; border-radius:10px; }
  .due2:focus-visible{ box-shadow: 0 0 0 2px var(--accent-soft); }
  .d2-bar{ display:flex; align-items:center; gap:4px; }
  .d2-nav{ width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; cursor:pointer; color: var(--text-muted); font-size: var(--fs-m); user-select:none; }
  .d2-nav:hover{ background: var(--hover); color: var(--text); }
  .d2-label{ display:inline-flex; align-items:baseline; gap:8px; padding: 0 6px; min-width:200px; justify-content:center; font-variant-numeric: tabular-nums; }
  .d2-label b{ font-size: var(--fs-m); font-weight:700; }
  .d2-label b.none{ color: var(--text-muted); font-weight:600; }
  .d2-label em{ font-style:normal; font-size: var(--fs-s); color: var(--text-muted); }
  .d2-label.over b, .d2-label.over em{ color: var(--signal); }
  .d2-q{ font: var(--fs-s) var(--ui-font); padding:4px 10px; border-radius:999px; background: var(--hover); color: var(--text-muted); cursor:pointer; user-select:none; white-space:nowrap; }
  .d2-q:hover{ color: var(--text); }
  .d2-strip{ display:grid; grid-template-columns: repeat(35, minmax(0, 1fr)); margin-top:6px; height:56px; }
  .d2{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; cursor:pointer; border-radius:5px; min-width:0; }
  .d2:hover{ background: var(--hover); }
  .d2 s{ position:absolute; top:0; left:2px; font-size: var(--fs-micro); text-decoration:none; color: var(--text-faint); text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; pointer-events:none; }
  .d2 i{ display:block; width:2px; height:9px; border-radius:1px; background: var(--text-faint); margin-top:4px; }
  .d2.we i{ opacity:.4; }
  .d2.mon i{ height:14px; background: var(--text-muted); }
  .d2.past i{ opacity:.35; }
  /* Wochentag (klein, gedämpft) über dem Datum (etwas kräftiger) — jeder Tag zeigt jetzt beides,
     nicht nur Montage, damit man nicht mehr zählen muss, welcher Wochentag gemeint ist. */
  .d2 em{ font-style:normal; text-decoration:none; font-size: var(--fs-micro); line-height:11px; color: var(--text-faint); white-space:nowrap; text-transform:uppercase; letter-spacing:.02em; }
  .d2 u{ text-decoration:none; font-size: var(--fs-xs); line-height:14px; color: var(--text-muted); white-space:nowrap; font-variant-numeric: tabular-nums; }
  .d2 .load{ width:4px; height:4px; border-radius:50%; background: var(--text-muted); margin-top:1px; }
  .d2 .load.many{ background: var(--signal); }
  /* Zwei Tage sind immer markiert: der Termin (Mitte, Kasten + kräftiger Balken) und heute
     (nur ein roter Strich, damit er den Termin nicht übertönt). */
  .d2.today i{ background: var(--signal); height:18px; width:2px; opacity:1; }
  .d2.today em, .d2.today u{ color: var(--signal); font-weight:600; }
  .d2.sel{ background: var(--accent-soft); }
  .d2.sel i{ width:4px; height:22px; background: var(--accent); border-radius:2px; opacity:1; }
  .d2.sel em, .d2.sel u{ color: var(--text); font-weight:700; }
  .d2.sel.today em, .d2.sel.today u{ color: var(--signal); }
  .hist{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:13px; padding: 0 8px 8px 8px; }
  .hist-item{ display:flex; gap:9px; font-size: var(--fs-s); line-height:1.35; }
  .hist-item i{ flex:none; width:9px; height:9px; margin-top:4px; border-radius:50%; box-shadow: inset 0 0 0 1.5px var(--text-faint); }
  .hist-item.h-status i{ box-shadow:none; background: var(--accent); }
  .hist-item.h-due i{ box-shadow: inset 0 0 0 1.5px var(--accent); }
  .hist-item b{ display:block; font-weight:600; color: var(--text); }
  .hist-item span{ font-size: var(--fs-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .foot-btn{ display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border-radius:7px; color: var(--text-muted); cursor:pointer; white-space:nowrap; }
  .foot-btn:hover{ background: var(--hover); color: var(--text); }
  .foot-btn select{ border:none; background:transparent; font:inherit; color: var(--text); cursor:pointer; outline:none; }
  .foot-btn code{ font-family: var(--mono-font); font-size: var(--fs-xs); color: var(--text-faint); }

  /* ---------- Filterleiste (Board, Tickets, Planen) ---------- */
  /* Dieselbe flache Pillen-Sprache wie überall sonst in der App (.pill) — vorher hatte diese Leiste
     ihr eigenes, "glänzendes" Design (Schlagschatten, Großbuchstaben), das aus dem Rahmen fiel. */
  .fbar{ position:relative; display:flex; align-items:center; gap:8px; flex-wrap:wrap; width:100%; padding: 4px 0 16px; margin-bottom:4px; border-bottom:1px solid var(--border); }
  .fpill{ display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; cursor:pointer; user-select:none; white-space:nowrap;
    font-size: var(--fs-s); color: var(--text-muted); border:1px solid transparent; background: transparent;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }
  .fpill:hover{ background: var(--hover); color: var(--text); }
  .fpill.on{ color: var(--accent-text); background: var(--surface); border-color: transparent; box-shadow: var(--shadow-sm); }
  .fpill .caret{ font-size: var(--fs-micro); opacity:.6; }
  .fpill .cnt{ color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .fpill.on .cnt{ color: inherit; opacity:.7; }
  .fsep{ width:1px; align-self:stretch; margin: 4px 4px; background: var(--border); }
  /* Gleitende Markierung (Monochrome-Redesign) — ein .phl-Element lebt pro
     Gruppe dauerhaft (wird bei jedem Rerender in die frische Leiste zurückgehängt, siehe
     placePillHighlight) und positioniert sich per transform auf die aktive Pille; .fbar ist schon
     position:relative, die Pillen bekommen z-index:1, um über der Markierung zu liegen. */
  .phl{
    position:absolute; top:0; left:0; z-index:0; border-radius:999px; background:var(--surface); box-shadow: var(--shadow-sm);
    pointer-events:none; transition: transform .4s cubic-bezier(.22,1,.36,1), width .4s cubic-bezier(.22,1,.36,1), height .4s cubic-bezier(.22,1,.36,1), box-shadow .4s cubic-bezier(.22,1,.36,1);
  }
  /* Durchgehende Spur (wie die Tabs bei animate-ui): graue Pille, darin die Optionen, die helle Fläche
     (.phl) gleitet zur aktiven. Aktiv = dunkler Text statt Akzentfarbe. */
  .fseg{ position:relative; display:inline-flex; align-items:center; gap:2px; padding:3px; border-radius:999px; background: var(--hover); }
  .fseg > .fpill{ position:relative; z-index:1; padding:6px 14px; }
  .fseg > .fpill:hover{ background:transparent; color: var(--text); }
  .fseg > .fpill.on{ background:transparent; border-color:transparent; box-shadow:none; color: var(--text); }
  @media (prefers-reduced-motion: reduce){ .phl{ transition:none; } }
  .fmenu{ position:absolute; z-index:30; display:grid; grid-template-columns: repeat(2, max-content); gap:8px; padding:10px; border-radius:12px;
    background: var(--surface); border:1px solid var(--border); box-shadow: var(--shadow-md);
    animation: dlgfade .12s ease-out; }
  .fmenu .fpill{ padding:7px 14px; justify-content:center; }
  @media (prefers-reduced-motion: reduce){ .fmenu{ animation:none; } .fpill{ transition:none; } }

  /* ---------- Papierkorb ---------- */
  .trash-inner{ max-width:1100px; padding:0 var(--page-x) 60px; }
  /* Archiv: erledigte Tickets, nach Monat des Erledigens gruppiert — der einzige Ort, an dem sie noch auftauchen */
  .archive-inner{ max-width:1100px; padding:0 var(--page-x) 60px; }
  /* Tagesabschluss (Phase 5): was heute erledigt ist, was noch offen ist (mit „→ Morgen"), was morgen ansteht */
  .ab-inner{ max-width:820px; padding:0 var(--page-x) 60px; }
  .ab-inner .page-head{ padding-left:0; padding-right:0; }
  .ab-inner .tlist{ padding:0; }
  .ab-inner .tlist-group{ display:flex; align-items:baseline; gap:8px; margin-left:0; }
  .ab-inner .tlist-group span{ font-weight:500; letter-spacing:0; text-transform:none; color:var(--text-faint); }
  .ab-row{ display:flex; align-items:center; gap:8px; }
  .ab-row > .trow{ flex:1; min-width:0; }
  .ab-later{ flex:none; font-size: var(--fs-xs); padding:4px 10px; }
  .ab-none{ font-size: var(--fs-s); color: var(--text-faint); padding:6px 0 4px; }
  .ab-end{ margin-top:32px; font-size: var(--fs-m); color: var(--text-muted); }
  /* Lesemodus (Phase 5): Text nur lesen — kein Cursor, keine Markdown-Zeichen, keine Stil-Färbung.
     Links und Kästchen funktionieren weiter; Doppelklick oder ⌘⇧L führt zurück ins Schreiben. */
  body.lesen #editor{ cursor:default; caret-color:transparent; }
  body.lesen #title-input{ cursor:default; caret-color:transparent; }
  #btn-lesen.active{ color: var(--accent-text); }  .archive-inner .tlist{ padding:0; }
  .trash-item{ display:flex; flex-direction:column; gap:4px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); margin-bottom:8px; }
  .trash-item:hover{ background: var(--hover); }
  .trash-item .ti-top, .trash-item .ti-bottom{ display:flex; align-items:center; gap:8px; }
  .trash-item .ti-bottom{ padding-left:24px; }
  .trash-item .ti-icon{ color: var(--text-faint); flex:none; }
  .trash-item .ti-meta{ flex:1; min-width:0; display:flex; }
  .trash-item .ti-title{ flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trash-item .ti-path{ flex:1; min-width:0; font-size: var(--fs-s); color: var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trash-item .ti-when{ font-size: var(--fs-s); color: var(--text-faint); flex:none; white-space:nowrap; }
  .trash-item .ti-actions{ display:flex; gap:4px; flex:none; }
  .trash-item .ti-actions button{
    border:none; background:var(--sidebar-bg); color:var(--text-muted); cursor:pointer;
    padding:5px 10px; border-radius:7px; font:var(--fs-s) var(--ui-font); font-weight:600; white-space:nowrap;
  }
  .trash-item .ti-actions button:hover{ background:var(--accent-soft); color:var(--accent-text); }
  .trash-item .ti-actions button.danger:hover{ background:var(--signal-soft); color:var(--signal); }
  #editor-wrap::-webkit-scrollbar{ width:10px; }
  #editor-wrap::-webkit-scrollbar-thumb{ background: transparent; border-radius:8px; border: 3px solid var(--bg); }
  #editor-wrap:hover::-webkit-scrollbar-thumb{ background: var(--border); }

  /* ---------- Outline ---------- */

    border-left: 1px solid var(--border); padding: 18px 12px 24px;
    transition: margin-right .25s ease, opacity .2s ease;
  }

  #outline::-webkit-scrollbar{ width:8px; }
  #outline::-webkit-scrollbar-thumb{ background: var(--border); border-radius:8px; }
  .outline-head{ display:flex; align-items:center; gap:8px; font-size: var(--fs-s); color:var(--text-muted); padding: 2px 4px 12px; }
  .outline-head svg{ width:16px; height:16px; flex:none; }

  #note-id-row button:hover{ background:var(--hover); color:var(--accent-text); }
  #note-id-row button.copied{ color:var(--accent-text); }

  #outline-list{ margin-left:11px; }

    font-size: var(--fs-s); line-height:1.45; padding:6px 8px 6px 16px; cursor:pointer; color:var(--text-muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition: color var(--dur-s) var(--ease);

  .outline-item:hover{ color: var(--text); }
  .outline-item.lvl2{ padding-left:30px; }

  #editor{
    --table-bleed: 0px;
    width:100%; max-width: var(--editor-w, 700px); padding: 36px 44px 40vh;
    font-family: var(--editor-font); font-size:17px; line-height: var(--editor-lh, 1.65); color:var(--text);
    outline:none; white-space:pre-wrap; word-wrap:break-word; caret-color: var(--accent-text);
  }
  body.focus-mode #editor{ max-width: 640px; padding-top: 18vh; }
  body.typewriter-mode:not(.focus-mode) #editor{ padding-top: 18vh; }
  #editor:empty::before{ content: attr(data-placeholder); color: var(--text-faint); pointer-events:none; }

  .line{ transition: opacity .25s ease; }
  .line.dim{ opacity: .22; }
  #title-input{
    display:block; flex:none; width:100%; max-width: var(--editor-w, 700px); padding: 32px 44px 0; margin:0; box-sizing:border-box;
    border:none; outline:none; resize:none; overflow:hidden; background:transparent; color: var(--text); caret-color: var(--accent-text);
    font-family: var(--editor-font); font-size: calc(17px * 2.1); font-weight:800; letter-spacing:-0.02em; line-height:1.15;
  }
  #title-input::placeholder{ color: var(--text-faint); }
  #title-input + #editor{ padding-top: 14px; }
  body.focus-mode #title-input{ max-width:640px; padding-top: 18vh; }
  body.focus-mode #title-input + #editor{ padding-top: 14px; }
  /* Eine Designsprache mit dem Handy: alle Überschriften sind gesperrte, leicht ausgegraute Versal-Labels
     (# einen Tick größer) — sie gliedern wie Abschnittstrenner. Keine automatische Trennlinie mehr —
     dafür gibt es "---" von Hand. Wie weit etwas verschachtelt ist, zeigt der Pfad darunter.
     text-transform ist rein visuell; der Text bleibt. */
  .line-h1, .line-h2, .line-h3, .line-h4, .line-h5, .line-h6{
    display:inline-block; width:100%; box-sizing:border-box;
    font-size: var(--fs-s); font-weight:600; letter-spacing:.15em; text-transform:uppercase; color: var(--text-muted);
    margin-top:1.5em; padding-top:.3em; padding-bottom:6px; line-height:1.4; }
  /* H1 und H2 sind echte Überschriften in Textfarbe (sonst wirken sie schwächer als der Fließtext);
     ab H3 bleibt das Versal-Label. Größen relativ zur Editorschrift: Titel > H1 > H2 > Text > H3. */
  .line-h1, .line-h2{ text-transform:none; letter-spacing:-0.01em; color: var(--text); line-height:1.3; }
  .line-h1{ font-size:1.5em; font-weight:700; margin-top:.8em; }
  .line-h2{ font-size:1.22em; font-weight:650; margin-top:.7em; }
  /* Pfad unter einer Überschrift: die übergeordneten Überschriften, winzig und blass — damit man in
     langen Texten weiß, wo man steht. Pseudo-Element, damit es nicht Teil des Textes wird. */
  .line[data-path]::after{ content: attr(data-path); display:block; font-size: var(--fs-xs); font-weight:500; letter-spacing:.02em; text-transform:none; margin-top:2px;
    line-height:1.4; color: var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; user-select:none; }
  @media print{ .line[data-path]::after{ display:none; } }
  .line-h1 .marker, .line-h2 .marker, .line-h3 .marker{ color: var(--accent-text); opacity:.75; font-weight:600; }
  @media screen{ .line.folded{ display:none; } }
  .fold-toggle{
    display:inline-block; width:16px; text-align:center; margin-left:-18px; padding-right:2px;
    vertical-align:middle; cursor:pointer; opacity:0; user-select:none; font-weight:400;
  }
  .line-h1:hover .fold-toggle, .line-h2:hover .fold-toggle, .line-h3:hover .fold-toggle,
  .line-h4:hover .fold-toggle, .line-h5:hover .fold-toggle, .line-h6:hover .fold-toggle,
  .line.folded-heading .fold-toggle{ opacity:.4; }
  .fold-toggle:hover{ opacity:1 !important; }
  /* Im Monat ist eine Zelle zu schmal für Kürzel und Titel; der Farbbalken links zeigt die Gruppe
     schon, das volle Kürzel steht im Tooltip und in der Wochenansicht. */
  .day:not(.day-week) .pcard .k{ display:none; }
  .fold-toggle::before{ content:"▸"; display:inline-block; font-size:.75em; transform:rotate(90deg); transition:transform .12s; }
  .line.folded-heading .fold-toggle::before{ transform:rotate(0deg); }
  /* inline-block über die volle Breite: so ist ein umbrochenes Zitat ein einziger Kasten und der
     Balken läuft über alle Zeilen, nicht nur über die erste. Das „>" blendet sich wie jede andere
     Markdown-Syntax nur in der Zeile mit dem Cursor ein. */
  /* Infobox */
  .line-quote.line-info{ font-style:normal; color: var(--text); background: var(--accent-soft); border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0; padding: 9px 14px 9px 40px; position:relative; margin: 4px 0; }
  .line-quote.line-info::before{ content:"i"; position:absolute; left:13px; top:11px; width:17px; height:17px; border-radius:50%;
    background: var(--accent); color: var(--bg); font: 700 var(--fs-xs)/17px Georgia, serif; text-align:center; font-style:italic; }
  .line-quote{ display:inline-block; width:100%; box-sizing:border-box; vertical-align:top;
    color: var(--text-muted); font-style: italic; border-left: 3px solid var(--text-faint); padding-left: 14px; }
  .line-hr{
    display:inline-block; width:100%; color:transparent;
    background: linear-gradient(var(--border), var(--border)) center / 100% 1px no-repeat;
  }
  .line-hr::selection{ color:transparent; }
  .line-code-fence{ color: var(--text-faint); font-family: var(--mono-font); font-size:.88em; }
  .line-code{ font-family: var(--mono-font); font-size:.88em; background: var(--code-bg); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 2px 8px; border-radius:6px; }
  /* Hängender Einzug: text-indent schiebt nur die erste (Marker-)Zeile nach links, padding-left
     schiebt die ganze Box (inkl. umgebrochener Folgezeilen) nach rechts — der feste width auf dem
     Marker sorgt dafür, dass der Text danach immer an derselben Stelle beginnt, egal ob "1." oder
     "12." oder "iv." davorsteht. Dieselbe Technik wie schon bei .line-bullet (dort mit einem
     generierten •-Zeichen statt echtem Markertext), hier fürs Original-Markdown übertragen. */
  /* Ein Raster für alle Listen (wie mobil): Text auf Ebene 1 bei 1,5em, Unterpunkte bei 3em */
  .line-list{ display:inline-block; padding-left:calc(1.5em * (var(--lvl, 0) + 1)); text-indent:-1.5em; }
  .line-list .mk-ind{ font-size:0; }
  .line-list .marker{ color: var(--accent-text); opacity:.75; }
  .line-list > .marker:first-child{ display:inline-block; width:1.5em; text-indent:0; }
  /* Punkt statt Strich: der Marker ("- ") bleibt im Text (fürs Markdown), wird aber ausgeblendet;
     ::before zeigt stattdessen einen Punkt. padding-left + text-indent (klassischer Hänge-Einzug-Trick)
     sorgen dafür, dass eine umgebrochene zweite Zeile exakt unter dem Text der ersten startet, nicht
     unter dem Punkt — und der Einzug ist insgesamt kleiner als vorher. */
  .line-bullet > .marker:first-child{ font-size:0; width:0; }
  .line-bullet::before{ content:"•"; display:inline-block; width:1.5em; text-indent:0; color:var(--accent-text); }
  .line-sub{ padding-left:calc(1.5em * (var(--lvl, 1) + 1)); text-indent:-3em; margin-left:0; }
  /* pre statt nowrap: nowrap ließ das Leerzeichen nach „i." zusammenfallen, getippt wurde dann „i.a" */
  .line-sub > .marker:first-child{ width:3em; text-align:right; padding-right:.5em; box-sizing:border-box; white-space:pre; }
  .line-sub .marker{ color: var(--accent-text); opacity:.6; }

  /* ---------- Tables (GFM: | a | b | + separator row) ---------- */
  /* Prose stays in the 700px reading column, but a table gains nothing from being narrow, so it
     bleeds symmetrically into the free space on either side. The bleed is measured in JS (it
     depends on the window and on which side panels are open) and is 0 when there is no room. */
  .line-table{
    display:inline-flex; box-sizing:border-box; align-items:stretch; vertical-align:top;
    width: calc(100% + 2 * var(--table-bleed, 0px));
    margin-left: calc(-1 * var(--table-bleed, 0px));
  }
  .line-table .td{
    flex:none; min-width:0; box-sizing:border-box; padding:6px 10px; overflow-wrap:break-word;
    border-bottom:1px solid var(--border); border-right:1px solid var(--border);
    outline:none; cursor:text; white-space:pre-wrap;
  }
  /* Each cell is its own contenteditable island (see renderTableLine) — :focus is the browser's
     own, free signal for "this is the active cell", same visual the old manually-toggled
     .td-active class used to give. */
  .line-table .td:focus{ box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
  /* explicit first/last classes — :first-of-type/:last-of-type would match the
     zero-size pipe markers that sit before and after the cells, not the cells */
  .line-table .td.td-first{ border-left:1px solid var(--border); }
  .line-table .marker.td-pipe,
  .line-table .marker.md-esc{ font-size:0; }   /* kept in the DOM for exact text round-tripping, not display:none (breaks Range/selection math at the boundary) */
  .line-table-first .td{ border-top:1px solid var(--border); }
  .line-table-first .td.td-first{ border-top-left-radius:8px; }
  .line-table-first .td.td-last{ border-top-right-radius:8px; }
  .line-table-last .td.td-first{ border-bottom-left-radius:8px; }
  .line-table-last .td.td-last{ border-bottom-right-radius:8px; }
  .line-table-head{ font-weight:700; background: var(--sidebar-bg); }
  .line-table-alt .td{ background: var(--hover); }
  .line-table .td.td-active{ box-shadow: inset 0 0 0 2px var(--accent); }
  .line-table .td.td-sel{ background: var(--accent-soft); }
  /* a row with more "|" than the header has: the surplus stays visible here instead of vanishing */
  .line-table .td.td-overflow{ background: var(--signal-soft); }
  .line-table-sep{ display:none; }

  /* ---------- Table grips: column/row handles, resize borders, append buttons ---------- */
  #table-grips{ position:fixed; inset:0; z-index:55; pointer-events:none; display:none; font-family:var(--ui-font); }
  /* Satzfokus: dimmt alles außer dem Satz, in dem der Cursor steht — als Overlay über dem Text
     (Rechtecke aus Range.getClientRects()), nicht als Umbau der Zeilen-DOM: der Live-Renderer und
     seine Cursor-/Offset-Logik bleiben so unangetastet. */
  #sentence-mask{ position:fixed; inset:0; z-index:57; pointer-events:none; }
  .smask-rect{ position:absolute; background:var(--bg); opacity:.86; transition:opacity .18s ease; }
  @media (prefers-reduced-motion: reduce){ .smask-rect{ transition:none; } }
  #table-grips.open{ display:block; }
  #table-grips > *{ position:fixed; box-sizing:border-box; pointer-events:auto; }
  /* The visible handle is a thin bar, but the element around it is wide enough to actually hit. */
  .tg-col, .tg-row{ background:transparent; cursor:pointer; }
  .tg-col::after, .tg-row::after{
    content:""; position:absolute; background:var(--border); border-radius:3px; transition: background .12s;
  }
  .tg-col::after{ left:0; right:0; top:50%; height:5px; transform:translateY(-50%); }
  .tg-row::after{ top:0; bottom:0; left:50%; width:5px; transform:translateX(-50%); }
  .tg-col:hover::after, .tg-col.on::after,
  .tg-row:hover::after, .tg-row.on::after{ background:var(--accent); }
  /* The "✕" that appears once a row/column is already selected — a second click deletes it. Its
     own stacking context keeps it drawn above the ::after bar (later in paint order otherwise). */
  .tg-col, .tg-row{ display:flex; align-items:center; justify-content:center; }
  .tg-x{
    position:relative; z-index:1; font-size: var(--fs-micro); line-height:1; font-weight:700;
    color:var(--accent-ink); pointer-events:none;
  }
  .tg-row.on .tg-x, .tg-col.on .tg-x{
    background:var(--signal); border-radius:50%; width:15px; height:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .tg-resize{ cursor:col-resize; background:transparent; }
  .tg-resize::after{
    content:""; position:absolute; left:50%; top:0; bottom:0; width:2px;
    transform:translateX(-1px); background:transparent; transition: background .12s;
  }
  .tg-resize:hover::after, .tg-resize.dragging::after{ background:var(--accent); }
  .tg-add{
    background:var(--bg); border:1px solid var(--border); border-radius:50%; color:var(--text-muted);
    display:flex; align-items:center; justify-content:center; font-size: var(--fs-m); line-height:1;
    cursor:pointer; padding:0 0 1px; transition: all .12s;
  }
  .tg-add:hover{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  /* Row/column grips are draggable once selected-or-not — .dragging is the live reorder, same
     active-feedback language as .tg-resize's own drag. */
  .tg-row.dragging, .tg-col.dragging{ opacity:.4; }
  .tg-dropline{
    position:fixed; z-index:56; background:var(--accent); border-radius:2px; pointer-events:none;
  }
  body.tg-row-dragging{ cursor:grabbing; user-select:none; }
  body.tg-col-dragging{ cursor:grabbing; user-select:none; }
  .tg-row, .tg-col{ cursor:grab; }
  body.tg-row-dragging .tg-row, body.tg-col-dragging .tg-col{ cursor:grabbing; }
  body.tg-resizing{ cursor:col-resize; user-select:none; }

  /* ---------- Tasks: rounded pills with a circle checkbox ---------- */
  .line-checkbox{
    display:inline-block; margin: 3px 0; padding: 7px 18px 7px 11px;
    border-radius: 999px; background: var(--task-bg); color: var(--task-ink);
    font-size:.97em; line-height:1.4; width:100%; text-indent:0;
  }
  .line-checkbox[style*="--lvl"]{ margin-left:calc(1.5em * var(--lvl)); width:calc(100% - 1.5em * var(--lvl)); }
  .line-checkbox > .marker:first-child{ font-size:0; width:0; }       /* "- " stays in the text, not on screen */
  .line-checkbox .md-checkbox{ font-size:0; padding:0; margin-right: 12px; vertical-align: middle; cursor:pointer; }
  .line-checkbox .md-checkbox::before{
    content:""; display:inline-block; width:20px; height:20px; border-radius:50%;
    border: 2px solid var(--text-muted); vertical-align:middle;
    transition: background .15s, box-shadow .15s;
  }
  .line-checkbox .md-checkbox:hover::before{ border-color: var(--accent); }
  .line-checkbox.checked{ background: var(--task-bg-done); color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--text-faint); }
  .line-checkbox .md-checkbox{ position:relative; }
  .line-checkbox.checked .md-checkbox::before{ border-color: var(--accent); background: var(--accent); }
  .line-checkbox.checked .md-checkbox::after{
    content:""; position:absolute; left:0; top:50%; width:20px; height:20px; margin-top:-10px; background: var(--bg);
    -webkit-mask: var(--check-mask) center/12px no-repeat; mask: var(--check-mask) center/12px no-repeat;
  }
  .line-checkbox.just .md-checkbox::before{ animation: checkpop .32s ease-out; }
  .line-checkbox.checked.just .md-checkbox::after{ animation: checkwipe .28s .06s cubic-bezier(.65,0,.35,1) both; }
  .line-checkbox.dim{ opacity:.35; }

  /* ---------- Stil (wie iA Writer): Syntax farbig, Stilprüfung grau durchgestrichen ---------- */
  ::highlight(syn-adj){ color: var(--syn-adj); }
  ::highlight(syn-noun){ color: var(--syn-noun); }
  ::highlight(syn-adv){ color: var(--syn-adv); }
  ::highlight(syn-verb){ color: var(--syn-verb); }
  ::highlight(syn-conj){ color: var(--syn-conj); }
  ::highlight(sty-filler), ::highlight(sty-phrase), ::highlight(sty-redundant), ::highlight(sty-custom){
    color: var(--text-faint); text-decoration: line-through; text-decoration-color: var(--text-faint); }
  .opt kbd{ margin-left:auto; font-family: var(--ui-font); font-size: var(--fs-xs); color: var(--text-faint); }
  .opt kbd + .check{ margin-left:8px; }
  .opt.toggle .swatch{ box-shadow: inset 0 0 0 1.5px var(--text-faint); background: transparent; }
  .opt.toggle.active .swatch{ background: var(--accent); box-shadow:none; }
  .field{ padding: 3px 8px; }
  .field input{
    width:100%; padding:6px 9px; border-radius:7px; border:1px solid var(--border); background:var(--sidebar-bg);
    color:var(--text); font-family:var(--ui-font); font-size: var(--fs-s); outline:none;
  }
  .field input:focus{ border-color: var(--accent); }
  .btn{
    display:block; width:calc(100% - 16px); margin:4px 8px; padding:7px 10px; border-radius:7px; border:none;
    background:var(--accent); color:var(--accent-ink); font-family:var(--ui-font); font-size: var(--fs-s); font-weight:600; cursor:pointer;
  }
  .btn.secondary{ background: var(--hover); color: var(--text); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .hint{ font-size: var(--fs-xs); color:var(--text-muted); padding:2px 8px 8px; line-height:1.45; }
  .hint.error{ color:#e5484d; }
  .hint.ok{ color:#3fb950; }
  .sync-dot{ width:8px; height:8px; border-radius:50%; background:var(--text-faint); margin:0 6px; flex:none; display:none; }
  .sync-dot.idle{ background:#3fb950; display:block; }
  .sync-dot.pending{ background:#e3a008; display:block; }
  .sync-dot.syncing{ background:var(--accent); display:block; animation: syncpulse 1s ease-in-out infinite; }
  .sync-dot.error{ background:#e5484d; display:block; }
  @keyframes syncpulse{ 0%,100%{ opacity:1 } 50%{ opacity:.3 } }
  /* Sync-Punkt lebt: atmet beim Abgleich, Welle bei Ankunft von außen, kurzes Nachleuchten nach dem Speichern */
  .sync-dot{ position:relative; }
  .sync-dot.syncing{ animation: syncbreathe 1.6s ease-in-out infinite; }
  @keyframes syncbreathe{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(.72); opacity:.55; } }
  .sync-dot::after{ content:""; position:absolute; inset:0; border-radius:50%; background:inherit; opacity:0; pointer-events:none; }
  .sync-dot.got::after{ animation: syncwave 1.1s cubic-bezier(.2,.8,.2,1); }
  .sync-dot.saved::after{ animation: syncglow .8s ease-out; }
  @keyframes syncwave{ 0%{ transform:scale(1); opacity:.7; } 100%{ transform:scale(3.4); opacity:0; } }
  @keyframes syncglow{ 0%{ transform:scale(1); opacity:.5; } 100%{ transform:scale(2.2); opacity:0; } }
  /* Überschrift wächst beim Tippen weich in ihre Größe */
  /* Überschrift wächst per transform (nur Grafik), nicht per font-size: das ließ den Browser pro Bild den ganzen
     Text neu umbrechen — beim Tippen von „# " hing es kurz. */
  #editor .line.h-morph{ animation: hmorph .22s cubic-bezier(.2,.8,.2,1); transform-origin: left center; }
  @keyframes hmorph{ from{ transform: scale(.72); opacity:.6; } }
  /* Letzte Aufgabe einer Liste abgehakt: Haken nacheinander, Schimmer über die Zeilen */
  #editor .line.all-done{ animation: alldone 1s ease-out both; animation-delay: calc(var(--i, 0) * 70ms); }
  #editor .line.all-done .md-checkbox{ animation: checkpop .42s ease-out both; animation-delay: calc(var(--i, 0) * 70ms); }
  @keyframes alldone{ 0%{ background: transparent; } 25%{ background: color-mix(in srgb, var(--accent) 16%, transparent); } 100%{ background: transparent; } }
  /* Zieh-Bild: gehoben und leicht gekippt */
  .drag-ghost > *{ transform: rotate(2deg); box-shadow: 0 14px 32px rgba(0,0,0,.28); background: var(--surface, var(--bg)); border-radius: 10px; opacity: 1 !important; }
  @media (prefers-reduced-motion: reduce){ .sync-dot.syncing, #editor .line.h-morph, #editor .line.all-done, #editor .line.all-done .md-checkbox{ animation:none; } }

  .marker{ color: var(--text-muted); font-weight:400; font-style:normal; }
  /* Bear/Typora-Verhalten: Inline-Syntax (**, *, ~~, `, [[ ]], [ ]( )) und die #-Überschriftenraute
     sind unsichtbar, solange der Cursor nicht in der Zeile steht — font-size:0 statt display:none,
     damit sie im DOM/Range bleiben (display:none brach dort die Cursor-Positionierung, siehe die
     Tabellen-Pipe-Marker weiter unten, die aus demselben Grund font-size:0 statt display:none nutzen). */
  .marker-hide{ font-size:0; letter-spacing:0; }   /* sonst schiebt der Sperrabstand der Versal-Überschriften die unsichtbaren ## als Lücke vor den Text */
  /* .md-url definiert weiter unten eine eigene font-size (für den ausgeklappten Link-Zustand) —
     gleiche Spezifität wie oben, ohne diese Regel gewinnt je nach Quellreihenfolge mal die eine,
     mal die andere Klasse. Das hat den Linkverlauf schon lange betroffen: die URL hinter einem
     `[Text](url)`-Link war nie wirklich unsichtbar, nur klein und blass genug, um nicht aufzufallen. */
  .md-url.marker-hide{ font-size:0; }
  .line-cursor .marker-hide{ font-size:inherit; }
  /* Schreibgefühl: Markdown-Zeichen blenden weich ein/aus, wenn der Cursor die Zeile betritt (statt zu springen) */
  .marker-hide{ transition: font-size .14s cubic-bezier(.2,.8,.2,1), opacity .14s ease; }
  .line:not(.line-cursor) .marker-hide{ opacity:0; }
  /* Weicher Cursor (eigener Strich neben dem Editor) und Tinte */
  #editor.soft-caret{ caret-color: transparent; }
  #editor.soft-caret .td{ caret-color: var(--accent-text); }   /* Tabellenzellen behalten den normalen Cursor */
  .wcaret{ position:absolute; left:0; top:0; width:3px; border-radius:2px; background: var(--accent); pointer-events:none; z-index:4;
    opacity:0; transition: transform 90ms cubic-bezier(.2,.8,.2,1), height 90ms cubic-bezier(.2,.8,.2,1); will-change: transform; }
  .wcaret.on{ opacity:1; animation: wcblink 1.1s ease-in-out infinite; }
  .wcaret.on.typing{ animation:none; }
  .wcaret.snap{ transition:none; }
  @keyframes wcblink{ 0%,100%{ opacity:1; } 50%{ opacity:0; } }
  .wink{ position:absolute; pointer-events:none; z-index:3; animation: wink .17s ease-out forwards; }
  @keyframes wink{ from{ opacity:.85; } to{ opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .marker-hide{ transition:none; } .wcaret, .wink{ display:none; } }

  strong{ font-weight:700; }
  em{ font-style: italic; }
  del{ color: var(--text-muted); }
  u{ text-decoration: underline; text-underline-offset: 2px; }
  code.md-code{ font-family: var(--mono-font); background: var(--code-bg); padding: 2px 6px; border-radius:5px; font-size:.86em; color: var(--accent-text); }
  a.md-link{ color: var(--accent-text); text-decoration: underline; text-decoration-color: var(--accent-soft); text-underline-offset: 3px; cursor:pointer; }
  .md-wikilink{ color: var(--accent-text); cursor:pointer; border-bottom: 1.5px solid var(--accent-soft); }
  .md-wikilink:hover{ border-bottom-color: var(--accent); }
  .md-wikilink.missing{ color: var(--text-muted); border-bottom: 1.5px dashed var(--text-faint); }

  /* ---------- [[ autocomplete ---------- */
  #link-pop{
    display:none; position:fixed; z-index:60; min-width:220px; max-width:320px;
    background: var(--surface); border:1px solid var(--border); border-radius:10px;
    box-shadow: var(--shadow-md); padding:5px; font-family: var(--ui-font); font-size: var(--fs-m);
  }
  #link-pop.open{ display:block; }
  #link-pop .opt{ padding:5px 9px; gap:8px; }
  #link-pop .opt svg{ color: var(--text-muted); flex:none; }
  #link-pop .opt.active svg{ color: var(--accent-text); }
  #link-pop .opt.create{ color: var(--text-muted); }
  #link-pop .opt.create.active{ color: var(--accent-text); }
  #link-pop .opt span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #backlinks{ margin-top:18px; }
  .backlink{ display:flex; align-items:center; gap:6px; font-size: var(--fs-s); padding:5px 9px; border-radius:7px; cursor:pointer; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .backlink:hover{ background: var(--hover); color: var(--text); }
  .backlink svg{ flex:none; width:13px; height:13px; }
  .md-url{ color: var(--text-faint); font-size:.85em; }
  .md-image-wrap{ display:inline-flex; flex-direction:column; align-items:flex-start; max-width:100%; cursor:pointer; }
  .md-image{ display:block; max-width:100%; max-height:70vh; border-radius:10px; margin:4px 0; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .md-caption{ font-size:.78em; color:var(--text-faint); padding:0 2px 6px; max-width:100%; }
  .md-caption:empty::before{ content:"+ Bildunterschrift"; opacity:.6; }
  .md-image-pending{ display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:8px; background:var(--hover); color:var(--text-muted); font-size:.85em; }
  .md-image-pending .spin{ width:12px; height:12px; border-radius:50%; border:1.5px solid var(--text-faint); border-top-color:var(--accent); animation:mdspin .7s linear infinite; }
  @keyframes mdspin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .md-image-pending .spin{ animation:none; } }
  #editor.drop-target{ outline:2px dashed var(--accent); outline-offset:-6px; border-radius:8px; }


  svg{ width:15px; height:15px; }

  /* ---------- Print / PDF export ---------- */
  @page{ margin: 20mm; }
  @media print{
    :root, :root[data-theme]{
      --bg:#fff; --text:#111; --text-muted:#666; --text-faint:#aaa; --border:#ccc;
      --accent:#b5301f; --accent-soft: rgba(0,0,0,0.06); --code-bg: rgba(0,0,0,0.06);
      --task-bg:#f1f1f1; --task-bg-done:#f8f8f8; --task-ink:#111;
    }
    html, body{ height:auto; overflow:visible; background:#fff; }
    #app, #editor-wrap, .dlg-body{ display:block !important; height:auto; width:auto; overflow:visible; }
    #dialog{ position:static !important; display:block !important; padding:0 !important; background:none !important; backdrop-filter:none !important; }
    .dlg-box{ display:block !important; width:auto !important; height:auto !important; border:none !important; box-shadow:none !important; overflow:visible !important; }
    #sidebar, #main, .dlg-head, #dlg-top, #dlg-history, .dlg-foot, #outline, #palette, #hover-pop, #fields{ display:none !important; }
    #table-grips{ display:none !important; }
    .line-table .td.td-active, .line-table .td.td-sel{ box-shadow:none; background:none; }
    #editor, body.focus-mode #editor{ max-width:none; padding:0; font-size:12pt; line-height:1.6; }
    /* !important because the bleed is an inline style on #editor: on paper the page width is the
       limit, so a table that reaches past the text column would simply be cut off. */
    #editor{ --table-bleed: 0px !important; }
    .line.dim{ opacity:1; }
    /* .line.folded ist nur unter @media screen definiert (siehe oben) — im Druck bleiben
       eingeklappte Kapitel dadurch automatisch vollständig sichtbar, jeder Zeilentyp mit seinem
       eigenen display-Wert (Tabellen etc.), ohne dass hier ein Wert erraten werden muss. */
    .fold-toggle{ display:none; }
    .marker, .md-url{ display:none; }                 /* clean text: no Markdown syntax on paper */
    .line-hr{ background: linear-gradient(#bbb,#bbb) center / 100% 1px no-repeat; }
    .line-checkbox, .line-code, code.md-code{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .line-checkbox .md-checkbox::before{ border-color:#333; }
    .line-checkbox.checked .md-checkbox::before{ background:#333; border-color:#333; box-shadow: inset 0 0 0 3px #f8f8f8; }
    a.md-link{ color:#111; text-decoration: underline; }
    .md-wikilink, .md-wikilink.missing{ color:#111; border-bottom:none; }
    #link-pop{ display:none !important; }  }
</style>
</head>

      <svg viewBox="0 0 20 20" fill="none"><path d="M4 6h12M8 6V4.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V6M6 6l.7 9.4a1 1 0 0 0 1 .9h4.6a1 1 0 0 0 1-.9L14 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 9v4M11.5 9v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="name">Papierkorb</span><span class="count" id="nav-trash-count"></span>
    </div>
    </div>
    <div class="side-ghead side-sec">
      <span class="gico"><svg viewBox="0 0 20 20" fill="none"><path d="M3 6a1 1 0 0 1 1-1h4l1.5 2H16a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span><span class="glabel glink" id="nav-notes" title="Alle Notizen: Übersicht, Suche, Tags">Ordner</span><span class="gcount" id="nav-notes-count"></span>
      <button class="side-btn" id="side-new-note" title="Neue Notiz (⌘⇧T)"><svg viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div id="side-tree"><div class="stree-track rail"></div></div>

<script>
(function(){

        },
        {
          id: n2, folderId: folderId, createdAt: Date.now()-1000, updatedAt: Date.now()-1000,
          text: "Zweite Notiz\n\nLeer zum Loslegen."
        }
      ],
      selectedNoteId: n1,
      ui: { sidebarHidden:false }
    };
  }

  let saveTimer = null;
  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){}
  }
  // JSON.stringify(store) covers every note/folder/ticket, not just the one being edited — for a
  // sizeable account that can take long enough to block the main thread right as the debounce
  // below fires, which lands squarely in the middle of continued typing. Deferring the actual
  // write to idle time (with a bounded timeout so it never waits indefinitely) keeps that off the
  // keystroke path without changing when a save is considered "due" or the storage format itself.
  const idleDefer = window.requestIdleCallback
    ? fn => requestIdleCallback(fn, { timeout: 1000 })
    : fn => setTimeout(fn, 0);
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>idleDefer(persist), 180);
    scheduleSync();
  }

  /* ---------------- DOM refs ---------------- */
  const treeEl = document.getElementById("tree");
  const editorEl = document.getElementById("editor");
  const titleInputEl = document.getElementById("title-input");
  const editorWrap = document.getElementById("editor-wrap");
  const breadcrumbEl = document.getElementById("dlg-crumb");       // path of the open note/ticket, in the dialog
  const viewTitleEl = document.getElementById("breadcrumb");       // name of the page behind it, in the topbar
  const dialogEl = document.getElementById("dialog");
  const dlgTopEl = document.getElementById("dlg-top"), dlgHistoryEl = document.getElementById("dlg-history"), dlgFootEl = document.getElementById("dlg-foot");
  const wordcountEl = document.getElementById("wordcount");

  const typewriterBtn = document.getElementById("btn-typewriter");

  /* ---------------- Markdown live-render engine ---------------- */
  // A completely empty <span> is not a reliable place for the browser to
  // insert typed characters into (it "backs off" to the nearest preceding
  // text node instead). Empty lines get a zero-width-space as a real,
  // invisible anchor; every place that reads the live DOM strips it back out.
  const ZWS = "​";

  function escapeHtml(s){

  function escAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }
  function unescapeHtmlEntities(s){ return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&amp;/g,"&"); }

  const TAG_RE = /(^|[\s(])#([\p{L}_][\p{L}\p{N}_\-\/]*)/gu;
  function noteTags(note){
    const out = new Set();
    let m; TAG_RE.lastIndex = 0;

  function renderInline(raw){
    let t = escapeHtml(raw);
    const stash = [];
    function put(html){ stash.push(html); return "" + (stash.length-1) + ""; }

    t = t.replace(/`([^`]+)`/g, (m, code) =>
      put('<span class="marker marker-hide">`</span><code class="md-code">'+code+'</code><span class="marker marker-hide">`</span>'));

    // \| is GFM's way to put a literal pipe inside a table cell without splitting the row;
    // the backslash stays in the text (round-tripping) but is hidden inside a table.
    t = t.replace(/\\\|/g, () => put('<span class="marker md-esc">\\</span>|'));

    t = t.replace(/\[\[([^\[\]\n]+?)\]\]/g, (m, title) => {
      const missing = !findNoteByTitle(title.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">"));
      return put('<span class="marker marker-hide">[[</span><span class="md-wikilink'+(missing?" missing":"")+'">'+title+'</span><span class="marker marker-hide">]]</span>');
    });

    // Bild-Syntax zuerst, sonst würde die Link-Regel gleich darunter "[alt](url)" aus "![alt](url)"
    // herausgreifen. Eine "img:…"-URL ist ein Platzhalter, während der Upload noch läuft (siehe
    // uploadNoteImage) — dafür ein Chip mit Spinner statt eines <img>, das sonst als kaputtes Bild
    // aufblitzt, bis die echte URL da ist. Die Bildunterschrift ist der Standard-Markdown-„Titel"
    // (dritter, in Anführungszeichen gesetzter Teil) — Klick aufs Bild fragt danach (editImageCaption).
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]*)(?:\s+"([^"]*)")?\)/g, (m, alt, url, title) => {
      const pending = /^img:[a-z0-9]+$/.test(url);
      const rawMd = "![" + unescapeHtmlEntities(alt) + "](" + unescapeHtmlEntities(url) + (title !== undefined ? ' "' + unescapeHtmlEntities(title) + '"' : "") + ")";
      const shown = pending
        ? '<span class="md-image-pending"><i class="spin"></i>'+(alt || "Bild wird hochgeladen…")+'</span>'
        : '<span class="md-image-wrap" data-md="'+escAttr(rawMd)+'"><img class="md-image" src="'+url+'" alt="'+alt+'" loading="lazy"><span class="md-caption">'+(title || '')+'</span></span>';
      let hidden = '<span class="marker marker-hide">![</span><span class="marker md-url marker-hide">'+alt+'</span><span class="marker marker-hide">](</span><span class="md-url marker-hide">'+url+'</span>';
      if(title !== undefined) hidden += '<span class="marker marker-hide"> "</span><span class="marker md-url marker-hide">'+title+'</span><span class="marker marker-hide">"</span>';
      hidden += '<span class="marker marker-hide">)</span>';
      return put(hidden + shown);
    });

    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, txt, url) =>
      put('<span class="marker marker-hide">[</span><a class="md-link" href="'+url+'" target="_blank" rel="noopener">'+txt+'</a><span class="marker marker-hide">](</span><span class="md-url marker-hide">'+url+'</span><span class="marker marker-hide">)</span>'));

    t = t.replace(/(\*\*|__)([^\s].*?)\1/g, (m, mark, inner) =>
      put('<span class="marker marker-hide">'+mark+'</span><strong>'+inner+'</strong><span class="marker marker-hide">'+mark+'</span>'));

    t = t.replace(/(~~)([^\s].*?)\1/g, (m, mark, inner) =>
      put('<span class="marker marker-hide">'+mark+'</span><del>'+inner+'</del><span class="marker marker-hide">'+mark+'</span>'));

    t = t.replace(/(\+\+)([^\s].*?)\1/g, (m, mark, inner) =>
      put('<span class="marker marker-hide">'+mark+'</span><u>'+inner+'</u><span class="marker marker-hide">'+mark+'</span>'));

    t = t.replace(/(\*|_)([^\s*_].*?)\1/g, (m, mark, inner) =>
      put('<span class="marker marker-hide">'+mark+'</span><em>'+inner+'</em><span class="marker marker-hide">'+mark+'</span>'));

    t = t.replace(TAG_RE, (m, pre, tag) => pre + put('<span class="md-tag" data-tag="'+tag.toLowerCase()+'">#'+tag+'</span>'));

    // Nested inline styles (z. B. *kursiv **fett** kursiv*) stashen ihre HTML verschachtelt;
    // ein einzelner Replace-Durchlauf löst nur die äußerste Ebene auf. Bis zum Fixpunkt
    // wiederholen, damit auch mehrfach verschachtelte Marker vollständig aufgelöst werden.
    let resolved;
    do { resolved = t; t = t.replace(/(\d+)/g, (m, i) => stash[+i]); } while(t !== resolved);
    return t;
  }

    // Text der Zeile ohne Markdown-Zeichen, Code, Links und Tags; übersprungene Stücke zählen als Leerzeichen
    const parts = []; let text = "";
    const tw = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
    while(tw.nextNode()){
      const n = tw.currentNode, p = n.parentElement;
      if(p && p.closest(".marker, code, .md-url, .md-tag, .fold-toggle")){ text += " ".repeat(n.nodeValue.length); continue; }
      parts.push({ n, start: text.length }); text += n.nodeValue;
    }
    if(!parts.length || !text.trim()) return;
    const at = off => { let i = parts.length - 1; while(i > 0 && parts[i].start > off) i--; return parts[i]; };
    const list = [];
    const add = (key, from, to) => {
      const a = at(from), b = at(to - 1);
      if(!a || !b || from - a.start > a.n.nodeValue.length || to - b.start > b.n.nodeValue.length) return;
      const r = new StaticRange({ startContainer: a.n, startOffset: from - a.start, endContainer: b.n, endOffset: to - b.start });
      stilHl[key].add(r); list.push([key, r]);
    };
    const toks = stilTokens(text);
    if(syntaxOn() && toks) toks.forEach(t => { if(t.cls && stilHl["syn-" + t.cls]) add("syn-" + t.cls, t.at, t.at + t.w.length); });
    if(styleOn()) stilChecks(text, toks, stilCustomRegex()).forEach(h => add("sty-" + h.key, h.at, h.at + h.len));
    stilLines.set(line, list);
  }
  // Welche Markierungen sichtbar sind (an/aus je Eintrag) — ohne neu zu berechnen
  function stilShow(){
    if(!STIL_HL) return;
    const off = stilOff();
    STIL_SYNTAX.forEach(([k]) => { const n = "syn-" + k; if(syntaxOn() && !off.includes(k)) CSS.highlights.set(n, stilHl[n]); else CSS.highlights.delete(n); });
    STIL_CHECKS.forEach(([k]) => { const n = "sty-" + k; if(styleOn() && !off.includes(k)) CSS.highlights.set(n, stilHl[n]); else CSS.highlights.delete(n); });
  }
  function stilRefresh(ed){
    if(!STIL_HL) return;
    Object.values(stilHl).forEach(h => h.clear());
    if(ed && stilActive()) ed.querySelectorAll(":scope > .line").forEach(stilApplyLine);
    stilShow();
  }
  // Jede neu gezeichnete Zeile nachfärben, ersetzte abräumen
  let stilObs = null;
  function stilWatch(ed){
    if(!STIL_HL) return;
    if(stilObs) stilObs.disconnect();
    stilObs = new MutationObserver(muts => {
      if(!stilActive()) return;
      muts.forEach(m => {
        m.removedNodes.forEach(n => { if(n.nodeType === 1) stilClearLine(n); });
        m.addedNodes.forEach(n => { if(n.nodeType === 1) stilApplyLine(n); });
