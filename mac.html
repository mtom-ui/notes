      '<span class="foot-btn danger" data-act="delete-ticket" title="Ticket löschen (⌘⇧⌫)">'+trashSvg()+'Löschen</span>';
  }
  function makeSeriesFromTicket(t, code){
    const s = presetToSeries(code, t);
    store.ticketSeries.push(s);
    // this ticket is the first occurrence; the template takes over from the next one
    const patch = { seriesId: s.id };
    if(!t.due) patch.due = s.startDate;
    s.nextDue = seriesStep(s, patch.due || t.due);
    setTicket(t, patch);
    toast("Serie angelegt — nächstes Ticket am " + fmtDueLong(s.nextDue), { actionLabel: "Serie öffnen", onAction: ()=> showSeries(s.id) });
  }
  dlgFootEl.addEventListener("change", (e)=>{
    const sel = e.target.closest('[data-act="make-series"]');

  });

    const act = e.target.closest("[data-act]");
    if(!act || !isTicket(currentNote)) return;

    else if(act.dataset.act === "open-series") showSeries(t.seriesId);
    else if(act.dataset.act === "delete-ticket") deleteTicket(t);
    else if(act.dataset.act === "copy-id"){
      try{ await navigator.clipboard.writeText(t.id); toast("ID kopiert"); }catch(err){ toast("ID: " + t.id); }
    }

  /* ---------------- Fälligkeit: Tagesband ----------------
     Immer sichtbar im Ticket-Dialog: ein fester Ausschnitt von fünf Wochen, der mitwandert, sobald der
     Termin an den Rand kommt. Verstellt wird nur bewusst — Pfeile (Tag/Woche), Klick auf einen Tag,
     ←/→ bzw. ⇧←/→ auf dem fokussierten Band, Schnellwahl. Scrollen ändert nichts: beim Lesen mit dem
     Trackpad hätte sonst ein Wischen den Termin verschoben. Heute ist als eigene Spalte markiert, die
     Punkte zeigen, wie viele andere offene Tickets an einem Tag schon fällig sind. */
  const DUE_WEEKS = 5;
  function dayFromKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
  function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }
  function fmtDueLong(k){
    const d = dayFromKey(k);
    return d.toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" });
  }
  function dueRelLabel(k){
    const today = dayFromKey(localDateKey()), d = dayFromKey(k);
    const days = Math.round((d - today) / 864e5);
    if(days === 0) return "heute";
    if(days === 1) return "morgen";
    if(days === -1) return "gestern";
    return days < 0 ? Math.abs(days)+" Tage überfällig" : "in "+days+" Tagen";
  }
  // Der Termin steht immer in der Mitte (17 Tage davor, 17 danach); ohne Termin ist es heute.
  function dueWindowStart(t){
    return addDays(dayFromKey(t.due || localDateKey()), -Math.floor(DUE_WEEKS * 7 / 2));
  }
  function dueBandHtml(t){
    const start = dueWindowStart(t), todayKey = localDateKey();
    const load = {};
    openTickets().forEach(x => { if(x !== t && x.due) load[x.due] = (load[x.due] || 0) + 1; });
    let cells = "";
    for(let i = 0; i < DUE_WEEKS * 7; i++){
      const d = addDays(start, i), key = localDateKey(d), dow = d.getDay(), n = load[key] || 0;
      const cls = ["d2"];
      if(dow === 0 || dow === 6) cls.push("we");
      if(dow === 1) cls.push("mon");
      if(key === todayKey) cls.push("today");
      if(key === t.due) cls.push("sel");
      if(key < todayKey) cls.push("past");
      const month = (i === 0 || d.getDate() === 1) ? d.toLocaleDateString("de-DE", { month:"short" }).replace(".", "") : "";
      // Jeder Tag zeigt jetzt Wochentag und Datum, nicht nur Montage — leichter zu lesen, welcher Tag gemeint ist.
      const wd = key === todayKey ? "Heute" : WEEKDAY_SHORT[isoWeekday(d) - 1];
      cells += '<span class="'+cls.join(" ")+'" data-day="'+key+'" title="'+d.toLocaleDateString("de-DE", { weekday:"short", day:"2-digit", month:"2-digit" })+(n ? " · " + n + (n === 1 ? " Ticket" : " Tickets") + " fällig" : "")+'">' +
        '<s>'+month+'</s><i></i><em>'+wd+'</em><u>'+d.getDate()+'</u><b class="load'+(n > 2 ? " many" : "")+'"'+(n ? "" : ' style="visibility:hidden"')+'></b></span>';
    }
    const over = t.due && t.due < todayKey && t.status !== "Erledigt";
    const label = t.due
      ? '<b>'+dayFromKey(t.due).toLocaleDateString("de-DE", { weekday:"short" })+', '+fmtDueLong(t.due)+'</b><em>'+dueRelLabel(t.due)+'</em>'
      : '<b class="none">ohne Termin</b>';
    const nav = (step, sym, tip) => '<span class="d2-nav" data-due-step="'+step+'" title="'+tip+'">'+sym+'</span>';
    const q = (v, text) => '<span class="d2-q" data-due-set="'+v+'">'+text+'</span>';
    return '<div class="due2" tabindex="0" title="Termin — ←/→ ein Tag, ⇧←/→ eine Woche">' +
      '<div class="d2-bar">' + nav(-7, "«", "Eine Woche früher (⇧←)") + nav(-1, "‹", "Einen Tag früher (←)") +
        '<span class="d2-label'+(over ? " over" : "")+'">'+label+'</span>' +
        nav(1, "›", "Einen Tag später (→)") + nav(7, "»", "Eine Woche später (⇧→)") +
        '<span style="flex:1"></span>' + q("today", "Heute") + q("tomorrow", "Morgen") + q("monday", "Nächster Mo") + q("", "Ohne Termin") +
      '</div><div class="d2-strip">' + cells + '</div></div>';
  }
  function setDueBy(step){
    const t = currentNote;
    if(!isTicket(t)) return;
    setTicket(t, { due: localDateKey(addDays(dayFromKey(t.due || localDateKey()), step)) });
  }
  function setDueQuick(v){
    const t = currentNote;
    if(!isTicket(t)) return;
    const today = dayFromKey(localDateKey());
    const due = v === "today" ? localDateKey(today) : v === "tomorrow" ? localDateKey(addDays(today, 1))
              : v === "monday" ? localDateKey(addDays(mondayOf(today), 7)) : "";
    if((t.due || "") !== due) setTicket(t, { due });
  }
  fieldsEl.addEventListener("keydown", (e)=>{
    if(!e.target.classList.contains("due2") || (e.key !== "ArrowLeft" && e.key !== "ArrowRight") || e.metaKey || e.ctrlKey || e.altKey) return;
    e.preventDefault();
    setDueBy((e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 7 : 1));
  });
  fieldsEl.addEventListener("change", (e)=>{
    const t = currentNote;
    if(!isTicket(t)) return;
    const sel = e.target.closest("select[data-act]");
    if(!sel) return;
    if(sel.dataset.act === "add-tag"){
      const v = sel.value === "__new" ? askNewTag() : sel.value;
      sel.value = "";
      if(v) addTicketTag(t, v);
    }
  });
  fieldsEl.addEventListener("click", (e)=>{
    const openT = e.target.closest("[data-open-ticket]");
    if(openT){ selectNote(openT.dataset.openTicket); return; }
    if(!currentNote) return;
    const act = e.target.closest("[data-act]");
    if(!isTicket(currentNote)){
      if(act && act.dataset.act === "ticket-from-note") ticketFromNote(currentNote);
      return;
    }
    const t = currentNote;
    if(act && act.dataset.act === "toggle-due"){
      // ohne Neuzeichnen umschalten, damit das Auf-/Zuklappen animiert
      dueBandOpen = !dueBandOpen;
      act.classList.toggle("open", dueBandOpen);
      fieldsEl.querySelector(".tk-dueexp").classList.toggle("is-open", dueBandOpen);
      if(dueBandOpen){ const b = fieldsEl.querySelector(".due2"); if(b) b.focus({ preventScroll:true }); }
      return;
    }
    const rm = e.target.closest("[data-remove-tag]");
    if(rm){ removeTicketTag(t, rm.dataset.removeTag); return; }
    const band = e.target.closest(".due2");
    if(band) band.focus({ preventScroll:true });            // so ←/→ work right after a click
    const stepBtn = e.target.closest("[data-due-step]");
    if(stepBtn){ setDueBy(+stepBtn.dataset.dueStep); return; }
    const quick = e.target.closest("[data-due-set]");
    if(quick){ setDueQuick(quick.dataset.dueSet); return; }
    const day = e.target.closest(".d2[data-day]");
    if(day){ if(t.due !== day.dataset.day) setTicket(t, { due: day.dataset.day }); return; }
    if(!act) return;
    if(act.dataset.act === "open-series") showSeries(t.seriesId);
    else if(act.dataset.act === "delete-ticket") deleteTicket(t);
  });
  function updateBoardCount(){
    const open = openTickets(), today = localDateKey();
    const cnt = document.getElementById("nav-tickets-count"), val = String(open.filter(t => t.due && t.due <= today).length || "");
    slideNumber(cnt, val, "nav-tickets");
  }

  // ---- Ticket-Panel rechts: Unteraufgaben (Checkliste) & Updates (Fortschritt, datiert) ----
  const taskPanelEl = document.getElementById("task-panel");
  let tpEditingId = null;
  function fmtUpdateStamp(ts){
    const d = new Date(ts);
    return d.toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" }) + ", " +
           d.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
  }
  // Abschnitts-Überschrift im Stil der Seitenleiste: Icon im abgerundeten Kästchen + grauer Text
  const SEC_ICONS = {
    history: '<svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 6.5V10l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    items: '<svg viewBox="0 0 20 20" fill="none"><path d="M4 6l1.5 1.5L8 5M4 13l1.5 1.5L8 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 6.5h5M11 13.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    updates: '<svg viewBox="0 0 20 20" fill="none"><path d="M4 5.5h12v7H9l-3 2.5v-2.5H4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'
  };
  function secHead(icon, label, extra){
    return '<div class="sec-head"><span class="gico">'+icon+'</span><span>'+label+'</span>'+(extra || "")+'</div>';
  }
  function renderTaskPanel(){
    if(!isTicket(currentNote)){ taskPanelEl.innerHTML = ""; return; }
    // a full re-render would otherwise steal focus/caret out of an in-progress draft
    const active = document.activeElement;
    const draft = active && (active.id === "tp-new-item" || active.id === "tp-new-update")
      ? { id: active.id, value: active.value, start: active.selectionStart, end: active.selectionEnd } : null;
    const n = currentNote, items = n.subtasks, updates = n.updates;
    const draftVal = id => draft && draft.id === id ? escapeHtml(draft.value) : "";
    taskPanelEl.innerHTML =
      secHead(SEC_ICONS.items, "Unteraufgaben", items.length ? '<span class="tp-prog">' + ringHtml("ring:" + n.id, items.filter(t=>t.done).length, items.length).replace('class="pring"', 'class="pring" style="--ring:15px"') + '<span class="tp-count" data-sn="tp:' + n.id + '">' + items.filter(t=>t.done).length + '/' + items.length + '</span></span>' : '') +
      '<div class="tp-list">' + items.map(t =>
        '<div class="tp-item' + (t.done ? " done" : "") + '" draggable="' + (tpEditingId !== t.id) + '" data-id="' + t.id + '"><span class="tp-circle" data-toggle-item="' + t.id + '" title="Erledigt"></span>' +
        (tpEditingId === t.id
          ? '<input class="tp-edit" data-edit-item="' + t.id + '" value="' + escapeHtml(t.text) + '">'
          : '<span class="tp-text" data-edit-open="' + t.id + '">' + escapeHtml(t.text) + '</span>') +
        '<span class="tp-del" data-del-item="' + t.id + '" title="Entfernen">×</span></div>').join("") +
      '</div>' +
      '<input class="tp-add" id="tp-new-item" placeholder="Neue Unteraufgabe, ⏎ hinzufügen" value="' + draftVal("tp-new-item") + '">' +
      secHead(SEC_ICONS.updates, "Updates") +
      '<div class="tp-list">' + (updates.length
        ? updates.map(u =>
            '<div class="tp-update"><div class="tp-update-head"><b>' + escapeHtml(fmtUpdateStamp(u.ts)) + '</b>' +
            '<span class="tp-del" data-del-update="' + u.id + '" title="Entfernen">×</span></div>' +
            '<div class="tp-update-text">' + escapeHtml(u.text) + '</div></div>').join("")
        : '<div class="outline-empty">Noch keine Updates.</div>') +
      '</div>' +
      '<textarea class="tp-update-input" id="tp-new-update" rows="2" placeholder="Fortschritt festhalten…">' + draftVal("tp-new-update") + '</textarea>' +
      '<span class="tp-update-submit" data-act="add-update-panel">Update speichern <kbd>⌘⏎</kbd></span>';
    slideNumbers(taskPanelEl);
    if(draft){
      const el = document.getElementById(draft.id);
      if(el){ el.focus(); if(el.setSelectionRange) el.setSelectionRange(draft.start, draft.end); }
    }
  }
  function submitPanelUpdate(){
    const ta = document.getElementById("tp-new-update");
    if(!ta || !ta.value.trim() || !isTicket(currentNote)) return;
    addTicketUpdate(currentNote, ta.value);
    const fresh = document.getElementById("tp-new-update");
    if(fresh){ fresh.value = ""; fresh.focus(); }
  }
  taskPanelEl.addEventListener("click", (e)=>{

     frische Leiste zurückgehängt wird: derselbe Knoten, nur neu platziert, die Transition läuft

  function syncPillHighlight(hl, track, active){

    let x, y, w, h;

  function mondayOf(d){ const day = (d.getDay()+6)%7; const m = new Date(d); m.setDate(d.getDate()-day); m.setHours(0,0,0,0); return m; }
  let planWeekStart = mondayOf(new Date());
  function planCard(n, withDate){
    const st = n.status.toLowerCase();
    const sr = n.seriesId && seriesById(n.seriesId);
    return '<div class="pcard'+(st==="blockiert"?" blocked":st==="in arbeit"?" doing":"")+'" draggable="true" data-id="'+n.id+'" data-open="'+n.id+'" title="'+escapeHtml(noteTitle(n))+(sr?" · "+escapeHtml(seriesLabel(sr)):"")+'">' +
      taskCheckHtml(n) +

      (withDate && n.due ? '<span class="pdue">'+fmtDue(n.due)+'</span>' : "") +

  // Künftige Vorkommen einer Serie gibt es noch nicht als Ticket — Planen zeigt sie trotzdem, blass,
  // damit man z. B. nächste Woche nicht an einem Tag plant, an dem schon Wiederkehrendes ansteht.
  function seriesGhosts(from, to){
    const out = {};
    store.ticketSeries.forEach(s => {
      if(!s.active || !s.nextDue || (boardTag && !(s.tags||[]).includes(boardTag)) || (boardGroup && !boardTag && !inGroup(s.tags||[], boardGroup))) return;
      let d = s.nextDue, guard = 0;
      while(d && d <= to && guard++ < 400){
        if(d >= from) (out[d] = out[d] || []).push(s);
        d = seriesStep(s, d);
      }
    });
    return out;
  }
  function ghostCard(s){
    return '<div class="pcard ghost" data-series="'+s.id+'" title="Serie · '+escapeHtml(seriesLabel(s))+' — das Ticket entsteht an diesem Tag">' +
      '<span class="gicon">↻</span><span class="ptext">'+((s.tags||[]).length?'<span class="k">'+escapeHtml(s.tags.join(" · "))+'</span> ':"")+escapeHtml(s.title || "Serie")+'</span></div>';
  }
  function weekRangeLabel(start){
    const end = new Date(start); end.setDate(start.getDate() + 6);
    const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
    if(sameMonth) return start.getDate() + '.–' + end.getDate() + '. ' + start.toLocaleDateString("de-DE", { month:"long", year:"numeric" });
    const sameYear = start.getFullYear() === end.getFullYear();
    const a = start.getDate() + '. ' + start.toLocaleDateString("de-DE", { month:"short" }) + (sameYear ? "" : " " + start.getFullYear());
    const b = end.getDate() + '. ' + end.toLocaleDateString("de-DE", { month:"short", year:"numeric" });
    return a + ' – ' + b;
  }
  function renderPlanWeekCells(open, today){
    let cells = "";
    const ghosts = seriesGhosts(localDateKey(planWeekStart), localDateKey(addDays(planWeekStart, 6)));
    for(let i=0;i<7;i++){
      const d = new Date(planWeekStart); d.setDate(planWeekStart.getDate() + i);
      const iso = localDateKey(d);
      const items = open.filter(n => n.due === iso);
      cells += '<div class="day day-week'+(iso===today?" today":"")+'" data-date="'+iso+'">' +
        '<div class="n">'+d.toLocaleDateString("de-DE", { weekday:"short" })+' <span>'+d.getDate()+'.</span></div>' +
        items.map(n => planCard(n)).join("") + (ghosts[iso] || []).map(ghostCard).join("") +
        '</div>';
    }
    return '<div class="cal cal-week">'+cells+'</div>';

  function renderPlan(){
    if(cardCollapsing()){ rerenderTaskViewsWhenSettled(); return; }   // erledigte Karte klappt gerade ein
    if(!document.body.classList.contains("plan-mode")) return;

    if(planViewMode === "week"){
      calHtml = renderPlanWeekCells(open, today);
      headerLabel = weekRangeLabel(planWeekStart);
    } else {
      const y = planMonth.getFullYear(), m = planMonth.getMonth();
      const startDow = (new Date(y, m, 1).getDay() + 6) % 7;
      let cells = ["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=>'<div class="dow">'+d+'</div>').join("");
      const ghosts = seriesGhosts(localDateKey(new Date(y, m, 1 - startDow)), localDateKey(new Date(y, m, 42 - startDow)));
      for(let i=0;i<42;i++){
        const d = new Date(y, m, 1 - startDow + i);
        const iso = localDateKey(d);
        const items = open.filter(n => n.due === iso);
        cells += '<div class="day'+(d.getMonth()!==m?" dim":"")+(iso===today?" today":"")+'" data-date="'+iso+'"><div class="n">'+d.getDate()+'</div>'+items.map(n => planCard(n)).join("")+(ghosts[iso] || []).map(ghostCard).join("")+'</div>';
      }
      calHtml = '<div class="cal">'+cells+'</div>';
      headerLabel = planMonth.toLocaleDateString("de-DE", { month:"long", year:"numeric" });

    const unplanned = open.filter(n => !n.due).sort((a,b)=>b.updatedAt-a.updatedAt);
    // Überfälliges steht vor dem Kalender: Es liegt in vergangenen Tagen (oft Wochen oder Monaten),
    // die die Wochenansicht gar nicht zeigt — genau die Arbeit, die man beim Planen zuerst sehen muss.
    const overdue = open.filter(n => n.due && n.due < today).sort((a,b)=> a.due.localeCompare(b.due));
    const overdueHtml = overdue.length

      '<div class="view-head-row">' +
        '<span class="pill" data-nav="-1">‹</span><h2>'+headerLabel+'</h2><span class="pill" data-nav="1">›</span>' +
        '<span class="pill" data-nav="0">Heute</span>' +
        '<span class="pill'+(planViewMode==="month"?" on":"")+'" data-view="month">Monat</span>' +
        '<span class="pill'+(planViewMode==="week"?" on":"")+'" data-view="week">Woche</span>' +
        '<span style="flex:1"></span><span class="pill" data-show-series="1" title="Wiederkehrende Tickets verwalten">↻ Serien</span><span class="pill primary" data-new-task="1" title="Neues Ticket (⌘⇧E)">＋ Neues Ticket</span>' +
      '</div></div>' +
      '<div class="pl">'+overdueHtml+calHtml+
      '<div class="unplanned"><h4>Ohne Termin – auf einen Tag ziehen</h4>'+(unplanned.map(n => planCard(n)).join("") || '<span style="color:var(--text-faint);font-size:var(--fs-s)">–</span>')+'</div></div>';

      } else {
        planMonth = d === 0 ? new Date(new Date().getFullYear(), new Date().getMonth(), 1) : new Date(planMonth.getFullYear(), planMonth.getMonth() + d, 1);

  function moveOverdueToToday(){
    const today = localDateKey();
    const list = openTickets().filter(matchesGroupTag).filter(n => n.due && n.due < today);
    if(!list.length) return;
    const before = list.map(n => [n, n.due, (n.activity || []).slice()]);
    const refresh = ()=>{ save(); updateBoardCount(); renderPlan(); renderBoard(); if(list.includes(currentNote)) renderFields(); };
    list.forEach(n => { logActivity(n, "due", fmtDueLong(n.due) + " → " + fmtDueLong(today)); n.due = today; n.updatedAt = Date.now(); n.editedBy = "user"; });

    toast(list.length + (list.length === 1 ? " Ticket" : " Tickets") + " auf heute verschoben", { actionLabel: "Rückgängig", onAction: ()=>{

  function ticketRowHtml(t, i){
    const done = t.status === "Erledigt", prog = subtaskProgress(t);
    return '<div class="trow'+(done?" is-done":"")+(i===listActive?" active":"")+'" data-open="'+t.id+'" data-idx="'+i+'">' + taskCheckHtml(t) +
      '<span class="tt">'+escapeHtml(noteTitle(t))+(t.source==="claude"?'<span class="claude-badge">Claude</span>':"")+seriesMark(t)+'</span>' +

      '<span class="st-chip '+statusClass(t.status)+'">'+escapeHtml(t.status)+'</span>' +
      '<span class="tdue due '+(done ? "" : dueClass(t.due))+'">'+(done ? (t.doneAt ? "✓ "+fmtDue(t.doneAt) : "✓") : dueLabel(t.due))+'</span></div>';

  /* Gruppen-Überschrift für ein Ticket in der Listenansicht: Überfällig / Heute / Morgen, danach
     einzelne Tage (Mi., 01.10.), zuletzt Ohne Termin bzw. Erledigt. Die Sortierung selbst kommt
     unverändert aus listTickets() (nach Fälligkeit) — hier wird nur erkannt, wann sich die Gruppe
     gegenüber dem vorigen Ticket ändert. */
  function ticketGroupLabel(t, todayKey, tomorrowKey){
    if(t.status === "Erledigt") return "Erledigt";
    if(!t.due) return "Ohne Termin";
    if(t.due < todayKey) return "Überfällig";
    if(t.due === todayKey) return "Heute";
    if(t.due === tomorrowKey) return "Morgen";
    return WEEKDAY_SHORT[isoWeekday(dayFromKey(t.due)) - 1] + ", " + fmtDue(t.due);
  }
  function ticketListHtml(items){
    const todayKey = localDateKey(), tomorrowKey = localDateKey(addDays(dayFromKey(todayKey), 1));
    let out = "", prevLabel = null;
    items.forEach((t, i) => {
      const label = ticketGroupLabel(t, todayKey, tomorrowKey);
      if(label !== prevLabel){ out += '<div class="tlist-group">'+escapeHtml(label)+'</div>'; prevLabel = label; }
      out += ticketRowHtml(t, i);
    });
    return out;
  }
  function listTickets(){
    const q = listQuery.trim().toLowerCase();
    return store.tickets.filter(matchesGroupTag)
      .filter(t => t.status !== "Erledigt")                    // Erledigtes steht im Archiv
      .filter(t => !listSeries || t.seriesId === listSeries)
      .filter(t => !boardDateMode || (t.status !== "Erledigt" && inBoardDateFilter(t)))
      .filter(t => sucheTrifft(t.text, t.tags, q))
      .sort((a,b) => {
        const ad = a.status === "Erledigt", bd = b.status === "Erledigt";
        if(ad !== bd) return ad - bd;
        if(ad) return (b.doneAt||"").localeCompare(a.doneAt||"") || b.updatedAt - a.updatedAt;
        return (a.due||"9").localeCompare(b.due||"9") || b.updatedAt - a.updatedAt;
      });
  }
  function renderTicketList(){

  // ---- Archiv: der einzige Ort für erledigte Tickets. Suche, Board, Liste und ⌘K blenden sie aus,

  const archiveEl = document.getElementById("archive");
  let archiveQuery = "";
  function renderArchive(){
    if(cardCollapsing()){ rerenderTaskViewsWhenSettled(); return; }
    if(!document.body.classList.contains("archive-mode")) return;
    const hadFocus = document.activeElement && document.activeElement.id === "archive-search";
    const caret = hadFocus ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
    const q = archiveQuery.trim().toLowerCase();
    const done = store.tickets.filter(t => t.status === "Erledigt");
    const items = done.filter(t => sucheTrifft(t.text, t.tags, q))
      .sort((a,b) => (b.doneAt||"").localeCompare(a.doneAt||"") || b.updatedAt - a.updatedAt);
    let rows = "", prev = null;
    items.forEach((t, i) => {
      const key = t.doneAt ? t.doneAt.slice(0, 7) : "";
      if(key !== prev){
        prev = key;
        const label = key ? dayFromKey(key + "-01").toLocaleDateString("de-DE", { month:"long", year:"numeric" }) : "Ohne Datum";
        rows += '<div class="tlist-group">'+escapeHtml(label)+'</div>';
      }
      rows += ticketRowHtml(t, null);          // null: nie „aktiv" markiert (das gehört zur Tastatursteuerung der Liste)
    });
    const doneCount = store.tickets.filter(t => t.status === "Erledigt").length;
    archiveEl.innerHTML = '<div class="archive-inner">' +
      pageHead("Archiv", doneCount + (doneCount === 1 ? " erledigtes Ticket" : " erledigte Tickets")) +

      '<div class="tlist">' + (rows || (q ? emptyState("search", "Keine Treffer", "Im Archiv passt nichts zu „" + escapeHtml(q) + "“.") : emptyState("archive", "Noch nichts erledigt", "Erledigte Tickets landen hier, nach Monat sortiert."))) + '</div>' +
      '</div>';
    if(hadFocus){ const inp = document.getElementById("archive-search"); inp.focus(); inp.setSelectionRange(caret[0], caret[1]); }
  }
  archiveEl.addEventListener("input", (e)=>{ if(e.target.id === "archive-search"){ archiveQuery = e.target.value; renderArchive(); } });
  archiveEl.addEventListener("click", (e)=>{
    const check = e.target.closest("[data-done]");
    if(check){ toggleTaskFromCard(check); return; }
    const open = e.target.closest("[data-open]");
    if(open) selectNote(open.dataset.open);
  });

  /* ---- Tagesabschluss (Phase 5) ----
     Ein Blick am Ende des Tages: Was ist heute erledigt? Was war für heute fällig und ist noch offen — das lässt sich
     einzeln oder gesammelt auf morgen schieben (mit Rückgängig)? Was steht morgen an? */
  const abschlussEl = document.getElementById("abschluss");
  function abschlussDaten(){
    const today = localDateKey(), tomorrow = localDateKey(addDays(dayFromKey(today), 1));
    const alle = store.tickets.filter(t => !t.deletedAt);
    return {
      today, tomorrow,
      done: alle.filter(t => t.status === "Erledigt" && t.doneAt === today).sort((a, b) => b.updatedAt - a.updatedAt),
      open: alle.filter(t => t.status !== "Erledigt" && t.due && t.due <= today).sort((a, b) => a.due.localeCompare(b.due)),
      next: alle.filter(t => t.status !== "Erledigt" && t.due === tomorrow)
    };
  }
  function renderAbschluss(){
    if(!document.body.classList.contains("abschluss-mode")) return;
    const d = abschlussDaten();
    const sub = new Date().toLocaleDateString("de-DE", { weekday:"long", day:"numeric", month:"long" });
    const group = (title, n) => '<div class="tlist-group">' + escapeHtml(title) + (n ? '<span>' + n + '</span>' : "") + '</div>';
    const rows = (list, later) => list.map(t => later
      ? '<div class="ab-row">' + ticketRowHtml(t, null) + '<span class="pill ab-later" data-ab-later="' + t.id + '" title="Termin auf morgen">→ Morgen</span></div>'
      : ticketRowHtml(t, null)).join("");
    const end = !d.open.length
      ? (d.done.length ? "Alles für heute geschafft. Schönen Feierabend." : "Heute war nichts fällig.")
      : d.open.length === 1 ? "Ein Ticket ist noch offen." : d.open.length + " Tickets sind noch offen.";
    abschlussEl.innerHTML = '<div class="ab-inner">' +
      pageHead("Tagesabschluss", sub, d.open.length > 1 ? '<span class="pill" data-ab-all="1">Alles Offene auf morgen</span>' : "") +
      '<div class="tlist">' +
        group("Heute erledigt", d.done.length) + (d.done.length ? rows(d.done) : '<div class="ab-none">Noch nichts erledigt.</div>') +
        group("Noch offen für heute", d.open.length) + (d.open.length ? rows(d.open, true) : '<div class="ab-none">Nichts mehr offen.</div>') +
        group("Morgen", d.next.length) + (d.next.length ? rows(d.next) : '<div class="ab-none">Für morgen ist noch nichts geplant.</div>') +
      '</div>' +
      '<div class="ab-end">' + escapeHtml(end) + '</div>' +
      '</div>';
  }
  function aufMorgen(list){
    const { tomorrow } = abschlussDaten(), before = list.map(t => [t, t.due]);
    list.forEach(t => setTicket(t, { due: tomorrow }));
    renderTicketViews();
    toast(list.length === 1 ? "„" + noteTitle(list[0]) + "“ auf morgen verschoben" : list.length + " Tickets auf morgen verschoben",
      { actionLabel: "Rückgängig", onAction: ()=>{ before.forEach(([t, due]) => setTicket(t, { due })); renderTicketViews(); } });
  }
  abschlussEl.addEventListener("click", (e)=>{
    const later = e.target.closest("[data-ab-later]");
    if(later){ const t = ticketById(later.dataset.abLater); if(t) aufMorgen([t]); return; }
    if(e.target.closest("[data-ab-all]")){ aufMorgen(abschlussDaten().open); return; }
    const check = e.target.closest("[data-done]");
    if(check){ toggleTaskFromCard(check); return; }
    const open = e.target.closest("[data-open]");
    if(open) selectNote(open.dataset.open);
  });

  // ---- Serien: Vorlagen anlegen, Rhythmus einstellen, pausieren, löschen ----
  const seriesEl = document.getElementById("series");
  const SERIES_RULE_FIELDS = ["freq", "interval", "weekdays", "dayOfMonth", "startDate", "endDate"];
  function seriesStateHtml(s){
    if(!s.nextDue) return '<span class="s-state ended">beendet</span>';
    if(!s.active) return '<span class="s-state paused">pausiert</span>';
    const d = dayFromKey(s.nextDue);
    return '<span class="s-state">nächstes Ticket '+d.toLocaleDateString("de-DE", { weekday:"short" })+', '+fmtDueLong(s.nextDue)+' <em>('+dueRelLabel(s.nextDue)+')</em></span>';
  }
  function seriesCardHtml(s){
    const f = FREQ_LABELS[s.freq] || FREQ_LABELS.weekly;
    const made = store.tickets.filter(t => t.seriesId === s.id);
    const open = made.filter(t => t.status !== "Erledigt").length;
    const wd = s.weekdays || [];
    return '<div class="scard'+(!s.active ? " paused" : "")+(!s.nextDue ? " ended" : "")+'" data-series="'+s.id+'">' +
      '<div class="scard-top">' +
        '<span class="gicon">↻</span>' +
        '<input class="s-title" data-sf="title" value="'+escapeHtml(s.title)+'" placeholder="Titel der Tickets">' +
        seriesStateHtml(s) +
        (s.nextDue ? '<button class="s-btn" data-s-act="toggle">'+(s.active ? "Pausieren" : "Fortsetzen")+'</button>' : "") +

        '<select data-sf="freq">' + Object.keys(FREQ_LABELS).map(k => '<option value="'+k+'"'+(s.freq===k?" selected":"")+'>'+FREQ_LABELS[k][0]+'</option>').join("") + '</select>' +

        (s.freq === "monthly" ? '<label>am <input type="number" min="1" max="31" data-sf="dayOfMonth" value="'+(s.dayOfMonth || +s.startDate.slice(8,10))+'">.</label>' : "") +
        '<label>ab <input type="date" data-sf="startDate" value="'+s.startDate+'"></label>' +
        '<label>bis <input type="date" data-sf="endDate" value="'+(s.endDate||"")+'"></label>' +
      '</div>' +
      '<div class="scard-tags">' + (s.tags||[]).map(k => tagChip(k, true)).join("") + addTagSelectHtml(s.tags||[]) + '</div>' +
      '<textarea data-sf="description" rows="2" placeholder="Beschreibung für jedes neue Ticket (Markdown, optional)">'+escapeHtml(s.description||"")+'</textarea>' +
      '<div class="scard-foot">' +
        (made.length ? '<span class="s-link" data-s-act="tickets">'+made.length+(made.length===1?" Ticket":" Tickets")+' aus dieser Serie'+(open?" · "+open+" offen":"")+' →</span>' : '<span class="s-muted">Noch kein Ticket erzeugt</span>') +
        '<span class="s-muted">Änderungen gelten ab dem nächsten Ticket</span>' +

  function seriesSortKey(s){ return (!s.nextDue ? "2" : !s.active ? "1" : "0") + (s.nextDue || "9999"); }
  function renderSeriesView(){
    if(!document.body.classList.contains("series-mode")) return;
    const list = store.ticketSeries.slice().sort((a,b) => seriesSortKey(a).localeCompare(seriesSortKey(b)) || (a.title||"").localeCompare(b.title||"", "de"));
    seriesEl.innerHTML = '<div class="series-inner">' +
      pageHead("Serien", list.length + (list.length === 1 ? " wiederkehrendes Ticket" : " wiederkehrende Tickets"), '<span class="pill primary" data-s-new="1">＋ Neue Serie</span>') +
      '<p class="series-intro">Eine Serie ist eine Vorlage: Am Fälligkeitstag entsteht daraus ein neues Ticket — jedes Vorkommen ist ein eigenes Ticket mit eigener Historie. In Planen erscheinen künftige Vorkommen blass im Kalender.</p>' +
      (list.length ? list.map(seriesCardHtml).join("") : emptyState("repeat", "Noch keine Serien", "Leg eine an, oder wähle bei einem Ticket unter „Serie“ einen Rhythmus.", '<span class="pill primary" data-s-new="1">＋ Neue Serie</span>')) +
      '</div>';
  }
  function rerenderSeriesCard(s){
    const card = seriesEl.querySelector('.scard[data-series="'+s.id+'"]');
    if(!card){ renderSeriesView(); return; }
    const focusSf = document.activeElement && card.contains(document.activeElement) ? document.activeElement.dataset.sf : null;
    card.outerHTML = seriesCardHtml(s);
    if(focusSf){ const el = seriesEl.querySelector('.scard[data-series="'+s.id+'"] [data-sf="'+focusSf+'"]'); if(el) el.focus(); }
  }
  function updateSeries(s, patch){
    const ruleChange = Object.keys(patch).some(k => SERIES_RULE_FIELDS.includes(k));
    Object.assign(s, patch);
    if(ruleChange && s.active) recomputeNextDue(s);
    s.updatedAt = Date.now();
    save();
    if(ruleChange || "tags" in patch || "active" in patch) rerenderSeriesCard(s);
  }
  function createSeries(){
    const start = localDateKey(addDays(new Date(), 1));   // tomorrow: nothing is generated while it is still being set up
    const s = { id: uid(), title: "", description: "", tags: [], freq: "weekly", interval: 1, weekdays: [isoWeekday(dayFromKey(start))],
                dayOfMonth: null, startDate: start, endDate: null, nextDue: null, active: true, createdAt: Date.now(), updatedAt: Date.now() };
    recomputeNextDue(s);
    store.ticketSeries.push(s); save();
    renderSeriesView();
    const inp = seriesEl.querySelector('.scard[data-series="'+s.id+'"] .s-title');
    if(inp){ inp.scrollIntoView({ block:"center" }); inp.focus(); }
  }
  function deleteSeries(s){
    const snap = JSON.parse(JSON.stringify(s));
    store.ticketSeries = store.ticketSeries.filter(x => x !== s);
    save(); renderSeriesView(); renderPlan();
    toast("Serie „" + (s.title || "ohne Titel") + "“ gelöscht — erzeugte Tickets bleiben", { actionLabel: "Rückgängig", onAction: ()=>{
      snap.updatedAt = Date.now(); store.ticketSeries.push(snap); save(); renderSeriesView(); renderPlan();
    } });
  }
  function seriesOf(el){ const c = el.closest(".scard"); return c ? seriesById(c.dataset.series) : null; }
  seriesEl.addEventListener("click", (e)=>{
    if(e.target.closest("[data-s-new]")){ createSeries(); return; }
    const s = seriesOf(e.target);
    if(!s) return;
    const wd = e.target.closest("[data-wd]");
    if(wd){
      const d = +wd.dataset.wd, cur = s.weekdays || [];
      updateSeries(s, { weekdays: cur.includes(d) ? cur.filter(x => x !== d) : [...cur, d].sort() });
      return;
    }
    const rm = e.target.closest("[data-remove-tag]");
    if(rm){ updateSeries(s, { tags: (s.tags||[]).filter(k => k !== rm.dataset.removeTag) }); return; }
    const act = e.target.closest("[data-s-act]");
    if(!act) return;
    if(act.dataset.sAct === "toggle") updateSeries(s, s.active ? { active:false } : { active:true, startDate: s.startDate });
    else if(act.dataset.sAct === "delete") deleteSeries(s);
    else if(act.dataset.sAct === "tickets"){ showTickets({ series: s.id }); }
  });
  seriesEl.addEventListener("change", (e)=>{
    const s = seriesOf(e.target);
    if(!s) return;
    if(e.target.dataset.act === "add-tag"){
      const v = e.target.value === "__new" ? askNewTag() : e.target.value;
      e.target.value = "";
      if(v && !(s.tags||[]).includes(v)) updateSeries(s, { tags: [...(s.tags||[]), v] });
      return;
    }
    const key = e.target.dataset.sf;
    if(!key) return;
    let val = e.target.value;
    if(key === "interval") val = Math.max(1, Math.min(99, parseInt(val, 10) || 1));
    else if(key === "dayOfMonth") val = Math.max(1, Math.min(31, parseInt(val, 10) || 1));
    else if(key === "startDate" && !val) val = s.startDate;
    else if(key === "endDate") val = val || null;
    else if(key === "freq" && val === "weekly" && !(s.weekdays||[]).length) return updateSeries(s, { freq: val, weekdays: [isoWeekday(dayFromKey(s.startDate))] });
    updateSeries(s, { [key]: val });
  });

  // ---- ⌘K palette ----
  /* ---------- ⌘K: Schnellöffner (Redesign 3.42) ----------
     Für den ganzen Arbeitstag gebaut: Gruppen mit den Versal-Labels der App (Zuletzt · Befehle · Tickets · Notizen ·
     Ordner · Anlegen), Bereiche (Alles · Notizen · Tickets · Befehle; Tab/⇧Tab wechselt, „>" springt zu Befehlen)
     mit gleitender Markierung, Treffer im Titel hervorgehoben, gleitende Auswahl, rechts eine Vorschau des gewählten
     Elements. Was man oft wählt, rückt nach oben (zählt mit, vergisst nach zwei Wochen langsam). */
  const paletteEl = document.getElementById("palette"), paletteInput = document.getElementById("palette-input"), paletteList = document.getElementById("palette-list");
  const palPreview = document.getElementById("pal-preview"), palScopesEl = document.getElementById("pal-scopes");
  const PAL_SCOPES = [["all", "Alles"], ["notes", "Notizen"], ["tickets", "Tickets"], ["cmds", "Aktionen"]];
  const CMD_SVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M6 6V4.5A1.5 1.5 0 1 0 4.5 6H6Zm0 0h4m-4 0v4m4-4V4.5A1.5 1.5 0 1 1 11.5 6H10Zm0 0v4m0 0h1.5A1.5 1.5 0 1 1 10 11.5V10Zm0 0H6m0 0v1.5A1.5 1.5 0 1 1 4.5 10H6Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  const FOLDER_SVG = '<svg viewBox="0 0 20 20" fill="none"><path d="M3 6a1 1 0 0 1 1-1h4l1.5 2H16a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  const PLUS_SVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  let palItems = [], palActive = 0, palScope = "all", palQuery = "";
  const palHl = document.createElement("div"); palHl.className = "pal-hl";

  function openPalette(){
    paletteInput.value = ""; palScope = "all"; palActive = 0;
    paletteEl.classList.add("open"); renderPalette(); paletteInput.focus();
  }
  function closePalette(){ paletteEl.classList.remove("open"); }

  // Häufigkeit: { schlüssel: [anzahl, zuletzt] } — Bonus fürs Ranking
  function palHits(){ store.ui = store.ui || {}; return store.ui.palHits = store.ui.palHits || {}; }
  function palBonus(key){
    const h = palHits()[key]; if(!h) return 0;
    const age = (Date.now() - h[1]) / 864e5;
    return Math.min(4, Math.log2(1 + h[0])) * (age < 14 ? 1 : age < 60 ? .5 : .2);
  }
  function palRemember(key){
    const hits = palHits(), h = hits[key] || [0, 0];
    hits[key] = [h[0] + 1, Date.now()];
    const keys = Object.keys(hits);
    if(keys.length > 300) keys.sort((a, b) => hits[a][1] - hits[b][1]).slice(0, keys.length - 300).forEach(k => delete hits[k]);
    save();
  }
  const palTerms = q => sucheBegriffe(q);              // gemeinsamer Suchkern (tools/suche-kern.js), wie am Handy
  function rankNotes(q, kind){
    const terms = palTerms(q);
    const all = linkables().filter(n => !(isTicket(n) && n.status === "Erledigt"))   // Erledigtes nur im Archiv
      .filter(n => !kind || (kind === "tickets") === isTicket(n));
    if(!terms.length) return all.map(n => ({ n, s: palBonus(n.id) * 3 + n.updatedAt / 1e13 })).sort((a, b) => b.s - a.s).map(x => x.n);
    return all.map(n => {
      const score = sucheWert(noteTitle(n), n.text, isTicket(n) ? n.tags : [], terms);
      return score === null ? null : { n, score: score + palBonus(n.id) };
    }).filter(Boolean).sort((a, b) => b.score - a.score || b.n.updatedAt - a.n.updatedAt).map(x => x.n);
  }
  /* Befehle: wer den ganzen Tag im Tool lebt, springt per Tastatur statt per Maus */
  function paletteCommands(){
    const cmds = [
      { label:"Board öffnen",          keys:"⌘⇧B", run: showBoard },
      { label:"Tickets öffnen",        keys:"",    run: ()=> showTickets() },
      { label:"Planen öffnen",         keys:"⌘⇧P", run: showPlan },
      { label:"Notizen öffnen",        keys:"",    run: ()=> showNotes() },
      { label:"Serien öffnen",         keys:"",    run: ()=> showSeries() },
      { label:"Papierkorb öffnen",     keys:"",    run: showTrash },
      { label:"Archiv öffnen",         keys:"",    run: showArchive },
      { label:"Tag abschließen",       keys:"",    run: showAbschluss },
      { label:"Lesemodus ein/aus",     keys:"⌘⇧L", run: ()=> { if(currentNote && !isTicket(currentNote)) setLesen(!lesenAktiv()); else toast("Lesemodus gibt es für Notizen"); } },
      { label:"Neues Ticket",          keys:"⌘⇧E", run: ()=> createTicket() },
      { label:"Neue Notiz",            keys:"⌘⇧T", run: ()=> createNote(folderForNewNote()) },
      { label:"Jetzt synchronisieren", keys:"",    run: ()=> { if(syncEnabled()) syncNow(); else toast("Kein Konto verbunden"); } },
      { label:"Seitenleiste ein-/ausklappen", keys:"⌘.", run: ()=> setSidebarHidden(!document.body.classList.contains("sidebar-hidden")) },
      { label:"Fokus-Modus ein/aus",   keys:"⌘⇧F", run: ()=> setFocusMode(!focusModeActive) },
      { label:"Schreibmaschinen-Modus ein/aus", keys:"⌘⇧W", run: ()=> setTypewriterMode(!typewriterActive) },
      { label:"Weicher Cursor ein/aus", keys: softCaretOn() ? "an" : "aus", run: ()=> { setSetting("softCaret", !softCaretOn()); edFeel.refresh(); } },
      { label:"Töne ein/aus",          keys: soundOn() ? "an" : "aus", run: ()=> { setSetting("sounds", !soundOn()); sound("tick"); } },
      { label:"Tempo-Messung ein/aus", keys: perfMeterOn() ? "an" : "aus", run: ()=> togglePerfMeter() },
      { label:"Syntax ein/aus",        keys:"⌘⇧S", run: ()=> setSyntax(!syntaxOn()) },
      { label:"Stilprüfung ein/aus",   keys: styleOn() ? "an" : "aus", run: ()=> setStilCheck(!styleOn()) },
      { label:"Als PDF drucken",       keys:"⌘P",  run: ()=> exportPdf() },
      { label:"Notiz als Markdown speichern", keys:"", run: ()=> exportMarkdown() },
      { label:"Einstellungen öffnen",  keys:"",    run: ()=> setSettingsOpen(true) },
      { label:"Darstellung: Dunkel",   keys: currentColorMode()==="dark" ? "aktiv" : "", run: ()=> setSetting("colorMode","dark") },
      { label:"Darstellung: Hell",     keys: currentColorMode()==="light" ? "aktiv" : "", run: ()=> setSetting("colorMode","light") }
    ];
    return cmds;
  }
  function matchCommands(q){
    const terms = palTerms(q);
    const all = paletteCommands();
    if(!terms.length) return all;
    return all.map(c => {
      const l = sucheFalten(c.label);
      let s = 0;
      for(const t of terms){ if(l.startsWith(t)) s += 4; else if(sucheWortanfang(l, t)) s += 3; else if(l.includes(t)) s += 1; else return null; }
      return { c, s: s + palBonus("cmd:" + c.label) };
    }).filter(Boolean).sort((a, b) => b.s - a.s).map(x => x.c);
  }
  function matchFolders(q){
    const terms = palTerms(q); if(!terms.length) return [];
    return store.folders.filter(f => { const p = sucheFalten(folderPathOf(f.id) || f.name); return terms.every(t => p.includes(t)); })
      .sort((a, b) => palBonus("f:" + b.id) - palBonus("f:" + a.id)).slice(0, 3);
  }
  // Treffer im Titel hervorheben (alle Suchwörter, ohne Groß-/Kleinschreibung)
  function palMark(text, q){
    const terms = palTerms(q), low = sucheFalten(text), marks = [];   // gefaltet, gleiche Längen → Stellen passen aufs Original
    terms.forEach(t => { t = t.replace(/^#/, ""); const i = t ? low.indexOf(t) : -1; if(i >= 0) marks.push([i, i + t.length]); });
    if(!marks.length) return escapeHtml(text);
    marks.sort((a, b) => a[0] - b[0]);
    let out = "", pos = 0;
    marks.forEach(([a, b]) => { if(a < pos) a = pos; if(b <= a) return; out += escapeHtml(text.slice(pos, a)) + "<mark>" + escapeHtml(text.slice(a, b)) + "</mark>"; pos = b; });
    return out + escapeHtml(text.slice(pos));
  }
  function renderPalette(){
    let raw = paletteInput.value;
    if(raw.startsWith(">")){ palScope = "cmds"; raw = raw.slice(1); }
    const q = raw.trim(); palQuery = q;
    const sections = [];
    const add = (label, items) => { if(items.length) sections.push([label, items]); };
    if(palScope === "cmds") add("Aktionen", matchCommands(q).map(c => ({ cmd:c })));
    else if(palScope === "notes" || palScope === "tickets"){
      add(palScope === "notes" ? "Notizen" : "Tickets", rankNotes(q, palScope).slice(0, 40).map(n => ({ note:n })));
      if(q) add("Anlegen", [{ create:q, kind: palScope === "notes" ? "note" : "ticket" }]);
    } else if(!q){
      add("Zuletzt", rankNotes("", null).slice(0, 7).map(n => ({ note:n })));
      add("Schnellzugriff", paletteCommands().filter(c => /^(Neue Notiz|Neues Ticket|Board öffnen|Planen öffnen)$/.test(c.label)).map(c => ({ cmd:c })));
    } else {
      const hits = rankNotes(q, null);
      add("Aktionen", q.length >= 2 ? matchCommands(q).slice(0, 4).map(c => ({ cmd:c })) : []);
      add("Tickets", hits.filter(isTicket).slice(0, 6).map(n => ({ note:n })));
      add("Notizen", hits.filter(n => !isTicket(n)).slice(0, 8).map(n => ({ note:n })));
      add("Ordner", matchFolders(q).map(f => ({ folder:f })));
      if(!hits.some(n => noteTitle(n).toLowerCase() === q.toLowerCase())) add("Anlegen", [{ create:q, kind:"note" }, { create:q, kind:"ticket" }]);
    }
    // Befehle vor Treffern nur, wenn sie wirklich gut passen — sonst nach hinten
    if(palScope === "all" && q && sections[0] && sections[0][0] === "Aktionen" && sections[1] && !matchCommands(q).some(c => c.label.toLowerCase().startsWith(q.toLowerCase())))
      sections.push(sections.shift());
    palItems = [];
    let html = "";
    sections.forEach(([label, items]) => {
      html += '<div class="pal-sec">' + escapeHtml(label) + '</div>';
      items.forEach(it => { const i = palItems.push(it) - 1; html += palRow(it, i, q); });
    });
    palActive = Math.min(palActive, Math.max(0, palItems.length - 1));
    paletteList.innerHTML = html || '<div class="pal-empty">Keine Treffer' + (q ? ' für „' + escapeHtml(q) + '“' : '') + '</div>';
    paletteList.prepend(palHl);
    palScopesEl.innerHTML = PAL_SCOPES.map(([k, l]) => '<button class="pill fpill' + (k === palScope ? " on" : "") + '" data-scope="' + k + '">' + l + '</button>').join("");
    syncPillTracks(paletteEl);
    palSetActive(palActive, true);
  }
  function palRow(it, i, q){
    const kbd = k => k ? '<span class="pal-keys">' + k.split("").map(ch => '<kbd>' + escapeHtml(ch) + '</kbd>').join("") + '</span>' : "";
    if(it.cmd){
      const state = /^(an|aus|aktiv)$/.test(it.cmd.keys);
      return '<div class="pal-item" data-idx="' + i + '"><span class="pal-ico cmd">' + CMD_SVG + '</span><span class="t">' + palMark(it.cmd.label, q) + '</span>' +
        (state ? '<span class="pal-state' + (it.cmd.keys !== "aus" ? " on" : "") + '">' + it.cmd.keys + '</span>' : kbd(it.cmd.keys)) + '</div>';
    }
    if(it.create) return '<div class="pal-item create" data-idx="' + i + '"><span class="pal-ico">' + PLUS_SVG + '</span><span class="t">' +
      (it.kind === "ticket" ? 'Neues Ticket „' + escapeHtml(it.create) + '“' : 'Neue Notiz „' + escapeHtml(it.create) + '“') + '</span>' +
      kbd(it.kind === "ticket" ? "⌥↵" : "⇧↵") + '</div>';
    if(it.folder) return '<div class="pal-item" data-idx="' + i + '"><span class="pal-ico">' + FOLDER_SVG + '</span><span class="t">' + palMark(it.folder.name, q) + '</span><span class="f">' + escapeHtml(folderPathOf(it.folder.parentId) || "Ordner") + '</span></div>';
    const n = it.note;
    const where = isTicket(n) ? [n.tags.map(k => "#" + k).join(" "), n.due ? fmtDue(n.due) : ""].filter(Boolean).join(" · ") : (folderPathOf(n.folderId) || "");
    return '<div class="pal-item" data-idx="' + i + '"><span class="pal-ico">' + itemIcon(n) + '</span><span class="t">' + palMark(noteTitle(n), q) + '</span><span class="f">' + escapeHtml(where) + '</span></div>';
  }
  function palSetActive(i, instant){
    palActive = i;
    paletteList.querySelectorAll(".pal-item.active").forEach(x => x.classList.remove("active"));
    const row = paletteList.querySelector('.pal-item[data-idx="' + i + '"]');
    if(!row){ palHl.style.opacity = "0"; palPreview.innerHTML = ""; return; }
    row.classList.add("active");
    if(instant || reducedMotion()) palHl.style.transition = "none";
    palHl.style.opacity = "1";
    palHl.style.transform = "translateY(" + row.offsetTop + "px)";
    palHl.style.height = row.offsetHeight + "px";
    if(instant){ palHl.getBoundingClientRect(); palHl.style.transition = ""; }
    const top = row.offsetTop, bottom = top + row.offsetHeight;
    if(top < paletteList.scrollTop + 28) paletteList.scrollTop = Math.max(0, top - 28);
    else if(bottom > paletteList.scrollTop + paletteList.clientHeight) paletteList.scrollTop = bottom - paletteList.clientHeight + 6;
    renderPalPreview(palItems[i]);
  }
  /* Vorschau rechts: worauf man gleich springt — ohne Markdown-Zeichen, die ersten Zeilen */
  function renderPalPreview(it){
    if(!it){ palPreview.innerHTML = ""; return; }
    const plain = l => escapeHtml(l.replace(/^#{1,6}\s+/, "").replace(/^>\s?(\[!info\]\s?)?/i, "").replace(/^(\s*)[-*+]\s+/, "$1• ").replace(/\*\*|__|~~|\+\+|`/g, "")
      .replace(/(^|[^\w*])\*([^*\n]+)\*/g, "$1$2").replace(/(^|[^\w_])_([^_\n]+)_/g, "$1$2")
      .replace(/!\[([^\]]*)\]\([^)]*\)/g, "🖼 $1").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/\[\[([^\]]+)\]\]/g, "$1"));
    let html = "";
    if(it.note){
      const n = it.note, body = n.text.split("\n").slice(1).filter(l => l.trim()).slice(0, 14);
      const meta = isTicket(n) ? ticketPreview(n) : (folderPathOf(n.folderId) || "Hauptebene");
      html = '<div class="pp-kind">' + (isTicket(n) ? "Ticket" : "Notiz") + '</div><div class="pp-title">' + escapeHtml(noteTitle(n)) + '</div>' +
        '<div class="pp-meta">' + escapeHtml(meta) + ' · ' + escapeHtml(relTime(n.updatedAt)) + '</div>' +
        (isTicket(n) && n.subtasks.length ? '<div class="pp-meta">Unteraufgaben ' + n.subtasks.filter(s => s.done).length + '/' + n.subtasks.length + '</div>' : "") +
        '<div class="pp-body">' + (body.length ? body.map(l => {
          const m = /^\s*[-*]\s+\[( |x|X)\]\s*(.*)$/.exec(l);
          if(m) return '<div class="pp-line pp-task' + (m[1] !== " " ? " done" : "") + '"><i></i>' + plain(m[2]) + '</div>';
          return '<div class="pp-line' + (/^#{1,6}\s/.test(l) ? " pp-h" : "") + '">' + plain(l) + '</div>';
        }).join("") : '<div class="pp-line pp-empty">Noch leer</div>') + '</div>';
    } else if(it.cmd){
      html = '<div class="pp-kind">Aktion</div><div class="pp-title">' + escapeHtml(it.cmd.label) + '</div>' +
        (it.cmd.keys ? '<div class="pp-meta">' + (/^(an|aus|aktiv)$/.test(it.cmd.keys) ? "Zurzeit " + escapeHtml(it.cmd.keys) : "Kurzbefehl " + escapeHtml(it.cmd.keys)) + '</div>' : "");
    } else if(it.folder){
      const f = it.folder, count = store.notes.filter(n => n.folderId === f.id).length;
      html = '<div class="pp-kind">Ordner</div><div class="pp-title">' + escapeHtml(f.name) + '</div><div class="pp-meta">' + escapeHtml(folderPathOf(f.id)) + ' · ' + count + (count === 1 ? " Notiz" : " Notizen") + '</div>';
    } else if(it.create){
      html = '<div class="pp-kind">Anlegen</div><div class="pp-title">' + escapeHtml(it.create) + '</div><div class="pp-meta">' +
        (it.kind === "ticket" ? "Neues Ticket — Kürzel und Termin danach im Ticket" : "Neue Notiz in der Inbox") + '</div>';
    }
    palPreview.innerHTML = html;
  }
  function acceptPalette(force){
    const q = palQuery;
    const it = palItems[palActive];
    closePalette();
    if(!force && it && it.cmd){ palRemember("cmd:" + it.cmd.label); it.cmd.run(); return; }
    if(!force && it && it.folder){ palRemember("f:" + it.folder.id); showNotes({ folder: it.folder.id }); return; }
    const kind = force || (it && it.create ? it.kind : null);
    if(kind){
      if(!q) return;
      if(kind === "ticket"){ createTicket({ text: q + "\n\n" }); return; }
      const n = { id: uid(), folderId: ensureFolder("Inbox").id, createdAt: Date.now(), updatedAt: Date.now(), text: q + "\n\n" };
      store.notes.unshift(n); save(); renderTree(); selectNote(n.id);
      return;
    }
    if(it && it.note){ palRemember(it.note.id); selectNote(it.note.id); }
  }
  function palSetScope(dir){
    const i = PAL_SCOPES.findIndex(([k]) => k === palScope);
    palScope = PAL_SCOPES[(i + dir + PAL_SCOPES.length) % PAL_SCOPES.length][0];
    if(paletteInput.value.startsWith(">") && palScope !== "cmds") paletteInput.value = paletteInput.value.slice(1);
    palActive = 0; renderPalette();
  }
  paletteInput.addEventListener("input", ()=>{ palActive = 0; if(!paletteInput.value.startsWith(">") && palScope === "cmds" && !paletteInput.value) palScope = "all"; renderPalette(); });
  paletteInput.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      if(palItems.length) palSetActive((palActive + (e.key === "ArrowDown" ? 1 : palItems.length - 1)) % palItems.length);
    } else if(e.key === "Tab"){ e.preventDefault(); palSetScope(e.shiftKey ? -1 : 1); }
    else if(e.key === "Enter"){ e.preventDefault(); acceptPalette(e.altKey ? "ticket" : e.shiftKey ? "note" : null); }
    else if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); closePalette(); }
  });
  paletteList.addEventListener("mousemove", (e)=>{ const it = e.target.closest(".pal-item[data-idx]"); if(it && +it.dataset.idx !== palActive) palSetActive(+it.dataset.idx); });
  paletteList.addEventListener("mousedown", (e)=>{ const it = e.target.closest(".pal-item[data-idx]"); if(it){ e.preventDefault(); palActive = +it.dataset.idx; acceptPalette(null); } });
  palScopesEl.addEventListener("mousedown", (e)=>{ const b = e.target.closest("[data-scope]"); if(!b) return; e.preventDefault(); palScope = b.dataset.scope; palActive = 0; renderPalette(); paletteInput.focus(); });
  paletteEl.addEventListener("mousedown", (e)=>{ if(e.target === paletteEl) closePalette(); });

  // ---- unlinked mentions ----
  const mentionsEl = document.getElementById("mentions");
  function mentionRe(title){ return new RegExp("(?<![\\p{L}\\p{N}])" + escapeRe(title.trim()) + "(?![\\p{L}\\p{N}])", "iu"); }
  function stripWikiLinks(text){ return text.replace(/\[\[[^\[\]\n]+\]\]/g, " "); }
  function renderMentions(){
    if(!currentNote){ mentionsEl.innerHTML = ""; return; }
    const title = noteTitle(currentNote);
    if(title.length < 3 || isDefaultTitle(title)){ mentionsEl.innerHTML = ""; return; }
    const re = mentionRe(title);
    const hits = linkables().filter(n => n !== currentNote && re.test(stripWikiLinks(n.text).split("\n").slice(1).join("\n")));
    if(!hits.length){ mentionsEl.innerHTML = ""; return; }
    mentionsEl.innerHTML = '<div class="outline-head">Erwähnt in</div>' + hits.map(n =>
      '<div class="mention" data-note="'+n.id+'">'+itemIcon(n)+'<span class="name">'+escapeHtml(noteTitle(n))+'</span><button class="link-btn" data-link="'+n.id+'" title="Erwähnung in [[Link]] umwandeln">verlinken</button></div>').join("");
  }
  mentionsEl.addEventListener("click", (e)=>{
    const btn = e.target.closest("[data-link]");
    if(btn && currentNote){
      const n = itemById(btn.dataset.link);
      if(!n) return;
      const title = noteTitle(currentNote), re = mentionRe(title);
      // replace the first mention that is not already inside a [[link]]
      const parts = n.text.split(/(\[\[[^\[\]\n]+\]\])/);
      let done = false, first = true;
      for(let i=0;i<parts.length;i++){
        if(parts[i].startsWith("[[")) continue;
        if(first){ // skip the title line of that note
          const nl = parts[i].indexOf("\n");
          if(nl === -1){ first = false; continue; }
          const head = parts[i].slice(0, nl+1), rest = parts[i].slice(nl+1);
          if(re.test(rest)){ parts[i] = head + rest.replace(re, m => "[[" + m + "]]"); done = true; break; }
          first = false; continue;
        }
        if(re.test(parts[i])){ parts[i] = parts[i].replace(re, m => "[[" + m + "]]"); done = true; break; }
      }
      if(done){ snapshotVersion(n, "vor Verlinkung"); n.text = parts.join(""); n.updatedAt = Date.now(); n.editedBy = "user"; save(); renderTree(); renderBacklinks(); renderFields(); }
      return;
    }
    const row = e.target.closest(".mention");
    if(row) selectNote(row.dataset.note);
  });

  // ---- local version history ----
  const VERSIONS_KEY = "mdnotes.versions";
  let versions = readJson(VERSIONS_KEY) || {};
  const versionsEl = document.getElementById("versions");
  function snapshotVersion(note, label){
    if(!note || !note.text.trim()) return;
    const list = versions[note.id] || [];
    if(list.length && list[0].text === note.text) return;
    list.unshift({ ts: Date.now(), label, text: note.text });
    versions[note.id] = list.slice(0, 20);
    writeJson(VERSIONS_KEY, versions);
  }
  function renderVersions(){
    // tickets have their own history (left column); saved text versions are a notes thing
    if(!currentNote || isTicket(currentNote) || !(versions[currentNote.id]||[]).length){ versionsEl.innerHTML = ""; return; }
    versionsEl.innerHTML = '<div class="outline-head" title="Frühere Fassungen des Textes, nur auf diesem Gerät — Klick stellt sie wieder her">Versionen</div>' + versions[currentNote.id].map((v, i) =>
      '<div class="version" data-v="'+i+'" title="Diese Version wiederherstellen">'+new Date(v.ts).toLocaleString("de-DE", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" })+'<span class="lbl">'+escapeHtml(v.label)+'</span></div>').join("");
  }
  versionsEl.addEventListener("click", (e)=>{
    const row = e.target.closest(".version");
    if(!row || !currentNote) return;
    const v = versions[currentNote.id][+row.dataset.v];
    if(!v) return;
    if(!confirm("Version vom " + new Date(v.ts).toLocaleString("de-DE") + " wiederherstellen? Der aktuelle Stand wird im Verlauf gesichert.")) return;
    snapshotVersion(currentNote, "vor Wiederherstellung");
    prevLines = [];
    const restored = splitNote(v.text);
    currentNote.text = joinNote(restored.title, edText());
    titleInputEl.value = restored.title; autosizeTitle();
    commitText(restored.body, restored.body.length);
    renderVersions();
  });

  // ---- hover preview for [[links]] ----
  const hoverPop = document.getElementById("hover-pop");
  let hoverTimer = null;
  editorEl.addEventListener("mouseover", (e)=>{
    const wl = e.target.closest(".md-wikilink");
    if(!wl || wl.classList.contains("missing")) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(()=>{
      const n = findNoteByTitle(wl.textContent);
      if(!n) return;
      const body = n.text.split("\n").slice(1).join("\n").trim();
      hoverPop.innerHTML = "<b>" + escapeHtml(noteTitle(n)) + "</b><div class=\"body\">" + escapeHtml(body.slice(0, 400) || "(leer)") + "</div>";
      hoverPop.classList.add("open");
      const r = wl.getBoundingClientRect();
      let top = r.bottom + 8, left = r.left;
      if(top + hoverPop.offsetHeight > window.innerHeight - 8) top = r.top - hoverPop.offsetHeight - 8;
      if(left + hoverPop.offsetWidth > window.innerWidth - 8) left = window.innerWidth - hoverPop.offsetWidth - 8;
      hoverPop.style.top = top + "px"; hoverPop.style.left = left + "px";
    }, 350);
  });
  editorEl.addEventListener("mouseout", (e)=>{
    if(e.target.closest && e.target.closest(".md-wikilink")){ clearTimeout(hoverTimer); hoverPop.classList.remove("open"); }
  });
  editorEl.addEventListener("mousedown", ()=>{ clearTimeout(hoverTimer); hoverPop.classList.remove("open"); tableSel = null; tableUiDismissed = null; });

  /* ---------------- Init ---------------- */
  applyTheme(); applyFont(); applyEditorLayout(); renderSettings(); ipc.apply();
  if(syncEnabled()){ setSyncStatus("pending"); setTimeout(syncNow, 500); }
  if(store.ui && store.ui.sidebarHidden) setSidebarHidden(true);
  if(!store.ui || !store.ui.outlineHidden) document.getElementById("btn-outline").classList.add("active");
  if(store.ui && store.ui.outlineHidden) setOutlineHidden(true);
  runSeries();
  renderTree();
  updateBoardCount();
  renderTrashCount();
  // open where the address says (after a reload: where you were); a fresh tab starts on the Board
  applyRoute(location.hash.slice(1) || "board");
  history.replaceState({ route: currentRoute(), idx: navIndex() }, "", "#" + currentRoute());
  updateNavButtons();

})();
</script>
</body>
</html>
