      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      const oldNode = editorEl.children[i], fresh = tmp.firstChild;
      if(oldNode) oldNode.replaceWith(fresh);
      // eben zur Überschrift geworden („# “ getippt): wächst weich auf ihre Größe statt umzuspringen
      if(fresh && /^#{1,3} /.test(lines[i]) && !/^#{1,3} /.test(prevLines[i]) && !reducedMotion()) fresh.classList.add("h-morph");
    }
    prevLines = lines;
    updateHeadingPaths(lines); updateStilButton();
  }

  /* ---------------- Caret offset preservation ---------------- */
  // Measuring the caret used to always clone a Range over the ENTIRE editor and stringify it —
  // on every keystroke, and on every selectionchange (so several times per keystroke). That is
  // O(document length) each time, which is the main reason typing felt sluggish in long notes.
  // Fast path: find which .line the caret is actually in (one cheap DOM lookup) and only measure
  // the Range *inside that one line*, then add the already-known lengths of every line before it
  // (lineStartsOf — the same "+1 per line" arithmetic the renumbering code already relies on, so
  // it is proven to agree with the real DOM even around hidden table-separator rows, which carry
  // their own leading/trailing "\n" instead of a separate sibling text node). Falls straight back
  // to the old full-document measurement whenever that invariant doesn't hold — never wrong, just
  // not faster.
  function getCaretOffset(el){
    const sel = window.getSelection();
    if(!sel.rangeCount) return 0;
    const range = sel.getRangeAt(0);
    if(!el.contains(range.startContainer)) return 0;
    if(el === editorEl && prevLines.length && editorEl.children.length === prevLines.length){
      const startEl = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
      const lineEl = startEl && startEl.closest(".line");
      if(lineEl && lineEl.parentElement === editorEl){
        const li = parseInt(lineEl.dataset.line, 10);
        if(!Number.isNaN(li) && editorEl.children[li] === lineEl){
          const pre = range.cloneRange();
          pre.selectNodeContents(lineEl);
          pre.setEnd(range.endContainer, range.endOffset);
          // A table separator row's own span embeds a leading "\n" (see renderTableLine) that a
          // plain line never has — Range.toString() includes it like any real character, which
          // would otherwise double-count against the single "+1 per line" that lineStartsOf
          // already budgets for, overshooting the true offset by one inside/after a sep row.
          const isSep = lineEl.classList.contains("line-table-sep");
          const colLen = Math.max(0, cleanText(pre.toString()).length - (isSep ? 1 : 0));
          return lineStartsOf(prevLines)[li] + colLen;
        }
      }
    }
    const pre = range.cloneRange();
    pre.selectNodeContents(el);
    pre.setEnd(range.endContainer, range.endOffset);
    return cleanText(pre.toString()).length;
  }

  // Walks text nodes AND empty .line elements (a blank line has no text
  // node at all, so it must still be a valid caret target — otherwise
  // the caret lands outside every line span and native typing inserts
  // characters as stray un-wrapped nodes, which the line-diff renderer
  // then duplicates instead of replacing). A hidden table-separator line's
  // text never gets targeted by any of our own code, so it's never an issue
  // that it has no visible position to land on.
  function locateOffset(el, offset){
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
      acceptNode(n){
        if(n.nodeType === 3) return NodeFilter.FILTER_ACCEPT;
        if(n.nodeType === 1 && n.classList && n.classList.contains("line") && n.childNodes.length === 0) return NodeFilter.FILTER_ACCEPT;
        return NodeFilter.FILTER_SKIP;
      }
    });
    let remaining = offset, node = null, nodeOffset = 0, found = false, lastText = null;
    let endHere = null;   // text node whose end sits exactly on the target offset (see below)
    // Fast path: skip straight to the .line the offset falls in instead of visiting every text
    // node of every line before it — the same "+1 per line" arithmetic the renumbering code
    // already trusts (lineStartsOf/lineIndexAndColAt), so it agrees with the real DOM even around
    // hidden table-separator rows. The walker's root stays the whole editor (not just that one
    // line) so the end-of-line lookahead below can still peek at the following line/node exactly
    // as it always could; only the starting point moves. Falls back to a full walk from the start
    // whenever the invariant (prevLines in sync with the rendered .line elements) doesn't hold.
    if(el === editorEl && prevLines.length && editorEl.children.length === prevLines.length){
      const pos = lineIndexAndColAt(prevLines, lineStartsOf(prevLines), offset);
      const startEl = editorEl.children[pos.line];
      if(startEl){
        walker.currentNode = startEl;
        // Mirror image of the same compensation in getCaretOffset: a sep row's own text node
        // starts with an embedded "\n" that pos.col (computed via the standard one-"\n"-between-
        // lines convention) never accounts for, so the raw column undershoots by one once the
        // walker starts inside that node.
        remaining = startEl.classList.contains("line-table-sep") ? pos.col + 1 : pos.col;
      }
    }
    while(walker.nextNode()){
      const n = walker.currentNode;
      /* The strict "<" below hands an exact boundary to the NEXT node. That is wrong when the
         next node is invisible: the table's "|" markers, hidden Markdown syntax (**, [[ …) and the
         checkbox's "- [ ]" are all font-size:0. A caret parked inside one looks right but is dead —
         the browser spends the next Backspace resolving it instead of deleting a character. That is
         why deleting in an unpadded table cell ("|mitte|") took two presses per character after
         the first. Staying at the end of the visible text before it is the same text offset, just a
         live position. The same goes for a line end: the next node is the "\n" between two line
         spans, and a caret there sits outside every line — it then got drawn in the base font size
         instead of, say, the title's. An empty line still gets picked: the node before it is that
         "\n", which is outside a line and so never an endHere candidate. */
      if(endHere){
        if(n.nodeType === 3 && (isZeroSizeText(n) || !n.parentElement || !n.parentElement.closest(".line"))){
          node = endHere; nodeOffset = endHere.textContent.length; found = true; break;
        }
        endHere = null;
      }
      if(n.nodeType === 3){
        const isPlaceholder = n.textContent === ZWS;
        const len = isPlaceholder ? 0 : n.textContent.length;
        if(isPlaceholder){
          if(remaining === 0){ node = n; nodeOffset = 0; found = true; break; }
          continue; // contributes nothing to the clean offset count
        }
        lastText = n;   // remembered for the end-of-document fallback below
        // Strict "<": at an exact node boundary (remaining === len), prefer
        // landing at the START of the NEXT node rather than the end of this
        // one — otherwise a following empty line span never gets picked.
        if(remaining < len){ node = n; nodeOffset = remaining; found = true; break; }
        if(remaining === len && n.parentElement && n.parentElement.closest(".line") && !isZeroSizeText(n)) endHere = n;
        remaining -= len;
      } else if(remaining === 0){
        node = n; nodeOffset = 0; found = true; break;
      }
    }
    // The offset lands exactly at the end of the whole document's last text node: there is no
    // "next node" to jump to (the entire reason for the strict "<" above only applies between
    // two nodes), so the walker runs out and comes back empty. Landing inside that last text
    // node's own end, instead of falling through to setCaretOffset's container-level fallback,
    // matters a lot: a container-level (non-text) caret is visually identical but makes the
    // browser's native Backspace a no-op on its first press — it takes a second press before the
    // browser resolves the selection into real text and actually deletes a character. Since this
    // runs after every single keystroke (commitText always calls setCaretOffset), that meant
    // typing or deleting right at the end of a note needed Backspace pressed twice.
    if(!found && remaining === 0 && lastText){ node = lastText; nodeOffset = lastText.textContent.length; found = true; }
    return { node, nodeOffset, found };
  }
  function isZeroSizeText(textNode){
    const el = textNode.parentElement;
    return !!el && getComputedStyle(el).fontSize === "0px";
  }
  function setCaretOffset(el, offset){
    const { node, nodeOffset, found } = locateOffset(el, offset);
    const sel = window.getSelection();
    const range = document.createRange();
    if(found){
      range.setStart(node, nodeOffset);
    } else if(el.lastChild){
      range.selectNodeContents(el);
      range.collapse(false);
    } else {
      range.setStart(el, 0);
    }
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  /* ---------------- Editor <-> note wiring ---------------- */
  // Called several times per keystroke (cursor-line highlight, outline, folds, the global
  // selectionchange listener). Used to re-read and re-scan the whole document's text on every
  // call; now reuses the already-known per-line lengths instead.
  function currentLineIndex(){
    const offset = getCaretOffset(editorEl);
    if(prevLines.length) return lineIndexAndColAt(prevLines, lineStartsOf(prevLines), offset).line;
    const before = cleanText(editorEl.textContent).slice(0, offset);
    return (before.match(/\n/g) || []).length;
  }

  // Bear/Typora-Verhalten: Markdown-Syntax (**, *, ~~, `, [[ ]], [ ]( ), #) ist nur in der Zeile
  // sichtbar, in der gerade der Cursor steht (siehe .marker-hide). Läuft unabhängig vom Fokus-Modus.
  function updateCursorLine(){
    if(document.activeElement !== editorEl){ clearCursorLine(); return; }
    const idx = currentLineIndex();
    const prev = editorEl.querySelector(".line-cursor");
    if(prev && parseInt(prev.dataset.line,10) === idx) return;
    if(prev) prev.classList.remove("line-cursor");
    const cur = editorEl.children[idx];
    if(cur) cur.classList.add("line-cursor");
  }
  function clearCursorLine(){
    editorEl.querySelectorAll(".line-cursor").forEach(s=>s.classList.remove("line-cursor"));
  }

  function sentenceFocusOn(){ return !!(store.ui && store.ui.sentenceFocus); }
  function setSentenceFocus(on){
    store.ui = store.ui || {};
    store.ui.sentenceFocus = on;
    save();
    renderSettings();
    applyFocusDimming(true);
  }
  // [start, end) der Satzgrenze um `offset` in `lineText` (bereinigter Zeilentext). Satzenden sind
  // .!?… (mit optional folgenden Anführungs-/Klammerzeichen) vor Leerraum oder Zeilenende; ein Cursor
  // genau auf der Grenze zählt zum nächsten Satz, nicht zum vorigen — beim Weiterschreiben nach einem
  // Punkt ist man gedanklich schon im nächsten Satz.
  const SENTENCE_END_RE = /[.!?…]+(?:["'’”)\]]*)(?=\s|$)/g;
  function sentenceRangeAt(lineText, offset){
    let segStart = 0, m;
    SENTENCE_END_RE.lastIndex = 0;
    while((m = SENTENCE_END_RE.exec(lineText))){
      const segEnd = m.index + m[0].length;
      if(offset < segEnd) return [segStart, segEnd];
      segStart = segEnd;
    }
    return [segStart, lineText.length];
  }
  function rangeRectsFor(lineEl, from, to){
    if(from >= to) return [];
    const a = locateOffset(lineEl, from), b = locateOffset(lineEl, to);
    if(!a.found || !b.found) return [];
    const range = document.createRange();
    range.setStart(a.node, a.nodeOffset);
    range.setEnd(b.node, b.nodeOffset);
    return [...range.getClientRects()].filter(r => r.width || r.height);
  }
  const sentenceMaskEl = document.getElementById("sentence-mask");
  function updateSentenceMask(){
    if(!focusModeActive || !sentenceFocusOn() || document.activeElement !== editorEl){
      if(sentenceMaskEl.childNodes.length) sentenceMaskEl.innerHTML = "";
      return;
    }
    const idx = currentLineIndex();
    const lineEl = editorEl.children[idx];
    if(!lineEl){ sentenceMaskEl.innerHTML = ""; return; }
    const lineText = cleanText(lineEl.textContent);
    const [start, end] = sentenceRangeAt(lineText, getCaretOffset(lineEl));
    const rects = rangeRectsFor(lineEl, 0, start).concat(rangeRectsFor(lineEl, end, lineText.length));
    sentenceMaskEl.innerHTML = rects.map(r =>
      '<div class="smask-rect" style="left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px"></div>').join("");
  }
  let sentenceMaskRaf = 0;
  function scheduleSentenceMask(){
    if(!focusModeActive || !sentenceFocusOn() || sentenceMaskRaf) return;
    sentenceMaskRaf = requestAnimationFrame(()=>{ sentenceMaskRaf = 0; updateSentenceMask(); });
  }
  editorWrap.addEventListener("scroll", scheduleSentenceMask, { passive:true });
  window.addEventListener("resize", scheduleSentenceMask);

  // Fokus-Modus dimmt alle Zeilen außer der aktuellen; der Schreibmaschinen-Modus zentriert nur
  // (beide zusammen im Fokus-Modus, wie bisher; der Zentrier-Teil ist eigenständig nutzbar).
  function applyFocusDimming(smooth){
    if(focusModeActive){
      const idx = currentLineIndex();
      editorEl.querySelectorAll(".line").forEach(span=>{
        span.classList.toggle("dim", parseInt(span.dataset.line,10) !== idx);
      });
    }
    updateSentenceMask();
    if(!focusModeActive && !typewriterActive) return;
    centerCaretLine(smooth);
  }
  function centerCaretLine(smooth){
    const idx = currentLineIndex();
    const cur = editorEl.children[idx];
    if(!cur) return;
    // Center the *visual* line the caret is on (a long paragraph wraps into many),
    // not the whole paragraph block.
    const wrapRect = editorWrap.getBoundingClientRect();
    const rect = caretRect() || cur.getBoundingClientRect();
    const delta = (rect.top + rect.height/2) - (wrapRect.top + wrapRect.height/2);
    if(Math.abs(delta) < 1) return;
    if(smooth) editorWrap.scrollBy({ top: delta, behavior:"smooth" });
    else glideScroll(editorWrap, delta);   // beim Tippen weich nachgleiten statt springen
  }

  // Bounding box of the caret (collapsed selection) inside the editor, or null.
  function caretRect(){
    const sel = window.getSelection();
    if(!sel.rangeCount || !editorEl.contains(sel.getRangeAt(0).startContainer)) return null;
    const range = sel.getRangeAt(0).cloneRange();
    range.collapse(true);
    let r = range.getBoundingClientRect();
    const ok = x => x && (x.width || x.height);
    if(!ok(r)){
      // Resolve an element-level caret (container = editor/line, offset = child index)
      // to a text position, then measure the character next to the caret – Chrome
      // returns an empty rect for collapsed ranges in several spots.
      let node = range.startContainer, off = range.startOffset;
      const lastText = n => { while(n && n.nodeType !== 3) n = n.lastChild; return n; };
      const firstText = n => { while(n && n.nodeType !== 3) n = n.firstChild; return n; };
      if(node.nodeType !== 3){
        let t = lastText(node.childNodes[off - 1]);
        if(t && t.textContent.endsWith("\n")) t = null;        // caret is at the start of the next line
        if(t){ node = t; off = t.length; }
        else { t = firstText(node.childNodes[off]); if(t){ node = t; off = 0; } }
      }
      if(node.nodeType === 3){
        const probe = document.createRange();
        if(off > 0){ probe.setStart(node, off - 1); probe.setEnd(node, off); r = probe.getBoundingClientRect(); }
        if(!ok(r) && off < node.length){ probe.setStart(node, off); probe.setEnd(node, off + 1); r = probe.getBoundingClientRect(); }
      }
    }
    if(!ok(r)){
      const rects = range.getClientRects();
      r = rects.length ? rects[0] : null;
    }
    if(!ok(r)){
      const line = editorEl.children[currentLineIndex()];
      r = line ? line.getBoundingClientRect() : null;
    }
    return r && (r.width || r.height) ? r : null;
  }

  // Outside focus mode: keep some breathing room below (and above) the caret
  // instead of letting the browser park the current line at the very edge.
  function keepCaretComfortable(){
    if(focusModeActive || typewriterActive || document.activeElement !== editorEl) return;
    const r = caretRect();
    if(!r) return;
    const wrapRect = editorWrap.getBoundingClientRect();
    const margin = Math.min(220, wrapRect.height * 0.28);
    if(r.bottom > wrapRect.bottom - margin) editorWrap.scrollTop += r.bottom - (wrapRect.bottom - margin);
    else if(r.top < wrapRect.top + 60) editorWrap.scrollTop -= (wrapRect.top + 60) - r.top;
  }

  function clearDimming(){
    editorEl.querySelectorAll(".line.dim").forEach(s=>s.classList.remove("dim"));
    sentenceMaskEl.innerHTML = "";
  }

  function updateWordCount(text){
    const words = text.trim().length ? text.trim().split(/\s+/).length : 0;
    slideNumber(wordcountEl, words ? (words + " Wörter") : "", "wc:" + (currentNote ? currentNote.id : ""));
  }

  /* ---------------- Undo / Redo ----------------
     The browser's own undo cannot work in this editor: every keystroke re-renders the changed
     lines and sets the caret from code, which leaves the browser's history pointing at DOM nodes
     that no longer exist. ⌘Z then did nothing — or replayed a stale edit from a different note
     into the current one. So the history lives here, per note, as plain text states. Every change
     to the open note goes through commitText, so everything is undoable: typing, Enter in lists,
     table actions, smart typing, paste, checkbox clicks, a restored version. */
  const noteHistory = new Map();          // note id -> { undo:[], redo:[] }, for this session only
  const HISTORY_MAX = 300;
  const TYPE_GROUP_GAP = 1000, TYPE_GROUP_SPAN = 4000;   // ms: a pause, or a long run, ends an undo step
  let historyKind = "op";                 // "type" while plain typing is being committed
  let historyApplying = false;
  function historyOf(id){
    let h = noteHistory.get(id);
    if(!h){ h = { undo:[], redo:[] }; noteHistory.set(id, h); }
    return h;
  }
  function recordHistory(note, before, after){
    if(historyApplying || before === after) return;
    const h = historyOf(note.id), now = Date.now(), top = h.undo[h.undo.length - 1];
    h.redo.length = 0;
    // Plain typing is merged into one step until a pause or a long run — one ⌘Z per burst of
    // typing, not one per character. Everything else (Enter, table action, paste …) is its own step.
    if(historyKind === "type" && top && top.kind === "type" && top.after === before &&
       now - top.at < TYPE_GROUP_GAP && now - top.startedAt < TYPE_GROUP_SPAN){
      top.after = after; top.at = now;
      return;
    }
    h.undo.push({ before, after, kind: historyKind, at: now, startedAt: now });
    if(h.undo.length > HISTORY_MAX) h.undo.shift();
  }
  function stepHistory(dir){
    if(!currentNote) return;
    const h = historyOf(currentNote.id);
    const from = dir < 0 ? h.undo : h.redo, to = dir < 0 ? h.redo : h.undo;
    const step = from[from.length - 1];
    if(!step) return;
    const expected = dir < 0 ? step.after : step.before, target = dir < 0 ? step.before : step.after;
    // Sync or Claude changed the note behind the history's back: stepping now would silently throw
    // their change away, so this history no longer applies.
    if(edText() !== expected){ h.undo.length = 0; h.redo.length = 0; return; }
    from.pop();
    // caret goes to the end of what changed, the way native undo leaves it
    const max = Math.min(expected.length, target.length);
    let prefix = 0, suffix = 0;
    while(prefix < max && expected[prefix] === target[prefix]) prefix++;
    while(suffix < max - prefix && expected[expected.length - 1 - suffix] === target[target.length - 1 - suffix]) suffix++;
    historyApplying = true;
    try{ commitText(target, target.length - suffix); } finally { historyApplying = false; }
    to.push(step);
  }

  // newText is the editor's text (without the title)
  // Re-runs list renumbering on whatever text is about to be committed, not just after Enter/Tab —
  // deleting a list line (Backspace/Delete/selection, all of which just fire a plain browser
  // "input" event) skipped renumbering entirely before, leaving gaps like "1. 2. 4.". Cheap no-op
  // fast path when nothing actually needs renumbering, which is the common case while just typing.
  function renumberListsPreservingCaret(text, offset){
    const lines = text.split("\n");
    const fixed = renumberLists(lines);
    if(fixed.length === lines.length && fixed.every((l,i)=>l===lines[i])) return { text, offset };
    const starts = lineStartsOf(lines);
    const { line, col } = lineIndexAndColAt(lines, starts, offset);
    const delta = fixed[line].length - lines[line].length;
    let off = 0;
    for(let i=0;i<line;i++) off += fixed[i].length + 1;
    return { text: fixed.join("\n"), offset: off + Math.max(0, col + delta) };
  }

  // `opts.skipRender`: a table cell is its own native contenteditable island (see renderTableLine)
  // — the browser has already applied the edit to the DOM itself, so re-rendering from text would
  // only tear that cell down and rebuild it mid-keystroke, costing the native cursor position for
  // no reason. The text model still needs to catch up (history, save, outline, word count, …), so
  // everything below the render step still runs; only the DOM rebuild and caret placement are
  // skipped, and prevLines is updated to match what the DOM already shows.
  function commitText(newText, caretOffset, opts){
    if(!currentNote) return;
    const skipRender = !!(opts && opts.skipRender);
    const oldText = edText();
    if(!skipRender){
      ({ text: newText, offset: caretOffset } = renumberListsPreservingCaret(newText, caretOffset));
      renderInto(newText);
      presetCursorLine(caretOffset);
      setCaretOffset(editorEl, caretOffset);
    } else {
      prevLines = newText.split("\n");
    }
    currentNote.text = joinNote(splitNote(currentNote.text).title, newText);
    recordHistory(currentNote, oldText, newText);
    currentNote.updatedAt = Date.now();
    currentNote.editedBy = "user";
    lastEditAt = Date.now();
    save();
    scheduleQuietUpdates();
    updateLinkAutocomplete();
    if(!skipRender){
      updateCursorLine();
      applyHeadingFolds();
      if(focusModeActive || typewriterActive) applyFocusDimming(false);
      else keepCaretComfortable();
    }
  }

  /* Tempo beim Tippen: Wortzähler, Seitenleisten-Zeile und Gliederung erst in der Tipp-Pause (160 ms). Sie
     schreiben ins DOM und lesen Maße — bei jedem Anschlag kostete das in langen Notizen ein zusätzliches Layout. */
  let quietT = 0;
  function scheduleQuietUpdates(){
    clearTimeout(quietT);
    quietT = setTimeout(()=>{ if(!currentNote) return; updateWordCount(currentNote.text); updateSidebarRowFor(currentNote); renderOutline(); }, 160);
  }
  /* Die Cursorzeile gleich nach dem Neuzeichnen markieren, solange die neue Zeile noch keinen Stil hat: sonst
     blendeten ihre Markdown-Zeichen bei jedem Anschlag neu ein (früher per Klasse am ganzen Editor verhindert —
     die zwang aber zweimal pro Anschlag alle Elemente zur Stil-Neuberechnung). */
  function presetCursorLine(offset){
    if(document.activeElement !== editorEl || !prevLines.length) return;
    const cur = editorEl.children[lineIndexAndColAt(prevLines, lineStartsOf(prevLines), offset).line];
    if(!cur || cur.classList.contains("line-cursor")) return;
    editorEl.querySelectorAll(".line-cursor").forEach(x => x.classList.remove("line-cursor"));
    cur.classList.add("line-cursor");
  }

  /* ---------------- Outline (live, from # / ##) ---------------- */
  function buildOutline(text){
    const lines = text.split("\n");
    const items = [];
    lines.forEach((line, i)=>{
      const m = /^(#{1,2})\s+(.*)$/.exec(line);
      if(m) items.push({ level: m[1].length, text: m[2].trim() || "Ohne Titel", line: i });
    });
    return items;
  }

  /* ---------------- Kapitel ein-/ausklappen (# bis ###### — nicht nur die Gliederung h1/h2) ----------------
     Klapp-Zustand ist pro Notiz nur für die Sitzung gemerkt (nicht gespeichert, nicht synchronisiert):
     ein Set aus "Ebene|Überschriftentext" je Notiz-ID. Zeilen werden nie aus dem DOM entfernt, nur
     per .folded (display:none) versteckt — genau wie beim Fokus-Modus-Dimmen bleibt die Zeilenzahl
     (und damit jede Cursor-/Offset-Berechnung) unangetastet. Verschwindet eine Überschrift aus dem
     Text, passt kein Schlüssel mehr und der Bereich klappt von selbst wieder auf.
  */
  let collapsedHeadings = {};
  function buildFullOutline(text){
    const lines = text.split("\n");
    const items = [];
    lines.forEach((line, i)=>{
      const m = /^(#{1,6})\s+(.*)$/.exec(line);
      if(m) items.push({ level: m[1].length, key: m[1].length + "|" + m[2].trim(), line: i });
    });
    return items;
  }
  function foldedLineIndices(text, noteId){
    const collapsed = collapsedHeadings[noteId];
    if(!collapsed || !collapsed.size) return new Set();
    const headings = buildFullOutline(text);
    const totalLines = text.split("\n").length;
    const hidden = new Set();
    headings.forEach((h, i)=>{
      if(!collapsed.has(h.key)) return;
      let end = totalLines;
      for(let j=i+1; j<headings.length; j++){
        if(headings[j].level <= h.level){ end = headings[j].line; break; }
      }
      for(let l=h.line+1; l<end; l++) hidden.add(l);
    });
    return hidden;
  }
  // Note ids that currently have "folded"/"folded-heading" classes applied in the DOM — lets
  // applyHeadingFolds (called on every keystroke) skip its full .line scan whenever a note has no
  // folds and never had any, which is true for almost every note almost all the time. Still runs
  // in full whenever folds are active, and once more to clear them the moment the last one opens.
  const notesWithAppliedFolds = new Set();
  function applyHeadingFolds(){
    if(!currentNote) return;
    const id = currentNote.id;
    const collapsed = collapsedHeadings[id];
    const hasFolds = !!(collapsed && collapsed.size);
    if(!hasFolds && !notesWithAppliedFolds.has(id)) return;
    const hidden = foldedLineIndices(edText(), id);
    if(hasFolds) notesWithAppliedFolds.add(id); else notesWithAppliedFolds.delete(id);
    editorEl.querySelectorAll(".line").forEach(span=>{
      span.classList.toggle("folded", hidden.has(parseInt(span.dataset.line, 10)));
      const toggle = span.querySelector(".fold-toggle");
      if(toggle) span.classList.toggle("folded-heading", !!(collapsed && collapsed.has(toggle.dataset.foldToggle)));
    });
    // Ein Cursor, der in einem gerade versteckten Bereich landet (z. B. weil eine Notiz beim
    // Öffnen immer ans Ende springt, oder weil man die Zeile faltet, in der man gerade steht),
    // wäre unsichtbar und Tippen würde scheinbar ins Leere gehen — zur zugehörigen Überschrift holen.
    if(hidden.size && document.activeElement === editorEl){
      const idx = currentLineIndex();
      if(hidden.has(idx)){
        const headings = buildFullOutline(edText());
        let target = 0;
        headings.forEach(h => { if(h.line <= idx) target = h.line; });
        const lines = edText().split("\n");
        let off = 0; for(let i=0;i<target;i++) off += lines[i].length + 1;
        setCaretOffset(editorEl, off + lines[target].length);
      }
    }
  }
  function toggleHeadingFold(key){
    if(!currentNote) return;
    const id = currentNote.id;
    const set = collapsedHeadings[id] || (collapsedHeadings[id] = new Set());
    if(set.has(key)) set.delete(key); else set.add(key);
    applyHeadingFolds();
  }

  const noteIdRowEl = document.getElementById("note-id-row");
  function renderNoteIdRow(){
    if(!currentNote){ noteIdRowEl.innerHTML = ""; return; }
    noteIdRowEl.innerHTML = '<code title="Supabase-ID in '+(isTicket(currentNote) ? "tickets" : "notes")+'">' + escapeHtml(currentNote.id) + '</code>' +
      '<button data-copy-id="1" title="ID kopieren"><svg viewBox="0 0 20 20" fill="none" width="13" height="13">' +
      '<rect x="6" y="6" width="10" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/>' +
      '<path d="M4 13V5a1.5 1.5 0 0 1 1.5-1.5H13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>';
  }
  noteIdRowEl.addEventListener("click", async (e)=>{
    const btn = e.target.closest("[data-copy-id]");
    if(!btn || !currentNote) return;
    try{
      await navigator.clipboard.writeText(currentNote.id);
    }catch(err){
      // Clipboard API can refuse outside a secure context (e.g. a plain file:// open) — fall back.
      const ta = document.createElement("textarea");
      ta.value = currentNote.id; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(err2){}
      ta.remove();
    }
    btn.classList.add("copied"); btn.title = "Kopiert!";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.title = "ID kopieren"; }, 1200);
  });

  // Rebuilding the outline list's innerHTML on every single keystroke was wasted work almost
  // every time — the headings only actually change when a "#" line itself is touched. Skip the
  // rebuild (not the active-item highlight, which does need to track the cursor) whenever the
  // heading set is unchanged from last time.
  let lastOutlineKey = null;
  function renderOutline(){
    renderNoteIdRow();
    if(!currentNote){
      outlineListEl.innerHTML = ""; document.getElementById("outline-head").style.display = "";
      lastOutlineKey = null;
      return;
    }
    const items = buildOutline(edText());
    // a ticket description rarely has headings; its panel (Unteraufgaben, Updates) takes the space instead
    document.getElementById("outline-head").style.display = isTicket(currentNote) && !items.length ? "none" : "";
    const key = currentNote.id + "" + items.map(it=>it.level+":"+it.line+":"+it.text).join("");
    if(key !== lastOutlineKey){
      lastOutlineKey = key;
      outlineListEl.innerHTML = !items.length
        ? (isTicket(currentNote) ? "" : '<div class="outline-empty">Noch keine Überschriften (# oder ##)</div>')
        : items.map(it=>'<div class="outline-item lvl'+it.level+'" data-goto-line="'+it.line+'">'+escapeHtml(it.text)+'</div>').join("");
    }
    if(items.length) updateActiveOutlineItem();
  }

  function updateActiveOutlineItem(){
    const items = outlineListEl.querySelectorAll(".outline-item");
    if(!items.length) return;
    const curLine = currentLineIndex();
    let activeIdx = -1;
    items.forEach((it,i)=>{
      if(parseInt(it.dataset.gotoLine,10) <= curLine) activeIdx = i;
    });
    items.forEach((it,i)=> it.classList.toggle("active", i===activeIdx));
    syncRail(railInd("outline"), outlineListEl, items[activeIdx] || null, true);
  }

  outlineListEl.addEventListener("click", (e)=>{
    const item = e.target.closest(".outline-item");
    if(!item || !currentNote) return;
    const idx = parseInt(item.dataset.gotoLine, 10);
    const lines = edText().split("\n");
    let offset = 0;
    for(let i=0;i<idx;i++) offset += lines[i].length + 1;
    // Fokus und Cursor setzen, ohne dass der Browser erst an den Textanfang springt — sonst startet das
    // weiche Scrollen jedes Mal ganz oben statt an der aktuellen Stelle.
    const keep = editorWrap.scrollTop;
    editorEl.focus({ preventScroll:true });
    setCaretOffset(editorEl, offset);
    editorWrap.scrollTop = keep;
    const target = editorEl.children[idx];
    if(target) target.scrollIntoView({ block:"center", behavior:"smooth" });
    updateActiveOutlineItem();
  });

  function updateSidebarRowFor(note){
    if(isTicket(note)) return;               // tickets have no row in the notes list
    const row = treeEl.querySelector('.row.note[data-note="'+note.id+'"]');
    if(!row) return;                         // not on the list right now; it refreshes when the dialog closes
    const titleEl = row.querySelector(".note-title");
    const previewEl = row.querySelector(".note-preview");
    if(titleEl) titleEl.textContent = noteTitle(note);
    if(previewEl) previewEl.textContent = notePreview(note);
    if(currentNote) updateBreadcrumb();
  }

  const TYPING_INPUTS = new Set(["insertText", "insertCompositionText", "deleteContentBackward", "deleteContentForward"]);
  function scheduleRender(e){
    if(!currentNote) return;
    // A table cell is its own contenteditable island (see renderTableLine) — its "input" events
    // still bubble up here, but they need the cell-local sync path, not the whole-document one.
    const td = e && e.target && e.target.closest && e.target.closest(".td");
    if(td){ syncTableCellEdit(td); return; }
    const offset = getCaretOffset(editorEl);
    historyKind = e && TYPING_INPUTS.has(e.inputType) ? "type" : "op";
    const raw = cleanText(editorEl.textContent);
    const x = expandSlash(raw, offset) || (e && e.inputType === "insertText" ? smartType(raw, offset) : null);
    try{ x ? commitText(x.text, x.offset) : commitText(raw, offset); } finally { historyKind = "op"; }
  }
  /* Schnellbefehl: „/info " am Zeilenanfang wird zur Infobox „> [!info] " */
  function expandSlash(text, offset){
    const ls = text.lastIndexOf("\n", offset - 1) + 1;
    if(text.slice(ls, offset) !== "/info ") return null;
    const rep = "> [!info] ";
    return { text: text.slice(0, ls) + rep + text.slice(offset), offset: ls + rep.length };
  }
  /* Feinsatz beim Tippen: "…" → „…“, Apostroph → ’, ... → …, " -- " → " – ". Nur für gerade getippte Zeichen
     (nicht beim Einfügen) und nie in Code (``` -Block, `inline`) oder in einem Link-/Bildziel ](… "Unterschrift") —
     dort bleibt die Markdown-Syntax unangetastet. */
  function smartType(text, offset){
    const ch = text[offset - 1];
    if(!ch || !"\"'. ".includes(ch)) return null;
    const ls = text.lastIndexOf("\n", offset - 1) + 1, before = text.slice(ls, offset - 1);
    if(((text.slice(0, ls).match(/^```/gm) || []).length % 2) || /^```/.test(before)) return null;   // im Codeblock
    if((before.match(/`/g) || []).length % 2) return null;                                          // in `inline`
    if(before.lastIndexOf("](") > before.lastIndexOf(")")) return null;                            // im Link-/Bildziel
    const put = (from, rep) => ({ text: text.slice(0, offset - from) + rep + text.slice(offset), offset: offset - from + rep.length });
    const prev = before.slice(-1);
    if(ch === '"') return put(1, !prev || /[\s(\[{„‚–—\/]/.test(prev) ? "„" : "“");
    if(ch === "'") return /[\p{L}\p{N}]/u.test(prev) ? put(1, "’") : null;
    if(ch === ".") return before.endsWith("..") && !before.endsWith("...") ? put(3, "…") : null;
    return / --$/.test(before) && !/---$/.test(before) ? put(3, "– ") : null;                       // ch === " "
  }


  editorEl.addEventListener("input", scheduleRender);
  editorEl.addEventListener("blur", clearCursorLine);
  // Weicher Cursor, Tinte, gleitende Zeilen (siehe writerFeel); nach scheduleRender registriert, damit es danach läuft.
  // var statt let: renderInto kann schon vor dieser Zeile laufen (Start mit offener Notiz).
  var edFeel = writerFeel(editorEl, editorWrap, editorWrap, { typewriter: () => false });

  /* Tempo-Messung (⌘K → „Tempo-Messung" bzw. am Handy Einstellungen): kleine Anzeige unten rechts. Misst bei jedem
     Tastendruck im Editor die Zeit bis zum nächsten Bild (Median und 95 % der letzten 60) und zählt Ruckler (Bilder,
     die länger als 50 ms brauchen). Grün unter 16 ms, gelb bis 33 ms, rot darüber. */
  function perfMeterOn(){ return !!(store.ui && store.ui.perfMeter); }
  let perfEl = null, perfRaf = 0, perfSamples = [], perfJank = 0, perfLast = 0;
  function perfOnKey(e){
    if(!e.target || !e.target.closest || !e.target.closest("#editor")) return;
    const t0 = e.timeStamp;
    requestAnimationFrame(now => { perfSamples.push(now - t0); if(perfSamples.length > 60) perfSamples.shift(); perfDraw(); });
  }
  function perfLoop(now){
    if(perfLast && now - perfLast > 50 && document.visibilityState === "visible") perfJank++;
    perfLast = now; perfRaf = requestAnimationFrame(perfLoop);
  }
  function perfDraw(){
    if(!perfEl) return;
    const s = perfSamples.slice().sort((a, b) => a - b), q = p => s.length ? s[Math.min(s.length - 1, Math.floor(s.length * p))] : 0;
    const med = q(.5), p95 = q(.95);
    perfEl.className = "perf-meter " + (p95 < 16 ? "ok" : p95 < 33 ? "mid" : "bad");
    perfEl.textContent = s.length ? "Tippen " + med.toFixed(0) + " ms · 95 % " + p95.toFixed(0) + " ms · Ruckler " + perfJank : "Tempo-Messung: im Editor tippen · Ruckler " + perfJank;
  }
  function applyPerfMeter(){
    const on = perfMeterOn();
    if(on && !perfEl){
      perfEl = document.createElement("div"); document.body.appendChild(perfEl);
      perfSamples = []; perfJank = 0; perfLast = 0;
      document.addEventListener("keydown", perfOnKey, true);
      perfRaf = requestAnimationFrame(perfLoop); perfDraw();
    } else if(!on && perfEl){
      perfEl.remove(); perfEl = null; cancelAnimationFrame(perfRaf);
      document.removeEventListener("keydown", perfOnKey, true);
    }
  }
  function togglePerfMeter(){ store.ui = store.ui || {}; store.ui.perfMeter = !perfMeterOn(); save(); applyPerfMeter(); }
  applyPerfMeter();

  function getSelectionOffsets(el){
    const sel = window.getSelection();
    if(!sel.rangeCount || !el.contains(sel.getRangeAt(0).startContainer)) return { start:0, end:0 };
    const range = sel.getRangeAt(0);
    const preStart = range.cloneRange();
    preStart.selectNodeContents(el);
    preStart.setEnd(range.startContainer, range.startOffset);
    const preEnd = range.cloneRange();
    preEnd.selectNodeContents(el);
    preEnd.setEnd(range.endContainer, range.endOffset);
    return { start: cleanText(preStart.toString()).length, end: cleanText(preEnd.toString()).length };
  }

  function insertTextAtCaret(text){
    if(!currentNote) return;
    const { start, end } = getSelectionOffsets(editorEl);
    const full = cleanText(editorEl.textContent);
    const newFull = full.slice(0, start) + text + full.slice(end);
    commitText(newFull, start + text.length);
  }
  function wrapSelection(before, after){
    if(!currentNote) return;
    const { start, end } = getSelectionOffsets(editorEl);
    const full = cleanText(editorEl.textContent);
    const newFull = full.slice(0, start) + before + full.slice(start, end) + after + full.slice(end);
    commitText(newFull, start + before.length + (end - start));
  }

  /* ---------------- Bilder: Drag & Drop / Einfügen ----------------
     Der Platzhalter ("![…](img:<id>)") landet sofort im Text (Notiz oder Ticket-Beschreibung —
     derselbe Editor für beide), damit man sofort weiterschreiben kann; der Upload läuft im
     Hintergrund und ersetzt anschließend gezielt genau diesen Platzhalter-Text, egal was man
     inzwischen sonst noch geändert hat. Ist der Platzhalter inzwischen weg (z. B. die Zeile
     gelöscht), hängt sich das fertige Bild sicherheitshalber ans Ende an, statt verloren zu gehen. */
  function replaceInNoteText(note, from, to){
    note.text = note.text.includes(from) ? note.text.replace(from, to) : note.text.replace(/\n*$/, "") + (to ? "\n\n" + to : "");
    // Entfernen des Platzhalters lässt die davor eingefügte Leerzeile stehen (die auf ein
    // erfolgreiches Bild folgende Zeile war ja gewollt) — bei einem fehlgeschlagenen Upload ohne
    // Ersatztext bleibt daraus sonst eine überzählige Leerzeile übrig.
    note.text = note.text.replace(/\n{3,}/g, "\n\n");
    note.updatedAt = Date.now(); note.editedBy = "user";
    save();
    updateSidebarRowFor(note);
    if(note === currentNote){
      const off = Math.min(getCaretOffset(editorEl), edText().length);
      prevLines = [];
      renderInto(edText());
      setCaretOffset(editorEl, off);
      updateWordCount(note.text);
      renderOutline();
    }
  }
  // Bei mehreren Dateien auf einmal (Finder-Mehrfachauswahl aufs Editor gezogen) alle Platzhalter in
  // EINEM Schreibvorgang einfügen, statt pro Datei einzeln an der (dann schon verschobenen) Cursor-
  // Position anzusetzen — das riss sonst mitten in den Text der ersten Zeile hinein.
  function insertImagePlaceholders(files){
    const tokens = files.map(()=> "img:" + uid());
    const block = files.map((f, i) => "![Bild wird hochgeladen…](" + tokens[i] + ")").join("\n") + "\n";
    if(currentNote) insertTextAtCaret(block);
    return tokens;
  }
  async function runImageUpload(note, token, file){
    const placeholder = "![Bild wird hochgeladen…](" + token + ")";
    try{
      const url = await uploadImageToStorage(file);
      replaceInNoteText(note, placeholder, "![" + safeFileName(file.name.replace(/\.[^.]+$/, "")) + "](" + url + ")");
    }catch(e){
      replaceInNoteText(note, placeholder, "");
      toast("Bild-Upload fehlgeschlagen: " + e.message);
    }
  }
  function imageFilesFrom(list){
    return [...(list || [])].filter(f => f.type && f.type.startsWith("image/"));
  }
  editorEl.addEventListener("dragover", (e)=>{
    if(!currentNote || !e.dataTransfer.types.includes("Files")) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    editorEl.classList.add("drop-target");
  });
  editorEl.addEventListener("dragleave", (e)=>{ if(e.target === editorEl) editorEl.classList.remove("drop-target"); });
  editorEl.addEventListener("drop", (e)=>{
    editorEl.classList.remove("drop-target");
    if(!currentNote) return;
    const files = imageFilesFrom(e.dataTransfer.files);
    if(!files.length) return;                    // not an image drop: leave it to whatever else handles files
    e.preventDefault();
    const note = currentNote, tokens = insertImagePlaceholders(files);
    files.forEach((f, i) => runImageUpload(note, tokens[i], f));
  });
  editorEl.addEventListener("paste", (e)=>{
    if(!currentNote) return;
    const files = imageFilesFrom(e.clipboardData && e.clipboardData.files);
    if(!files.length) return;
    e.preventDefault();
    const note = currentNote, tokens = insertImagePlaceholders(files);
    files.forEach((f, i) => runImageUpload(note, tokens[i], f));
  });

  /* ---------------- Lists: bullets, numbers and i/ii/iii sub-points ---------------- */
  const ROMAN_MAP = [[1000,"m"],[900,"cm"],[500,"d"],[400,"cd"],[100,"c"],[90,"xc"],[50,"l"],[40,"xl"],[10,"x"],[9,"ix"],[5,"v"],[4,"iv"],[1,"i"]];
  function intToRoman(n){
    let out = "";
    for(const [v,s] of ROMAN_MAP){ while(n >= v){ out += s; n -= v; } }
    return out;
  }
  function romanToInt(s){
    const vals = { i:1, v:5, x:10, l:50, c:100, d:500, m:1000 };
    let total = 0;
    for(let i=0;i<s.length;i++){
      const cur = vals[s[i]], next = vals[s[i+1]] || 0;
      total += cur < next ? -cur : cur;
    }
    return total;
  }

  // Splits a list line into its parts. Roman markers only count when the line
  // is indented (they are sub-points), so a paragraph starting with "cm. " or
  // "di. " is left alone.
  /* Listen-Ebene aus dem Einzug (2 Leerzeichen oder ein Tab je Ebene) → --lvl am Zeilen-Element; das CSS rückt
     damit jede Ebene um 1,5em ein. Der Einzug selbst steht im Marker, aber unsichtbar (.mk-ind), damit er nicht
     doppelt zählt — vorher standen Unterpunkte auf derselben Höhe wie die Hauptpunkte. */
  function listLvl(marker){
    const n = Math.min(8, Math.floor(/^\s*/.exec(marker)[0].replace(/\t/g, "  ").length / 2));
    return n ? ' style="--lvl:' + n + '"' : "";
  }
  function listMarker(marker){
    const ind = /^\s*/.exec(marker)[0];
    return '<span class="marker">' + (ind ? '<span class="mk-ind">' + ind + '</span>' : "") + escapeHtml(marker.slice(ind.length)) + '</span>';
  }
  function parseListLine(line){
    let m;
    if((m = /^(\s*)([-*]\s)(\[[ xX]\]\s)?(.*)$/.exec(line)))
      return { indent:m[1], type:"bullet", sym:m[2][0], check:m[3]||"", num:0, marker:m[1]+m[2]+(m[3]||""), content:m[4] };
    if((m = /^(\s*)(\d+)\.\s(.*)$/.exec(line)))
      return { indent:m[1], type:"number", sym:"", check:"", num:parseInt(m[2],10), marker:m[1]+m[2]+". ", content:m[3] };
    if((m = /^(\s+)([ivxlcdm]+)\.\s(.*)$/.exec(line))){
      const n = romanToInt(m[2]);
      if(n > 0 && intToRoman(n) === m[2])
        return { indent:m[1], type:"roman", sym:"", check:"", num:n, marker:m[1]+m[2]+". ", content:m[3] };
    }
    return null;
  }
  function makeMarker(indent, type, sym, num, check){
    if(type === "bullet") return indent + sym + " " + check;
    if(type === "number") return indent + num + ". ";
    return indent + intToRoman(num) + ". ";
  }
  function isListLine(line){ return parseListLine(line) !== null; }

  // Re-numbers "1. 2. 3." and "i. ii. iii." per indent level. Blank lines
  // don't end a list, any other non-list line does.
  function renumberLists(lines){
    let counters = {}, inCode = false;
    return lines.map(line=>{
      // Codeblöcke bleiben unangetastet (vorher wurde „3. drei" im Code zu „1. drei")
      if(/^```/.test(line)){ inCode = !inCode; counters = {}; return line; }
      if(inCode) return line;
      const li = parseListLine(line);
      if(!li){
        if(line.trim() !== "") counters = {};
        return line;
      }
      const k = li.indent.length;
      Object.keys(counters).forEach(key=>{ if(+key > k) delete counters[key]; });
      if(li.type === "bullet"){ counters[k] = { type:"bullet", num:0 }; return line; }
      const prev = counters[k];
      const num = prev && prev.type === li.type ? prev.num + 1 : 1;
      counters[k] = { type: li.type, num };
      return num === li.num ? line : makeMarker(li.indent, li.type, li.sym, num, "") + li.content;
    });
  }

  // Nearest list item above `idx` with a smaller indent (the parent of a sub-point).
  function parentListItem(lines, idx, indentLen){
    for(let i=idx-1;i>=0;i--){
      const li = parseListLine(lines[i]);
      if(li && li.indent.length < indentLen) return li;
      if(!li && lines[i].trim() !== "") break;
    }
    return null;
  }
  // Nearest list item above `idx` with exactly this indent (a sibling).
  function siblingListItem(lines, idx, indentLen){
    for(let i=idx-1;i>=0;i--){
      const li = parseListLine(lines[i]);
      if(li && li.indent.length === indentLen) return li;
      if(li && li.indent.length < indentLen) return null;
      if(!li && lines[i].trim() !== "") return null;
    }
    return null;
  }

  function lineStartsOf(lines){
    const starts = [];
    let acc = 0;
    for(let i=0;i<lines.length;i++){ starts.push(acc); acc += lines[i].length + 1; }
    return starts;
  }

  // Commits edited lines after renumbering; the caret is given as line/column
  // so it survives markers changing length above or on its own line.
  function commitLines(lines, caretLine, caretCol){
    const fixed = renumberLists(lines);
    const delta = fixed[caretLine].length - lines[caretLine].length;
    let off = 0;
    for(let i=0;i<caretLine;i++) off += fixed[i].length + 1;
    commitText(fixed.join("\n"), off + Math.max(0, caretCol + delta));
  }

  /* Rücktaste direkt hinter einer Zeilenmarke („- ", „1. ", „- [ ] ", „# ", „> ", „> [!info] "): die Marke verschwindet,
     aus dem Punkt wird normaler Text — vorher löschte sie nur das Leerzeichen („2.Zwei"), und die Liste darunter
     begann neu. Unterpunkte rücken stattdessen eine Ebene hoch ("outdent"). Im Code: nichts. */
  function markerBackspace(text, start){
    const ls = text.lastIndexOf("\n", start - 1) + 1, le = text.indexOf("\n", start), end = le < 0 ? text.length : le;
    const line = text.slice(ls, end), col = start - ls;
    if(inCodeBeforeLine(text.split("\n"), text.slice(0, ls).split("\n").length - 1)) return null;
    const li = parseListLine(line);
    const marker = li ? li.marker : (/^(?:#{1,6}\s+|>\s?\[!info\]\s?|>\s?)/i.exec(line) || [""])[0];
    if(!marker || col !== marker.length) return null;
    if(li && li.indent) return "outdent";
    return { text: text.slice(0, ls) + line.slice(marker.length) + text.slice(end), offset: ls };
  }
  function handleEnter(){
    const { start, end } = getSelectionOffsets(editorEl);
    const lines = cleanText(editorEl.textContent).split("\n");
    const pos = lineIndexAndColAt(lines, lineStartsOf(lines), start);
    const line = lines[pos.line];
    const li = start === end && !inCodeBeforeLine(lines, pos.line) ? parseListLine(line) : null;   // im Code: keine Liste
    if(!li || pos.col < li.marker.length){ insertTextAtCaret("\n"); return; }

    const newLines = lines.slice();
    if(li.content.trim() === ""){
      // Enter on an empty item: a sub-point moves back up to its parent level,
      // a top-level item leaves the list.
      const parent = parentListItem(lines, pos.line, li.indent.length);
      newLines[pos.line] = parent
        ? makeMarker(parent.indent, parent.type, parent.sym, parent.num + 1, parent.check ? "[ ] " : "")
        : "";
      commitLines(newLines, pos.line, newLines[pos.line].length);
      return;
    }
    const next = li.type === "bullet"
      ? makeMarker(li.indent, "bullet", li.sym, 0, li.check ? "[ ] " : "")
      : makeMarker(li.indent, li.type, li.sym, li.num + 1, "");
    newLines.splice(pos.line, 1, line.slice(0, pos.col), next + line.slice(pos.col));
    commitLines(newLines, pos.line + 1, next.length);
  }

  function lineIndexAndColAt(lines, lineStarts, off){
    for(let i=0;i<lines.length;i++){
      if(off <= lineStarts[i] + lines[i].length) return { line:i, col: off - lineStarts[i] };
    }
    const last = lines.length - 1;
    return { line:last, col: lines[last].length };
  }

  function indentLines(outdent){
    if(!currentNote) return;
    const { start, end } = getSelectionOffsets(editorEl);
    const lines = cleanText(editorEl.textContent).split("\n");
    const lineStarts = lineStartsOf(lines);
    const a = lineIndexAndColAt(lines, lineStarts, start);
    const b = lineIndexAndColAt(lines, lineStarts, end);

    const newLines = lines.slice();
    const colDelta = {};
    for(let i=a.line;i<=b.line;i++){
      const old = newLines[i];
      const li = inCodeBeforeLine(newLines, i) ? null : parseListLine(old);   // im Code nur einrücken
      let line;
      if(outdent){
        const m = /^ {1,2}/.exec(old);
        const removed = m ? m[0].length : 0;
        line = old.slice(removed);
        if(li && li.type === "roman" && removed){
          // A sub-point leaving its level takes the marker style of its new
          // siblings; with none around it falls back to bullet / roman.
          const indent = li.indent.slice(removed);
          const sib = siblingListItem(newLines, i, indent.length);
          const type = sib ? sib.type : (indent.length > 0 ? "roman" : "bullet");
          line = makeMarker(indent, type, sib ? sib.sym : "-", 1, "") + li.content;
        }
      } else {
        line = "  " + old;
        // Eine Nummer, die eingerückt wird, wird zum Unterpunkt i./ii./iii.; Stichpunkte und Aufgaben
        // bleiben, was sie sind (vorher wurde auch aus „- " ein „i.").
        if(li && li.type === "number"){
          line = makeMarker("  " + li.indent, "roman", "", 1, "") + li.content;
        }
      }
      newLines[i] = line;
      colDelta[i] = line.length - old.length;
    }
    commitLines(newLines, b.line, b.col + colDelta[b.line]);
  }

  editorEl.addEventListener("keydown", (e)=>{
    // ⌘Z / ⌘⇧Z (⌃Z / ⌃Y) go to the note's own history — the browser's must never run (see stepHistory)
    if((e.metaKey || e.ctrlKey) && !e.altKey && !e.isComposing){
      const hk = e.key.toLowerCase();
      if(hk === "z"){ e.preventDefault(); stepHistory(e.shiftKey ? 1 : -1); return; }
      if(hk === "y" && !e.shiftKey){ e.preventDefault(); stepHistory(1); return; }
    }
    // up from the first line, or backspace at the very start: back into the title field — not
    // while inside a table cell (even its very first one): that Backspace belongs to the cell's
    // own native deletion, and ArrowUp already has its own table-aware handling below.
    const inTableCell = !!(e.target && e.target.closest && e.target.closest(".td"));
    if((e.key === "ArrowUp" || e.key === "Backspace") && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey && !linkPopOpen() && !inTableCell){
      const { start, end } = getSelectionOffsets(editorEl);
      const firstLine = !cleanText(editorEl.textContent).slice(0, start).includes("\n");
      if(start === end && (e.key === "Backspace" ? start === 0 : firstLine && !currentTableContext())){
        e.preventDefault();
        titleInputEl.focus();
        titleInputEl.setSelectionRange(titleInputEl.value.length, titleInputEl.value.length);
        return;
      }
    }
    if(e.key === "Enter" && (e.metaKey || e.ctrlKey)) return;   // ⌘⏎ gehört dem Dialog (Ticket erledigen)
    if((e.key === "Enter" || e.key === " ") && !e.shiftKey && expandTableTrigger()){ e.preventDefault(); return; }
    // wrapSelection reads the whole-document offset model, meaningless for a cell's own local
    // selection — table cells don't live-render inline markdown (see renderTableLine), so there is
    // nothing useful for ⌘B/⌘I/⌘U to do there yet; skip rather than risk wrapping the wrong text.
    if((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && !e.isComposing && !inTableCell){
      const fk = e.key.toLowerCase();
      if(fk === "b"){ e.preventDefault(); wrapSelection("**", "**"); return; }
      if(fk === "i"){ e.preventDefault(); wrapSelection("*", "*"); return; }
      if(fk === "u"){ e.preventDefault(); wrapSelection("++", "++"); return; }
    }
    if(!e.metaKey && !e.ctrlKey && !e.isComposing){
      const tk = currentTableContext();
      if(tk){
        if(e.altKey && e.shiftKey && e.key.indexOf("Arrow") === 0){
          e.preventDefault();
          if(e.key === "ArrowUp") tableMoveRow(tk, -1);
          else if(e.key === "ArrowDown") tableMoveRow(tk, 1);
          else if(e.key === "ArrowLeft") tableMoveColumn(tk, -1);
          else tableMoveColumn(tk, 1);
          return;
        }
        if(!e.altKey && !e.shiftKey && (e.key === "ArrowUp" || e.key === "ArrowDown")
           && tableArrowVertical(tk, e.key === "ArrowDown" ? 1 : -1)){ e.preventDefault(); return; }
        if(!e.altKey && !e.shiftKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")
           && tableArrowHorizontal(tk, e.key === "ArrowRight" ? 1 : -1)){ e.preventDefault(); return; }
        if(!e.altKey && !e.shiftKey && (e.key === "Home" || e.key === "End")){
          e.preventDefault(); tableHomeEnd(tk, e.key === "End"); return;
        }
      } else if(!e.altKey && !e.shiftKey && e.key.indexOf("Arrow") === 0){
        // no preventDefault: this only fixes up a move the browser dropped at a table's edge
        if(e.key === "ArrowUp" || e.key === "ArrowDown") tableArrowRescue(e.key === "ArrowDown" ? 1 : -1);
        else tableArrowRescue(e.key === "ArrowRight" ? 1 : -1, true);
      }
      if((e.key === "Backspace" || e.key === "Delete") && handleTableDeleteKey(e.key === "Backspace")){
        e.preventDefault(); return;
      }
      if(e.key === "Escape" && !linkPopOpen() && dismissTableUI()){ e.preventDefault(); return; }
    }
    if(linkPopOpen()){
      if(e.key === "ArrowDown" || e.key === "ArrowUp"){
        e.preventDefault();
        linkActive = (linkActive + (e.key === "ArrowDown" ? 1 : linkMatches.length - 1)) % linkMatches.length;
        renderLinkPop();
        return;
      }
      if(e.key === "Enter" || e.key === "Tab"){ e.preventDefault(); acceptLinkMatch(linkActive); return; }
      if(e.key === "Escape"){ e.preventDefault(); closeLinkPop(); return; }
    }
    // Rücktaste in einer leeren Zeile: selbst erledigen (Zeile entfernen, Cursor ans Ende der Zeile davor).
    // Der Browser löschte sonst nur den unsichtbaren Platzhalter samt Zeilen-Element — sichtbar passierte nichts.
    if(e.key === "Backspace" && !e.altKey && !e.metaKey && !e.ctrlKey && !e.shiftKey){
      const { start, end } = getSelectionOffsets(editorEl);
      if(start === end && start > 0){
        const text = cleanText(editorEl.textContent), ls = text.lastIndexOf("\n", start - 1) + 1, le = text.indexOf("\n", start);
        if(ls === start && text.slice(ls, le < 0 ? text.length : le) === ""){ e.preventDefault(); commitText(text.slice(0, start - 1) + text.slice(start), start - 1); return; }
        const mb = markerBackspace(text, start);
        if(mb === "outdent"){ e.preventDefault(); indentLines(true); return; }
        if(mb){ e.preventDefault(); commitText(mb.text, mb.offset); return; }
      }
    }
    // Entf in einer leeren Zeile: Zeile entfernen (der Browser löschte nur den unsichtbaren Platzhalter)
    if(e.key === "Delete" && !e.altKey && !e.metaKey && !e.ctrlKey && !e.shiftKey){
      const { start, end } = getSelectionOffsets(editorEl);
      const text = cleanText(editorEl.textContent), ls = text.lastIndexOf("\n", start - 1) + 1, le = text.indexOf("\n", start);
      if(start === end && le >= 0 && ls === start && le === start){ e.preventDefault(); commitText(text.slice(0, start) + text.slice(start + 1), start); return; }
    }
    if(e.key === "Enter"){
      const tctx = currentTableContext();
      if(tctx){ e.preventDefault(); tableEnter(tctx); return; }
      e.preventDefault();
      if(e.shiftKey) insertTextAtCaret("\n");
      else handleEnter();
    } else if(e.key === "Tab"){
      const tctx = currentTableContext();
      if(tctx){ e.preventDefault(); tableMoveCell(tctx, e.shiftKey ? -1 : 1); return; }
      e.preventDefault();
      if(e.shiftKey){
        indentLines(true);
        return;
      }
      const { start, end } = getSelectionOffsets(editorEl);
      const lines = cleanText(editorEl.textContent).split("\n");
      const lineStarts = lineStartsOf(lines);
      const a = lineIndexAndColAt(lines, lineStarts, start);
      const b = lineIndexAndColAt(lines, lineStarts, end);
      const touchesList = (a.line !== b.line || isListLine(lines[a.line])) && !inCodeBeforeLine(lines, a.line);
      if(touchesList){
        indentLines(false);
      } else {
        insertTextAtCaret("  ");
      }
    }
  });

  editorEl.addEventListener("paste", (e)=>{
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain").replace(/\r\n?/g, "\n");   // Windows-Zeilenenden
    // In eine Tabelle nur, wenn die Auswahl in einer Zelle liegt — sonst (z. B. ⌘A in einer Notiz, die mit einer
    // Tabelle beginnt) landete der ganze eingefügte Text in einer einzigen Zelle.
    const pr = getSelection().rangeCount ? getSelection().getRangeAt(0) : null;
    const cellOf = n => n && (n.nodeType === 1 ? n : n.parentElement) && (n.nodeType === 1 ? n : n.parentElement).closest(".td");
    const tctx = !pr || pr.collapsed || (cellOf(pr.startContainer) && cellOf(pr.startContainer) === cellOf(pr.endContainer)) ? currentTableContext() : null;
    if(tctx && pasteIntoTable(tctx, text)) return;       // fills cells, grows the table to fit
    const table = !tctx && text.includes("\t") ? tsvToTable(text) : null;
    const atEnd = table && getSelectionOffsets(editorEl).end >= cleanText(editorEl.textContent).length;
    insertTextAtCaret(table ? (atEnd ? table + "\n" : table) : text);
  });

  /* Dinge, die der Browser beim Tippen von allein falsch macht, laufen auf beforeinput statt
     keydown, damit sie auch die Wege abdecken, die ein reiner Tastendruck nie nimmt: IME-Bestätigung,
     Autokorrektur, Diktat, hineingezogener Text. */
  editorEl.addEventListener("beforeinput", (e)=>{
    if(!currentNote) return;
    // undo/redo from the browser's Edit menu or a touch bar never passes through keydown
    if(e.inputType === "historyUndo" || e.inputType === "historyRedo"){
      e.preventDefault(); stepHistory(e.inputType === "historyUndo" ? -1 : 1); return;
    }
    // A table cell is its own contenteditable island now — none of the whole-document offset logic
    // below applies to its local selection. A typed (or pasted — see pasteIntoTable) "|" still
    // needs escaping to "\|" right here, in the DOM, as the ONE place this ever happens: a later
    // full re-render (triggered by an edit elsewhere in the note) reads the row straight out of
    // editorEl.textContent same as any other line, so the DOM itself must already be the escaped,
    // parseable form — syncTableCellEdit does not escape again, only trims/strips newlines.
    if(e.target && e.target.closest && e.target.closest(".td")){
      if((e.inputType === "insertText" || e.inputType === "insertReplacementText") && e.data && e.data.indexOf("|") > -1){
        e.preventDefault();
        document.execCommand("insertText", false, e.data.replace(/\|/g, "\\|"));
      }
      return;
    }
    if(e.inputType !== "insertText" && e.inputType !== "insertReplacementText") return;
    // 1. a selection spanning several cells would be replaced *including* the "|" between them,
    //    collapsing the whole table into one line
    const span = tableSelectionSpan();
    if(span){ e.preventDefault(); clearTableSpan(span, e.data || ""); return; }
    // 2. a raw "|" typed into a cell would split the row in two; GFM's \| is how a cell holds
    //    a literal pipe
    if(e.data && e.data.indexOf("|") > -1 && currentTableContext()){
      e.preventDefault();
      insertTextAtCaret(e.data.replace(/\|/g, "\\|"));
      return;
    }
    // 3. Smart Typing: „Anführungszeichen“, -- → –, Klammern-Paare — nicht in Tabellenzellen
    //    (eigene Pipe-Logik oben) und nicht in Code (Inline oder Fence), wo die rohen Zeichen zählen.
    if(e.data && !currentTableContext() && !inCodeContext() && applySmartTyping(e.data)){
      e.preventDefault();
    }
  });

  // Ist der Cursor in einem Code-Fence-Block oder zwischen einem ungeraden Backtick-Paar (Inline-Code)?
  function inCodeContext(){
    const { start } = getSelectionOffsets(editorEl);
    const lines = cleanText(editorEl.textContent).split("\n");
    const { line, col } = lineIndexAndColAt(lines, lineStartsOf(lines), start);
    let inFence = false;
    for(let i=0;i<line;i++){ if(/^```/.test(lines[i])) inFence = !inFence; }
    if(inFence || /^```/.test(lines[line])) return true;
    const ticks = (lines[line].slice(0, col).match(/`/g) || []).length;
    return ticks % 2 === 1;
  }

  const SMART_BRACKETS = { "(":")", "[":"]", "{":"}" };
  const SMART_CLOSERS = new Set(Object.values(SMART_BRACKETS));

  // Returns true if it handled (and already committed) the keystroke; the caller still has to
  // preventDefault so the browser doesn't also insert its own plain version.
  function applySmartTyping(data){
    const { start, end } = getSelectionOffsets(editorEl);
    const full = cleanText(editorEl.textContent);
    const hasSel = start !== end;

    if(data === "-" && !hasSel && full[start-1] === "-"){
      // Not if the line so far is only dashes — that's someone typing "---" for a manual
      // divider, not a word-connecting dash, and turning it into "–" makes it un-typeable.
      const lineStart = full.lastIndexOf("\n", start-1) + 1;
      if(!/^-+$/.test(full.slice(lineStart, start))){
        commitText(full.slice(0, start-1) + "–" + full.slice(start), start);
        return true;
      }
    }
    if(data === ">" && !hasSel && full[start-1] === "-"){
      commitText(full.slice(0, start-1) + "→" + full.slice(start), start);
      return true;
    }
    if(data === '"'){
      if(hasSel) commitText(full.slice(0,start) + "„" + full.slice(start,end) + "“" + full.slice(end), end + 2);
      else if(full[start] === "“") setCaretOffset(editorEl, start + 1);
      else commitText(full.slice(0,start) + "„“" + full.slice(end), start + 1);
      return true;
    }
    if(SMART_BRACKETS[data]){
      const close = SMART_BRACKETS[data];
      if(hasSel) commitText(full.slice(0,start) + data + full.slice(start,end) + close + full.slice(end), end + 1);
      else commitText(full.slice(0,start) + data + close + full.slice(end), start + 1);
      return true;
    }
    if(SMART_CLOSERS.has(data) && !hasSel && full[start] === data){
      setCaretOffset(editorEl, start + 1);
      return true;
    }
    return false;
  }

  /* ---------------- Wiki links: [[Titel]] ---------------- */
  const linkPop = document.getElementById("link-pop");
  const backlinksEl = document.getElementById("backlinks");
  let linkMatches = [], linkActive = 0, linkQueryStart = -1;

  // [[Titel]] finds notes and tickets alike. Same title on both: the note wins, just as the older of
  // two same-titled notes always has.
  function linkables(){ return store.notes.concat(store.tickets); }
  function isDefaultTitle(title){ return title === "Neue Notiz" || title === "Neues Ticket"; }
  function findNoteByTitle(title){
    const t = title.trim().toLowerCase();
    return store.notes.find(n => noteTitle(n).toLowerCase() === t) || store.tickets.find(n => noteTitle(n).toLowerCase() === t) || null;
  }
  function itemIcon(x){ return isTicket(x) ? '<span class="task-dot'+(x.status === "Erledigt" ? " done" : "")+'">'+CHECK_SVG+'</span>' : noteSvg(); }
  function openWikiLink(title){
    const target = findNoteByTitle(title);
    if(target){ selectNote(target.id); return; }
    const note = { id: uid(), folderId: currentNote ? currentNote.folderId : null, createdAt: Date.now(), updatedAt: Date.now(), text: title.trim() + "\n\n" };
    store.notes.unshift(note);
    save(); renderTree();
    selectNote(note.id);
  }
  function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function wikiLinkRe(title){ return new RegExp("\\[\\[\\s*" + escapeRe(title.trim()) + "\\s*\\]\\]", "gi"); }

  // When a note's title changes, links in other notes follow it.
  function syncWikiLinks(oldTitle, newTitle){
    if(!oldTitle || isDefaultTitle(oldTitle) || !newTitle || isDefaultTitle(newTitle)) return;
    // links keep pointing at whatever else still carries the old title (a note outranks a ticket)
    const holders = isTicket(currentNote) ? linkables() : store.notes;
    if(holders.some(n => n !== currentNote && noteTitle(n).toLowerCase() === oldTitle.toLowerCase())) return;
    const re = wikiLinkRe(oldTitle);
    let changed = false;
    linkables().forEach(n=>{
      if(n === currentNote || !re.test(n.text)) return;
      n.text = n.text.replace(re, "[[" + newTitle + "]]");
      n.updatedAt = Date.now();
      changed = true;
    });
    if(changed){ save(); renderTree(); }
  }

  function renderBacklinks(){
    renderMentions(); renderVersions(); renderTaskPanel();
    if(!currentNote){ backlinksEl.innerHTML = ""; return; }
    const title = noteTitle(currentNote);
    const re = wikiLinkRe(title);
    // a ticket that shares its title with a note is not what [[Titel]] opens — those links belong to the note
    const shadowed = isTicket(currentNote) && store.notes.some(n => noteTitle(n).toLowerCase() === title.toLowerCase());
    const sources = shadowed ? [] : linkables().filter(n => n !== currentNote && re.test(n.text));
    if(!sources.length){ backlinksEl.innerHTML = ""; return; }
    backlinksEl.innerHTML = '<div class="outline-head">Verlinkt von</div>' + sources.map(n =>
      '<div class="backlink'+(isTicket(n) ? " is-ticket" : "")+'" data-note="'+n.id+'">'+itemIcon(n)+'<span>'+escapeHtml(noteTitle(n))+'</span>' +
      (isTicket(n) ? '<span class="bl-meta">'+escapeHtml(n.status === "Erledigt" ? "erledigt" : dueLabel(n.due))+'</span>' : "") + '</div>').join("");
  }
  backlinksEl.addEventListener("click", (e)=>{
    const row = e.target.closest(".backlink");
    if(row) selectNote(row.dataset.note);
  });

  // ---- [[ autocomplete ----
  function closeLinkPop(){ linkPop.classList.remove("open"); linkMatches = []; linkQueryStart = -1; }
  function linkPopOpen(){ return linkPop.classList.contains("open"); }

  function updateLinkAutocomplete(){
    if(!currentNote || document.activeElement !== editorEl){ closeLinkPop(); return; }
    const { start, end } = getSelectionOffsets(editorEl);
    if(start !== end){ closeLinkPop(); return; }
    const full = cleanText(editorEl.textContent);
    const lineStart = full.lastIndexOf("\n", start - 1) + 1;
    const m = /\[\[([^\[\]]*)$/.exec(full.slice(lineStart, start));
    if(!m){ closeLinkPop(); return; }
    const q = m[1].toLowerCase();
    linkQueryStart = start - m[1].length;
    const notes = linkables().filter(n => n !== currentNote && !(isTicket(n) && n.status === "Erledigt") && noteTitle(n).toLowerCase().includes(q) && !isDefaultTitle(noteTitle(n)))
      .sort((a,b)=> (isTicket(a) && a.status === "Erledigt") - (isTicket(b) && b.status === "Erledigt") || b.updatedAt - a.updatedAt).slice(0, 8);
    linkMatches = notes.map(n => ({ title: noteTitle(n), create:false, item:n }));
    if(m[1].trim() && !notes.some(n => noteTitle(n).toLowerCase() === q)) linkMatches.push({ title: m[1].trim(), create:true });
    if(!linkMatches.length){ closeLinkPop(); return; }
    linkActive = Math.min(linkActive, linkMatches.length - 1);
    renderLinkPop();
    positionLinkPop();
  }
  function renderLinkPop(){
    linkPop.innerHTML = linkMatches.map((it, i) =>
      '<div class="opt'+(i===linkActive?" active":"")+(it.create?" create":"")+'" data-idx="'+i+'">'+(it.item ? itemIcon(it.item) : noteSvg())+'<span>'+
      (it.create ? 'Neue Notiz „'+escapeHtml(it.title)+'“' : escapeHtml(it.title))+'</span>' +
      (it.item && isTicket(it.item) ? '<span class="opt-kind">Ticket</span>' : "") + '</div>').join("");
    linkPop.classList.add("open");
  }
  function positionLinkPop(){
    const sel = window.getSelection();
    if(!sel.rangeCount) return;
    let rect = sel.getRangeAt(0).getBoundingClientRect();
    if(!rect || (!rect.width && !rect.height)){
      const line = editorEl.children[currentLineIndex()];
      if(line) rect = line.getBoundingClientRect();
    }
    const popH = linkPop.offsetHeight, popW = linkPop.offsetWidth;
    let top = rect.bottom + 6, left = rect.left;
    if(top + popH > window.innerHeight - 8) top = rect.top - popH - 6;
    if(left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
    linkPop.style.top = top + "px";
    linkPop.style.left = left + "px";
  }
  function acceptLinkMatch(i){
    const it = linkMatches[i];
    if(!it) return;
    const { start } = getSelectionOffsets(editorEl);
    const full = cleanText(editorEl.textContent);
    const after = full.slice(start);
    // Swallow whatever closing brackets already follow the caret, so the link never ends with "]]]".
    // Typing "[[" key by key leaves "]]" (the smart brackets close each "["), but a chunk inserted
    // in one go — paste, dictation, autocorrect — may leave just one.
    const closing = after.startsWith("]]") ? 2 : after.startsWith("]") ? 1 : 0;
    const qs = linkQueryStart;
    const newFull = full.slice(0, qs) + it.title + "]]" + full.slice(start + closing);
    closeLinkPop();
    commitText(newFull, qs + it.title.length + 2);
  }
  linkPop.addEventListener("mousedown", (e)=>{
    e.preventDefault();                                     // keep the editor focused
    const opt = e.target.closest(".opt");
    if(opt) acceptLinkMatch(parseInt(opt.dataset.idx, 10));
  });

  // Bildunterschrift hinzufügen/ändern/entfernen — data-md trägt genau die rohe Markdown-Zeile,
  // die hier ersetzt wird; leere Eingabe entfernt die Unterschrift wieder.
  function editImageCaption(wrapEl){
    if(!currentNote) return;
    const rawMd = wrapEl.dataset.md;
    const m = /^!\[([^\]]*)\]\(([^)\s]*)(?:\s+"([^"]*)")?\)$/.exec(rawMd);
    if(!m) return;
    const [, alt, url, title] = m;
    const next = prompt("Bildunterschrift (klein, unter dem Bild — auch über die Suche zu finden):", title || "");
    if(next === null) return;
    const cleaned = next.trim().replace(/"/g, "'");
    const newMd = "![" + alt + "](" + url + (cleaned ? ' "' + cleaned + '"' : "") + ")";
    const body = edText();
    const idx = body.indexOf(rawMd);
    if(idx < 0) return;
    commitText(body.slice(0, idx) + newMd + body.slice(idx + rawMd.length), idx + newMd.length);
  }
  editorEl.addEventListener("click", (e)=>{
    const imgWrap = e.target.closest(".md-image-wrap");
    if(imgWrap && currentNote){ e.preventDefault(); editImageCaption(imgWrap); return; }
    const foldToggle = e.target.closest(".fold-toggle");

  /* ---------------- Note / folder operations ---------------- */
  function notesIn(folderId){
    return store.notes.filter(n=>n.folderId===folderId);
  }
  function foldersIn(parentId){
    return store.folders.filter(f=>f.parentId===parentId);
  }
  /* ---------------- Manuelle Reihenfolge (3.35.0) ----------------
     sort aufsteigend; Einträge ohne sort folgen danach alphabetisch — bestehende Daten bleiben also so
     sortiert wie bisher. Beim Verschieben bekommt nur der verschobene Eintrag eine neue Bruchzahl
     (Mittelwert der Nachbarn); noch unnummerierte Einträge vor der Einfügestelle erhalten dabei einmalig
     eine Position (sonst ließe sich „zwischen zwei alphabetischen“ nicht ausdrücken). Ordner und Notizen
     werden je für sich sortiert — im Baum stehen Ordner weiter vor den Notizen. */
  const hasSort = x => typeof x.sort === "number" && isFinite(x.sort);
  function bySortThen(nameOf){
    return (a,b) => {
      const ha = hasSort(a), hb = hasSort(b);
      if(ha && hb && a.sort !== b.sort) return a.sort - b.sort;
      if(ha !== hb) return ha ? -1 : 1;
      return nameOf(a).localeCompare(nameOf(b), "de");
    };
  }
  const folderOrder = bySortThen(f => f.name), noteOrder = bySortThen(n => noteTitle(n));
  function siblingFolders(parentId){ return store.folders.filter(f => (f.parentId || null) === (parentId || null)).sort(folderOrder); }
  function siblingNotes(folderId){ return (folderId ? notesIn(folderId) : rootNotes()).sort(noteOrder); }
  // list = Geschwister in Anzeigereihenfolge (ohne item); item landet an Position index
  function placeAt(item, list, index){
    const now = Date.now();
    let prev = null;
    list.slice(0, index).forEach(b => { if(!hasSort(b)){ b.sort = prev === null ? 1 : prev + 1; b.updatedAt = now; } prev = b.sort; });
    const after = list[index], next = after && hasSort(after) ? after.sort : null;
    item.sort = prev === null ? (next === null ? 1 : next - 1) : (next === null ? prev + 1 : (prev + next) / 2);
    item.updatedAt = now;
  }
  // Neues ans Ende: nur wenn alle Geschwister nummeriert sind — sonst bleibt es alphabetisch einsortiert
  function sortAtEnd(list){
    if(list.some(x => !hasSort(x))) return undefined;
    return (list.length ? Math.max(...list.map(x => x.sort)) : 0) + 1;
  }
  function sortAlphabetically(folderId){
    const now = Date.now();
    siblingFolders(folderId).concat(siblingNotes(folderId)).forEach(x => { if(hasSort(x)){ delete x.sort; x.updatedAt = now; } });
  }
  function isInFolder(folderId, ancestorId){
    for(let f = store.folders.find(x => x.id === folderId), guard = 0; f && guard < 50; f = store.folders.find(x => x.id === f.parentId), guard++)
      if(f.id === ancestorId) return true;
    return false;
  }
  /* Titel und Text sind in der Oberfläche getrennte Felder. Gespeichert wird weiter „Titel, Leerzeile,
     Text" in einem Feld — so bleiben Sync, mobile App, Supabase und der MCP-Server unverändert. Der
     Editor sieht nur den Text; alles, was mit ihm rechnet (Zeilen, Offsets, Undo), bezieht sich darauf. */
  function splitNote(text){
    const lines = (text || "").split("\n");

    if(rest[0] === "") rest = rest.slice(1);

  }
  function joinNote(title, body){ return title || body ? title + "\n\n" + body : ""; }
  function edText(){ return currentNote ? splitNote(currentNote.text).body : ""; }
  function noteTitle(note){
    const first = (note.text.split("\n")[0] || "").replace(/^#+\s*/,"").trim();
    return first || (isTicket(note) ? "Neues Ticket" : "Neue Notiz");
  }
  function notePreview(note){
    const lines = note.text.split("\n").slice(1).map(l=>l.trim()).filter(Boolean);
    return (lines[0] || "").replace(/^#+\s*/,"").slice(0,80);
  }

  /* ---------------- Öffnen als Dialog ----------------

     Beide nutzen denselben Live-Editor; der Ticket-Dialog trägt Termin, Kürzel und Status oben,

  function autosizeTitle(){ titleInputEl.style.height = "auto"; titleInputEl.style.height = titleInputEl.scrollHeight + "px"; }

  titleInputEl.addEventListener("input", ()=>{

  function selectNote(id){

    if(ticket) animateDialogOpen(id); else dialogEl.querySelector(".dlg-box").style.animation = "";
    renderSideTree(); syncSidebar();

    // Notiz entsteht verschlüsselt, von oben nach unten — nur beim ersten Öffnen je Sitzung, sonst wird es zum Gimmick
    if(switched && !ticket && !cryptSeen.has(id)){ cryptSeen.add(id); encryptReveal([titleInputEl, editorEl]); }
    setLesen(!ticket && !!lesenMerk()[id], false);          // Lesemodus je Notiz wie zuletzt
  }
  /* Dialog aus der Karte: wer eine Karte, Zeile oder Notiz anklickt, sieht den Dialog aus genau dieser
     Stelle wachsen und beim Schließen dorthin zurückschrumpfen (FLIP mit der Web Animations API).
     Ohne sichtbaren Ursprung (Adresse, ⌘K) bleibt es beim Einblenden aus der Mitte. */
  let dlgOrigin = null;
