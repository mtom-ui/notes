  function exportJson(){
    setSettingsOpen(false);
    const data = { app:"notes", version:2, exportedAt: new Date().toISOString(), folders: store.folders, notes: store.notes,
                   tickets: store.tickets, ticketSeries: store.ticketSeries };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "notes-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
  }
  // Merges a backup into the current data: unknown ids are added, known ones only replaced when newer.
  function importJson(file){
    const reader = new FileReader();
    reader.onload = ()=>{
      let data;
      try{ data = JSON.parse(reader.result); }catch(e){ alert("Die Datei ist kein gültiges JSON."); return; }
      if(!data || !Array.isArray(data.notes) || !Array.isArray(data.folders)){ alert("Das ist keine Notes-Sicherung."); return; }
      let added = 0, updated = 0;
      data.folders.forEach(f=>{
        if(!f || !f.id) return;
        const local = store.folders.find(x=>x.id===f.id);
        if(!local){ store.folders.push({ id:f.id, name:f.name||"Ordner", parentId:f.parentId||null, collapsed:!!f.collapsed, updatedAt:f.updatedAt||Date.now() }); added++; }
        else if((f.updatedAt||0) > (local.updatedAt||0)){ Object.assign(local, { name:f.name, parentId:f.parentId||null, collapsed:!!f.collapsed, updatedAt:f.updatedAt }); updated++; }
      });
      const incomingTickets = Array.isArray(data.tickets) ? data.tickets.slice() : [];
      data.notes.forEach(n=>{
        if(!n || !n.id) return;
        // a backup from before 3.0.0: its task-notes come in as tickets
        if(n.props && n.props.type === "task"){
          const { ticket, series } = taskNoteToTicket(n);
          incomingTickets.push(ticket);
          if(series && !seriesById(series.id)){ store.ticketSeries.push(series); added++; }
          return;
        }
        const local = store.notes.find(x=>x.id===n.id);
        if(!local){ store.notes.push({ id:n.id, folderId:n.folderId||null, text:n.text||"", createdAt:n.createdAt||Date.now(), updatedAt:n.updatedAt||Date.now(), props:n.props||undefined }); added++; }
        else if((n.updatedAt||0) > (local.updatedAt||0)){ if(local.text !== n.text) snapshotVersion(local, "vor Import"); Object.assign(local, { folderId:n.folderId||null, text:n.text||"", updatedAt:n.updatedAt, props:n.props||local.props }); updated++; }
      });
      incomingTickets.forEach(t=>{
        if(!t || !t.id) return;
        t = Object.assign(newTicket(), t, { kind:"ticket" });
        const local = ticketById(t.id);
        if(!local){ store.tickets.push(t); added++; }
        else if((t.updatedAt||0) > (local.updatedAt||0)){ Object.assign(local, t); updated++; }
      });
      (Array.isArray(data.ticketSeries) ? data.ticketSeries : []).forEach(x=>{
        if(!x || !x.id) return;
        const local = seriesById(x.id);
        if(!local){ store.ticketSeries.push(x); added++; }
        else if((x.updatedAt||0) > (local.updatedAt||0)){ Object.assign(local, x); updated++; }
      });
      save(); renderTree(); updateBoardCount();
      if(currentNote) selectNote(currentNote.id); else if(store.notes.length) selectNote(store.notes[0].id);
      alert(added + " neu, " + updated + " aktualisiert.");
    };
    reader.readAsText(file);
  }
  document.getElementById("import-file").addEventListener("change", (e)=>{
    const f = e.target.files[0];
    if(f) importJson(f);
    e.target.value = "";
  });

  /* ---------------- Account & sync (Supabase, plain fetch – no SDK) ----------------
     Config (project URL + anon key) and the session live in their own localStorage keys.
     Sync is last-write-wins per note/folder via updatedAt; deletions are tombstones
     (deleted_at) so they reach other devices. Pull first, then push. */
  const SYNC_CFG_KEY = "mdnotes.sync.cfg", SYNC_SESSION_KEY = "mdnotes.sync.session", SYNC_STATE_KEY = "mdnotes.sync.state";
  function readJson(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
  function writeJson(k, v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  const sync = {
    cfg: readJson(SYNC_CFG_KEY),
    session: readJson(SYNC_SESSION_KEY),
    state: readJson(SYNC_STATE_KEY) || { lastPull:0, known:{} },
    status:"off", message:"", timer:null, busy:false, again:false,
    ui: { email:"", codeSent:false, info:"", error:"" }
  };
  let lastEditAt = 0;
  const syncDot = document.getElementById("sync-dot");
  let live = null;                                  // Live-Verbindung (Phase 4), angelegt nach syncNow

  function syncEnabled(){ return !!(sync.cfg && sync.cfg.url && sync.cfg.key && sync.session); }
  function setSyncStatus(status, message){
    sync.status = status; sync.message = message || "";
    syncDot.className = "sync-dot " + (status === "off" ? "" : status);
    const label = ({ idle:"Synchronisiert", pending:"Änderungen ausstehend", syncing:"Synchronisiere…", error:"Sync-Fehler" }[status] || "") +
      (status === "idle" && live && live.state() === "live" ? " · live" : "");
    syncDot.title = label + (message ? " – " + message : "");
    const st = document.getElementById("sync-status");
    if(st){ st.textContent = label + (message ? ": " + message : ""); st.className = "hint" + (status === "error" ? " error" : status === "idle" ? " ok" : ""); }
  }
  function saveSyncState(){ writeJson(SYNC_STATE_KEY, sync.state); }

  function normalizeSupabaseUrl(url){
    return url.trim().replace(/\/(rest|auth|storage|realtime|functions)\/v1.*$/i, "").replace(/\/+$/, "");
  }
  function baseUrl(){ return normalizeSupabaseUrl(sync.cfg.url); }
  async function apiFetch(path, opts){
    opts = opts || {};
    if(sync.session && sync.session.expires_at - Date.now() < 60000) await refreshSession();
    const headers = Object.assign({ "apikey": sync.cfg.key, "Content-Type": "application/json" }, opts.headers || {});
    if(sync.session && !opts.noAuth) headers["Authorization"] = "Bearer " + sync.session.access_token;
    const res = await fetch(baseUrl() + path, { method: opts.method || "GET", headers, body: opts.body });
    if(!res.ok){
      let msg = res.status + "";
      try{ const j = await res.json(); msg += " " + (j.msg || j.message || j.error_description || j.error || j.hint || JSON.stringify(j)).slice(0,160); }catch(e){}
      throw new Error(msg);
    }
    if(res.status === 204) return null;
    const ct = res.headers.get("content-type") || "";
    return ct.includes("json") ? res.json() : res.text();
  }
  const IMAGE_BUCKET = "note-images";
  const IMAGE_MAX_BYTES = 20 * 1024 * 1024;
  // Der eigene User-ID-Teil des JWT (Supabase's "sub"-Claim) — für den Upload-Pfad, der laut
  // Storage-Policy im ersten Ordnersegment genau dieser ID entsprechen muss (siehe schema.sql).
  function jwtSub(token){
    try{
      const b64 = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
      const json = decodeURIComponent(atob(b64).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
      return JSON.parse(json).sub;
    }catch(e){ return null; }
  }
  async function uploadImageToStorage(file){
    if(!syncEnabled()) throw new Error("Bilder brauchen ein verbundenes Konto (Einstellungen → Konto & Sync)");
    if(file.size > IMAGE_MAX_BYTES) throw new Error("Datei größer als " + Math.round(IMAGE_MAX_BYTES/1024/1024) + " MB");
    if(sync.session.expires_at - Date.now() < 60000) await refreshSession();
    const uid_ = jwtSub(sync.session.access_token);
    if(!uid_) throw new Error("Nutzer-ID nicht ermittelbar — bitte neu anmelden");
    const ext = (file.name.match(/\.[a-zA-Z0-9]+$/) || [".jpg"])[0].toLowerCase().replace(/[^a-z0-9.]/g,"");
    const path = uid_ + "/" + Date.now().toString(36) + Math.random().toString(36).slice(2,8) + ext;
    await apiFetch("/storage/v1/object/" + IMAGE_BUCKET + "/" + path, {
      method:"POST", headers:{ "Content-Type": file.type || "application/octet-stream" }, body: file
    });
    return baseUrl() + "/storage/v1/object/public/" + IMAGE_BUCKET + "/" + path;
  }
  function setSession(s, email){
    sync.session = {
      access_token: s.access_token, refresh_token: s.refresh_token,
      expires_at: Date.now() + ((s.expires_in || 3600) * 1000),
      email: email || (s.user && s.user.email) || (sync.session && sync.session.email) || ""
    };
    writeJson(SYNC_SESSION_KEY, sync.session);
  }
  async function refreshSession(){
    const res = await fetch(baseUrl() + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST", headers:{ "apikey": sync.cfg.key, "Content-Type":"application/json" },
      body: JSON.stringify({ refresh_token: sync.session.refresh_token })
    });
    if(!res.ok){ logout(true); throw new Error("Sitzung abgelaufen – bitte neu anmelden."); }
    setSession(await res.json());
  }
  async function sendLoginCode(email){
    await apiFetch("/auth/v1/otp", { method:"POST", noAuth:true, body: JSON.stringify({ email, create_user:true }) });
  }
  async function verifyLoginCode(email, token){
    const s = await apiFetch("/auth/v1/verify", { method:"POST", noAuth:true, body: JSON.stringify({ type:"email", email, token }) });
    setSession(s, email);
    sync.state = { lastPull:0, known:{} };     // fresh account view: pull everything, push everything local
    saveSyncState();
    if(live) live.start();
  }
  function logout(silent){
    if(sync.session && !silent){ apiFetch("/auth/v1/logout", { method:"POST" }).catch(()=>{}); }
    sync.session = null; writeJson(SYNC_SESSION_KEY, null);
    sync.state = { lastPull:0, known:{} }; saveSyncState();
    if(live) live.stop();
    setSyncStatus("off");
    renderAccount();
  }

  function scheduleSync(){
    if(!syncEnabled()) return;
    setSyncStatus("pending");
    clearTimeout(sync.timer);
    sync.timer = setTimeout(syncNow, 1500);
  }
  async function syncNow(){
    if(!syncEnabled()) return;
    if(sync.busy){ sync.again = true; return; }
    sync.busy = true;
    setSyncStatus("syncing");
    try{
      sync.got = false;
      await pullChanges();
      const dirty = hasLocalChanges();
      await pushChanges();
      setTimeout(()=> sync.got ? syncPulse("got") : dirty && syncPulse("saved"), 0);
      setSyncStatus("idle", sync.legacy ? "alte DB-Struktur – Migration aus schema.sql ausführen"
                          : sync.noTickets ? "Tickets nur lokal – Tabellen fehlen, supabase/schema.sql ausführen"
                          : sync.noActivity ? "Ticket-Verlauf nur lokal – Spalte fehlt, supabase/schema.sql erneut ausführen" : "");
    }catch(e){
      setSyncStatus("error", e.message);
    }finally{
      sync.busy = false;
      if(sync.again){ sync.again = false; scheduleSync(); }
    }
  }

  /* Tickets und Serien liegen in eigenen Tabellen (tickets, ticket_series). Fehlen die noch — schema.sql
     nicht ausgeführt —, bleiben Tickets lokal und alles andere synct normal weiter. Die alten
     Aufgaben-Notizen auf dem Server bekommen ihren Tombstone erst, wenn das Ticket dazu drüben
     angekommen ist; vorher geht nichts verloren. */
  function isMissingTable(e){ return /^404|PGRST20[45]|schema cache|does not exist/i.test(e.message || ""); }
  function ticketRow(t){
    return { id:t.id, title: noteTitle(t), description: ticketDescription(t), status: t.status, due: t.due || null, tags: t.tags,
             series_id: t.seriesId || null, subtasks: t.subtasks, updates: t.updates, activity: t.activity || [], created_at: t.createdAt || Date.now(),
             updated_at: t.updatedAt || 1, done_at: t.doneAt || null, deleted_at: null, source: t.source || null, edited_by: t.editedBy || null };
  }
  function ticketFromRow(r){
    return { kind:"ticket", id: r.id, text: (r.title || "") + "\n\n" + (r.description || ""), status: r.status || "Offen", due: r.due || "",
             tags: Array.isArray(r.tags) ? r.tags : [], seriesId: r.series_id || null, subtasks: Array.isArray(r.subtasks) ? r.subtasks : [],
             updates: Array.isArray(r.updates) ? r.updates : [], activity: Array.isArray(r.activity) ? r.activity : [],
             doneAt: r.done_at || null, createdAt: r.created_at, updatedAt: r.updated_at,
             source: r.source || undefined, editedBy: r.edited_by || undefined };
  }
  function seriesRow(x){
    return { id:x.id, title:x.title || "", description:x.description || "", tags:x.tags || [], freq:x.freq, interval: x.interval || 1,
             weekdays: x.weekdays && x.weekdays.length ? x.weekdays : null, day_of_month: x.dayOfMonth || null, start_date: x.startDate,
             end_date: x.endDate || null, next_due: x.nextDue || null, active: !!x.active, created_at: x.createdAt || Date.now(),
             updated_at: x.updatedAt || 1, deleted_at: null };
  }
  function seriesFromRow(r){
    return { id:r.id, title:r.title || "", description:r.description || "", tags: Array.isArray(r.tags) ? r.tags : [], freq:r.freq,
             interval: r.interval || 1, weekdays: Array.isArray(r.weekdays) ? r.weekdays : null, dayOfMonth: r.day_of_month || null,
             startDate: r.start_date, endDate: r.end_date || null, nextDue: r.next_due || null, active: r.active !== false,
             createdAt: r.created_at, updatedAt: r.updated_at };
  }
  async function upsertRows(table, rows){
    for(let i = 0; i < rows.length; i += 200)
      await apiFetch("/rest/v1/" + table + "?on_conflict=user_id,id", { method:"POST", headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows.slice(i, i + 200)) });
  }

  async function pushChanges(){
    const known = sync.state.known, now = Date.now();
    const notes = store.notes.filter(n => (known["n:"+n.id] || 0) < (n.updatedAt || 1));
    const folders = store.folders.filter(f => (known["f:"+f.id] || 0) < (f.updatedAt || 1));
    if(folders.length){
      // sort (manuelle Reihenfolge, 3.35.0) nur, solange die Spalte existiert — sonst ohne weiter synchronisieren
      const frows = folders.map(f=>{ const r = { id:f.id, parent_id:f.parentId||null, name:f.name, collapsed:!!f.collapsed, updated_at:f.updatedAt||1, deleted_at:null };
        if(!sync.noSort) r.sort = typeof f.sort === "number" ? f.sort : null; return r; });
      const postF = () => apiFetch("/rest/v1/folders?on_conflict=user_id,id", { method:"POST", headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(frows) });
      try{ await postF(); }
      catch(e){ if(sync.noSort || !/sort/i.test(e.message)) throw e; sync.noSort = true; frows.forEach(r => delete r.sort); await postF(); }
      folders.forEach(f => known["f:"+f.id] = f.updatedAt || 1);
    }
    if(notes.length){
      const rows = notes.map(n=>{
        const r = { id:n.id, folder_id:n.folderId||null, text:n.text, created_at:n.createdAt||now, updated_at:n.updatedAt||1, deleted_at:null };
        if(!sync.legacy){ r.source = n.source || null; r.edited_by = n.editedBy || null; r.props = n.props || null; }
        if(!sync.noSort) r.sort = typeof n.sort === "number" ? n.sort : null;
        return r;
      });
      try{
        await apiFetch("/rest/v1/notes?on_conflict=user_id,id", { method:"POST", headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
      }catch(e){
        // Spalte sort fehlt noch (SQL aus schema.sql nicht ausgeführt): ohne sie erneut senden
        if(!sync.noSort && /sort/i.test(e.message)){
          sync.noSort = true;
          rows.forEach(r => delete r.sort);
          await apiFetch("/rest/v1/notes?on_conflict=user_id,id", { method:"POST", headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
        // schema without source/edited_by columns (migration not run yet): retry without them
        } else if(!sync.legacy && /column|source|edited_by/i.test(e.message)){
          sync.legacy = true;
          rows.forEach(r => { delete r.source; delete r.edited_by; delete r.props; });
          await apiFetch("/rest/v1/notes?on_conflict=user_id,id", { method:"POST", headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
        } else throw e;
      }
      notes.forEach(n => known["n:"+n.id] = n.updatedAt || 1);
    }
    if(!sync.noTickets){
      try{
        const series = store.ticketSeries.filter(x => (known["s:"+x.id] || 0) < (x.updatedAt || 1));
        if(series.length){ await upsertRows("ticket_series", series.map(seriesRow)); series.forEach(x => known["s:"+x.id] = x.updatedAt || 1); }
        const tickets = store.tickets.filter(t => (known["t:"+t.id] || 0) < (t.updatedAt || 1));
        if(tickets.length){
          // the "activity" column came after the tables (schema.sql re-run adds it); until then, sync without it
          const rows = tickets.map(t => { const r = ticketRow(t); if(sync.noActivity) delete r.activity; return r; });
          try{ await upsertRows("tickets", rows); }
          catch(e){
            if(sync.noActivity || !/activity/i.test(e.message)) throw e;
            sync.noActivity = true;
            rows.forEach(r => delete r.activity);
            await upsertRows("tickets", rows);
          }
          tickets.forEach(t => known["t:"+t.id] = t.updatedAt || 1);
        }
      }catch(e){
        if(!isMissingTable(e)) throw e;
        sync.noTickets = true;
      }
    }
    // tombstones for things deleted locally since the last push
    const live = { n: new Set(store.notes.map(n=>n.id)), f: new Set(store.folders.map(f=>f.id)),
                   t: new Set(store.tickets.map(t=>t.id)), s: new Set(store.ticketSeries.map(x=>x.id)) };
    const tables = { n:"notes", f:"folders", t:"tickets", s:"ticket_series" };
    for(const key of Object.keys(known)){
      const kind = key[0], id = key.slice(2);
      if(!tables[kind] || live[kind].has(id)) continue;
      if((kind === "t" || kind === "s") && sync.noTickets) continue;
      // an old task-note that became a ticket: only retire it once the ticket is safely on the server
      if(kind === "n" && live.t.has(id) && !known["t:"+id]) continue;
      await apiFetch("/rest/v1/" + tables[kind] + "?id=eq." + encodeURIComponent(id), { method:"PATCH",
        headers:{ "Prefer":"return=minimal" }, body: JSON.stringify({ deleted_at: now, updated_at: now }) });
      delete known[key];
    }
    saveSyncState();
  }

  async function pullChanges(){
    const since = sync.state.lastPull, known = sync.state.known;
    const q = "?select=*&updated_at=gt." + since + "&order=updated_at.asc";
    const [folders, notes] = await Promise.all([ apiFetch("/rest/v1/folders" + q), apiFetch("/rest/v1/notes" + q) ]);
    // own cursor for tickets: rows written before the tables existed here (migration script, another
    // device) must still arrive once they do
    const sinceT = sync.state.lastPullTickets || 0, qt = "?select=*&updated_at=gt." + sinceT + "&order=updated_at.asc";
    let tickets = [], series = [];
    try{
      [tickets, series] = await Promise.all([ apiFetch("/rest/v1/tickets" + qt), apiFetch("/rest/v1/ticket_series" + qt) ]);
      sync.noTickets = false;
    }catch(e){
      if(!isMissingTable(e)) throw e;
      sync.noTickets = true;
    }
    let maxTs = since, maxT = sinceT, changed = false, currentChanged = false;
    folders.forEach(r=>{
      maxTs = Math.max(maxTs, r.updated_at);
      const local = store.folders.find(f=>f.id===r.id);
      if(r.deleted_at){
        if(local && (local.updatedAt||0) <= r.updated_at){ store.folders = store.folders.filter(f=>f.id!==r.id); delete known["f:"+r.id]; changed = true; }
        return;
      }
      if(!local){ store.folders.push({ id:r.id, name:r.name, parentId:r.parent_id, collapsed:!!r.collapsed, updatedAt:r.updated_at, sort: typeof r.sort === "number" ? r.sort : undefined }); changed = true; }
      else if((local.updatedAt||0) < r.updated_at){ Object.assign(local, { name:r.name, parentId:r.parent_id, collapsed:!!r.collapsed, updatedAt:r.updated_at, sort: typeof r.sort === "number" ? r.sort : undefined }); changed = true; }
      else return;
      known["f:"+r.id] = r.updated_at;
    });
    const applyTicket = (t)=>{
      const local = ticketById(t.id);
      if(!local){ store.tickets.push(t); return true; }
      if((local.updatedAt||0) >= t.updatedAt) return false;
      if(local.text !== t.text) snapshotVersion(local, t.editedBy === "claude" ? "vor Claude-Änderung" : "vor Sync");
      Object.assign(local, t);
      if(local === currentNote) currentChanged = true;
      return true;
    };
    notes.forEach(r=>{
      maxTs = Math.max(maxTs, r.updated_at);
      // a task-note from an older app or MCP version: it arrives as a ticket, and the note row is
      // remembered so it gets its tombstone once the ticket is on the server
      if(r.props && r.props.type === "task"){
        if(r.deleted_at){ delete known["n:"+r.id]; return; }   // retired by the migration; the ticket lives on
        const { ticket, series: tpl } = taskNoteToTicket({ id:r.id, folderId:r.folder_id, text:r.text, createdAt:r.created_at, updatedAt:r.updated_at, source:r.source||undefined, editedBy:r.edited_by||undefined, props:r.props });
        if(applyTicket(ticket)) changed = true;
        if(tpl && !seriesById(tpl.id)){ store.ticketSeries.push(tpl); changed = true; }
        store.notes = store.notes.filter(n => n.id !== r.id);
        known["n:"+r.id] = r.updated_at;
        return;
      }
      const local = store.notes.find(n=>n.id===r.id);
      if(r.deleted_at){
        if(local && (local.updatedAt||0) <= r.updated_at){
          store.notes = store.notes.filter(n=>n.id!==r.id); delete known["n:"+r.id]; changed = true;
          if(currentNote && currentNote.id === r.id) closeDialog();
        }
        else if(!local) delete known["n:"+r.id];
        return;
      }
      if(!local){ store.notes.push({ id:r.id, folderId:r.folder_id, text:r.text, createdAt:r.created_at, updatedAt:r.updated_at, source:r.source||undefined, editedBy:r.edited_by||undefined, props:r.props||undefined, sort: typeof r.sort === "number" ? r.sort : undefined }); changed = true; }
      else if((local.updatedAt||0) < r.updated_at){
        if(local.text !== r.text) snapshotVersion(local, r.edited_by === "claude" ? "vor Claude-Änderung" : "vor Sync");
        Object.assign(local, { folderId:r.folder_id, text:r.text, updatedAt:r.updated_at, source:r.source||local.source, editedBy:r.edited_by||local.editedBy, props:r.props||local.props, sort: typeof r.sort === "number" ? r.sort : undefined });
        changed = true;
        if(local === currentNote) currentChanged = true;
      }
      else return;
      known["n:"+r.id] = r.updated_at;
    });
    series.forEach(r=>{
      maxT = Math.max(maxT, r.updated_at);
      const local = seriesById(r.id);
      if(r.deleted_at){
        if(local && (local.updatedAt||0) <= r.updated_at){ store.ticketSeries = store.ticketSeries.filter(x => x !== local); delete known["s:"+r.id]; changed = true; }
        return;
      }
      if(!local) store.ticketSeries.push(seriesFromRow(r));
      else if((local.updatedAt||0) < r.updated_at) Object.assign(local, seriesFromRow(r));
      else return;
      changed = true;
      known["s:"+r.id] = r.updated_at;
    });
    tickets.forEach(r=>{
      maxT = Math.max(maxT, r.updated_at);
      const local = ticketById(r.id);
      if(r.deleted_at){
        if(local && (local.updatedAt||0) <= r.updated_at){
          store.tickets = store.tickets.filter(t => t !== local); delete known["t:"+r.id]; changed = true;
          if(currentNote === local) closeDialog();
        }
        return;
      }
      if(!applyTicket(ticketFromRow(r))) return;
      changed = true;
      known["t:"+r.id] = r.updated_at;
    });

    if(!sync.noTickets) sync.state.lastPullTickets = maxT;

  /* ---------------- ZIP ohne Fremdbibliothek (nur „gespeichert", keine Kompression) ----------------
     Reicht für Text: .md-Dateien sind klein, und jeder Zip-Reader liest STORED-Einträge normal. */
  function crc32Table(){
    const t = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  }
  const CRC_TABLE = crc32Table();
  function crc32(bytes){
    let c = 0xFFFFFFFF;
    for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zU16(n){ return new Uint8Array([n & 0xFF, (n>>>8) & 0xFF]); }
  function zU32(n){ return new Uint8Array([n & 0xFF, (n>>>8) & 0xFF, (n>>>16) & 0xFF, (n>>>24) & 0xFF]); }
  function buildZip(files){
    const enc = new TextEncoder(), now = new Date();
    const time = (now.getHours()<<11) | (now.getMinutes()<<5) | (now.getSeconds()>>1);
    const date = ((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate();
    const localParts = [], centralParts = [];
    let offset = 0;
    files.forEach(f=>{
      const nameBytes = enc.encode(f.name), dataBytes = enc.encode(f.data), crc = crc32(dataBytes);
      const local = [zU32(0x04034b50), zU16(20), zU16(0x0800), zU16(0), zU16(time), zU16(date),
        zU32(crc), zU32(dataBytes.length), zU32(dataBytes.length), zU16(nameBytes.length), zU16(0), nameBytes, dataBytes];
      localParts.push(...local);
      centralParts.push(zU32(0x02014b50), zU16(20), zU16(20), zU16(0x0800), zU16(0), zU16(time), zU16(date),
        zU32(crc), zU32(dataBytes.length), zU32(dataBytes.length), zU16(nameBytes.length), zU16(0), zU16(0), zU16(0), zU16(0), zU32(0),
        zU32(offset), nameBytes);
      offset += local.reduce((a,x)=>a+x.length, 0);
    });
    const centralSize = centralParts.reduce((a,x)=>a+x.length, 0);
    const eocd = [zU32(0x06054b50), zU16(0), zU16(0), zU16(files.length), zU16(files.length), zU32(centralSize), zU32(offset), zU16(0)];
    return new Blob([...localParts, ...centralParts, ...eocd], { type:"application/zip" });
  }
  // Notizen als Ordnerstruktur (Ordner → Unterordner → Titel.md), Tickets gesammelt in „Tickets/" —
  // ein Zip statt echter Ordner, weil ein file://-geöffnetes Tab keinen Ordner aufs Dateisystem
  // schreiben kann; Namensdopplungen im selben Ordner bekommen „ (2)“, „ (3)“ usw. angehängt.
  function exportMarkdownFolder(){
    setSettingsOpen(false);
    const files = [], used = new Set();
    function uniquePath(parts, base){
      let name = base, i = 2, full = parts.concat(name + ".md").join("/");
      while(used.has(full)){ name = base + " (" + i + ")"; i++; full = parts.concat(name + ".md").join("/"); }
      used.add(full);
      return full;
    }
    function pathPartsFor(folderId){
      const parts = [];
      let f = store.folders.find(x=>x.id===folderId);
      while(f){ parts.unshift(safeFileName(f.name)); f = store.folders.find(x=>x.id===f.parentId); }
      return parts;
    }
    store.notes.forEach(n=>{
      files.push({ name: uniquePath(pathPartsFor(n.folderId), safeFileName(noteTitle(n))), data: n.text });
    });
    store.tickets.forEach(t=>{
      let body = "**Status:** " + t.status + (t.due ? " · **Fällig:** " + fmtDueLong(t.due) : "") +
                 (t.tags.length ? " · **Kürzel:** " + t.tags.join(", ") : "") + "\n\n" + ticketDescription(t);
      if(t.subtasks.length) body += "\n\n## Unteraufgaben\n" + t.subtasks.map(x => "- [" + (x.done?"x":" ") + "] " + x.text).join("\n");
      if(t.updates.length) body += "\n\n## Updates\n" + t.updates.slice().sort((a,b)=>a.ts-b.ts).map(u => "**" + fmtUpdateStamp(u.ts) + "** — " + u.text).join("\n\n");
      files.push({ name: uniquePath(["Tickets"], safeFileName(noteTitle(t))), data: noteTitle(t) + "\n\n" + body });
    });
    const blob = buildZip(files);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "notes-" + new Date().toISOString().slice(0,10) + ".zip";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
  }

    } else if(e.key === "Escape" && currentNote && !e.defaultPrevented && !linkPopOpen()){
      e.preventDefault(); requestClose();
    }
  });

  /* ---------------- Second brain: inbox, home, palette, mentions, versions, previews ---------------- */
  function ensureFolder(name, parentId){
    parentId = parentId || null;
    let f = store.folders.find(x => (x.parentId||null) === parentId && x.name.toLowerCase() === name.toLowerCase());
    if(!f){
      f = { id: uid(), name, parentId, collapsed:false, updatedAt: Date.now() };
      store.folders.push(f);
      save();
    }
    return f;
  }
  /* ---------------- Vorlagen: jede Notiz im Ordner „Vorlagen" ist eine Vorlage ---------------- */
  const templatePop = document.getElementById("template-pop");
  const templateBtn = document.getElementById("btn-new-template");
  function templateNotes(){
    const f = store.folders.find(x => !x.parentId && x.name.toLowerCase() === "vorlagen");
    if(!f) return [];
    return store.notes.filter(n => n.folderId === f.id).sort((a,b) => noteTitle(a).localeCompare(noteTitle(b), "de"));
  }
  function renderTemplatePop(){
    const list = templateNotes();
    templatePop.innerHTML =
      (list.length
        ? list.map(n => '<div class="opt" data-use-template="' + n.id + '">' + noteSvg() + '<span>' + escapeHtml(noteTitle(n)) + '</span></div>').join("")
        : '<div style="padding:10px 8px;color:var(--text-faint);font-size:var(--fs-s);line-height:1.5">Noch keine Vorlagen. Lege eine Notiz im Ordner „Vorlagen" an, dann erscheint sie hier zur Auswahl.</div>') +
      '<div class="opt" data-new-template="1" style="color:var(--accent);margin-top:4px;border-top:1px solid var(--border);padding-top:8px"><span>+ Neue Vorlage anlegen</span></div>';
  }
  function setTemplatePopOpen(open){
    templatePop.classList.toggle("open", open);
    if(open) renderTemplatePop();
  }
  templateBtn.addEventListener("click", (e)=>{ e.stopPropagation(); setTemplatePopOpen(!templatePop.classList.contains("open")); });
  templatePop.addEventListener("click", (e)=>{
    const use = e.target.closest("[data-use-template]");
    if(use){
      const tpl = store.notes.find(n => n.id === use.dataset.useTemplate);
      setTemplatePopOpen(false);
      if(!tpl) return;
      // Landet man gerade selbst im Ordner „Vorlagen" (z. B. beim Bearbeiten einer Vorlage), soll die
      // neue Notiz daraus nicht dort hinein, sondern auf die Hauptebene.
      const targetFolderId = currentNote && currentNote.folderId !== tpl.folderId ? currentNote.folderId : null;
      const note = { id: uid(), folderId: targetFolderId, createdAt: Date.now(), updatedAt: Date.now(), text: tpl.text };
      store.notes.unshift(note);
      save(); renderTree(); selectNote(note.id);
      return;
    }
    if(e.target.closest("[data-new-template]")){ setTemplatePopOpen(false); createNote(ensureFolder("Vorlagen").id); }
  });

  function localDateKey(d){
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  const toastEl = document.getElementById("toast");
  let toastTimer = null, toastAction = null;
  // opts: { ms, actionLabel, onAction } — an action gives the toast more time by default so
  // there's a real chance to click it (e.g. "Rückgängig" after a delete).
  function toast(msg, opts){
    opts = opts || {};
    toastEl.innerHTML = escapeHtml(msg) + (opts.actionLabel ? '<span class="toast-action">' + escapeHtml(opts.actionLabel) + '</span>' : "");
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastAction = opts.onAction || null;
    toastTimer = setTimeout(()=>{ toastEl.classList.remove("on"); toastAction = null; }, opts.ms || (opts.actionLabel ? 5000 : 3200));
  }
  toastEl.addEventListener("click", (e)=>{
    if(!e.target.closest(".toast-action") || !toastAction) return;
    const fn = toastAction;
    toastAction = null;
    clearTimeout(toastTimer);
    toastEl.classList.remove("on");
    fn();
  });

  function relTime(ts){
    const d = Date.now() - ts;
    if(d < 60000) return "gerade eben";
    if(d < 3600000) return "vor " + Math.round(d/60000) + " Min.";
    if(d < 86400000) return "vor " + Math.round(d/3600000) + " Std.";
    if(d < 7*86400000) return "vor " + Math.round(d/86400000) + " Tagen";
    return new Date(ts).toLocaleDateString("de-DE");
  }
  function folderPathOf(folderId){
    const parts = [];
    let f = store.folders.find(x=>x.id===folderId);
    while(f){ parts.unshift(f.name); f = store.folders.find(x=>x.id===f.parentId); }
    return parts.join(" / ");
  }
  const VIEW_MODES = ["board", "tickets", "plan", "series", "notes", "trash", "archive", "abschluss"];
  const VIEW_TITLES = { board:"Board", tickets:"Board", plan:"Planen", series:"Serien", notes:"Ordner", trash:"Papierkorb", archive:"Archiv", abschluss:"Tagesabschluss" };
  function setView(mode){
    if(!document.body.classList.contains(mode + "-mode")){ flipHold = true; setTimeout(()=>{ flipHold = false; }, 0); }
    document.body.classList.remove(...VIEW_MODES.map(m => m + "-mode"));
    document.body.classList.add(mode + "-mode");
    viewTitleEl.textContent = VIEW_TITLES[mode];
    syncSidebar();
  }
  /* Wechsel zwischen Ansichten aus der Seitenleiste mit View Transition (siehe CSS). Nur wenn keine Notiz
     und kein Ticket offen ist — die haben eigene Animationen — und nie während der Adress-Navigation. */
  function cardCollapsing(){ return !!document.querySelector(".kcard.completing:not(.collapsed), .pcard.completing:not(.collapsed), .trow.completing:not(.collapsed)"); }
  // Klappt gerade eine erledigte Karte ein, warten die Ticket-Ansichten damit, sonst wäre sie mitten
  // in der Animation weg (passiert z. B., wenn ⌘⏎ den Dialog schließt).
  function renderCurrentView(){ if(cardCollapsing()) rerenderTaskViewsWhenSettled(); else renderTicketViews(); renderTrash(); renderTree(); }
  function leaveNote(mode){
    if(!closeDialog()) return;
    setView(mode);
    renderTree();
  }
  // Board und Tickets teilen sich eine Zeile in der Seitenleiste (dieselben Daten, zwei Ansichten —
  // die Kanban/Liste-Pille schaltet innerhalb schon um). Welche der beiden zuletzt offen war, merkt
  // sich die App, damit die Seitenleiste dort wieder hinführt.
  function rememberTicketsView(v){ store.ui = store.ui || {}; store.ui.ticketsView = v; save(); }
  function openBoardOrTickets(){ ((store.ui && store.ui.ticketsView) === "tickets") ? showTickets() : showBoard(); }
  function showBoard(){ leaveNote("board", "Board"); renderBoard(); pushRoute(); rememberTicketsView("board"); }
  function showPlan(){ leaveNote("plan", "Planen"); renderPlan(); pushRoute(); }
  function showTickets(opts){
    if(opts && "series" in opts) listSeries = opts.series || null;
    leaveNote("tickets", "Tickets"); renderTicketList(); pushRoute();
    rememberTicketsView("tickets");
  }
  function showSeries(focusId){
    leaveNote("series", "Serien"); renderSeriesView(); pushRoute();
    if(focusId){
      const card = seriesEl.querySelector('.scard[data-series="'+focusId+'"]');
      if(card){ card.scrollIntoView({ block:"center" }); flashRow(card); }
    }
  }
  function showTrash(){ leaveNote("trash", "Papierkorb"); renderTrash(); pushRoute(); }
  function showArchive(){ leaveNote("archive", "Archiv"); renderArchive(); pushRoute(); }
  function showAbschluss(){ leaveNote("abschluss", "Tagesabschluss"); renderAbschluss(); pushRoute(); }
  function showNotes(opts){
    if(opts && "folder" in opts){ notesFolder = opts.folder; if(notesFolder && notesFolder !== "root") expandToFolder(notesFolder); }
    leaveNote("notes"); pushRoute();
  }

  /* ---------------- Zurück / Vor ----------------
     Läuft über den echten Browser-Verlauf: Jeder Wechsel (Notiz, Board, Planen, Papierkorb) ist ein
     Eintrag. Dadurch funktionieren ⌘[ / ⌘], die Seitentasten der Maus, das Wischen auf dem Trackpad und
     die Pfeile des Browsers gleichermaßen — und die Adresse trägt die Ansicht (#note/…), sodass man nach
     dem Neuladen wieder dort landet, wo man war. Ein frisch geöffneter Tab ohne Adresse startet weiter
     auf dem Board. */
  const backBtn = document.getElementById("btn-back"), fwdBtn = document.getElementById("btn-forward");
  let routing = false;                     // a history step is being applied: don't record it again
  function currentRoute(){
    if(currentNote) return (isTicket(currentNote) ? "ticket/" : "note/") + currentNote.id;
    const b = document.body.classList;
    return VIEW_MODES.find(m => b.contains(m + "-mode")) || "board";
  }
  function navIndex(){ return (history.state && history.state.idx) || 0; }
  function navMax(){ try{ return parseInt(sessionStorage.getItem("notes.navMax"), 10) || 0; }catch(e){ return 0; } }
  function updateNavButtons(){
    backBtn.disabled = navIndex() <= 0;
    fwdBtn.disabled = navIndex() >= navMax();
  }
  function pushRoute(){
    if(routing) return;
    const route = currentRoute();
    if(history.state && history.state.route === route) return;
    const idx = navIndex() + 1;
    history.pushState({ route, idx }, "", "#" + route);
    try{ sessionStorage.setItem("notes.navMax", String(idx)); }catch(e){}   // a new step drops everything "forward"
    updateNavButtons();
  }
  function applyRoute(route){
    routing = true;
    try{
      const id = /^(note|ticket)\//.test(route) ? route.slice(route.indexOf("/") + 1) : null;
      if(id && itemById(id)) selectNote(id);
      else if(route === "plan") showPlan();
      else if(route === "tickets") showTickets();
      else if(route === "series") showSeries();
      else if(route === "notes") showNotes();
      else if(route === "trash") showTrash();
      else if(route === "archive") showArchive();
      else if(route === "abschluss") showAbschluss();
      else {
        showBoard();
        // a note deleted since: the entry now shows the Board, so it should say so too
        if(id) history.replaceState({ route: "board", idx: navIndex() }, "", "#board");
      }
    } finally { routing = false; }
  }
  window.addEventListener("popstate", (e)=>{
    applyRoute((e.state && e.state.route) || location.hash.slice(1) || "board");
    updateNavButtons();
  });
  backBtn.addEventListener("click", ()=>{ if(navIndex() > 0) history.back(); });
  fwdBtn.addEventListener("click", ()=>{ if(navIndex() < navMax()) history.forward(); });

  /* Wo man in einer Notiz war (Cursor, Scrollposition), für die laufende Sitzung. Zurück bringt einen
     genau dorthin. Beim ersten Öffnen steht die Ansicht oben und der Cursor am Ende des Titels — vorher
     stand er unsichtbar am Notizende, und der erste Tastendruck riss die Ansicht dorthin (im Test 6.880 px). */
  const notePositions = new Map();         // note id -> { caret, scroll }
  function trackNoteCaret(){
    if(!currentNote || document.activeElement !== editorEl) return;
    const pos = notePositions.get(currentNote.id) || {};
    pos.caret = getCaretOffset(editorEl);
    notePositions.set(currentNote.id, pos);
  }
  function rememberNotePosition(){
    if(!currentNote) return;
    const pos = notePositions.get(currentNote.id) || {};
    pos.scroll = editorWrap.scrollTop;
    if(pos.caret === undefined) pos.caret = 0;
    notePositions.set(currentNote.id, pos);
  }
  function restoreNotePosition(note){
    const pos = notePositions.get(note.id);
    editorWrap.scrollTop = pos ? (pos.scroll || 0) : 0;
    // no title yet: that's where typing starts
    if(!splitNote(note.text).title){ titleInputEl.focus({ preventScroll: true }); return; }
    editorEl.focus({ preventScroll: true });
    setCaretOffset(editorEl, pos ? Math.min(pos.caret || 0, edText().length) : 0);
  }

  /* ---- Wo bin ich? ---- */
  // Opening a note reveals it in the tree: collapsed parent folders open, the row scrolls into view.
  // (Collapsing the open note's folder afterwards still works — this only runs when a note is opened.)
  function expandToFolder(folderId){
    let f = folderId && store.folders.find(x => x.id === folderId), changed = false;
    while(f){
      if(f.collapsed){ f.collapsed = false; f.updatedAt = Date.now(); changed = true; }
      f = f.parentId && store.folders.find(x => x.id === f.parentId);
    }
    if(changed){ save(); renderTree(); }
  }
  function flashRow(row){ row.classList.remove("reveal"); void row.offsetWidth; row.classList.add("reveal"); }
  function revealFolder(folderId){
    if(document.body.classList.contains("sidebar-hidden")) setSidebarHidden(false);
    showNotes({ folder: folderId });
    const row = treeEl.querySelector('.row.folder[data-folder="'+folderId+'"]');
    if(row){ row.scrollIntoView({ block:"nearest" }); flashRow(row); }
  }
  // A ticket has no row in the tree; its home is the ticket list, so that is marked while one is open.
  function updateNavContext(){
    document.getElementById("nav-board").classList.toggle("context", isTicket(currentNote));
  }
  breadcrumbEl.addEventListener("click", (e)=>{
    const f = e.target.closest("[data-crumb-folder]");
    if(f){ revealFolder(f.dataset.crumbFolder); return; }
    if(e.target.closest("[data-crumb-root]")){ showNotes({ folder: "root" }); return; }
    if(e.target.closest('[data-crumb-view="tickets"]')) showTickets();
  });

  /* ---------------- Papierkorb: local snapshot on delete, restore, optional server lookup ----------------
     Deleting still removes the item from store.notes/folders exactly as before (so every existing
     view — Board, Planen, tags, search, sync's tombstone push — keeps working unmodified); this
     just ALSO keeps a local copy so the delete is undoable. Capped and pruned so it can't grow
     forever. A deletion made before this feature existed, or from another device, has no local
     snapshot — "Serverseitig gelöschte laden" fetches those from Supabase on demand instead. */
  const TRASH_LIMIT = 300, TRASH_MAX_AGE = 90 * 86400000;
  const trashEl = document.getElementById("trash");
  function pushTrash(kind, id, title, path, obj){
    store.trash = (store.trash || []).filter(t => !(t.kind === kind && t.id === id));
    const entry = { kind, id, title, path, deletedAt: Date.now(), data: JSON.parse(JSON.stringify(obj)) };
    store.trash.unshift(entry);
    const cutoff = Date.now() - TRASH_MAX_AGE;
    store.trash = store.trash.filter(t => t.deletedAt >= cutoff).slice(0, TRASH_LIMIT);
    return entry;
  }
  // Stellt mehrere Einträge auf einmal wieder her (Ordner-Löschung mit Inhalt) — Ordner zuerst und
  // in Abhängigkeitsreihenfolge, damit ein Kind-Ordner nicht kurzzeitig an die Wurzel umgehängt wird,
  // nur weil sein Eltern-Ordner in derselben Charge noch nicht dran war.
  function restoreTrashEntries(entries){
    const pending = entries.filter(e => e.kind === "folder");
    let progressed = true;
    while(pending.length && progressed){
      progressed = false;
      for(let i = pending.length - 1; i >= 0; i--){
        const folder = pending[i].data;
        if(folder.parentId && pending.some(p => p !== pending[i] && p.id === folder.parentId)) continue;
        restoreTrashEntry(pending[i]);
        pending.splice(i, 1);
        progressed = true;
      }
    }
    pending.forEach(restoreTrashEntry);
    entries.filter(e => e.kind === "note").forEach(restoreTrashEntry);
  }
  function renderTrashCount(){
    const n = (store.trash || []).length;
    document.getElementById("nav-trash-count").textContent = n || "";
  }
  function restoreTrashEntry(entry){
    // an old task-note from before tickets had their own place comes back as a ticket
    if(entry.kind === "note" && entry.data.props && entry.data.props.type === "task"){
      const { ticket, series } = taskNoteToTicket(entry.data);
      entry = Object.assign({}, entry, { kind:"ticket", data: ticket, _orig: entry });
      if(series && !seriesById(series.id)) store.ticketSeries.push(series);
    }
    if(entry.kind === "ticket"){
      if(!ticketById(entry.id)){
        const t = entry.data;
        t.updatedAt = Date.now(); t.editedBy = "user";
        store.tickets.unshift(t);
      }
      store.trash = (store.trash || []).filter(x => x !== entry && x !== entry._orig);
      save(); updateBoardCount(); renderTrash(); renderTrashCount();
      selectNote(entry.id);
      return;
    }
    if(entry.kind === "note"){
      if(store.notes.some(n => n.id === entry.id)) { /* already back (e.g. restored elsewhere) */ }
      else {
        const note = entry.data;
        if(note.folderId && !store.folders.some(f => f.id === note.folderId)) note.folderId = null;
        note.updatedAt = Date.now(); note.editedBy = "user";
        store.notes.unshift(note);
      }
    } else {
      if(!store.folders.some(f => f.id === entry.id)){
        const folder = entry.data;
        if(folder.parentId && !store.folders.some(f => f.id === folder.parentId)) folder.parentId = null;
        folder.updatedAt = Date.now();
        store.folders.push(folder);
      }
    }
    store.trash = (store.trash || []).filter(t => t !== entry);
    save(); renderTree(); renderTrash(); renderTrashCount();
    if(entry.kind === "note") selectNote(entry.id);
  }
  function purgeTrashEntry(entry){
    store.trash = (store.trash || []).filter(t => t !== entry);
    save(); renderTrash(); renderTrashCount();
  }
  function trashIcon(kind){
    if(kind === "ticket") return '<span class="task-dot ti-icon">'+CHECK_SVG+'</span>';
    return kind === "folder"
      ? '<svg viewBox="0 0 20 20" fill="none" class="ti-icon" width="16" height="16"><path d="M3 6a1 1 0 0 1 1-1h4l1.5 2H16a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>'
      : '<svg viewBox="0 0 20 20" fill="none" class="ti-icon" width="16" height="16"><path d="M6 3h6l4 4v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.4"/></svg>';
  }
  function renderTrash(){
    if(!document.body.classList.contains("trash-mode")) return;
    const items = (store.trash || []).slice().sort((a,b) => b.deletedAt - a.deletedAt);
    trashEl.innerHTML = '<div class="trash-inner">' +
      pageHead("Papierkorb", items.length + (items.length === 1 ? " Eintrag" : " Einträge") + " · jederzeit wiederherstellbar") +
      '<div class="home-grid" style="margin-bottom:14px"><div class="card wide" style="display:flex;align-items:center;gap:10px">' +
        '<div style="flex:1;color:var(--text-muted);font-size:var(--fs-s)">Hier landet alles, was du löschst — jederzeit wiederherstellbar. Löschungen von anderen Geräten oder von vor dieser Funktion stehen nicht automatisch hier.</div>' +
        (syncEnabled() ? '<button class="btn secondary" data-act="load-remote">Serverseitig gelöschte laden</button>' : '') +
      '</div></div>' +
      (items.length ? items.map(t =>
        '<div class="trash-item" data-kind="'+t.kind+'" data-id="'+escapeHtml(t.id)+'">' +
        '<div class="ti-top">' + trashIcon(t.kind) +
        '<div class="ti-meta"><div class="ti-title">'+escapeHtml(t.title || "(ohne Titel)")+'</div></div>' +
        '<div class="ti-when" data-rt="'+t.deletedAt+'">'+escapeHtml(relTime(t.deletedAt))+'</div>' +
        '</div>' +
        '<div class="ti-bottom">' +
        '<div class="ti-path">'+(t.kind === "folder" ? "Ordner" : t.kind === "ticket" ? "Ticket" : "Notiz")+(t.path && t.kind !== "ticket" ? " · " + escapeHtml(t.path) : "")+'</div>' +
        '<div class="ti-actions"><button data-act="restore">Wiederherstellen</button><button class="danger" data-act="purge">Entfernen</button></div>' +
        '</div>' +
        '</div>').join("")
       : emptyState("trash", "Papierkorb ist leer", "Gelöschtes bleibt hier, bis du es endgültig entfernst.")) +
      '</div>';
  }
  trashEl.addEventListener("click", (e)=>{
    const row = e.target.closest("[data-kind]");
    const act = e.target.closest("[data-act]");
    if(act && act.dataset.act === "load-remote"){ loadRemoteTrash(); return; }
    if(!row || !act) return;
    const entry = (store.trash || []).find(t => t.kind === row.dataset.kind && t.id === row.dataset.id);
    if(!entry) return;
    if(act.dataset.act === "restore") restoreTrashEntry(entry);
    else if(act.dataset.act === "purge") purgeTrashEntry(entry);
  });
  // On-demand: pull recently soft-deleted rows straight from Supabase (covers deletions this
  // local trash never saw — another device, or before this feature existed).
  async function loadRemoteTrash(){
    if(!syncEnabled()) return;
    try{
      const since = Date.now() - TRASH_MAX_AGE;
      const q = "?select=*&deleted_at=gt." + since + "&order=deleted_at.desc&limit=100";
      const [folders, notes, tickets] = await Promise.all([ sb_apiFetchTrash("folders", q), sb_apiFetchTrash("notes", q),
        sb_apiFetchTrash("tickets", q).catch(e => { if(isMissingTable(e)) return []; throw e; }) ]);
      const known = new Set((store.trash || []).map(t => t.kind + ":" + t.id));
      let added = 0;
      folders.forEach(r=>{
        if(known.has("folder:" + r.id) || store.folders.some(f => f.id === r.id)) return;
        store.trash.push({ kind:"folder", id:r.id, title:r.name, path: folderPathOf(r.parent_id), deletedAt: r.deleted_at,
          data: { id:r.id, name:r.name, parentId:r.parent_id, collapsed: !!r.collapsed, updatedAt: r.updated_at } });
        added++;
      });
      tickets.forEach(r=>{
        if(known.has("ticket:" + r.id) || ticketById(r.id)) return;
        store.trash.push({ kind:"ticket", id:r.id, title:r.title || "Ticket", path:"Ticket", deletedAt: r.deleted_at, data: ticketFromRow(r) });
        added++;
      });
      notes.forEach(r=>{
        // task-notes retired by the ticket migration are not deleted — they live on as tickets
        if(known.has("note:" + r.id) || store.notes.some(n => n.id === r.id) || ticketById(r.id)) return;
        store.trash.push({ kind:"note", id:r.id, title:title_of_text(r.text), path: folderPathOf(r.folder_id), deletedAt: r.deleted_at,
          data: { id:r.id, folderId:r.folder_id, text:r.text, createdAt:r.created_at, updatedAt:r.updated_at, props:r.props||undefined } });
        added++;
      });
      store.trash = store.trash.filter(t => t.deletedAt >= since).slice(0, TRASH_LIMIT);
      save(); renderTrash(); renderTrashCount();
      toast(added ? added + " gelöschte Einträge vom Server geladen" : "Nichts Neues auf dem Server gefunden");
    }catch(e){
      toast("Server-Abfrage fehlgeschlagen: " + e.message);
    }
  }
  function title_of_text(text){ const first = (text || "").split("\n")[0].replace(/^#+\s*/, "").trim(); return first || "Neue Notiz"; }
  async function sb_apiFetchTrash(table, q){ return apiFetch("/rest/v1/" + table + q); }
  document.getElementById("nav-board").addEventListener("click", openBoardOrTickets);
  document.getElementById("nav-plan").addEventListener("click", showPlan);
  document.getElementById("nav-notes").addEventListener("click", ()=> showNotes());
  document.getElementById("nav-trash").addEventListener("click", showTrash);
  document.getElementById("nav-archive").addEventListener("click", showArchive);

  /* ---------------- Tickets: eigene Entität (store.tickets), getrennt von Notizen ----------------
     Titel und Beschreibung stehen im selben Live-Editor wie bei einer Notiz (erste Zeile = Titel; in
     Supabase getrennt als title/description gespeichert), dazu Status, Fälligkeit, Kürzel,
     Unteraufgaben und Updates. Ein Ticket liegt in keinem Ordner — Board, Tickets und Planen sind die
     Ansichten darauf. Bis 2.x waren Tickets Notizen mit props.type = "task"; migrateLocalTaskNotes
     zieht solche Altbestände einmalig um. */
  const STATUSES = ["Offen", "In Arbeit", "Blockiert", "Erledigt"];
  const fieldsEl = document.getElementById("fields");
  function isTicket(x){ return !!x && x.kind === "ticket"; }
  function ticketById(id){ return store.tickets.find(t => t.id === id) || null; }
  function itemById(id){ return store.notes.find(n => n.id === id) || ticketById(id); }
  function openTickets(){ return store.tickets.filter(t => t.status !== "Erledigt"); }
  function fmtDue(d){ if(!d) return ""; const [y,m,dd] = d.split("-"); return dd + "." + m + "."; }
  function dueClass(d){ const t = localDateKey(); return !d ? "" : d < t ? "over" : d === t ? "today" : ""; }
  function dueLabel(d){ if(!d) return "ohne Termin"; const t = localDateKey(); return d === t ? "heute" : fmtDue(d); }
  function statusClass(st){ return "s-" + (st || "Offen").toLowerCase().replace(/\s+/g, ""); }
  function knownTags(){
    const set = new Set();
    store.tickets.forEach(t => t.tags.forEach(k => set.add(k)));
    return [...set].sort();
  }
  function subtaskProgress(t){
    const list = t.subtasks;
    return list.length ? { done: list.filter(x=>x.done).length, total: list.length } : null;
  }
  function ticketPreview(t){
    const s = t.seriesId && seriesById(t.seriesId);
    return [t.status, t.due ? "fällig " + fmtDue(t.due) : "ohne Termin", t.tags.map(k => "#" + k).join(" "), s ? "↻ " + seriesLabel(s) : ""].filter(Boolean).join(" · ");
  }
  function newTicket(f){
    const now = Date.now();
    return Object.assign({ kind:"ticket", id: uid(), text: "Neues Ticket\n\n", status:"Offen", due:"", tags:[], seriesId:null,
                           subtasks:[], updates:[], activity:[{ id: uid(), ts: now, type:"created", text:"", by:"user" }],
                           doneAt:null, createdAt: now, updatedAt: now, editedBy:"user" }, f || {});
  }
  /* Verlauf (wie „Activity" im alten Board): angelegt, Statuswechsel, Terminänderungen. Tickets von
     vor dem Verlauf zeigen nur „angelegt" (aus createdAt). */
  const ACTIVITY_MAX = 300;
  function logActivity(t, type, text, by){
    const list = t.activity || [], last = list[list.length - 1], now = Date.now();
    // stepping a date day by day is one change, not seven: merge into the entry from a moment ago
    if(type === "due" && last && last.type === "due" && last.by === (by || "user") && now - last.ts < 60000){
      const from = last.text.split(" → ")[0], to = text.split(" → ")[1];
      t.activity = from === to ? list.slice(0, -1) : list.slice(0, -1).concat(Object.assign({}, last, { ts: now, text: from + " → " + to }));
      return;
    }
    t.activity = list.concat({ id: uid(), ts: now, type, text, by: by || "user" }).slice(-ACTIVITY_MAX);
  }
  function ticketActivity(t){
    const list = (t.activity || []).slice();
    if(!list.some(a => a.type === "created")) list.push({ id:"created", ts: t.createdAt, type:"created", text:"" });
    return list.sort((a,b) => a.ts - b.ts);
  }
  function statusSince(t){
    const last = ticketActivity(t).filter(a => a.type === "status").pop();
    return last ? last.ts : t.createdAt;
  }
  function sinceLabel(ts){
    const days = Math.floor((dayFromKey(localDateKey()) - dayFromKey(localDateKey(new Date(ts)))) / 864e5);
    return days <= 0 ? "seit heute" : days === 1 ? "seit gestern" : "steht seit " + days + " T";
  }
  // Gruppen & Kürzel, übernommen aus dem alten Board (TAG_GROUPS in mein-board.html) — gelten für
  // die Kürzel von Tickets, nicht für freie #hashtags in Notizen. Ein Ticket kann mehrere tragen.
  const TAG_GROUPS = [
    { id:"myo",           name:"MYO",           color:"#5b8fd6", tags:["sls","fin","mkt","ops","sf","bizdev","prod","andere"] },
    { id:"privat",        name:"Privat",        color:"#c46730", tags:["ehe","solo"] },
    { id:"wiederkehrend", name:"Wiederkehrend", color:"#b8860b", tags:["geburtstage","arbeit"] }
  ];
  function groupOfTag(tag){ tag = (tag||"").toLowerCase(); return TAG_GROUPS.find(g => g.tags.includes(tag)) || null; }
  // "eigene" = Kürzel außerhalb der festen Gruppen
  function inGroup(tags, groupId){ return tags.some(k => { const g = groupOfTag(k); return groupId === "eigene" ? !g : !!g && g.id === groupId; }); }
  function tagChip(tag, removable){
    return '<span class="tagchip">'+escapeHtml(tag) +
      (removable ? '<span class="x" data-remove-tag="'+escapeHtml(tag)+'" title="Kürzel entfernen">×</span>' : "") + '</span>';
  }
  function addTagSelectHtml(current){
    const opt = k => '<option value="'+escapeHtml(k)+'">'+escapeHtml(k)+'</option>';
    const custom = knownTags().filter(k => !groupOfTag(k) && !current.includes(k));
    return '<select class="tag-add" data-act="add-tag" title="Kürzel hinzufügen"><option value="">＋ Kürzel</option>' +
      TAG_GROUPS.map(g => { const free = g.tags.filter(k => !current.includes(k)); return free.length ? '<optgroup label="'+g.name+'">'+free.map(opt).join("")+'</optgroup>' : ""; }).join("") +
      (custom.length ? '<optgroup label="Eigene">'+custom.map(opt).join("")+'</optgroup>' : "") +
      '<option value="__new">Eigenes Kürzel…</option></select>';
  }
  function askNewTag(){
    const v = prompt("Eigenes Kürzel (klein geschrieben, ohne #):", "");
    return v === null ? "" : v.trim().replace(/^#/, "").toLowerCase();
  }

  /* ---- Serien: Vorlagen, aus denen am Fälligkeitstag ein neues Ticket entsteht (wie „Recurring"
     im alten Board). Jedes Vorkommen ist ein eigenes Ticket mit seriesId; die Vorlage merkt sich nur,
     wann das nächste fällig ist (nextDue). ---- */
  const SERIES_PRESETS = [["", "keine"], ["weekly:1", "wöchentlich"], ["weekly:2", "alle 2 Wochen"], ["monthly:1", "monatlich"], ["monthly:3", "alle 3 Monate"], ["yearly:1", "jährlich"]];
  const FREQ_LABELS = { daily:["täglich","alle %n Tage","Tage"], weekly:["wöchentlich","alle %n Wochen","Wochen"], monthly:["monatlich","alle %n Monate","Monate"], yearly:["jährlich","alle %n Jahre","Jahre"] };
  const WEEKDAY_SHORT = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  function seriesById(id){ return store.ticketSeries.find(s => s.id === id) || null; }
  function seriesLabel(s){
    const f = FREQ_LABELS[s.freq];
    if(!f) return "";
    let out = s.interval > 1 ? f[1].replace("%n", s.interval) : f[0];
    if(s.freq === "weekly" && s.weekdays && s.weekdays.length) out += " · " + s.weekdays.slice().sort().map(d => WEEKDAY_SHORT[d-1]).join(", ");
    if(s.freq === "monthly" && s.dayOfMonth) out += " · am " + s.dayOfMonth + ".";
    return out;
  }
  function isoWeekday(d){ return (d.getDay() + 6) % 7 + 1; }
  function monthDay(y, m, day){ const last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(day, last)); }
  function seriesAnchorDay(s){ return (s.freq === "monthly" && s.dayOfMonth) || +s.startDate.slice(8, 10); }
  // The first occurrence on or after the start date.
  function seriesFirst(s){
    const start = dayFromKey(s.startDate);
    if(s.freq === "weekly" && s.weekdays && s.weekdays.length){
      for(let i = 0; i < 7; i++){ const d = addDays(start, i); if(s.weekdays.includes(isoWeekday(d))) return localDateKey(d); }
    }
    if(s.freq === "monthly"){
      let d = monthDay(start.getFullYear(), start.getMonth(), seriesAnchorDay(s));
      if(d < start) d = monthDay(start.getFullYear(), start.getMonth() + 1, seriesAnchorDay(s));
      return localDateKey(d);
    }
    return s.startDate;
  }
  // The occurrence after `iso`, or null once the series is past its end date.
  function seriesStep(s, iso){
    const k = Math.max(1, parseInt(s.interval, 10) || 1);
    const [y, m, d] = iso.split("-").map(Number);
    let out = null;
    if(s.freq === "daily") out = new Date(y, m - 1, d + k);
    else if(s.freq === "weekly"){
      const days = (s.weekdays || []).filter(x => x >= 1 && x <= 7);
      if(!days.length) out = new Date(y, m - 1, d + 7 * k);
      else {
        const startMon = mondayOf(dayFromKey(s.startDate));
        for(let i = 1; i <= 7 * k + 7 && !out; i++){
          const c = new Date(y, m - 1, d + i);
          const weeks = Math.round((mondayOf(c) - startMon) / (7 * 864e5));
          if(days.includes(isoWeekday(c)) && weeks >= 0 && weeks % k === 0) out = c;
        }
      }
    } else if(s.freq === "monthly") out = monthDay(y, m - 1 + k, seriesAnchorDay(s));
    else out = monthDay(y + k, m - 1, seriesAnchorDay(s));
    if(!out) return null;
    const key = localDateKey(out);
    return s.endDate && key > s.endDate ? null : key;
  }
  function seriesOnOrAfter(s, from){
    let d = seriesFirst(s), guard = 0;
    if(s.endDate && d > s.endDate) return null;
    while(d && d < from && guard++ < 5000) d = seriesStep(s, d);
    return d;
  }
  // After a rule change: the next occurrence that has no ticket yet — never one in the past, never
  // a second ticket for a day that already got one.
  function recomputeNextDue(s){
    const made = store.tickets.filter(t => t.seriesId === s.id && t.due).map(t => t.due).sort();
    const last = made[made.length - 1];
    let from = localDateKey();
    if(s.startDate > from) from = s.startDate;
    if(last && last >= from) from = localDateKey(addDays(dayFromKey(last), 1));
    s.nextDue = seriesOnOrAfter(s, from);
  }
  function presetToSeries(code, t){
    const [freq, n] = code.split(":");
    const start = t.due || localDateKey();
    return { id: uid(), title: noteTitle(t), description: ticketDescription(t), tags: t.tags.slice(), freq, interval: parseInt(n, 10) || 1,
             weekdays: null, dayOfMonth: freq === "monthly" ? +start.slice(8, 10) : null, startDate: start, endDate: null,
             nextDue: null, active: true, createdAt: Date.now(), updatedAt: Date.now() };
  }
  function ticketDescription(t){
    let rest = t.text.split("\n").slice(1);
    if(rest[0] === "") rest = rest.slice(1);
    return rest.join("\n");
  }
  /* Erzeugt fällige Serien-Tickets. Läuft beim Start, nach jedem Sync und wenn das Fenster wieder in
     den Vordergrund kommt — nicht beim Rendern, damit eine gerade bearbeitete Vorlage nicht mittendrin
     schon ein Ticket abwirft. War die App länger zu, entsteht nur das jüngste verpasste Vorkommen,
     nicht eins pro verpasster Woche. Die Ticket-ID ist Serie + Datum: Erzeugen zwei Geräte dasselbe
     Vorkommen, landen beide auf derselben Zeile statt doppelt. */
  function runSeries(){
    const today = localDateKey();
    let made = 0, changed = false;
    store.ticketSeries.forEach(s => {
      if(!s.active || !s.nextDue || s.nextDue > today) return;
      let due = s.nextDue, next = seriesStep(s, due), guard = 0;
      while(next && next <= today && guard++ < 5000){ due = next; next = seriesStep(s, due); }
      const id = s.id + "-" + due;
      if(!ticketById(id)){
        const t = newTicket({ id, text: s.title + "\n\n" + (s.description || ""), due, tags: (s.tags || []).slice(), seriesId: s.id, editedBy: undefined });
        t.activity[0].by = "serie";
        store.tickets.unshift(t);
        made++;
      }
      s.nextDue = next; s.updatedAt = Date.now(); changed = true;
    });
    if(!changed) return 0;
    save(); updateBoardCount();
    if(made){ renderBoard(); renderPlan(); renderTicketList(); renderSeriesView(); }
    return made;
  }

  /* ---- Ändern: jede Änderung an Status, Termin, Kürzeln, Unteraufgaben läuft hierüber ---- */
  function snapshotTicket(t){
    return JSON.parse(JSON.stringify({ status:t.status, due:t.due, tags:t.tags, seriesId:t.seriesId, subtasks:t.subtasks, updates:t.updates, activity:t.activity || [], doneAt:t.doneAt }));
  }
  function setTicket(t, patch){
    const before = snapshotTicket(t);
    const completing = patch.status === "Erledigt" && t.status !== "Erledigt";
    if(patch.status && patch.status !== t.status) logActivity(t, "status", t.status + " → " + patch.status);
    if("due" in patch && (patch.due || "") !== (t.due || "")) logActivity(t, "due", (t.due ? fmtDueLong(t.due) : "ohne Termin") + " → " + (patch.due ? fmtDueLong(patch.due) : "ohne Termin"));
    Object.assign(t, patch);
    if(completing) t.doneAt = localDateKey();
    else if(patch.status && patch.status !== "Erledigt") t.doneAt = null;
    t.updatedAt = Date.now(); t.editedBy = "user";
    save();
    refreshTicket(t);
    // Every way of finishing a ticket — check on the card, status path, drag into "Erledigt" — ends
    // in the same acknowledgement, and it can always be taken back.
    if(completing){
      const s = t.seriesId && seriesById(t.seriesId);
      const left = ticketsLeftToday();
      toast("„" + noteTitle(t) + "“ erledigt" + (s && s.active && s.nextDue ? " — nächstes Mal am " + fmtDueLong(s.nextDue)
            : left === 0 ? " — alles für heute geschafft ✓" : " — noch " + left + " für heute"),
            { actionLabel: "Rückgängig", onAction: ()=> restoreTicket(t, before) });
    }
  }
  // Wie viele offene Tickets sind heute (oder schon überfällig) noch fällig?
  function ticketsLeftToday(){
    const today = localDateKey();
    return store.tickets.filter(x => !x.deletedAt && x.status !== "Erledigt" && x.due && x.due <= today).length;
  }
  /* Erledigt-Moment: Der Status-Schalter spielt seine Erledigt-Animation selbst (Lichtstreif, Haken, Konfetti).
     Hier dazu: Ton, Titel wird durchgestrichen, danach schließt das Ticket von selbst. Beim Meilenstein — dieses
     Ticket war für heute fällig und danach ist für heute nichts mehr offen — Dreiklang statt einfachem Ton. */
  function celebrateStatus(t, to){
    if(to !== "Erledigt") return;
    if(reducedMotion()){ setTimeout(()=>{ if(currentNote === t && t.status === "Erledigt") requestClose(); }, 700); return; }
    const today = localDateKey(), milestone = t.due && t.due <= today && !store.tickets.some(x => x !== t && x.status !== "Erledigt" && x.due && x.due <= today);
    sound(milestone ? "all" : "done");
    // Titel wird durchgestrichen (Linie über die Breite des Titeltexts)
    const ti = document.getElementById("title-input");
    if(ti && ti.value.trim()){
      const m = document.createElement("canvas").getContext("2d"), st = getComputedStyle(ti);
      m.font = st.fontWeight + " " + st.fontSize + " " + st.fontFamily;
      const tr = ti.getBoundingClientRect(), padL = parseFloat(st.paddingLeft), padT = parseFloat(st.paddingTop);
      const w = Math.min(m.measureText(ti.value.split("\n")[0]).width, tr.width - padL * 2);
      const line = document.createElement("div");
      line.className = "done-strike";
      line.style.left = (tr.left + padL) + "px"; line.style.width = w + "px";
      line.style.top = (tr.top + padT + parseFloat(st.fontSize) * 0.62) + "px";
      document.body.appendChild(line);
      setTimeout(()=> line.remove(), 1300);
    }
    // Danach schließt das Ticket von selbst — erledigte Tickets wandern ohnehin ins Archiv
    setTimeout(()=>{ if(currentNote === t && t.status === "Erledigt") requestClose(); }, 1500);   // Haken und Konfetti ausspielen lassen
  }
  function refreshTicket(t){
    if(t === currentNote){ renderFields(); renderTaskPanel(); updateBreadcrumb(); renderHistory(); renderDialogFoot(); }
    updateBoardCount();
  }
  /* Ein Seitenkopf für alle Ansichten (Phase 2): Titel 24px, eine Zeile Zahlen, Aktionen rechts — überall
     gleiche Kante und Höhe, damit beim Wechseln nichts springt. */
  /* Leerer Zustand, überall gleich (Phase 3). hint darf HTML enthalten (nur feste Texte / escapte Eingaben). */
  const ES_ICONS = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>',
    archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="4" rx="1.2"/><path d="M5 8.5v10a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 18.5v-10M10 12.5h4"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2M6.5 7l1 12a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l1-12"/></svg>',
    repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3"/><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H20M7 21l-3-3 3-3"/><path d="M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h7l4 4v12a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1Z"/><path d="M13.5 3.5v4h4M9 12.5h6M9 16h4"/></svg>'
  };
  function emptyState(icon, title, hint, act){
    return '<div class="empty-state"><div class="es-ico">' + ES_ICONS[icon] + '</div><div class="es-title">' + escapeHtml(title) + '</div>' +
      (hint ? '<div class="es-hint">' + hint + '</div>' : '') + (act ? '<div class="es-act">' + act + '</div>' : '') + '</div>';
  }
  document.addEventListener("click", (e)=>{
    const a = e.target.closest("[data-empty-act]"); if(!a) return;
    if(a.dataset.emptyAct === "ticket") createTicket(); else if(a.dataset.emptyAct === "note") createNote(folderForNewNote());
  });
  function pageHead(title, sub, actions){
    return '<header class="page-head"><div class="ph-text"><h1 class="ph-title">' + escapeHtml(title) + '</h1>' +
      (sub ? '<div class="ph-sub">' + escapeHtml(sub) + '</div>' : '') + '</div>' + (actions ? '<div class="ph-actions">' + actions + '</div>' : '') + '</header>';
  }
  function ticketsSummary(){
    const open = store.tickets.filter(t => t.status !== "Erledigt"), today = localDateKey();
    const due = open.filter(t => t.due === today).length, over = open.filter(t => t.due && t.due < today).length;
    return [open.length + " offen", due ? due + " heute fällig" : "", over ? over + " überfällig" : ""].filter(Boolean).join(" · ");
  }
  function planSummary(){
    const open = store.tickets.filter(t => t.status !== "Erledigt"), today = localDateKey();
    const week = localDateKey(new Date(Date.now() + 6 * 864e5)), inWeek = open.filter(t => t.due && t.due >= today && t.due <= week).length;
    const none = open.filter(t => !t.due).length;
    return [inWeek + " in den nächsten 7 Tagen", none ? none + " ohne Termin" : ""].filter(Boolean).join(" · ");
  }
  function renderTicketViews(){ renderBoard(); renderPlan(); renderTicketList(); renderSeriesView(); renderArchive(); renderAbschluss(); }
  // Listen gleiten beim Neuzeichnen (siehe withFlip): Board, Planen, Ticket-Liste, Archiv, Baum, Gliederung
  renderBoard = withFlip(renderBoard, ()=> document.getElementById("board"), ".kcard[data-open]");
  renderPlan = withFlip(renderPlan, ()=> document.getElementById("plan"), ".pcard[data-open]");
  renderTicketList = withFlip(renderTicketList, ()=> document.getElementById("tickets"), ".trow[data-open]");
  renderArchive = withFlip(renderArchive, ()=> document.getElementById("archive"), "[data-open]");
  renderSideTree = withFlip(renderSideTree, ()=> document.getElementById("side-tree"), "[data-side-note], [data-side-toggle]");
  renderOutline = withFlip(renderOutline, ()=> document.getElementById("outline-list"), ".outline-item",
    { enterOnGrow:true, keyOf: e => e.textContent + "|" + e.className });
  function restoreTicket(t, snap){
    Object.assign(t, snap); t.updatedAt = Date.now(); t.editedBy = "user";
    save(); refreshTicket(t); renderTicketViews();
  }
  function addSubtask(t, text){
    text = (text||"").trim(); if(!text) return;
    setTicket(t, { subtasks: [...t.subtasks, { id: uid(), text, done:false, doneAt:null }] });
  }
  function toggleSubtask(t, id){
    const sub = t.subtasks.find(x => x.id === id);
    if(sub && !sub.done) sound(t.subtasks.every(x => x.done || x.id === id) && t.subtasks.length > 1 ? "all" : "tick");
    setTicket(t, { subtasks: t.subtasks.map(x => x.id === id ? Object.assign({}, x, { done: !x.done, doneAt: x.done ? null : localDateKey() }) : x) });
  }
  function deleteSubtask(t, id){ setTicket(t, { subtasks: t.subtasks.filter(x => x.id !== id) }); }
  function renameSubtask(t, id, text){
    text = (text||"").trim();
    if(!text) return;
    setTicket(t, { subtasks: t.subtasks.map(x => x.id === id ? Object.assign({}, x, { text }) : x) });
  }
  function reorderSubtask(t, id, targetId, before){
    const list = t.subtasks.slice();
    const fromIdx = list.findIndex(x => x.id === id);
    if(fromIdx < 0) return;
    const [moved] = list.splice(fromIdx, 1);
    let toIdx = list.findIndex(x => x.id === targetId);
    if(toIdx < 0) toIdx = list.length;
    else if(!before) toIdx++;
    list.splice(toIdx, 0, moved);
    setTicket(t, { subtasks: list });
  }
  function addTicketUpdate(t, text){
    text = (text||"").trim(); if(!text) return;
    setTicket(t, { updates: [{ id: uid(), ts: Date.now(), text }, ...t.updates] });
  }
  function deleteTicketUpdate(t, id){ setTicket(t, { updates: t.updates.filter(u => u.id !== id) }); }
  function addTicketTag(t, tag){
    tag = (tag || "").trim().replace(/^#/, "").toLowerCase();
    if(!tag || t.tags.includes(tag)) return;
    setTicket(t, { tags: [...t.tags, tag] });
  }
  function removeTicketTag(t, tag){ setTicket(t, { tags: t.tags.filter(k => k !== tag) }); }

  function selectTitleLine(){ titleInputEl.focus(); titleInputEl.select(); }
  function createTicket(f){
    const t = newTicket(f);
    store.tickets.unshift(t); save(); updateBoardCount();
    selectNote(t.id);
    selectTitleLine();
    return t;
  }
  // Aus einer Notiz heraus: Die Notiz bleibt, wie sie ist. Das neue Ticket verlinkt auf sie, sodass
  // es in der Notiz unter „Tickets" bzw. „Verlinkt von" auftaucht; danach gleich den Termin setzen.
  function ticketFromNote(n){
    const title = noteTitle(n), named = title !== "Neue Notiz";
    const t = newTicket({ text: (named ? title : "Neues Ticket") + "\n\n" + (named ? "[[" + title + "]]\n" : "") });
    store.tickets.unshift(t); save(); updateBoardCount();
    selectNote(t.id);
    if(named){ const strip = fieldsEl.querySelector(".due2"); if(strip) strip.focus(); } else selectTitleLine();
  }
  function deleteTicket(t){
    const entry = pushTrash("ticket", t.id, noteTitle(t), "Ticket", t);
    store.tickets = store.tickets.filter(x => x !== t);
    save(); updateBoardCount();
    if(currentNote === t) requestClose();
    else renderTicketViews();
    renderTrash(); renderTrashCount();
    toast("„" + entry.title + "“ gelöscht", { actionLabel: "Rückgängig", onAction: ()=> restoreTrashEntry(entry) });
  }

  /* ---- Einmal-Umzug der Altbestände: Aufgaben-Notizen (props.type = "task") → store.tickets ----
     Gleiche Umrechnung und gleiche IDs wie das frühere Umzugsskript (mcp/migrate-tickets.py, siehe Git-Historie), damit es egal war, ob das Skript
     oder die App zuerst läuft. Eine Serie wird zur Vorlage „ser-<id>", das Ticket selbst bleibt als
     aktuelles Vorkommen stehen. */
  function taskNoteToTicket(n){
    const p = n.props || {};
    const tags = (Array.isArray(p.tags) ? p.tags : (p.tag ? [p.tag] : [])).map(k => String(k).toLowerCase()).filter(Boolean);
    const updates = (p.updates || []).slice();
    const path = folderPathOf(n.folderId).replace(/ \/ /g, "/");
    if(path && !/^aufgaben(\/|$)/i.test(path)) updates.push({ id: "mig-" + n.id, ts: n.createdAt || n.updatedAt, text: "Aus Notiz übernommen · Ordner: " + path });
    const ticket = { kind:"ticket", id: n.id, text: n.text, status: p.status || "Offen", due: p.due || "", tags,
      seriesId: p.series ? "ser-" + n.id : null,
      subtasks: (p.tasks || []).map(x => ({ id: x.id || uid(), text: x.text || "", done: !!x.done, doneAt: x.doneAt || null })),
      updates, doneAt: p.doneAt || null, createdAt: n.createdAt || n.updatedAt, updatedAt: n.updatedAt,
      source: n.source, editedBy: n.editedBy };
    let series = null;
    if(p.series){
      series = presetToSeries(p.series, ticket);
      series.id = "ser-" + n.id; series.createdAt = series.updatedAt = n.updatedAt;
      series.nextDue = p.due ? seriesStep(series, p.due) : seriesStep(series, localDateKey());
    }
    return { ticket, series };
  }
  function migrateLocalTaskNotes(){
    if(!Array.isArray(store.tickets)) store.tickets = [];
    if(!Array.isArray(store.ticketSeries)) store.ticketSeries = [];
    const legacy = store.notes.filter(n => n.props && n.props.type === "task");
    if(!legacy.length) return;
    try{ localStorage.setItem("mdnotes.backup.task-notes", JSON.stringify({ at: Date.now(), notes: legacy })); }catch(e){}
    legacy.forEach(n => {
      const { ticket, series } = taskNoteToTicket(n);
      if(!ticketById(ticket.id)) store.tickets.push(ticket);
      if(series && !seriesById(series.id)) store.ticketSeries.push(series);
    });
    const ids = new Set(legacy.map(n => n.id));
    store.notes = store.notes.filter(n => !ids.has(n.id));
    // the collector folder only ever held tasks — now empty, it would just sit in the tree
    const col = store.folders.find(f => !f.parentId && f.name.toLowerCase() === "aufgaben");
    if(col && !store.notes.some(n => n.folderId === col.id) && !store.folders.some(f => f.parentId === col.id))
      store.folders = store.folders.filter(f => f !== col);
    persist();
  }

  function linkingTickets(n){

    if(title === "Neue Notiz") return [];
    const re = wikiLinkRe(title);
    return store.tickets.filter(t => re.test(t.text)).sort((a,b) => (a.status === "Erledigt") - (b.status === "Erledigt") || (a.due||"9").localeCompare(b.due||"9"));
  }

          '<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 9h14M7 3v4M13 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
          '<span>'+escapeHtml(dueText)+'</span>' + chevronSvg() + '</span>' +
        '<span class="tk-tags">' + t.tags.map(k => tagChip(k, true)).join("") + addTagSelectHtml(t.tags) + '</span>' +
        (s ? '<span class="tk-kind series" data-act="open-series" title="Serie bearbeiten">↻ '+escapeHtml(seriesLabel(s))+'</span>' : "") +
        (t.source === "claude" ? '<span class="claude-badge">Claude</span>' : "") +
        '<span class="tk-hint">Ziehen, klicken oder 1–4 / ← →</span>' +
      '</div>' +
      '<div class="tk-dueexp'+(dueBandOpen ? " is-open" : "")+'"><div class="expand-body"><div class="expand-inner">' + dueBandHtml(t) + '</div></div></div>';
    const changed = statusSince(t);
    fieldsEl.querySelector(".sr-slot").replaceWith(statusSchalter({ id: t.id, idx: cur,
      since: t.status === "Erledigt" && t.doneAt ? "erledigt am " + fmtDue(t.doneAt) : Date.now() - changed < 60000 ? "gerade eben"
           : sinceLabel(changed).replace(/^steht seit (\d+) T$/, (m, n) => "seit " + n + " Tagen"),
      onCommit: (i) => { const to = STATUSES[i]; if(to === t.status) return; setTicket(t, { status: to }); celebrateStatus(t, to); },
      onStep: () => sound("tick") }));

  /* ---- Ticket-Dialog: Verlauf (links) und Fußleiste ---- */
  function activityLabel(a){
    if(a.type === "created") return a.by === "serie" ? "aus Serie angelegt" : "angelegt";
    if(a.type === "due") return "Termin: " + a.text;

  function renderDialogFoot(){

    dlgFootEl.innerHTML =

         : '<label class="foot-btn" title="Macht aus diesem Ticket eine Serie: Zum nächsten Termin entsteht ein neues Ticket">↻ Wiederholen: <select data-act="make-series">'+SERIES_PRESETS.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join("")+'</select></label>') +
