  }
  function stilToggle(key){ const ui = stilUi(), off = stilOff(); ui.stilOff = off.includes(key) ? off.filter(x => x !== key) : off.concat(key); save(); stilShow(); }
  // Altlasten der früheren Stilprüfung (Wortarten, LanguageTool) einmalig entfernen
  ["styleCheck", "wcHidden", "wordClasses"].forEach(k => { if(store.ui && k in store.ui) delete store.ui[k]; });

  /* Mac: Knopf „Stil" im Notizkopf öffnet die Liste wie in iA Writer; ⌘⇧S schaltet die Syntax. */
  stilWatch(editorEl); stilShow();
  const stilPop = document.getElementById("stil-pop");
  let stilEditing = false, stilCustomT = 0;
  function setSyntax(on){ stilUi().syntax = on; save(); stilRefresh(editorEl); renderSettings(); updateStilButton(); if(stilPop.classList.contains("open")) renderStilPop(); }
  function setStilCheck(on){ stilUi().stilCheck = on; save(); stilRefresh(editorEl); renderSettings(); updateStilButton(); if(stilPop.classList.contains("open")) renderStilPop(); }
  function setStilCustom(text){
    stilUi().stilCustom = text; save();
    clearTimeout(stilCustomT); stilCustomT = setTimeout(()=> stilRefresh(editorEl), 250);
  }
  function updateStilButton(){
    const el = document.getElementById("stylecount"), t = currentNote && !isTicket(currentNote) ? "Stil" : "";
    if(el.textContent !== t) el.textContent = t;
    el.classList.toggle("clickable", !!t);
  }
  function renderStilPop(){
    const off = stilOff();
    const head = (key, label, on) => '<div class="stil-row head' + (on ? " on" : "") + '" data-stil-master="' + key + '">' + label + '<span class="sw"></span></div>';
    const row = (k, label, on, master, color) => '<div class="stil-row sub' + (master ? "" : " dim") + '" data-stil="' + k + '"><span class="ck">' + (on ? "✓" : "") + '</span>' +
      '<span' + (color ? ' style="color:var(' + color + ')"' : '') + '>' + label + '</span></div>';
    stilPop.innerHTML = head("syntax", "Syntax", syntaxOn()) +
      STIL_SYNTAX.map(([k, l]) => row(k, l, !off.includes(k), syntaxOn(), "--syn-" + k)).join("") +
      '<div class="stil-sep"></div>' + head("check", "Stilprüfung", styleOn()) +
      STIL_CHECKS.map(([k, l]) => row(k, l, !off.includes(k), styleOn())).join("") +
      '<div class="stil-row sub edit' + (styleOn() ? "" : " dim") + '" data-stil-edit>' + (stilEditing ? "Fertig" : "Eigene Kriterien bearbeiten…") + '</div>' +
      (stilEditing ? '<textarea placeholder="Ein Wort oder eine Wendung pro Zeile">' + escapeHtml(stilUi().stilCustom || "") + '</textarea><div class="stil-hint">Wird grau durchgestrichen, sobald es im Text steht.</div>' : '');
    const ta = stilPop.querySelector("textarea");
    if(ta){ ta.addEventListener("input", ()=> setStilCustom(ta.value)); }
  }
  function setStilPopOpen(open){
    if(!open){ stilPop.classList.remove("open"); stilEditing = false; return; }
    renderStilPop();
    const r = document.getElementById("stylecount").getBoundingClientRect();
    stilPop.style.top = (r.bottom + 6) + "px";
    stilPop.style.left = Math.max(8, Math.min(window.innerWidth - 258, r.left)) + "px";
    stilPop.classList.add("open");
  }
  document.getElementById("stylecount").addEventListener("click", (e)=>{
    if(!currentNote || isTicket(currentNote)) return;
    e.stopPropagation();
    setStilPopOpen(!stilPop.classList.contains("open"));
  });
  stilPop.addEventListener("click", (e)=>{
    e.stopPropagation();
    const m = e.target.closest("[data-stil-master]"), k = e.target.closest("[data-stil]"), ed = e.target.closest("[data-stil-edit]");
    if(m){ if(m.dataset.stilMaster === "syntax") setSyntax(!syntaxOn()); else setStilCheck(!styleOn()); renderStilPop(); return; }
    if(k){ stilToggle(k.dataset.stil); renderStilPop(); renderSettings(); return; }
    if(ed){ stilEditing = !stilEditing; renderStilPop(); const ta = stilPop.querySelector("textarea"); if(ta) ta.focus(); }
  });
  document.addEventListener("click", (e)=>{ if(stilPop.classList.contains("open") && !e.target.closest("#stil-pop")) setStilPopOpen(false); });
  document.addEventListener("keydown", (e)=>{ if(e.key === "Escape" && stilPop.classList.contains("open")){ setStilPopOpen(false); e.stopPropagation(); } }, true);

  function renderLine(raw, idx, state){
    let m;

    if(/^```/.test(raw)){
      state.inCode = !state.inCode;
      return '<span class="line line-code-fence" data-line="'+idx+'"><span class="marker">'+escapeHtml(raw)+'</span></span>';
    }
    if(state.inCode){
      return '<span class="line line-code" data-line="'+idx+'">'+(raw === "" ? ZWS : escapeHtml(raw))+'</span>';
    }

    if(state.lines){
      const block = findTableBlock(state.lines, idx);
      if(block) return renderTableLine(raw, idx, block);
    }

    if((m = /^(#{1,6})(\s+)(.*)$/.exec(raw))){
      const headingKey = m[1].length + "|" + m[3].trim();
      return '<span class="line line-h'+m[1].length+'" data-line="'+idx+'">' +
        '<span class="fold-toggle" contenteditable="false" data-fold-toggle="'+escapeHtml(headingKey).replace(/"/g,"&quot;")+'" title="Ein-/ausklappen"></span>' +
        '<span class="marker marker-hide">'+escapeHtml(m[1]+m[2])+'</span>'+renderInline(m[3])+'</span>';
    }
    if((m = /^(>\s?\[!info\]\s?)(.*)$/i.exec(raw)))   // Infobox „> [!info] Text" (aus „/info ")
      return '<span class="line line-quote line-info'+'" data-line="'+idx+'"><span class="marker marker-hide">'+escapeHtml(m[1])+'</span>'+renderInline(m[2])+'</span>';
    if((m = /^>(\s?)(.*)$/.exec(raw))){
      return '<span class="line line-quote'+'" data-line="'+idx+'"><span class="marker marker-hide">'+escapeHtml(">"+m[1])+'</span>'+renderInline(m[2])+'</span>';
    }
    if((m = /^(\s*[-*]\s)\[([ xX])\](\s.*)$/.exec(raw))){
      const checked = m[2].toLowerCase() === "x";
      return '<span class="line line-list line-checkbox'+(checked?" checked":"")+'" data-line="'+idx+'"'+listLvl(m[1])+'>'+listMarker(m[1])+'<span class="md-checkbox" data-line="'+idx+'">'+escapeHtml("["+m[2]+"]")+'</span>'+renderInline(m[3])+'</span>';
    }
    if((m = /^(\s*[-*]\s)(.*)$/.exec(raw))){
      // The bullet's own marker is font-size:0 (the dot comes from ::before instead), so an
      // empty item would leave the line with no visible-sized text node at all — the caret then
      // has nowhere real to render and goes invisible until the first character is typed.
      return '<span class="line line-list line-bullet'+'" data-line="'+idx+'"'+listLvl(m[1])+'>'+listMarker(m[1])+(m[2] === "" ? ZWS : renderInline(m[2]))+'</span>';
    }
    if((m = /^(\s*\d+\.\s)(.*)$/.exec(raw))){
      return '<span class="line line-list'+'" data-line="'+idx+'"'+listLvl(m[1])+'>'+listMarker(m[1])+(m[2] === "" ? ZWS : renderInline(m[2]))+'</span>';
    }
    if((m = /^(\s+[ivxlcdm]+\.\s)(.*)$/.exec(raw)) && parseListLine(raw)){
      return '<span class="line line-list line-sub'+'" data-line="'+idx+'"'+listLvl(m[1])+'>'+listMarker(m[1])+(m[2] === "" ? ZWS : renderInline(m[2]))+'</span>';
    }
    if(raw.trim().length > 0 && /^(-{3,}|\*{3,}|_{3,})$/.test(raw.trim())){
      return '<span class="line line-hr" data-line="'+idx+'">'+escapeHtml(raw)+'</span>';
    }
    return '<span class="line'+'" data-line="'+idx+'">'+(raw === "" ? ZWS : renderInline(raw))+'</span>';
  }

  /* ---------------- Tables (GFM): | a | b | header, | --- | --- | separator, body rows ----------------
     The markdown stays the single source of truth: one table row is exactly one line of text and
     the separator row rides along invisibly. Block detection is anchored on that separator row —
     it is the only thing that turns a run of pipe-bearing lines into a table, and anchoring on it
     keeps a paragraph that merely happens to contain a "|" from being swallowed as the header. */
  function hasPipe(line){
    if(line == null) return false;
    for(let i=0;i<line.length;i++){
      if(line[i] === "\\"){ i++; continue; }
      if(line[i] === "|") return true;
    }
    return false;
  }
  function tableRowBounds(line){
    if(!hasPipe(line)) return null;
    const bounds = []; let segStart = 0, esc = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(esc){ esc = false; continue; }
      if(ch === "\\"){ esc = true; continue; }
      if(ch === "|"){ bounds.push([segStart, i]); segStart = i + 1; }
    }
    bounds.push([segStart, line.length]);
    if(bounds.length > 1 && line.slice(bounds[0][0], bounds[0][1]).trim() === "" && line.trimStart().startsWith("|")) bounds.shift();
    if(bounds.length > 1){
      const last = bounds[bounds.length - 1];
      if(line.slice(last[0], last[1]).trim() === "" && line.trimEnd().endsWith("|")) bounds.pop();
    }
    return bounds.length ? bounds : null;
  }
  function tableRowCells(line){
    const b = tableRowBounds(line);
    return b ? b.map(([s,e]) => line.slice(s, e).trim()) : null;
  }
  function tableCellTrimmedRange(line, s, e){
    const raw = line.slice(s, e);
    return [s + (raw.length - raw.trimStart().length), e - (raw.length - raw.trimEnd().length)];
  }
  function isTableSepCell(c){ return /^:?-+:?$/.test(c.trim()); }
  function isTableSepRow(line){
    const cells = tableRowCells(line);
    return !!cells && cells.length > 0 && cells.every(isTableSepCell);
  }
  function tableSepAlign(c){
    c = c.trim();
    const l = c.startsWith(":"), r = c.endsWith(":");
    return l && r ? "center" : r ? "right" : l ? "left" : "";
  }
  /* Column widths live in the separator row's dash count: "| ------ | --- |" is plain, portable
     GFM that renders the same everywhere, and it makes the width a property of the *table*
     instead of a guess from whatever happens to be in the cells right now. The old version
     measured the text, so every single keystroke reshuffled every column while typing. */
  const TABLE_MIN_UNITS = 3;
  function sepCellUnits(c){ return Math.max(TABLE_MIN_UNITS, (String(c).match(/-/g) || []).length); }
  function tableColWidths(lines, sepIdx, cols){
    const cells = tableRowCells(lines[sepIdx]) || [];
    const units = [];
    for(let c=0;c<cols;c++) units.push(sepCellUnits(cells[c] === undefined ? "---" : cells[c]));
    const total = units.reduce((a,b)=>a+b, 0) || cols;
    return units.map(u => u / total * 100);
  }
  // ...and back again: percentages become dash counts (alignment colons don't count as width).
  function sepCellsFromWidths(pcts, align){
    const scale = Math.max(12, pcts.length * 6);
    return pcts.map((p, i) => {
      const dashes = "-".repeat(Math.max(TABLE_MIN_UNITS, Math.round(p / 100 * scale)));
      const a = align[i];
      return a === "center" ? ":"+dashes+":" : a === "right" ? dashes+":" : a === "left" ? ":"+dashes : dashes;
    });
  }
  const TABLE_SCAN_LIMIT = 400;
  function findTableBlock(lines, idx){
    if(idx < 0 || idx >= lines.length || !hasPipe(lines[idx])) return null;
    let sepIdx = -1;
    if(!isTableSepRow(lines[idx]) && idx + 1 < lines.length && isTableSepRow(lines[idx + 1])){
      sepIdx = idx + 1;                                  // idx is the header row itself
    } else {
      for(let i = idx; i >= 0 && idx - i < TABLE_SCAN_LIMIT; i--){
        if(!hasPipe(lines[i])) break;
        if(isTableSepRow(lines[i])){ sepIdx = i; break; }
      }
    }
    if(sepIdx <= 0) return null;
    const start = sepIdx - 1;
    const header = tableRowCells(lines[start]);
    if(!header || isTableSepRow(lines[start])) return null;
    const sep = tableRowCells(lines[sepIdx]);
    if(sep.length !== header.length) return null;
    // Rows of a pipe-delimited table have to be pipe-delimited too, so the paragraph directly
    // below a table isn't pulled in just for containing a "|".
    const bordered = lines[sepIdx].trim().startsWith("|");
    const isRow = l => hasPipe(l) && !isTableSepRow(l) && (!bordered || l.trim().startsWith("|"));
    // A row that is itself followed by a separator row is the header of the *next* table, not
    // the last body row of this one — otherwise two tables written back to back would each see
    // that line as theirs and render it twice over.
    const opensNextTable = i => i + 1 < lines.length && isTableSepRow(lines[i + 1]);
    let end = sepIdx;
    while(end + 1 < lines.length && isRow(lines[end + 1]) && !opensNextTable(end + 1)) end++;
    if(idx < start || idx > end) return null;
    return { start, sep: sepIdx, end, cols: header.length,
             align: sep.map(tableSepAlign), widths: tableColWidths(lines, sepIdx, header.length) };
  }
  function sameTableGeometry(a, b){
    return !!a && !!b && a.start === b.start && a.sep === b.sep && a.end === b.end && a.cols === b.cols &&
      a.align.join("/") === b.align.join("/") &&
      a.widths.every((w, i) => Math.abs(w - b.widths[i]) < 0.001);
  }
  /* Eine Zelle ist jetzt eine echte, eigene contenteditable-Insel (siehe CSS .line-table .td) statt
     eines simulierten Textabschnitts in der einen großen #editor-Fläche — Tippen, Rücktaste und
     Pfeiltasten *innerhalb* einer Zelle sind dadurch nativer Browser-Code, keine eigene
     Offset-Rechnung mehr nötig. Die Pipe-Marker zwischen den Zellen
     bleiben als unsichtbarer, nicht editierbarer Text stehen (wie bisher per font-size:0) — rein
     fürs Round-Tripping, damit `editorEl.textContent` für diese Zeile weiterhin exakt der
     Markdown-Zeile entspricht und Code, der das Dokument als Ganzes liest (z. B. beim Tippen
     außerhalb der Tabelle), nichts von der Umstellung merkt. Zellinhalt ist bewusst reiner Text
     ohne Live-Markdown-Rendering (fett oder Links werden innerhalb einer Zelle nicht mehr
     dargestellt) — das wäre wieder genau das Nachbauen von Cursor-Logik, das hier verschwinden soll.
  */
  function renderTableLine(raw, idx, block){
    if(idx === block.sep) return '<span class="line line-table-sep" data-line="'+idx+'">\n'+escapeHtml(raw)+'\n</span>';
    const isHead = idx === block.start;
    const bodyPos = idx - block.sep - 1;               // 0-based position in the body (zebra striping)
    const cls = ["line", "line-table"];
    if(isHead) cls.push("line-table-head", "line-table-first");
    if(idx === block.end) cls.push("line-table-last");
    if(!isHead && bodyPos % 2 === 1) cls.push("line-table-alt");
    let cells = tableRowCells(raw) || [];
    const overflow = cells.length > block.cols;
    if(overflow) cells = cells.slice(0, block.cols - 1).concat([cells.slice(block.cols - 1).join(" | ")]);
    while(cells.length < block.cols) cells.push("");
    let out = '<span class="'+cls.join(" ")+'" data-line="'+idx+'" data-table-start="'+block.start+'" data-table-end="'+block.end+'" data-cols="'+block.cols+'" contenteditable="false">';
    out += '<span class="marker td-pipe">| </span>';
    for(let c=0;c<block.cols;c++){
      const last = c === block.cols - 1;
      const tdCls = ["td"];
      if(c === 0) tdCls.push("td-first");
      if(last){ tdCls.push("td-last"); if(overflow) tdCls.push("td-overflow"); }
      const align = block.align[c];
      out += '<span class="'+tdCls.join(" ")+'" data-col="'+c+'" contenteditable="true" tabindex="-1" style="flex-basis:'+block.widths[c].toFixed(3)+'%'+(align?";text-align:"+align:"")+'">'
           + escapeHtml(cells[c]) + '</span>';
      if(!last) out += '<span class="marker td-pipe"> | </span>';
    }
    return out + '<span class="marker td-pipe"> |</span></span>';
  }

  function joinRenderedLines(htmls){
    let out = htmls[0] || "";
    for(let i=1;i<htmls.length;i++){
      const isSep = h => h.startsWith('<span class="line line-table-sep"');
      const sep = isSep(htmls[i]) || isSep(htmls[i-1]);
      out += (sep ? "" : "\n") + htmls[i];
    }
    return out;
  }

  /* ---------------- Table editing: cells, rows, columns, resize, toolbar, grips ---------------- */
  function rebuildTableRow(cells){ return "| " + cells.join(" | ") + " |"; }
  function rebuildSepRow(cells){ return rebuildTableRow(cells.map(c => isTableSepCell(c) ? String(c).trim() : "---")); }
  function blankTableRow(cols){ return rebuildTableRow(new Array(cols).fill("")); }
  // A row padded/clipped to the block's column count: ragged rows (too few or too many "|") get
  // straightened out by any structural edit instead of staying broken forever.
  function tableRowCellsPadded(lines, i, block){
    const fill = i === block.sep ? "---" : "";
    const cells = (tableRowCells(lines[i]) || []).slice(0, block.cols);
    while(cells.length < block.cols) cells.push(fill);
    return cells;
  }
  function mapTableRows(lines, block, fn){
    const out = lines.slice();
    for(let i=block.start;i<=block.end;i++){
      const next = fn(tableRowCellsPadded(lines, i, block), i);
      out[i] = i === block.sep ? rebuildSepRow(next) : rebuildTableRow(next);
    }
    return out;
  }
  function commitTableEdit(lines, caretLine, caretCol){
    const l = Math.max(0, Math.min(caretLine, lines.length - 1));
    commitText(lines.join("\n"), (lineStartsOf(lines)[l] || 0) + Math.max(0, caretCol));
  }
  // Commit, then put the caret into a cell with its content selected (spreadsheet-style, so the
  // next keystroke overwrites it) and re-place the toolbar/grips over the new layout.
  function afterTableEdit(lines, line, col){
    // selectTableCell must land in the real cell in the SAME tick as the commit above — deferring
    // it to requestAnimationFrame (as before) left a window where the caret sat wherever the old
    // document-wide offset path put it (often a non-editable marker span), and a keystroke arriving
    // inside that window was silently swallowed (typed into nothing). refreshTableUI alone still
    // benefits from waiting a frame (it measures layout of the just-rendered row).
    commitTableEdit(lines, line, 0);
    selectTableCell(lines, line, col);
    requestAnimationFrame(refreshTableUI);
  }

  // Typing "/table" (or "/tabelle", or "/table4x3" for a given size) then Enter or Space on an
  // otherwise empty line expands to a starter table. No space before the size: Space is itself a
  // trigger, so "/table 4x3" would already have expanded at the space.
  function expandTableTrigger(){
    if(!currentNote) return false;
    const { start, end } = getSelectionOffsets(editorEl);
    if(start !== end) return false;
    const lines = cleanText(editorEl.textContent).split("\n");
    const pos = lineIndexAndColAt(lines, lineStartsOf(lines), start);
    if(pos.col !== lines[pos.line].length) return false;
    const m = /^\/(?:table|tabelle)(?:(\d{1,2})[x*](\d{1,2}))?$/i.exec(lines[pos.line].trim());
    if(!m) return false;
    const cols = Math.min(12, Math.max(1, parseInt(m[1], 10) || 3));
    const rows = Math.min(50, Math.max(1, parseInt(m[2], 10) || 2));
    const starter = [rebuildTableRow(Array.from({ length: cols }, (_, i) => "Spalte " + (i+1))),
                     rebuildSepRow(new Array(cols).fill("---"))];
    for(let r=0;r<rows;r++) starter.push(blankTableRow(cols));
    const newLines = lines.slice(); newLines.splice(pos.line, 1, ...starter);
    if(pos.line + starter.length >= newLines.length) newLines.push("");   // leave a line to write on
    afterTableEdit(newLines, pos.line, 0);
    return true;
  }

  function tableCellRangeAt(lines, lineIdx, col){
    const bounds = tableRowBounds(lines[lineIdx]);
    if(!bounds) return [0, 0];
    if(bounds[col]) return bounds[col];
    const e = bounds[bounds.length - 1][1];
    return [e, e];
  }
  function tableCellContentRange(lines, lineIdx, col){
    const [s, e] = tableCellRangeAt(lines, lineIdx, col);
    const raw = lines[lineIdx].slice(s, e);
    const lead = raw.length - raw.trimStart().length, trail = raw.length - raw.trimEnd().length;
    // an all-blank cell keeps its full span, so there is always at least one caret position
    return lead + trail < raw.length ? [s + lead, e - trail] : [s, e];
  }
  // Spreadsheet-style: land in a cell with its content selected, so the next keystroke overwrites
  // it. `lines` is unused now (kept so every existing call site stays unchanged) — the cell is a
  // real, independent contenteditable, so no document-wide offset is needed to select its content.
  function selectTableCell(lines, lineIdx, col){
    focusTableCell(lineIdx, col, { selectAll: true });
  }
  function tableColAt(line, col){
    const bounds = tableRowBounds(line);
    if(!bounds) return 0;
    for(let c=0;c<bounds.length;c++){ if(col <= bounds[c][1]) return c; }
    return bounds.length - 1;
  }
  function tableContextAt(lines, lineIdx, col){
    const block = findTableBlock(lines, lineIdx);
    if(!block || lineIdx === block.sep) return null;
    return { lines, block, line: lineIdx, col: Math.max(0, Math.min(col, block.cols - 1)) };
  }
  // The focus-is-in-a-cell case is now the common one: read {line, col} straight off the cell's
  // own data attributes, no offset math needed at all. The old whole-document offset path stays as
  // a fallback for when the caret is in plain text approaching/leaving a table (table-arrow-rescue).
  function currentTableContext(){
    if(!currentNote) return null;
    const active = document.activeElement;
    const td = active && active.closest && active.closest(".td");
    if(td){
      const rowEl = td.closest(".line-table");
      const lineIdx = rowEl && parseInt(rowEl.dataset.line, 10);
      const col = parseInt(td.dataset.col, 10);
      if(rowEl && !Number.isNaN(lineIdx) && !Number.isNaN(col) && prevLines.length) return tableContextAt(prevLines, lineIdx, col);
    }
    // Uses the selection's START - a whole cell is often selected (e.g. right after Tab/Enter),
    // and that is still unambiguously "inside this table cell" for toolbar/navigation purposes.
    const { start } = getSelectionOffsets(editorEl);
    const lines = cleanText(editorEl.textContent).split("\n");
    const pos = lineIndexAndColAt(lines, lineStartsOf(lines), start);
    return tableContextAt(lines, pos.line, tableColAt(lines[pos.line], pos.col));
  }

  /* ---- Fokus/Cursor innerhalb einer Tabellenzelle: native Range-APIs auf genau diese eine Zelle
     beschränkt, statt der dokumentweiten Offset-Maschinerie (siehe locateOffset weiter unten). ---- */
  function focusTableCell(lineIdx, col, opts){
    opts = opts || {};
    const rowEl = editorEl.children[lineIdx];
    if(!rowEl) return false;
    const td = rowEl.querySelector('.td[data-col="'+col+'"]') || rowEl.querySelector(".td");
    if(!td) return false;
    td.focus();
    const sel = window.getSelection();
    const range = document.createRange();
    if(opts.selectAll){
      range.selectNodeContents(td);
    } else {
      const node = td.firstChild;
      const len = node ? node.textContent.length : 0;
      const off = opts.toStart ? 0 : (typeof opts.offset === "number" ? Math.max(0, Math.min(opts.offset, len)) : len);
      if(node) range.setStart(node, off); else range.setStart(td, 0);
      range.collapse(true);
    }
    sel.removeAllRanges();
    sel.addRange(range);
    return true;
  }
  // Caret offset within just this one cell — a small, bounded Range instead of the whole-document
  // version (getCaretOffset), since a cell is its own tiny editable island now.
  function localCaretOffset(td){
    const sel = window.getSelection();
    if(!sel.rangeCount) return 0;
    const range = sel.getRangeAt(0);
    if(!td.contains(range.startContainer)) return 0;
    const pre = range.cloneRange();
    pre.selectNodeContents(td);
    pre.setEnd(range.startContainer, range.startOffset);
    return pre.toString().length;
  }
  function tdAtBoundary(td, dir){
    const sel = window.getSelection();
    if(!sel.rangeCount || !sel.getRangeAt(0).collapsed) return false;
    const off = localCaretOffset(td);
    return dir < 0 ? off === 0 : off === td.textContent.length;
  }
  // The browser already applied the keystroke to this cell's DOM — read it back, rebuild just this
  // row's markdown line, and commit without touching the DOM (opts.skipRender in commitText).
  // "|" is NOT re-escaped here — the beforeinput handler already escaped it going into the DOM (the
  // one and only place that happens), so the DOM itself is already the parseable, escaped form.
  // Only trimming/newline-stripping still applies, same as cellSafe without its pipe step.
  function syncTableCellEdit(td){
    if(!currentNote) return;
    const rowEl = td.closest(".line-table");
    if(!rowEl || !prevLines.length) return;
    const i = parseInt(rowEl.dataset.line, 10);
    if(Number.isNaN(i) || i >= prevLines.length) return;
    const cells = Array.from(rowEl.querySelectorAll(".td")).map(t => t.textContent.replace(/\r?\n/g, " ").trim());
    const newLines = prevLines.slice();
    newLines[i] = rebuildTableRow(cells);
    historyKind = "type";
    try{ commitText(newLines.join("\n"), 0, { skipRender: true }); } finally { historyKind = "op"; }
  }

  /* Leaving a table needs somewhere to land. A table that ends the note has nothing below it, so
     the caret got stuck in the bottom-right cell with no way out at all — arrow keys had nowhere
     to go and Tab/Enter only ever added another row. Now the line gets created on the way out,
     the same way a word processor lets you walk off the end of a table. */
  function tableExitBelow(lines, block){
    if(block.end + 1 < lines.length){
      setCaretOffset(editorEl, lineStartsOf(lines)[block.end + 1]);
      refreshTableUI();
      return;
    }
    const newLines = lines.slice();
    newLines.push("");
    commitTableEdit(newLines, newLines.length - 1, 0);
    requestAnimationFrame(refreshTableUI);
  }
  function tableExitAbove(lines, block){
    if(block.start > 0){
      setCaretOffset(editorEl, lineStartsOf(lines)[block.start - 1] + lines[block.start - 1].length);
      refreshTableUI();
      return;
    }
    const newLines = lines.slice();
    newLines.unshift("");
    commitTableEdit(newLines, 0, 0);
    requestAnimationFrame(refreshTableUI);
  }

  // Stepping across rows always has to hop over the hidden separator row.
  function tableRowAfter(block, line){ return line === block.start ? block.sep + 1 : line + 1; }
  function tableRowBefore(block, line){ return line === block.sep + 1 ? block.start : line - 1; }

  function tableAppendRow(ctx, col){
    const { lines, block } = ctx;
    const newLines = lines.slice();
    newLines.splice(block.end + 1, 0, blankTableRow(block.cols));
    afterTableEdit(newLines, block.end + 1, col || 0);
  }
  // Tab / Shift+Tab: next/previous cell with its content selected. Tab past the very last cell
  // (like Enter on the last row) appends a fresh row.
  function tableMoveCell(ctx, dir){
    const { lines, block } = ctx;
    let line = ctx.line, col = ctx.col + dir;
    if(col >= block.cols){
      if(line === block.end){ tableAppendRow(ctx, 0); return; }
      line = tableRowAfter(block, line); col = 0;
    } else if(col < 0){
      if(line === block.start) return;                 // already in the very first cell
      line = tableRowBefore(block, line); col = block.cols - 1;
    }
    selectTableCell(lines, line, col);
    refreshTableUI();
  }
  // Enter inside a table: one row down, same column; on the last row it appends a new one.
  function tableEnter(ctx){
    const { lines, block, line, col } = ctx;
    if(line === block.end){ tableAppendRow(ctx, col); return; }
    selectTableCell(lines, tableRowAfter(block, line), col);
    refreshTableUI();
  }
  /* Arrow Up/Down inside a table moves to the same column one row up/down, and steps out of the
     table at its edges. The within-cell horizontal position is preserved via a small local Range
     on the currently focused cell — no document-wide offset math needed any more. */
  function tableArrowVertical(ctx, dir){
    const { lines, block, line, col } = ctx;
    const td = document.activeElement && document.activeElement.closest && document.activeElement.closest(".td");
    const within = td ? localCaretOffset(td) : 0;
    const to = dir < 0
      ? (line === block.start ? block.start - 1 : tableRowBefore(block, line))
      : (line === block.end ? block.end + 1 : tableRowAfter(block, line));
    if(to < block.start || to > block.end){           // leaving the table
      if(dir < 0) tableExitAbove(lines, block); else tableExitBelow(lines, block);
      return true;
    }
    focusTableCell(to, col, { offset: within });
    refreshTableUI();
    return true;
  }
  /* Left/Right at a cell's edge: tdAtBoundary checks (via a Range local to the focused cell) that
     the caret is really at that edge before hopping to the neighbour — inside the cell's own text
     the browser is left to do its job, same as any other native contenteditable. */
  function tableArrowHorizontal(ctx, dir){
    const { lines, block, line, col } = ctx;
    const td = document.activeElement && document.activeElement.closest && document.activeElement.closest(".td");
    if(!td || !tdAtBoundary(td, dir)) return false;
    let toLine = line, toCol = col + dir;
    if(toCol < 0){
      if(line === block.start){ tableExitAbove(lines, block); return true; }   // top-left corner
      toLine = tableRowBefore(block, line); toCol = block.cols - 1;
    } else if(toCol >= block.cols){
      if(line === block.end){ tableExitBelow(lines, block); return true; }     // bottom-right corner
      toLine = tableRowAfter(block, line); toCol = 0;
    }
    focusTableCell(toLine, toCol, dir < 0 ? {} : { toStart: true });
    refreshTableUI();
    return true;
  }
  /* The mirror image: crossing a table's *outer* edge. The browser refuses that
     outright — the caret just sits still, whether you arrow down into a table from the line
     above or up out of the line below, so without this you can only get in and out by clicking.
     Rather than guess when the browser will fail, let its own move run and step in only when
     the caret really did not budge. */
  function tableArrowRescue(dir, horizontal){
    if(!currentNote) return;
    const at = getSelectionOffsets(editorEl);
    if(at.start !== at.end) return;
    const rect = caretRect();
    const x = rect ? rect.left : null;
    requestAnimationFrame(()=>{
      const now = getSelectionOffsets(editorEl);
      if(now.start !== at.start || now.end !== at.end) return;     // the browser managed on its own
      const lines = prevLines;
      const starts = lineStartsOf(lines);
      const pos = lineIndexAndColAt(lines, starts, at.start);
      if(horizontal){
        const to = at.start + dir;
        if(to < 0 || to > lines.join("\n").length) return;          // really is the note's start/end
        const p = lineIndexAndColAt(lines, starts, to);
        const block = findTableBlock(lines, p.line);
        if(!block){
          setCaretOffset(editorEl, to);
        } else {
          const row = p.line === block.sep ? (dir > 0 ? block.sep + 1 : block.start) : p.line;
          focusTableCell(row, dir > 0 ? 0 : block.cols - 1, dir > 0 ? { toStart: true } : {});
        }
        refreshTableUI();
        return;
      }
      const to = pos.line + dir;
      if(to < 0 || to >= lines.length) return;                     // really is the note's first/last line
      const block = findTableBlock(lines, to);
      if(!block){
        setCaretOffset(editorEl, starts[to] + Math.min(pos.col, lines[to].length));
      } else {
        const row = to === block.sep ? (dir > 0 ? block.sep + 1 : block.start) : to;
        focusTableCell(row, x == null ? 0 : tableColAtX(row, x), {});
      }
      refreshTableUI();
    });
  }
  // Which column sits under this screen x — keeps the horizontal position when the caret steps
  // into a table row from outside.
  function tableColAtX(rowIdx, x){
    const rowEl = editorEl.children[rowIdx];
    if(!rowEl) return 0;
    const tds = Array.from(rowEl.querySelectorAll(".td"));
    for(let i=0;i<tds.length;i++){
      if(x <= tds[i].getBoundingClientRect().right || i === tds.length - 1) return i;
    }
    return 0;
  }
  // Home/End belong to the cell, not to the line (whose ends are the "|" characters).
  function tableHomeEnd(ctx, toEnd){
    focusTableCell(ctx.line, ctx.col, toEnd ? {} : { toStart: true });
    refreshTableUI();
  }

  function tableDeleteRow(ctx){
    const { lines, block, line, col } = ctx;
    if(line <= block.sep) return;                                   // the header row is structural
    // The last body row is emptied rather than removed: "delete row" should never make the whole
    // table disappear behind your back — deleting the header row (see renderTableGrips) is the
    // explicit, separate gesture for that.
    if(block.end === block.sep + 1){ tableClearRow(ctx); return; }
    const newLines = lines.slice(); newLines.splice(line, 1);
    afterTableEdit(newLines, Math.min(line, block.end - 1), col);
    toast("Zeile gelöscht", { actionLabel: "Rückgängig", onAction: ()=> stepHistory(-1) });
  }
  function tableClearRow(ctx){
    const { lines, block, line, col } = ctx;
    afterTableEdit(mapTableRows(lines, block, (cells, i) => i === line ? cells.map(()=>"") : cells), line, col);
    toast("Zeile geleert", { actionLabel: "Rückgängig", onAction: ()=> stepHistory(-1) });
  }
  function tableClearColumn(ctx){
    const { lines, block, line, col } = ctx;
    afterTableEdit(mapTableRows(lines, block, (cells, i) => {
      if(i !== block.sep) cells[col] = "";
      return cells;
    }), line, col);
    toast("Spalte geleert", { actionLabel: "Rückgängig", onAction: ()=> stepHistory(-1) });
  }
  function tableMoveRow(ctx, dir){
    const { lines, block, line, col } = ctx;
    if(line <= block.sep) return;
    const to = line + dir;
    if(to <= block.sep || to > block.end) return;
    const newLines = lines.slice();
    newLines.splice(to, 0, newLines.splice(line, 1)[0]);
    afterTableEdit(newLines, to, col);
  }
  // Drag-and-drop reorder: move a row any distance in one commit, not one step at a time.
  function tableMoveRowTo(ctx, from, to){
    const { lines, block } = ctx;
    if(from === to || from <= block.sep || to <= block.sep || from > block.end || to > block.end) return;
    const newLines = lines.slice();
    newLines.splice(to, 0, newLines.splice(from, 1)[0]);
    afterTableEdit(newLines, to, 0);
  }
  function tableInsertColumn(ctx, before){
    const { lines, block, line } = ctx;
    const at = before ? ctx.col : ctx.col + 1;
    afterTableEdit(mapTableRows(lines, block, (cells, i) => {
      cells.splice(at, 0, i === block.sep ? "---" : "");
      return cells;
    }), line, at);
  }
  function tableDeleteColumn(ctx){
    const { lines, block, line, col } = ctx;
    if(block.cols <= 1){ tableClearColumn(ctx); return; }            // same idea as the last row
    afterTableEdit(mapTableRows(lines, block, cells => { cells.splice(col, 1); return cells; }),
                   line, Math.max(0, Math.min(col, block.cols - 2)));
    toast("Spalte gelöscht", { actionLabel: "Rückgängig", onAction: ()=> stepHistory(-1) });
  }
  function tableMoveColumn(ctx, dir){
    const { lines, block, line, col } = ctx;
    const to = col + dir;
    if(to < 0 || to >= block.cols) return;
    afterTableEdit(mapTableRows(lines, block, cells => {
      cells.splice(to, 0, cells.splice(col, 1)[0]);
      return cells;
    }), line, to);
  }
  // Drag-and-drop reorder: move a column any distance in one commit, not one step at a time.
  function tableMoveColumnTo(ctx, from, to){
    const { lines, block } = ctx;
    if(from === to || from < 0 || to < 0 || from >= block.cols || to >= block.cols) return;
    afterTableEdit(mapTableRows(lines, block, cells => {
      cells.splice(to, 0, cells.splice(from, 1)[0]);
      return cells;
    }), block.start, to);
  }
  function tableSetWidths(ctx, pcts){
    const { lines, block, line, col } = ctx;
    const newLines = lines.slice();
    newLines[block.sep] = rebuildSepRow(sepCellsFromWidths(pcts, block.align));
    afterTableEdit(newLines, line, col);
  }
  // Pure text-level function, not wired to any UI right now (the toolbar that called it is gone) —
  // kept because test-tables.js checks it directly as part of the markdown-level test baseline.
  // Sort the body rows by the active column. Text-aware, so "Pos 2" sorts before "Pos 10" and
  // empty cells always sink to the bottom; equal keys keep their previous order.
  function tableSort(ctx, dir){
    const { lines, block, col } = ctx;
    const body = lines.slice(block.sep + 1, block.end + 1);
    if(body.length < 2) return;
    const key = l => ((tableRowCells(l) || [])[col] || "").trim();
    const decorated = body.map((l, i) => ({ l, i }));
    decorated.sort((a, b) => {
      const ka = key(a.l), kb = key(b.l);
      if(ka === kb) return a.i - b.i;
      if(ka === "") return 1;
      if(kb === "") return -1;
      return dir * ka.localeCompare(kb, "de", { numeric: true, sensitivity: "base" });
    });
    const newLines = lines.slice();
    newLines.splice(block.sep + 1, body.length, ...decorated.map(d => d.l));
    afterTableEdit(newLines, block.sep + 1, col);
  }
  function tableDeleteTable(ctx){
    const { lines, block } = ctx;
    const newLines = lines.slice();
    newLines.splice(block.start, block.end - block.start + 1);
    const at = Math.max(0, Math.min(block.start, newLines.length - 1));
    commitText(newLines.join("\n"), newLines.length ? lineStartsOf(newLines)[at] : 0);
    closeTableToolbar();
    toast("Tabelle gelöscht", { actionLabel: "Rückgängig", onAction: ()=> stepHistory(-1) });
  }

  /* ---- deleting / typing over a selection that covers several cells ----
     Left to the browser, both would swallow the "|" between the cells and collapse the whole
     table into a single line. Confluence clears the covered cells instead, and so does this. */
  function tableSelectionSpan(){
    if(!currentNote) return null;
    // Each cell is its own contenteditable island now — a native selection cannot span more than
    // one of them (that's cross-cell range-select, deferred).
    if(document.activeElement && document.activeElement.closest && document.activeElement.closest(".td")) return null;
    const { start, end } = getSelectionOffsets(editorEl);
    if(start === end) return null;
    const lines = cleanText(editorEl.textContent).split("\n");
    const starts = lineStartsOf(lines);
    const a = lineIndexAndColAt(lines, starts, start), b = lineIndexAndColAt(lines, starts, end);
    const block = findTableBlock(lines, a.line);
    if(!block || b.line < block.start || b.line > block.end) return null;
    const ca = tableColAt(lines[a.line], a.col), cb = tableColAt(lines[b.line], b.col);
    if(a.line === b.line && ca === cb) return null;                 // stays inside one cell
    return { lines, block, l1: Math.min(a.line, b.line), l2: Math.max(a.line, b.line),
             c1: Math.min(ca, cb), c2: Math.max(ca, cb) };
  }
  function clearTableSpan(span, insert){
    const { lines, block } = span;
    const newLines = mapTableRows(lines, block, (cells, i) => {
      if(i < span.l1 || i > span.l2 || i === block.sep) return cells;
      for(let c=span.c1;c<=span.c2 && c<block.cols;c++) cells[c] = "";
      return cells;
    });
    let line = Math.max(span.l1, block.start);
    if(line === block.sep) line = block.sep + 1;
    if(!insert){ afterTableEdit(newLines, line, span.c1); return; }
    const cells = tableRowCellsPadded(newLines, line, block);
    cells[span.c1] = insert.replace(/\|/g, "\\|");
    newLines[line] = rebuildTableRow(cells);
    commitTableEdit(newLines, line, tableCellContentRange(newLines, line, span.c1)[1]);
    requestAnimationFrame(refreshTableUI);
  }
  // Used to protect the "|" at a cell's edge from native deletion — now that a cell is its own
  // contenteditable island, there is nothing there to protect: Backspace/Delete at a cell boundary
  // natively does nothing (no neighbouring character to reach across the island's own boundary).
  // Only the cross-cell-selection case (still possible only outside the new per-cell model) remains.
  function handleTableDeleteKey(){
    const span = tableSelectionSpan();
    if(span){ clearTableSpan(span, null); return true; }
    return false;
  }

  /* ---- floating toolbar + column/row grips ---- */
  const tableGripsEl = document.getElementById("table-grips");
  let tableSel = null;          // {kind:"col"|"row", index} - a column/row picked via its grip
  let tableResize = null;       // live column-resize drag
  let tableDrag = null;         // live row/column reorder drag (grip mousedown + move past a threshold)
  let tableUiDismissed = null;  // {line, col} — Esc hid the grips for this cell
  const TABLE_MIN_PCT = 6;
  const TABLE_MAX_COLS = 24;
  const TABLE_MAX_W = 1100;     // a table may grow this wide before the extra space is wasted

  function wideTablesOn(){ return !!(store.ui && store.ui.wideTables === true); }   // Standard: so breit wie der Text (ruhiger)

  /* Prose reads best in a narrow column, a table does not. This works out how far a table may
     bleed out of the text column on each side — symmetrically, so it stays centred on the text —
     and leaves a margin for the row grips on the left and the "+" button on the right. */
  function updateTableBleed(){
    let bleed = 0;
    if(wideTablesOn()){
      const wrapR = editorWrap.getBoundingClientRect(), edR = editorEl.getBoundingClientRect();
      const cs = getComputedStyle(editorEl);
      const padL = parseFloat(cs.paddingLeft) || 0, padR = parseFloat(cs.paddingRight) || 0;
      const contentW = edR.width - padL - padR;
      const room = Math.min((edR.left + padL) - wrapR.left - 26, wrapR.right - (edR.right - padR) - 26);
      bleed = Math.max(0, Math.min(room, (TABLE_MAX_W - contentW) / 2));
    }
    const next = Math.round(bleed) + "px";
    if(editorEl.style.getPropertyValue("--table-bleed") === next) return;
    editorEl.style.setProperty("--table-bleed", next);
    scheduleTableUI();                                 // the grips sit on the cell edges
  }
  // Catches everything that changes the available width: window resize, sidebar, outline, focus mode.
  if(window.ResizeObserver){
    const ro = new ResizeObserver(()=> updateTableBleed());
    ro.observe(editorWrap);
    ro.observe(editorEl);
  }

  function tableRowLineEls(block){
    const out = [];
    for(let i=block.start;i<=block.end;i++){
      if(i === block.sep) continue;
      const el = editorEl.children[i];
      if(el) out.push({ i, el });
    }
    return out;
  }
  function renderTableGrips(ctx, wrapR){
    const b = ctx.block;
    const rows = tableRowLineEls(b);
    const headEl = rows.length ? rows[0].el : null;
    const cells = headEl ? Array.from(headEl.querySelectorAll(".td")) : [];
    if(!cells.length){ closeTableGrips(); return; }
    const hr = headEl.getBoundingClientRect();
    const top = hr.top, bottom = rows[rows.length - 1].el.getBoundingClientRect().bottom;
    const inView = y => y >= wrapR.top + 3 && y <= wrapR.bottom - 3;
    const box = o => Object.keys(o).map(k => k + ":" + o[k] + "px").join(";");
    const parts = [];
    cells.forEach((cell, c) => {
      const cr = cell.getBoundingClientRect();
      const colSelected = tableSel && tableSel.kind === "col" && tableSel.index === c;
      if(inView(top - 14)){
        // Selected once = highlighted handle; clicking the already-selected handle again deletes
        // it (see the mouseup handler) — the "✕" inside is the only visual cue that needs, and it
        // can never end up positioned off-screen the way a separate floating button could.
        parts.push('<div class="tg-col'+(colSelected ? " on" : "")+
          '" data-col="'+c+'" title="Spalte '+(c+1)+' auswählen (nochmal: löschen), ziehen zum Verschieben" style="'+
          box({ left: cr.left + 2, top: top - 14, width: Math.max(10, cr.width - 4), height: 11 })+'">'+(colSelected?'<span class="tg-x">✕</span>':"")+'</div>');
      }
      if(c < cells.length - 1){
        const y1 = Math.max(top, wrapR.top), y2 = Math.min(bottom, wrapR.bottom);
        if(y2 > y1 + 4){
          parts.push('<div class="tg-resize" data-edge="'+c+'" title="Spaltenbreite ziehen" style="'+
            box({ left: cr.right - 4, top: y1, width: 8, height: y2 - y1 })+'"></div>');
        }
      }
    });
    rows.forEach(({ i, el }) => {
      const rr = el.getBoundingClientRect();
      const y1 = Math.max(rr.top + 2, wrapR.top), y2 = Math.min(rr.bottom - 2, wrapR.bottom);
      if(y2 <= y1 + 3) return;
      const selected = tableSel && tableSel.kind === "row" && tableSel.index === i;
      const isHead = i === b.start;
      // The header row can't delete itself as "a row" (every table needs one) — selecting and
      // re-clicking it instead deletes the whole table. Same gesture everywhere, no separate
      // "delete table" control needed now that the toolbar (which had one) is gone.
      const delable = selected;
      const title = !delable ? "Zeile auswählen, ziehen zum Verschieben"

  /* ---- grids in and out: Excel/Numbers/Sheets and copied Markdown tables ---- */
  function parseGrid(text){

  function cellSafe(s){ return String(s).replace(/\r?\n/g, " ").replace(/\|/g, "\\|").trim(); }
  function tsvToTable(text){
    const rows = parseGrid(text);

    const cols = Math.min(TABLE_MAX_COLS, Math.max(...rows.map(r => r.length)));
    const pad = r => { const c = r.slice(0, cols).map(cellSafe); while(c.length < cols) c.push(""); return c; };
    const out = [rebuildTableRow(pad(rows[0])), rebuildSepRow(new Array(cols).fill("---"))];
    for(let i=1;i<rows.length;i++) out.push(rebuildTableRow(pad(rows[i])));

  }
  // Pasting a grid *into* a table fills cells from the current one and grows the table to fit,

      // not left to the beforeinput handler: a paste driven through execCommand like this does not

  /* Tempo: Ändert sich die Zeilenzahl (Enter, Zeilen zusammenführen, Einfügen), nur den geänderten Abschnitt

     Nur wenn der DOM sicher zum alten Stand passt und weder Codeblöcke noch Tabellen den Abschnitt berühren
     (deren Darstellung hängt an Nachbarzeilen); sonst false → kompletter Neuaufbau wie bisher. */
  function spliceLines(prev, lines){
    if(!prev.length || editorEl.children.length !== prev.length) return false;

    while(a < lines.length && a < prev.length && lines[a] === prev[a]) a++;
    while(t < lines.length - a && t < prev.length - a && lines[lines.length - 1 - t] === prev[prev.length - 1 - t]) t++;

    if(near(prev, a, oldEnd) || near(lines, a, newEnd) || prev.some(l => /^```/.test(l))) return false;

  function fullRebuild(lines){

  // Für jede Überschrift die Kette der übergeordneten Überschriften (ohne Codeblöcke). Läuft nach jedem

  function updateHeadingPaths(lines){

    for(let i=0;i<lines.length;i++){

      // Column widths now come from the separator row instead of the cell contents, so typing
      // in a cell neither reshuffles the columns nor rebuilds the whole document any more.
