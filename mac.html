    const o = e.target.closest("[data-open]");
    dlgOrigin = o && !o.closest("#dialog") ? { id: o.dataset.open, t: performance.now(), rect: o.getBoundingClientRect() } : null;
  }, true);
  function reducedMotion(){ return matchMedia("(prefers-reduced-motion: reduce)").matches; }

  /* ---------- Lebendigkeit: Töne, bewegte Listen, Druck mit Feder, Sync-Puls (gleich am Mac und am Handy) ---------- */

  /* Töne (Einstellungen → Töne, standardmäßig aus): kurz, leise, im Browser erzeugt — keine Dateien.
     tick = Haken gesetzt, done = Ticket erledigt, all = letzte offene Aufgabe einer Liste abgehakt. */
  let audioCtx = null;
  function soundOn(){ return !!(store.ui && store.ui.sounds); }
  function sound(kind){
    if(!soundOn()) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
      const t0 = audioCtx.currentTime + 0.01;
      const notes = kind === "tick" ? [[1320, 0, .06, .045]]
                  : kind === "done" ? [[784, 0, .18, .06], [1175, .09, .3, .06]]
                  : [[659, 0, .16, .05], [880, .08, .16, .05], [1319, .16, .4, .06]];
      notes.forEach(([f, at, len, vol]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = kind === "tick" ? "triangle" : "sine";
        o.frequency.setValueAtTime(f, t0 + at);
        if(kind === "tick") o.frequency.exponentialRampToValueAtTime(f * .55, t0 + at + len);
        g.gain.setValueAtTime(0, t0 + at);
        g.gain.linearRampToValueAtTime(vol, t0 + at + .006);
        g.gain.exponentialRampToValueAtTime(.0001, t0 + at + len);
        o.connect(g).connect(audioCtx.destination);
        o.start(t0 + at); o.stop(t0 + at + len + .03);
      });
    }catch(e){}
  }

  /* Listen bewegen sich statt zu springen (FLIP): vor dem Neuzeichnen merkt sich die Liste, wo jeder Eintrag
     stand; danach gleitet jeder vom alten an den neuen Platz, neue Einträge blenden weich ein, die Lücke eines
     entfernten schließt sich durch das Nachrücken. War die Liste vorher unsichtbar (Ansichtswechsel), passiert nichts. */
  function flipKey(e){
    return e.dataset.open || e.dataset.k || e.dataset.sideNote || (e.dataset.sideToggle ? "f:" + e.dataset.sideToggle : "");
  }
  function flipSnap(root, sel, keyOf){
    const m = new Map();
    if(root) root.querySelectorAll(sel).forEach(e => {
      const k = keyOf(e), r = e.getBoundingClientRect();
      if(k && (r.width || r.height) && !m.has(k)) m.set(k, r);

  }
  function flipPlay(root, sel, keyOf, before, opts){
    if(!root || !before.size || reducedMotion()) return;
    const items = [...root.querySelectorAll(sel)];
    const enter = !(opts && opts.enterOnGrow) || items.length > before.size;
    const seen = new Set();
    items.forEach(e => {
      const k = keyOf(e);
      if(!k || seen.has(k)) return;
      seen.add(k);
      const r = e.getBoundingClientRect();
      if(!r.width && !r.height) return;
      const b = before.get(k);
      if(!b){
        if(enter) e.animate([{ opacity:0, transform:"scale(.97)" }, { opacity:1, transform:"none" }],
          { duration:280, delay:70, easing:"cubic-bezier(.2,.8,.2,1)", fill:"backwards" });
        return;

      const dx = b.left - r.left, dy = b.top - r.top;
      if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      e.animate([{ transform:"translate(" + dx + "px," + dy + "px)" }, { transform:"none" }],
        { duration:380, easing:"cubic-bezier(.2,.9,.25,1)" });

  function withFlip(render, rootOf, sel, opts){

    return function(){
      if(flipHold) return render.apply(this, arguments);
      const before = flipSnap(rootOf.apply(this, arguments), sel, keyOf);
      const res = render.apply(this, arguments);
      flipPlay(rootOf.apply(this, arguments), sel, keyOf, before, opts);
      return res;
    };
  }

  /* Druck mit Feder: Zeilen und Karten geben beim Drücken minimal nach und federn beim Loslassen mit leichtem
     Überschwingen zurück. Über die eigene scale-Eigenschaft, damit es sich nicht mit Wisch- oder Ziehbewegungen
     (transform) beißt. Kurze Verzögerung, damit beim Scrollen nichts zuckt. */
  function pressSpring(selector){
    let cur = null, timer = 0, x0 = 0, y0 = 0;
    const release = () => {
      clearTimeout(timer);
      const el = cur; cur = null;
      if(!el || !el._pressed) return;
      el._pressed = false;
      if(el._pressAnim){ el._pressAnim.cancel(); el._pressAnim = null; }   // gedrückten Zustand lösen, dann federn
      el.animate([{ scale:".975" }, { scale:"1" }], { duration:420, easing:"cubic-bezier(.34,1.56,.64,1)" });
    };
    document.addEventListener("pointerdown", e => {
      if(reducedMotion() || e.button > 0) return;
      const el = e.target.closest && e.target.closest(selector);
      if(!el || e.target.closest("input, textarea, [contenteditable='true'], button, .tcheck, .check, .md-checkbox")) return;
      cur = el; x0 = e.clientX; y0 = e.clientY;
      timer = setTimeout(()=>{ if(cur !== el) return; el._pressed = true;
        el._pressAnim = el.animate([{ scale:"1" }, { scale:".975" }], { duration:110, easing:"ease-out", fill:"forwards" }); }, 55);
    }, true);
    document.addEventListener("pointermove", e => { if(cur && Math.hypot(e.clientX - x0, e.clientY - y0) > 8) release(); }, true);
    ["pointerup", "pointercancel", "dragstart", "scroll"].forEach(ev => document.addEventListener(ev, release, true));
  }

  /* Ziehen: das gezogene Element hebt sich mit Schatten und kippt leicht (eigenes Zieh-Bild statt Browser-Kopie) */
  function tiltDragImage(e, node){

    const wrap = document.createElement("div"), clone = node.cloneNode(true);
    wrap.className = "drag-ghost";
    wrap.style.cssText = "position:fixed;left:-9999px;top:0;padding:" + pad + "px;pointer-events:none;";
    clone.style.width = r.width + "px"; clone.classList.remove("drag", "dragging");
    wrap.appendChild(clone); document.body.appendChild(wrap);
    e.dataTransfer.setDragImage(wrap, e.clientX - r.left + pad, e.clientY - r.top + pad);
    setTimeout(()=> wrap.remove(), 0);
  }

  /* Der Sync-Punkt lebt: atmet während des Abgleichs (CSS), schlägt eine Welle, wenn etwas von einem anderen Gerät
     oder von Claude ankommt, und leuchtet kurz nach, wenn Eigenes gespeichert wurde. */
  function syncPulse(kind){
    if(reducedMotion()) return;
    document.querySelectorAll(".sync-dot, .syncdot").forEach(d => {
      d.classList.remove("got", "saved"); void d.offsetWidth; d.classList.add(kind);
      clearTimeout(d._pt); d._pt = setTimeout(()=> d.classList.remove(kind), 1300);
    });
  }
  function hasLocalChanges(){
    const k = sync.state.known;
    return [["n", store.notes], ["f", store.folders], ["t", store.tickets || []]]
      .some(([p, list]) => list.some(x => (k[p + ":" + x.id] || 0) < (x.updatedAt || 1)));
  }

  /* Letzte offene Aufgabe einer Checkliste abgehakt: die ganze Liste quittiert kurz (Haken nacheinander, ein Schimmer
     über die Zeilen), dazu Ton und Haptik. Gibt zurück, ob gefeiert wurde. */
  const TASK_LINE = /^\s*(?:[-*+]|\d+\.)\s+\[( |x|X)\]/;
  function celebrateTaskBlock(lines, idx, lineEl){
    if(!TASK_LINE.test(lines[idx] || "") || /\[ \]/.test(lines[idx])) return false;
    let a = idx, b = idx;
    while(a > 0 && TASK_LINE.test(lines[a - 1])) a--;
    while(b < lines.length - 1 && TASK_LINE.test(lines[b + 1])) b++;
    if(b - a < 1) return false;
    for(let i = a; i <= b; i++) if(/\[ \]/.test(lines[i])) return false;
    sound("all");
    if(!reducedMotion()) for(let i = a; i <= b; i++){

      ln.classList.remove("all-done"); void ln.offsetWidth; ln.classList.add("all-done");
      setTimeout(()=> ln.classList.remove("all-done"), 1200 + (i - a) * 70);

  }

  pressSpring(".trow, .srow, .kcard, .pcard, .note-card, .nrow");

  /* ---------- Schreibgefühl (Mac und Handy gleich): weicher Cursor, Schreibmaschine, Tinte, gleitende Zeilen ----------
     Alles sitzt neben dem Editor (in host), nie im contenteditable selbst — der Text wird nie angefasst.
     - Weicher Cursor: eigener Strich gleitet in 90 ms zur neuen Stelle, blinkt sanft; beim Tippen steht er still.
     - Schreibmaschine: die Cursorzeile bleibt auf 40 % der sichtbaren Höhe, der Text scrollt weich darunter weg.
     - Tinte: frisch getippte Zeichen erscheinen in 170 ms (eine Fläche in Hintergrundfarbe blendet darüber aus).
     - Gleitende Zeilen: neue Zeile öffnet sich, Zeilen darunter rücken weich nach; Einrücken und getauschte Zeilen

  function softCaretOn(){ return !store.ui || store.ui.softCaret !== false; }

  /* Tinte in allen Eingabefeldern (Unteraufgaben, Updates, Titel, Suche, ⌘K, Einstellungen …) — wie im Editor.
     Ein Eingabefeld verrät nicht, wo ein Zeichen steht: einzeilig wird die Breite des Textes bis zum Zeichen mit
     derselben Schrift vermessen, mehrzeilig (textarea) baut ein unsichtbares Spiegelbild denselben Umbruch nach.
     Darüber blendet eine Fläche in der Hintergrundfarbe des Feldes aus. Nicht bei Passwort-, Zahl-, Datums-,
     Farb- und Dateifeldern. */
  let inkCtx = null;
  function inkFieldBox(el, pos){
    const cs = getComputedStyle(el), r = el.getBoundingClientRect();
    const ch = el.value.slice(pos - 1, pos), before = el.value.slice(0, pos - 1);
    if(el.tagName === "INPUT"){
      inkCtx = inkCtx || document.createElement("canvas").getContext("2d");
      inkCtx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      const ls = parseFloat(cs.letterSpacing) || 0;
      const lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.25;
      return { x: r.left + el.clientLeft + parseFloat(cs.paddingLeft) + inkCtx.measureText(before).width + ls * before.length - el.scrollLeft,
               y: r.top + (r.height - lh) / 2, w: inkCtx.measureText(ch).width + ls, h: lh };
    }
    const m = document.createElement("div"), sp = document.createElement("span");
    ["boxSizing", "paddingTop", "paddingRight", "paddingBottom", "paddingLeft", "borderTopWidth", "borderRightWidth", "borderBottomWidth",
     "borderLeftWidth", "fontFamily", "fontSize", "fontWeight", "fontStyle", "letterSpacing", "lineHeight", "textTransform", "tabSize",
     "wordSpacing", "textIndent"].forEach(k => { m.style[k] = cs[k]; });
    Object.assign(m.style, { position: "absolute", left: "-9999px", top: "0", visibility: "hidden", width: r.width + "px",
      whiteSpace: "pre-wrap", overflowWrap: "break-word", wordBreak: cs.wordBreak, borderStyle: "solid" });

  }
  function inkField(el){
    if(reducedMotion()) return;
    const pos = el.selectionStart;
    if(pos == null || pos < 1 || el.selectionEnd !== pos) return;
    const b = inkFieldBox(el, pos);
    if(!b.w || !b.h) return;
    let bg = "", n = el;
    while(n && n !== document.documentElement){
      const c = getComputedStyle(n).backgroundColor;
      if(c && c !== "transparent" && !/rgba\([^)]*,\s*0\)$/.test(c)){ bg = c; break; }
      n = n.parentElement;
    }

    root.innerHTML = '<div class="ipc-hl"></div><svg class="ipc-arrow" viewBox="0 0 24 24"><path d="M4.5 3.5 20 9.6l-7.1 3.3-3.3 7.1Z"/></svg>';
    document.body.appendChild(root);
    const hl = root.firstChild, arrow = root.lastChild, html = document.documentElement;
    let active = false, x = -99, y = -99, target = null, raf = 0, sel = null;
    // Alle Cursor-Regeln der eigenen Stylesheets (auch in @media) in Quelltext-Reihenfolge, Pseudoklassen
    // wie :hover entfernt — wie in CSS gewinnt bei mehreren Treffern die spätere Regel.
    function collect(){
      sel = [{ s:"a[href]", k:"pointer" }];
      const walk = rules => { for(const r of rules){
        if(r.cssRules && !r.selectorText){ walk(r.cssRules); continue; }
        const c = r.style && r.style.cursor;
        if(!c || !r.selectorText || /ipc/.test(r.selectorText)) continue;
        // grab (Kanban-/Plan-Karten, Baum-Zeilen) morpht wie ein Knopf, nur mit größerem Platz —
        // beim Ziehen übernimmt ohnehin der Systemzeiger. Eigene Art "card" statt "pointer", damit
        // controlFor() nur für diese Elemente die Höhenbegrenzung lockert, nicht für jeden Button.
        const k = c === "pointer" ? "pointer" : c === "grab" ? "card" : (c === "auto" || c === "default") ? "plain" : "native";
        r.selectorText.split(",").forEach(part => {
          if(/:active\b/.test(part)) return;     // Zustand beim Drücken (z. B. grabbing), nicht beim Überfahren
          const t = part.replace(/:(hover|active|focus-visible|focus-within|focus)(?![\w-])/g, "").trim();
          try{ document.querySelector(t); sel.push({ s:t, k }); }catch(e){}
        });

      for(const sh of document.styleSheets){ try{ walk(sh.cssRules); }catch(e){} }
    }
    // Vom Element aufwärts: das erste Element mit eigener Cursor-Regel entscheidet (Cursor wird vererbt)
    function kindOf(el){
      // Im Editor und in Eingaben immer der Systemzeiger — auch über Checkboxen und Links im Text
      const field = el.closest('input, textarea, select, [contenteditable="true"], #editor');
      if(field) return ["native", field];
      for(let n = el; n && n !== document.documentElement; n = n.parentElement){
        const inl = n.style && n.style.cursor;
        let k = inl ? (inl === "pointer" ? "pointer" : inl === "grab" ? "card" : inl === "auto" || inl === "default" ? "plain" : "native") : null;
        if(!k) for(const r of sel) if(n.matches(r.s)) k = r.k;
        if(k) return [k, n];
      }
      return ["plain", null];
    }
    function controlFor(n, big){
      const r = n.getBoundingClientRect();
      const maxW = big ? 560 : 420, maxH = big ? 200 : 72;
      return r.width && r.height && r.width <= maxW && r.height <= maxH ? n : null;
    }
    function place(){
      raf = 0;
      arrow.style.translate = (x - 4) + "px " + (y - 3) + "px";   // nicht transform: das würde mitskaliert
      if(target){
        const r = target.getBoundingClientRect(), pad = r.width < 30 || r.height < 22 ? 4 : 0;
        const br = getComputedStyle(target).borderRadius;
        hl.style.left = (r.left - pad) + "px"; hl.style.top = (r.top - pad) + "px";
        hl.style.width = (r.width + 2*pad) + "px"; hl.style.height = (r.height + 2*pad) + "px";
        hl.style.borderRadius = parseFloat(br) ? br : "8px";
        // leichte Parallaxe wie am iPad: die Fläche folgt dem Zeiger ein paar Pixel
        const dx = Math.max(-4, Math.min(4, (x - (r.left + r.width/2)) * .08));
        const dy = Math.max(-3, Math.min(3, (y - (r.top + r.height/2)) * .12));

      }
    }
    function schedule(){ if(!raf) raf = requestAnimationFrame(place); }
    function update(el){
      const [kind, node] = el ? kindOf(el) : ["plain", null];
      const native = kind === "native";
      html.classList.toggle("ipc-native", native);
      root.classList.toggle("native", native);
      const ctl = kind === "pointer" ? controlFor(node) : kind === "card" ? controlFor(node, true) : null;
      if(ctl !== target){
        if(target) target.classList.remove("ipc-t");
        if(ctl) ctl.classList.add("ipc-t");
        // Aus dem Nichts kommend springt die Fläche ohne Gleiten an ihren Platz
        if(!target && ctl){ hl.style.transition = "none"; target = ctl; place(); void hl.offsetWidth; hl.style.transition = ""; }
        target = ctl;
      }
      root.classList.toggle("morph", !!target);
      schedule();
    }
    document.addEventListener("mousemove", e => {
      if(!active) return;
      x = e.clientX; y = e.clientY;
      root.classList.add("on");
      if(e.target !== update.last){ update.last = e.target; update(e.target); }
      else schedule();
    }, { passive:true });
    document.addEventListener("mouseout", e => { if(active && !e.relatedTarget){ root.classList.remove("on", "morph"); if(target) target.classList.remove("ipc-t"); target = null; update.last = null; } });
    document.addEventListener("mousedown", () => { if(active) root.classList.add("down"); });
    document.addEventListener("mouseup", () => root.classList.remove("down"));
    document.addEventListener("scroll", () => { if(active && target) schedule(); }, { capture:true, passive:true });
    // Beim Ziehen (Kanban, Ordnerbaum) übernimmt der Systemzeiger mit seinem Drag-Bild
    document.addEventListener("dragstart", () => { if(active){ html.classList.remove("ipc"); root.classList.remove("on"); } });
    document.addEventListener("dragend", () => { if(active) html.classList.add("ipc"); });
    // Nach Klicks wird oft neu gezeichnet: das Element unter dem Zeiger neu bestimmen
    document.addEventListener("click", () => { if(active) requestAnimationFrame(() => { update.last = null;
      const el = document.elementFromPoint(x, y); if(el){ update.last = el; update(el); } }); });
    return {
      apply(){
        active = ipadCursorOn() && matchMedia("(pointer: fine)").matches && !reducedMotion();
        if(active && !sel) collect();
        html.classList.toggle("ipc", active);
        if(!active){ html.classList.remove("ipc-native"); root.className = ""; if(target) target.classList.remove("ipc-t"); target = null; update.last = null; }
      }
    };
  })();
  function slideNumbers(root){ root.querySelectorAll("[data-sn]").forEach(el => slideNumber(el, el.textContent)); syncRings(root); }

  /* Fortschrittsring (Magic UI „Animated Circular Progress Bar“). Wie bei den rollenden Zahlen wird der
     letzte Wert pro Schlüssel gemerkt: Ein neu gezeichneter Ring füllt sich vom alten Stand aus, ein Neuzeichnen
     mitten im Lauf setzt ihn dort fort. Hinter dem offenen Dialog wird still gesetzt, damit er beim Schließen
     sichtbar nachzieht. Erster Auftritt: ohne Animation. */
  const RING_C = 2 * Math.PI * 45, ringPrev = new Map(), ringRun = new Map();
  function ringHtml(key, done, total){
    return '<span class="pring" data-ring="'+key+'" data-p="'+(total ? Math.round(done / total * 100) : 0)+'"></span>';
  }
  function setRing(svg, p){
    const a = svg.querySelector(".rg-1"), b = svg.querySelector(".rg-2");
    a.style.strokeDasharray = (p * RING_C / 100) + " " + RING_C;
    b.style.strokeDasharray = (Math.max(0, 90 - p) * RING_C / 100) + " " + RING_C;
    b.style.opacity = p <= 90 ? "1" : "0";
  }
  function syncRings(root){
    root.querySelectorAll("[data-ring]").forEach(el => {
      const key = el.dataset.ring, p = Math.max(0, Math.min(100, +el.dataset.p || 0));
      if(el.dataset.ringShown === String(p)) return;
      let svg = el.querySelector("svg");
      if(!svg){ el.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rg-2" cx="50" cy="50" r="45"/><circle class="rg-1" cx="50" cy="50" r="45"/></svg>'; svg = el.querySelector("svg"); }
      el.dataset.ringShown = String(p);
      el.setAttribute("aria-label", p + " %");
      if(document.body.classList.contains("dialog-open") && !el.closest("#dialog")){
        svg.classList.add("still"); setRing(svg, p); delete el.dataset.ringShown; return;
      }
      const prev = ringPrev.get(key); ringPrev.set(key, p);
      let from = null, elapsed = 0;
      const run = ringRun.get(key);
      if(prev === p && run && run.to === p && (elapsed = performance.now() - run.t) < 1000) from = run.from;
      else if(prev !== undefined && prev !== p){ from = prev; ringRun.set(key, { from: prev, to: p, t: performance.now() }); }
      if(from === null || reducedMotion()){ svg.classList.add("still"); setRing(svg, p); return; }
      svg.classList.add("still"); setRing(svg, from); svg.getBoundingClientRect();
      svg.classList.remove("still");
      svg.querySelectorAll("circle").forEach(c => c.style.transitionDelay = elapsed ? -elapsed + "ms" : "");
      setRing(svg, p);
    });
  }
  function visibleOriginRect(id){
    if(dlgOrigin && dlgOrigin.id === id && performance.now() - dlgOrigin.t < 1500) return dlgOrigin.rect;
    const el = [...document.querySelectorAll('[data-open="'+id+'"]')].find(x => !x.closest("#dialog") && x.offsetParent);
    const r = el && el.getBoundingClientRect();
    return r && r.width && r.bottom > 0 && r.top < innerHeight ? r : null;
  }
  function flipTransform(from, to){
    const s = Math.max(.12, from.width / to.width);
    return "translate(" + ((from.left + from.width/2) - (to.left + to.width/2)) + "px," + ((from.top + from.height/2) - (to.top + to.height/2)) + "px) scale(" + s + ")";
  }
  function animateDialogOpen(id){
    const box = dialogEl.querySelector(".dlg-box");
    if(!box) return;
    box.style.animation = "";
    const from = !reducedMotion() && box.animate ? visibleOriginRect(id) : null;
    dlgOrigin = null;
    if(!from) return;
    box.style.animation = "none";
    const to = box.getBoundingClientRect();
    box.animate([{ transform: flipTransform(from, to), opacity: 0 }, { opacity: 1, offset: .35 }, { transform: "none", opacity: 1 }],
                { duration: 340, easing: "cubic-bezier(.16,1,.3,1)" });
  }
  /* Ausblenden: der Dialog schließt sofort (alle Folgelogik bleibt synchron), eine eingefrorene
     Kopie davon blendet über der Seite aus und entfernt sich selbst. */
  function playDialogExit(){
    if(!document.body.classList.contains("dialog-open") || document.body.classList.contains("note-open") || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const box = dialogEl.querySelector(".dlg-box");
    if(!box) return;
    const r = box.getBoundingClientRect();
    const veil = document.createElement("div");
    veil.className = "dlg-exit";
    const ghost = box.cloneNode(true);
    ghost.removeAttribute("id"); ghost.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
    Object.assign(ghost.style, { position:"fixed", left:r.left+"px", top:r.top+"px", width:r.width+"px", height:r.height+"px", margin:"0" });
    veil.appendChild(ghost);
    document.body.appendChild(veil);
    const target = currentNote && ghost.animate ? visibleOriginRect(currentNote.id) : null;
    if(target){
      ghost.style.animation = "none";
      ghost.animate([{ transform:"none", opacity:1 }, { opacity:1, offset:.55 }, { transform: flipTransform(target, r), opacity:0 }],
                    { duration: 280, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" });
    }
    setTimeout(()=> veil.remove(), target ? 300 : 200);
  }
  // Ein Ticket ohne Kürzel UND ohne Termin verschwindet zu leicht aus dem Blick — beim Schließen
  // wird beides verlangt (eins von beiden reicht). Ausnahmen: erledigte Tickets (die Arbeit ist
  // getan, keine Nachfrage nötig) und schon gelöschte/nicht mehr im Store stehende Tickets.
  function ticketNeedsTagOrDue(t){
    return isTicket(t) && store.tickets.includes(t) && t.status !== "Erledigt" &&
           !(t.tags && t.tags.length) && !t.due;
  }
  function closeDialog(){
    setStilPopOpen(false);
    if(!currentNote) return true;
    if(lesenAktiv()){ document.body.classList.remove("lesen"); editorEl.setAttribute("contenteditable", "true"); titleInputEl.readOnly = false; lesenBtn.classList.remove("active"); }
    if(ticketNeedsTagOrDue(currentNote)){
      // Unberührter Entwurf (nichts getippt, keine Unteraufgabe) — kein Grund zu nerven, einfach verwerfen.
      const untouched = noteTitle(currentNote) === "Neues Ticket" && !edText().trim() &&
        !(currentNote.subtasks && currentNote.subtasks.length) && !(currentNote.updates && currentNote.updates.length);
      if(untouched){
        store.tickets = store.tickets.filter(x => x !== currentNote);
        save(); updateBoardCount();
      } else {
        toast("Bitte ein Kürzel oder einen Termin vergeben, bevor du schließt.");
        const strip = fieldsEl.querySelector(".due2");
        if(strip) strip.focus(); else fieldsEl.querySelector("select.tag-add")?.focus();
        return false;
      }
    }
    playDialogExit();
    snapshotVersion(currentNote, "Bearbeitung"); rememberNotePosition();
    currentNote = null;
    store.selectedNoteId = null;
    if(focusModeActive) setFocusMode(false);
    document.body.classList.remove("dialog-open", "ticket-open", "note-open");
    editorEl.blur();
    closeLinkPop(); closeTableToolbar();
    hoverPop.classList.remove("open");
    wordcountEl.textContent = ""; delete wordcountEl.dataset.snShown; document.getElementById("stylecount").textContent = "";
    updateNavContext();
    renderOutline(); renderBacklinks(); renderHistory(); renderDialogFoot();
    renderCurrentView();                      // titles, status and dates may have changed underneath
    syncSidebar();
    return true;
  }
  // Closing by hand: if the dialog came straight from the page behind it, step back in the history (so
  // "Vor" reopens it); after wandering through links inside the dialog, the page becomes a new step.
  function requestClose(){
    const back = returnToNoteId && currentNote && isTicket(currentNote) && itemById(returnToNoteId);
    if(back){
      if(!closeDialog()) return;
      returnToNoteId = null;
      selectNote(back.id); pushRoute();
      return;
    }
    const stepBack = dialogOpenedAt !== null && navIndex() === dialogOpenedAt + 1;
    if(!closeDialog()) return;
    if(stepBack) history.back(); else pushRoute();
    dialogOpenedAt = null;
  }
  document.getElementById("dlg-close").addEventListener("click", requestClose);
  dialogEl.addEventListener("mousedown", (e)=>{ if(e.target === dialogEl) requestClose(); });

  function createNote(folderId){
    const note = { id: uid(), folderId: folderId || null, createdAt: Date.now(), updatedAt: Date.now(), text: "" };
    const pos = sortAtEnd(siblingNotes(folderId || null));
    if(pos !== undefined) note.sort = pos;
    store.notes.unshift(note);
    save();
    renderTree();
    selectNote(note.id);
  }
  // Where a new note goes: next to the open note, else into the folder picked on the Notizen page.
  function folderForNewNote(){
    if(currentNote && !isTicket(currentNote)) return currentNote.folderId || null;
    return notesFolder && notesFolder !== "root" && store.folders.some(f => f.id === notesFolder) ? notesFolder : null;
  }

  function createFolder(parentId){
    const name = prompt("Ordnername:");
    if(!name) return;
    const folder = { id: uid(), name: name.trim(), parentId: parentId || null, collapsed:false, updatedAt: Date.now() };
    const pos = sortAtEnd(siblingFolders(parentId || null));
    if(pos !== undefined) folder.sort = pos;
    store.folders.push(folder);
    save();
    renderTree();
  }

  function renameFolder(folder){
    const name = prompt("Ordner umbenennen:", folder.name);
    if(!name) return;
    folder.name = name.trim();
    folder.updatedAt = Date.now();
    save();
    renderTree();
  }

  function deleteFolder(folder){
    const toDelete = new Set([folder.id]);
    let changed = true;
    while(changed){
      changed = false;
      store.folders.forEach(f=>{
        if(f.parentId && toDelete.has(f.parentId) && !toDelete.has(f.id)){ toDelete.add(f.id); changed = true; }
      });
    }
    const entries = [];
    store.folders.filter(f=>toDelete.has(f.id)).forEach(f=> entries.push(pushTrash("folder", f.id, f.name, folderPathOf(f.parentId), f)));
    store.notes.filter(n=>toDelete.has(n.folderId)).forEach(n=> entries.push(pushTrash("note", n.id, noteTitle(n), folderPathOf(n.folderId), n)));
    store.folders = store.folders.filter(f=>!toDelete.has(f.id));
    const removedNoteIds = new Set(store.notes.filter(n=>toDelete.has(n.folderId)).map(n=>n.id));
    store.notes = store.notes.filter(n=>!toDelete.has(n.folderId));
    if(currentNote && removedNoteIds.has(currentNote.id)) closeDialog();
    save();
    renderTree();
    renderTrash();
    renderTrashCount();
    toast('Ordner „' + folder.name + '“ gelöscht', { actionLabel: "Rückgängig", onAction: ()=> restoreTrashEntries(entries) });
  }

  function deleteNote(note){
    const entry = pushTrash("note", note.id, noteTitle(note), folderPathOf(note.folderId), note);
    store.notes = store.notes.filter(n=>n.id!==note.id);
    save();
    // Deleting the open note returns to wherever you were before it (the Board, the note you came from),
    // instead of jumping to whichever note happened to be newest.
    if(currentNote && currentNote.id===note.id) requestClose();
    renderTree();
    renderTrash();
    renderTrashCount();
    toast('„' + entry.title + '“ gelöscht', { actionLabel: "Rückgängig", onAction: ()=> restoreTrashEntry(entry) });
  }

  // Every segment is a jump target: a folder shows itself in the tree, "Tickets" opens the ticket list,
  // "Hauptebene" shows the note.
  function updateBreadcrumb(){
    if(!currentNote){ breadcrumbEl.textContent = ""; return; }
    let parts;
    const extra = [];
    if(isTicket(currentNote)){
      parts = ['<span class="crumb" data-crumb-view="tickets" title="Zur Ticket-Liste">Tickets</span>'];
      extra.push(currentNote.status);
    } else {
      const chain = [];
      let f = store.folders.find(x => x.id === currentNote.folderId);
      while(f){ chain.unshift(f); f = store.folders.find(x => x.id === f.parentId); }
      parts = !chain.length ? ['<span class="crumb" data-crumb-root="1" title="Hauptebene öffnen">Hauptebene</span>']
            : chain.map(x => '<span class="crumb" data-crumb-folder="'+x.id+'" title="Ordner öffnen">'+escapeHtml(x.name)+'</span>');
    }
    if(currentNote.source === "claude") extra.push("von Claude angelegt");
    else if(currentNote.editedBy === "claude") extra.push("zuletzt von Claude geändert");
    breadcrumbEl.innerHTML = parts.join('<span class="crumb-sep">/</span>') +
      (extra.length ? '<span class="crumb-sep">·</span>' + escapeHtml(extra.join(" · ")) : "");
    updateNavContext();
  }

  /* ---------------- Sidebar tree rendering ---------------- */

  function matchesSearch(note){
    if(!searchQuery) return true;
    if(searchQuery.startsWith("#")){
      const q = searchQuery.slice(1);
      return [...noteTags(note)].some(t => t === q || t.startsWith(q + "/"));

  /* ---------------- Notizen-Seite: Ordner links, Notizen des gewählten Ordners rechts ---------------- */
  // "root" = oberste Ebene (Ordner + lose Notizen), eine Ordner-ID, oder null = alle Notizen nach Datum
  let notesFolder = store.ui && "notesFolder" in store.ui ? store.ui.notesFolder : "root";
  function setNotesFolder(id){

  // Beim Suchen stehen passende Tickets unter den Notizen — sie leben nicht in Ordnern, sollen über die
  // Suche aber genauso auffindbar sein.
  function ticketSearchHtml(){
    if(!searchQuery || searchQuery.startsWith("#")) return "";
    const hits = store.tickets.filter(t => t.status !== "Erledigt" && sucheTrifft(t.text, t.tags, searchQuery))
      .sort((a,b) => (a.status === "Erledigt") - (b.status === "Erledigt") || b.updatedAt - a.updatedAt).slice(0, 30);
    if(!hits.length) return "";
    return '<div class="nl-section">Tickets</div>' + hits.map(t =>
      '<div class="row ticket-row'+(t.status === "Erledigt" ? " done" : "")+'" data-ticket="'+t.id+'">'
      + '<span class="task-dot">'+CHECK_SVG+'</span>'
      + '<span class="note-meta"><span class="note-title">'+escapeHtml(noteTitle(t))+'</span>'
      + '<span class="note-preview">'+escapeHtml(ticketPreview(t))+'</span></span></div>').join("");
  }
  /* Eine Seite über die ganze Breite, wie der Finder: oben der Pfad (jedes Stück springt dorthin und

     aktuellen Ebene, dann ihre Notizen. „Alle nach Datum" zeigt alles flach, die Suche ebenso. */
  function renderTree(){
    if(notesFolder && notesFolder !== "root" && !store.folders.some(f => f.id === notesFolder)) notesFolder = "root";
    const f = notesFolder && notesFolder !== "root" ? store.folders.find(x => x.id === notesFolder) : null;
    const flat = notesFolder === null || !!searchQuery;
    const chain = [];
    for(let x = f; x; x = x.parentId && store.folders.find(y => y.id === x.parentId)) chain.unshift(x);
    const crumbs = '<span class="drop-crumb'+(!flat && !f ? " here" : "")+'" data-crumb-folder="" title="Oberste Ebene — Notizen hierher ziehen nimmt sie aus ihrem Ordner">Ordner</span>' +
      chain.map(x => '<span class="crumb-sep">›</span><span class="drop-crumb'+(x === f && !flat ? " here" : "")+'" data-crumb-folder="'+x.id+'">'+escapeHtml(x.name)+'</span>').join("");
    const counts = tagCounts(), tags = Object.keys(counts).sort();
    const activeTag = searchQuery.startsWith("#") ? searchQuery.slice(1) : "";
    const notes = (searchQuery ? store.notes.filter(matchesSearch) : notesFolder === null ? store.notes.slice() : f ? notesIn(f.id) : rootNotes())
      .sort((a,b)=>b.updatedAt-a.updatedAt);
    const folders = flat ? [] : siblingFolders(f ? f.id : null);
    const heading = searchQuery ? (activeTag ? "#" + activeTag : "Suche „" + searchQuery + "“") : notesFolder === null ? "Alle Notizen" : f ? f.name : "Notizen";
    treeEl.innerHTML =
      '<div class="nb-bar"><div class="nb-path">' + (!flat && !f ? "" : flat ? '<span class="drop-crumb" data-crumb-folder="">Ordner</span><span class="crumb-sep">›</span><span class="drop-crumb here">'+escapeHtml(heading)+'</span>' : crumbs) + '</div>' +
        '<span class="nb-count">'+folders.length+(folders.length === 1 ? " Ordner" : " Ordner")+' · '+notes.length+(notes.length === 1 ? " Notiz" : " Notizen")+'</span>' +
        '<span style="flex:1"></span>' +
        '<span class="pill'+(notesFolder === null && !searchQuery ? " on" : "")+'" data-notes-all="1" title="Alle Notizen flach, zuletzt geänderte zuerst">Alle nach Datum</span>' +
      '</div>' +
      (tags.length ? '<div class="nb-tags">' + tags.map(t => '<span class="tag-row nb-tag'+(t === activeTag ? " active" : "")+'" data-tag="'+escapeHtml(t)+'">#'+escapeHtml(t)+'<span class="count">'+counts[t]+'</span></span>').join("") + '</div>' : "") +
      (flat || f ? '<h2 class="nb-title">'+escapeHtml(heading)+'</h2>' : '<div class="nb-gap"></div>') +
      folders.map(x => '<div class="row folder" draggable="true" data-folder="'+x.id+'">' + folderSvg()
        + '<span class="name">'+escapeHtml(x.name)+'</span>'
        + '<span class="count">'+[foldersIn(x.id).length ? foldersIn(x.id).length + " Ordner" : "", notesIn(x.id).length ? notesIn(x.id).length + (notesIn(x.id).length === 1 ? " Notiz" : " Notizen") : ""].filter(Boolean).join(" · ")+'</span>'
        + '<button class="row-del" data-del-folder="'+x.id+'" title="Ordner löschen">'+trashSvg()+'</button></div>').join("") +
      notes.map(note =>
        '<div class="row note" draggable="true" data-note="'+note.id+'">' + noteSvg()
        + '<span class="note-meta"><span class="note-title">'+escapeHtml(noteTitle(note))+(note.source==="claude" ? '<span class="claude-badge" title="Von Claude angelegt">Claude</span>' : "")+'</span>'
        + '<span class="note-preview">'+escapeHtml(notePreview(note))+'</span></span>'
        + (flat && note.folderId ? '<span class="nl-path">'+escapeHtml(folderPathOf(note.folderId))+'</span>' : "")
        + '<span class="nl-when" data-rt="'+note.updatedAt+'">'+escapeHtml(relTime(note.updatedAt))+'</span>'
        + '<button class="row-del" data-del-note="'+note.id+'" title="Löschen">'+trashSvg()+'</button>'
        + '</div>').join("") +
      (!folders.length && !notes.length ? (searchQuery ? emptyState("search", "Keine Notizen gefunden", "Nichts passt zu „" + escapeHtml(searchQuery) + "“.") : emptyState("doc", "Hier liegt noch nichts", "Neue Notiz mit <kbd>⌘⇧T</kbd>.", '<span class="pill primary" data-empty-act="note">＋ Neue Notiz</span>')) : "") +
      ticketSearchHtml();
    document.getElementById("nav-notes-count").textContent = store.notes.length || "";
    renderSideTree();
  }

  /* ---------------- Ordnerbaum in der Seitenleiste (Redesign Phase 3) ----------------
     Ordner (alphabetisch, beliebig tief) mit ihren Notizen, darunter die Notizen ohne Ordner.
     Ein Klick auf einen Ordner klappt ihn auf/zu — ohne Neuzeichnen, damit die grid-rows-Animation
     läuft; der Zustand wird wie bisher in folder.collapsed gespeichert und synchronisiert. Die
     geöffnete Notiz trägt die gleitende Markierung (in einer inneren Spur, die mitscrollt). */
  const sidebarEl = document.getElementById("sidebar");
  const sideTreeEl = document.getElementById("side-tree");
  const sideTrackEl = sideTreeEl.querySelector(".stree-track");
  function renderSideTree(){
    const openId = currentNote && !isTicket(currentNote) ? currentNote.id : null;
    const subFolders = id => siblingFolders(id);
    const noteRow = n => '<div class="srow snote'+(n.id === openId ? " on" : "")+'" data-side-note="'+n.id+'" draggable="true" title="'+escapeHtml(noteTitle(n))+'">' +
      noteSvg() + '<span class="sname">'+escapeHtml(noteTitle(n))+'</span></div>';
    const folderHtml = f => {
      const notes = siblingNotes(f.id);
      return '<div class="sfolder'+(f.collapsed ? "" : " is-open")+'" data-side-folder="'+f.id+'">' +
        '<div class="srow sfold" data-side-toggle="'+f.id+'" draggable="true">' + chevronSvg() + folderIcoSvg() +
          '<span class="sname">'+escapeHtml(f.name)+'</span><span class="scount">'+(notes.length || "")+'</span></div>' +
        '<div class="expand-body"><div class="expand-inner rail">' +
          subFolders(f.id).map(folderHtml).concat(notes.map(noteRow)).map((h, i) => h.replace("<div ", '<div style="--i:'+i+'" ')).join("") +
        '</div></div></div>';
    };
    sideTrackEl.innerHTML = subFolders(null).map(folderHtml).join("") + siblingNotes(null).map(noteRow).join("");
    syncSideTreeHighlight();
  }
  // Markierung nur, wenn die Notiz sichtbar ist — liegt sie in einem zugeklappten Ordner, verschwindet sie.
  function syncSideTreeHighlight(){
    let row = sideTrackEl.querySelector(".srow.on");
    for(let f = row && row.parentElement.closest(".sfolder"); f; f = f.parentElement.closest(".sfolder")){
      if(!f.classList.contains("is-open")){ row = null; break; }
    }
    syncRail(railInd("sidetree"), sideTrackEl, row);
  }
  /* Balken auf der Führungslinie (animate-ui-Stil): ein .rind pro Gruppe, dauerhaft wiederverwendet wie
     die Pillen-Markierung. Er sitzt auf der Linie der nächstgelegenen .rail um den aktiven Eintrag —
     im Ordnerbaum also auf der Linie seiner Ebene — und gleitet per transform dorthin.
     `full`: über die ganze Höhe des Eintrags (Gliederung), sonst 56 % mittig (Navigation, Baum). */
  const railInds = {};
  function railInd(name){
    if(!railInds[name]){ railInds[name] = document.createElement("span"); railInds[name].className = "rind"; }
    return railInds[name];
  }
  function syncRail(ind, track, active, full){
    if(!track || !active){ ind.remove(); return; }
    const first = !ind.dataset.placed;
    if(ind.parentNode !== track) track.appendChild(ind);
    const tr = track.getBoundingClientRect(), r = active.getBoundingClientRect();
    const rail = active.parentElement.closest(".rail") || track;
    const x = rail.getBoundingClientRect().left - tr.left - 1;
    const h = full ? r.height : Math.round(r.height * .56);
    const y = r.top - tr.top + (r.height - h) / 2;
    if(first) ind.style.transition = "none";
    ind.style.transform = "translate(" + x + "px," + y + "px)";
    ind.style.height = h + "px";
    if(first){ ind.getBoundingClientRect(); ind.style.transition = ""; ind.dataset.placed = "1"; }
  }
  // Welche Navigationszeile aktiv ist: die Ansicht hinter der Seite — außer eine Notiz ist offen, dann
  // markiert der Baum sie und die Navigation bleibt ohne Markierung.
  const NAV_FOR_MODE = { board:"nav-board", tickets:"nav-board", plan:"nav-plan", series:"nav-plan", notes:null, trash:"nav-trash", archive:"nav-archive" };
  function syncSidebar(){
    const mode = VIEW_MODES.find(m => document.body.classList.contains(m + "-mode"));
    const navId = document.body.classList.contains("note-open") ? null : NAV_FOR_MODE[mode];
    sidebarEl.querySelectorAll(".side-nav > .row").forEach(r => r.classList.toggle("on", r.id === navId));
    const nav = sidebarEl.querySelector(".side-nav");
    syncRail(railInd("nav"), nav, nav.querySelector(":scope > .row.on"));
    syncSideTreeHighlight();
  }
  const sideHov = document.createElement("span"); sideHov.className = "shov";
  sideTreeEl.addEventListener("mouseover", (e)=>{
    const row = e.target.closest(".srow");
    if(!row || !sideTrackEl.contains(row)) return;
    const fresh = !sideHov.classList.contains("on") || sideHov.parentNode !== sideTrackEl;
    if(sideHov.parentNode !== sideTrackEl) sideTrackEl.prepend(sideHov);
    const tr = sideTrackEl.getBoundingClientRect(), r = row.getBoundingClientRect();
    sideHov.classList.toggle("jump", fresh);
    sideHov.style.width = r.width + "px"; sideHov.style.height = r.height + "px";
    sideHov.style.transform = "translate(" + (r.left - tr.left) + "px," + (r.top - tr.top) + "px)";
    sideHov.classList.add("on");
  });
  sideTreeEl.addEventListener("mouseleave", ()=> sideHov.classList.remove("on"));
  /* Eine Hover-Fläche für die ganze Seitenleiste (Kopf, Ansichten, Ordnerbaum, Fuß): gleitet von Eintrag zu
     Eintrag, auch über Gruppen hinweg — wie in der animate-ui-Sidebar. Taucht sie neu auf, springt sie. */
  const sideHl = document.createElement("span"); sideHl.id = "side-hov"; sidebarEl.prepend(sideHl);
  let sideHlRow = null;
  function placeSideHl(row){
    sideHlRow = row;
    if(!row){ sideHl.classList.remove("on"); return; }
    const sr = sidebarEl.getBoundingClientRect(), r = row.getBoundingClientRect();
    // Zeilen im Baum, die halb aus dem sichtbaren Bereich gescrollt sind, auf den sichtbaren Teil kürzen
    const tr = sideTreeEl.contains(row) ? sideTreeEl.getBoundingClientRect() : null;
    const top = tr ? Math.max(r.top, tr.top) : r.top, bottom = tr ? Math.min(r.bottom, tr.bottom) : r.bottom;
    if(bottom <= top){ sideHl.classList.remove("on"); return; }
    sideHl.classList.toggle("jump", !sideHl.classList.contains("on"));
    sideHl.style.width = r.width + "px"; sideHl.style.height = (bottom - top) + "px";
    sideHl.style.transform = "translate(" + (r.left - sr.left) + "px," + (top - sr.top) + "px)";
    sideHl.classList.add("on");
  }
  sidebarEl.addEventListener("mouseover", (e)=>{
    const row = e.target.closest(".srow, .row.home-row, .side-hl");
    if(row && row !== sideHlRow) placeSideHl(row);
    else if(!row && !e.target.closest(".srow, .row.home-row, .side-hl")) placeSideHl(null);
  });
  sidebarEl.addEventListener("mouseleave", ()=> placeSideHl(null));
  sideTreeEl.addEventListener("scroll", ()=>{ if(sideHlRow) placeSideHl(sideHlRow); }, { passive:true });
  // Kopf öffnet die Einstellungen, Fuß direkt „Konto & Sync"
  document.getElementById("side-switch").addEventListener("click", (e)=>{
    e.stopPropagation(); settingsPage = "main"; renderSettings();
    settingsPop.classList.remove("at-foot"); settingsPop.classList.add("at-side");
    setSettingsOpen(!settingsPop.classList.contains("open"));
  });
  document.getElementById("side-user").addEventListener("click", (e)=>{
    e.stopPropagation(); settingsPop.classList.remove("at-side"); settingsPop.classList.add("at-foot");
    setSettingsOpen(true); settingsPage = "account"; renderSettings(); syncPillTracks(settingsPop);
  });
  sideTreeEl.addEventListener("click", (e)=>{
    const t = e.target.closest("[data-side-toggle]");
    if(t){
      const f = store.folders.find(x => x.id === t.dataset.sideToggle);
      if(!f) return;
      f.collapsed = !f.collapsed; f.updatedAt = Date.now(); save();
      const box = t.parentElement;
      box.classList.toggle("is-open", !f.collapsed);
      syncSideTreeHighlight();
      // nach dem Auf-/Zuklappen hat sich alles darunter verschoben → Markierung neu vermessen
      setTimeout(syncSideTreeHighlight, reducedMotion() ? 0 : 400);
      return;
    }
    const n = e.target.closest("[data-side-note]");
    if(n) selectNote(n.dataset.sideNote);
  });
  sideTreeEl.addEventListener("contextmenu", (e)=>{
    e.preventDefault();
    const n = e.target.closest("[data-side-note]"), f = e.target.closest("[data-side-toggle]");
    if(n) openCtxMenu(e.clientX, e.clientY, { type:"note", id: n.dataset.sideNote });
    else if(f) openCtxMenu(e.clientX, e.clientY, { type:"folder", id: f.dataset.sideToggle });
    else openCtxMenu(e.clientX, e.clientY, { type:"root" });
  });
  /* Ziehen im Ordnerbaum (Notizen und Ordner): oberes/unteres Drittel einer Zeile = davor/dahinter
     einsortieren (Linie als Einfügemarke), Mitte eines Ordners = hineinlegen, freie Fläche darunter =
     Hauptebene, ans Ende. Ordner wandern samt Inhalt, aber nie in sich selbst oder eigene Unterordner. */
  let sideDrag = null;   // { type:"note"|"folder", id }
  function clearSideDrop(){ sideTreeEl.querySelectorAll(".drop-target, .drop-before, .drop-after").forEach(x => x.classList.remove("drop-target", "drop-before", "drop-after")); }
  // Wohin würde der Drop gehen? { row, zone:"before"|"after"|"into"|"root" } oder null (nicht erlaubt)
  function sideDropAt(e){
    const row = e.target.closest(".srow.sfold, .srow.snote");
    if(!row) return { row:null, zone:"root" };
    const r = row.getBoundingClientRect(), y = (e.clientY - r.top) / r.height;
    const isFolder = row.classList.contains("sfold");
    const zone = isFolder ? (y < 1/3 ? "before" : y > 2/3 ? "after" : "into") : (y < .5 ? "before" : "after");
    if(sideDrag.type === "folder"){
      const targetFolder = isFolder ? row.dataset.sideToggle : (store.notes.find(n => n.id === row.dataset.sideNote) || {}).folderId || null;
      const newParent = isFolder && zone !== "into" ? (store.folders.find(f => f.id === targetFolder) || {}).parentId || null : targetFolder;
      if(isFolder && targetFolder === sideDrag.id) return null;
      if(newParent && isInFolder(newParent, sideDrag.id)) return null;
    } else if(!isFolder && row.dataset.sideNote === sideDrag.id) return null;
    return { row, zone };
  }
  sideTreeEl.addEventListener("dragstart", (e)=>{
    const n = e.target.closest("[data-side-note]"), f = e.target.closest("[data-side-toggle]");
    if(!n && !f) return;
    sideDrag = n ? { type:"note", id:n.dataset.sideNote } : { type:"folder", id:f.dataset.sideToggle };
    tiltDragImage(e, n || f);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", sideDrag.id);
  });
  sideTreeEl.addEventListener("dragover", (e)=>{
    if(!sideDrag) return;
    const d = sideDropAt(e);
    clearSideDrop();
    if(!d){ e.dataTransfer.dropEffect = "none"; return; }
    e.preventDefault();
    if(d.row) d.row.classList.add(d.zone === "into" ? "drop-target" : "drop-" + d.zone);
  });
  sideTreeEl.addEventListener("dragleave", (e)=>{ if(!sideTreeEl.contains(e.relatedTarget)) clearSideDrop(); });
  sideTreeEl.addEventListener("drop", (e)=>{
    if(!sideDrag) return;
    e.preventDefault();
    const d = sideDropAt(e), drag = sideDrag;
    sideDrag = null; clearSideDrop();
    if(!d) return;
    const now = Date.now();
    const openFolder = id => { const fo = id && store.folders.find(x => x.id === id); if(fo && fo.collapsed){ fo.collapsed = false; fo.updatedAt = now; } };
    const rowFolder = d.row && d.row.classList.contains("sfold") ? store.folders.find(f => f.id === d.row.dataset.sideToggle) : null;
    const rowNote = d.row && d.row.classList.contains("snote") ? store.notes.find(n => n.id === d.row.dataset.sideNote) : null;
    if(drag.type === "note"){
      const note = store.notes.find(x => x.id === drag.id);
      if(!note) return;
      if(rowNote){                               // vor/hinter eine Notiz: in deren Ordner, an diese Stelle
        note.folderId = rowNote.folderId || null;
        const list = siblingNotes(note.folderId).filter(x => x !== note);
        placeAt(note, list, list.indexOf(rowNote) + (d.zone === "after" ? 1 : 0));
      } else if(rowFolder && d.zone === "into"){ // in einen Ordner: ans Ende seiner Notizen
        note.folderId = rowFolder.id;
        const pos = sortAtEnd(siblingNotes(rowFolder.id).filter(x => x !== note));
        if(pos === undefined) delete note.sort; else note.sort = pos;
        note.updatedAt = now; openFolder(rowFolder.id);
      } else if(rowFolder){                      // vor/hinter einen Ordner: auf dessen Ebene, vor die Notizen
        note.folderId = rowFolder.parentId || null;
        placeAt(note, siblingNotes(note.folderId).filter(x => x !== note), 0);
      } else {                                   // freie Fläche: Hauptebene, ans Ende
        note.folderId = null;
        const pos = sortAtEnd(siblingNotes(null).filter(x => x !== note));
        if(pos === undefined) delete note.sort; else note.sort = pos;
        note.updatedAt = now;
      }
      if(currentNote === note) updateBreadcrumb();
    } else {
      const folder = store.folders.find(x => x.id === drag.id);
      if(!folder) return;
      if(rowFolder && d.zone !== "into"){        // vor/hinter einen Ordner: dessen Geschwister
        folder.parentId = rowFolder.parentId || null;
        const list = siblingFolders(folder.parentId).filter(x => x !== folder);
        placeAt(folder, list, list.indexOf(rowFolder) + (d.zone === "after" ? 1 : 0));
      } else {                                   // in einen Ordner / Ordner einer Notiz / Hauptebene: ans Ende
        folder.parentId = rowFolder ? rowFolder.id : rowNote ? (rowNote.folderId || null) : null;
        const pos = sortAtEnd(siblingFolders(folder.parentId).filter(x => x !== folder));
        if(pos === undefined) delete folder.sort; else folder.sort = pos;
        folder.updatedAt = now; openFolder(folder.parentId);
      }
    }
    save(); renderTree();
  });
  sideTreeEl.addEventListener("dragend", ()=>{ sideDrag = null; clearSideDrop(); });
  document.getElementById("side-new-note").addEventListener("click", ()=> createNote(folderForNewNote()));
  function tagCounts(){
    const counts = {};
    store.notes.forEach(n => noteTags(n).forEach(t => { counts[t] = (counts[t]||0) + 1; }));
    return counts;
  }

  function filterByTag(tag){
    searchEl.value = tag ? "#" + tag : "";
    searchEl.dispatchEvent(new Event("input"));
  }

  /* ---------------- Context menu (right-click in the sidebar) ---------------- */
  const ctxMenu = document.getElementById("ctx-menu");
  let ctxTarget = null;   // { type:"note"|"folder"|"root", id }
  function closeCtxMenu(){ ctxMenu.classList.remove("open"); ctxTarget = null; }
  function openCtxMenu(x, y, target){
    ctxTarget = target;
    const item = (action, label, cls) => '<div class="opt'+(cls?" "+cls:"")+'" data-ctx="'+action+'">'+label+'</div>';
    let html = "";
    if(target.type === "note"){
      html = item("open", "Öffnen") + item("new-note-here", "Neue Notiz im selben Ordner") +
             '<div class="sep"></div>' + item("delete-note", "Notiz löschen…", "danger");
    } else if(target.type === "folder"){
      html = item("new-note-in", "Neue Notiz hier") + item("new-folder-in", "Neuer Unterordner…") +
             item("rename-folder", "Ordner umbenennen…") + item("sort-alpha", "Alphabetisch sortieren") +
             '<div class="sep"></div>' + item("delete-folder", "Ordner und Inhalt löschen…", "danger");
    } else {
      html = item("new-note-root", "Neue Notiz") + item("new-folder-root", "Neuer Ordner…") + item("sort-alpha-root", "Alphabetisch sortieren");
    }
    ctxMenu.innerHTML = html;
    ctxMenu.classList.add("open");
    const w = ctxMenu.offsetWidth, h = ctxMenu.offsetHeight;
    ctxMenu.style.left = Math.min(x, window.innerWidth - w - 8) + "px";
    ctxMenu.style.top = Math.min(y, window.innerHeight - h - 8) + "px";
  }
  treeEl.addEventListener("contextmenu", (e)=>{
    e.preventDefault();
    if(e.target.closest(".row.ticket-row")) return;
    const noteRow = e.target.closest(".row.note"), folderRow = e.target.closest(".row.folder");
    if(noteRow) openCtxMenu(e.clientX, e.clientY, { type:"note", id: noteRow.dataset.note });
    else if(folderRow) openCtxMenu(e.clientX, e.clientY, { type:"folder", id: folderRow.dataset.folder });
    else openCtxMenu(e.clientX, e.clientY, { type:"root" });
  });
  ctxMenu.addEventListener("click", (e)=>{
    const opt = e.target.closest("[data-ctx]");
    if(!opt || !ctxTarget) return;
    const t = ctxTarget, a = opt.dataset.ctx;
    closeCtxMenu();
    const note = t.type === "note" ? store.notes.find(n=>n.id===t.id) : null;
    const folder = t.type === "folder" ? store.folders.find(f=>f.id===t.id) : null;
    if(a === "open" && note) selectNote(note.id);
    else if(a === "new-note-here" && note) createNote(note.folderId);
    else if(a === "delete-note" && note) deleteNote(note);
    else if(a === "new-note-in" && folder) createNote(folder.id);
    else if(a === "new-folder-in" && folder) createFolder(folder.id);
    else if(a === "rename-folder" && folder) renameFolder(folder);
    else if(a === "delete-folder" && folder) deleteFolder(folder);
    else if(a === "new-note-root") createNote(null);
    else if(a === "new-folder-root") createFolder(null);
    else if(a === "sort-alpha" && folder){ sortAlphabetically(folder.id); save(); renderTree(); }
    else if(a === "sort-alpha-root"){ sortAlphabetically(null); save(); renderTree(); }
  });
  document.addEventListener("mousedown", (e)=>{ if(ctxMenu.classList.contains("open") && !ctxMenu.contains(e.target)) closeCtxMenu(); });
  window.addEventListener("blur", closeCtxMenu);

  treeEl.addEventListener("click", (e)=>{
    const tagRow = e.target.closest(".tag-row");
    if(tagRow){ filterByTag(tagRow.classList.contains("active") ? "" : tagRow.dataset.tag); return; }
    const delFolder = e.target.closest("[data-del-folder]");
    if(delFolder){
      const f = store.folders.find(x=>x.id===delFolder.dataset.delFolder);
      if(f) deleteFolder(f);
      return;
    }
    const delNote = e.target.closest("[data-del-note]");
    if(delNote){
      const n = store.notes.find(x=>x.id===delNote.dataset.delNote);
      if(n) deleteNote(n);
      return;
    }
    if(e.target.closest("[data-notes-all]")){ setNotesFolder(notesFolder === null && !searchQuery ? "root" : null); return; }
    const crumb = e.target.closest("[data-crumb-folder]");
    if(crumb){ setNotesFolder(crumb.dataset.crumbFolder || "root"); return; }
    const folderRow = e.target.closest(".row.folder");
    if(folderRow){
      const f = store.folders.find(x=>x.id===folderRow.dataset.folder);
      if(!f) return;
      if(e.detail === 2){ renameFolder(f); return; }
      setNotesFolder(f.id);
      return;
    }
    const ticketRow = e.target.closest(".row.ticket-row");
    if(ticketRow){ selectNote(ticketRow.dataset.ticket); return; }
    const noteRow = e.target.closest(".row.note");
    if(noteRow){
      selectNote(noteRow.dataset.note);
    }
  });

  /* ---------------- Drag & drop (move notes/folders) ---------------- */
  function isDescendantOf(folderId, ancestorId){
    let f = store.folders.find(x=>x.id===folderId);
    while(f){
      if(f.parentId === ancestorId) return true;
      f = store.folders.find(x=>x.id===f.parentId);
    }
    return false;
  }

  function dropTargetFolderId(target){
    const crumb = target.closest(".drop-crumb[data-crumb-folder]");
    if(crumb) return crumb.dataset.crumbFolder || null;
    const folderRow = target.closest(".row.folder");
    if(folderRow) return folderRow.dataset.folder;
    const noteRow = target.closest(".row.note");
    if(noteRow){
      const note = store.notes.find(n=>n.id===noteRow.dataset.note);
      return note ? note.folderId : null;
    }
    return null;
  }

  function clearDropTargets(){
    treeEl.querySelectorAll(".drop-target").forEach(x=>x.classList.remove("drop-target"));
  }

  let dragPayload = null;

  treeEl.addEventListener("dragstart", (e)=>{
    const row = e.target.closest(".row.folder, .row.note");
    if(!row) return;
    const type = row.classList.contains("folder") ? "folder" : "note";
    const id = type === "folder" ? row.dataset.folder : row.dataset.note;
    dragPayload = { type, id };
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", JSON.stringify(dragPayload)); }catch(err){}
    requestAnimationFrame(()=> row.classList.add("dragging"));
  });

  treeEl.addEventListener("dragend", ()=>{
    treeEl.querySelectorAll(".row.dragging").forEach(x=>x.classList.remove("dragging"));
    clearDropTargets();
    dragPayload = null;
  });

  treeEl.addEventListener("dragover", (e)=>{
    if(!dragPayload) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const rootRow = e.target.closest(".drop-crumb[data-crumb-folder]");
    const folderRow = e.target.closest(".row.folder");
    if(rootRow && rootRow.classList.contains("drop-target")) return;
    if(folderRow && folderRow.classList.contains("drop-target")) return;
    clearDropTargets();
    if(rootRow) rootRow.classList.add("drop-target");
    else if(folderRow && folderRow.dataset.folder !== dragPayload.id) folderRow.classList.add("drop-target");
  });

  treeEl.addEventListener("drop", (e)=>{
    e.preventDefault();
    clearDropTargets();
    let payload = dragPayload;
    if(!payload){
      try{ payload = JSON.parse(e.dataTransfer.getData("text/plain")); }catch(err){ return; }
    }
    dragPayload = null;
    if(!payload) return;
    const targetFolderId = dropTargetFolderId(e.target);

    if(payload.type === "note"){
      const note = store.notes.find(n=>n.id===payload.id);
      if(note && note.folderId !== targetFolderId){
        note.folderId = targetFolderId;
        note.updatedAt = Date.now();
        save();
        renderTree();
      }
    } else if(payload.type === "folder"){
      if(payload.id === targetFolderId) return;
      const folder = store.folders.find(f=>f.id===payload.id);
      if(!folder) return;
      if(targetFolderId && (targetFolderId === folder.id || isDescendantOf(targetFolderId, folder.id))) return;
      if(folder.parentId !== targetFolderId){
        folder.parentId = targetFolderId;
        folder.updatedAt = Date.now();
        save();
        renderTree();
      }
    }
  });

  /* ---------------- Search ---------------- */
  searchEl.addEventListener("input", ()=>{
    searchQuery = searchEl.value.trim().toLowerCase();

  const lesenBtn = document.getElementById("btn-lesen");

  editorEl.addEventListener("dblclick", (e)=>{

  /* ---------------- Settings: theme & editor font ---------------- */
  // Each palette is 6 raw tokens (bg/surface/line/text/accent/signal); buildThemeVars() derives
  // everything else (muted/faint text, soft tints, hover/selected overlays, task pills, …).
  /* Monochrome-Redesign: die 11 Farb-Themes sind weg — Hintergrund/Fläche/
     Rand/Text sind jetzt reines Graustufen-Paar (nur hell/dunkel), die einzige frei wählbare Farbe
     ist der Akzent. `signal` (Rot) bleibt wie im Plan vorgesehen die einzige weitere, fest
     reservierte Nicht-Grau-Farbe (überfällig/blockiert/destruktiv). */
  // `surface2` ist eine weitere Stufe oberhalb von `surface` — für Elemente, die INNERHALB eines
  // bereits auf `surface` liegenden Panels (z.B. Settings-Popover) nochmal "erhöht" wirken sollen
  // (aktive Pille/Zeile), damit sie sich von ihrem eigenen Container abheben statt mit ihm zu
  // verschmelzen. Im Hellmodus ist `surface` bereits reines Weiß (die hellstmögliche Stufe) — dort
  // übernimmt der Schatten (`--shadow-sm`/`-md`) allein die Abhebung, siehe buildThemeVars().
  const GRAYSCALE = {
    dark:  { bg:"#1c1c1e", surface:"#242426", surface2:"#323234", line:"#38383a", text:"#f0f0f0", signal:"#ff6b5c" },
    light: { bg:"#ffffff", surface:"#ffffff", surface2:"#f0f0f1", line:"#dcdcdc", text:"#1c1c1e", signal:"#c62d24" }
  };
  const DEFAULT_ACCENT = "#8a8a8e";   // neutral grau-blau — wirkt in beiden Modi ruhig, ist aber frei wählbar
  const ACCENT_SWATCHES = ["#8a8a8e", "#5e8df0", "#4fb06e", "#e0a73a", "#d9596a", "#9a6fe0", "#3fb0c4"];
  const DEFAULT_COLOR_MODE = "dark";
  // Migration only — just enough of each pre-redesign theme (bis 3.8.x, 11 Farb-Themes) to carry
  // its general feel (hell/dunkel, Akzentton) into the new mode+accent pair on first load, instead
  // of a hard reset. bg/surface/line/text sind jetzt überall reines Graustufen-Paar, daher hier
  // bewusst nicht mehr mitgeführt.
  const LEGACY_THEMES = [
    { id:"fern", dark:true, accent:"#dcee8a" }, { id:"salbei", dark:false, accent:"#195c3a" },
    { id:"flieder", dark:false, accent:"#6a1bd1" }, { id:"mandarine", dark:false, accent:"#1f4499" },
    { id:"sonne", dark:false, accent:"#2e4bc4" }, { id:"papier", dark:false, accent:"#3f6f4f" },
    { id:"navy", dark:true, accent:"#7fa8e6" }, { id:"terrakotta", dark:false, accent:"#9c3a17" },
    { id:"tiefsee", dark:false, accent:"#155a68" }, { id:"billabong", dark:true, accent:"#aed0c9" },
    { id:"bordeaux", dark:true, accent:"#d9a35a" }
  ];

  // ---- small color-math helpers, used only to derive theme variables from the 6 raw tokens ----
  function hexToRgb(hex){
    hex = hex.replace("#", ""); if(hex.length === 3) hex = hex.split("").map(c=>c+c).join("");
    const n = parseInt(hex, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  function rgbToHex(rgb){ return "#" + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join(""); }
  function mixHex(a, b, wb){ const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A.map((v,i) => v * (1 - wb) + B[i] * wb)); }
  function relLuminance(hex){ const [r,g,b] = hexToRgb(hex).map(v => v / 255); return 0.299*r + 0.587*g + 0.114*b; }
  function toRgba(hex, a){ const [r,g,b] = hexToRgb(hex); return "rgba(" + r + "," + g + "," + b + "," + a + ")"; }

  // WCAG-Kontrast (echte relative Leuchtdichte, nicht die Helligkeits-Näherung oben)
  function wcagContrast(a, b){
    const L = h => { const [r,g,bl] = hexToRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
                     return .2126*r + .7152*g + .0722*bl; };
    const x = L(a), y = L(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05);
  }
  // Mischt fg Richtung bg, aber nur so weit, dass mindestens `min` Kontrast bleibt
  function mixWithContrast(fg, bg, wb, min){
    for(let w = wb; w > 0; w -= 0.02){ const c = mixHex(fg, bg, w); if(wcagContrast(c, bg) >= min) return c; }
    return fg;
  }
  // Akzent als Textfarbe: ein neutraler (grauer) Akzent würde Aktives blasser zeigen als Inaktives —
  // dann gilt die Textfarbe. Bunte Akzente werden nur so weit Richtung Text gezogen, bis 4,5:1 erreicht ist.
  function accentTextFor(accent, text, bg){
    const [r,g,b] = hexToRgb(accent);
    if(Math.max(r,g,b) - Math.min(r,g,b) < 24) return text;
    for(let w = 0; w <= 1; w += 0.05){ const c = mixHex(accent, text, w); if(wcagContrast(c, bg) >= 4.5) return c; }
    return text;
  }
  function buildThemeVars(t){
    const isDark = relLuminance(t.text) > relLuminance(t.bg);
    return {
      "--bg": t.bg, "--sidebar-bg": t.surface, "--surface": t.surface, "--surface-2": t.surface2,
      "--border": t.line, "--text": t.text,
      // Schatten statt Rand für "erhöhte" Flächen (aktive Pille, Panels). Dunkelmodus braucht einen
      // stärkeren, aber diffusen Schlagschatten PLUS einen hauchdünnen hellen Innenrand (sonst geht
      // ein reiner Schwarz-Schatten auf fast-schwarzem Grund optisch unter); Hellmodus kommt mit
      // einem klassischen weichen Schatten aus.
      "--shadow-sm": isDark
        ? "0 1px 2px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.045) inset"
        : "0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.04)",
      "--shadow-md": isDark
        ? "0 10px 28px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.045) inset"
        : "0 10px 28px rgba(0,0,0,.12)",
      // Gedämpfte Töne mischen Textfarbe Richtung Hintergrund. Auf hellen Paletten wäscht das
      // schneller aus als auf dunklen (heller Text auf hellem Grund verliert Kontrast früher),
      // deshalb wird dort weniger beigemischt — sonst ist die rechte Spalte kaum lesbar.
      "--text-muted": mixHex(t.text, t.bg, isDark ? 0.36 : 0.28),
      "--text-faint": mixWithContrast(t.text, t.bg, isDark ? 0.56 : 0.44, 4.5),
      "--accent": t.accent, "--accent-soft": toRgba(t.accent, isDark ? 0.20 : 0.14),
      "--accent-text": accentTextFor(t.accent, t.text, t.bg),
      // Schrift auf einer Akzent-Fläche: die Seite (hell/dunkel), die auf dem Akzent besser lesbar ist
      "--accent-ink": wcagContrast(t.bg, t.accent) >= wcagContrast(t.text, t.accent) ? t.bg : t.text,
      "--signal": t.signal, "--signal-soft": toRgba(t.signal, isDark ? 0.22 : 0.15),
      "--code-bg": toRgba(t.text, isDark ? 0.09 : 0.05),
      "--hover": toRgba(t.text, isDark ? 0.08 : 0.05), "--selected": toRgba(t.text, isDark ? 0.12 : 0.07),
      "--task-bg": mixHex(t.bg, t.accent, isDark ? 0.16 : 0.09), "--task-bg-done": mixHex(t.bg, t.accent, isDark ? 0.08 : 0.045), "--task-ink": t.text,
      // Syntax (Farben wie iA Writer)
      "--syn-adj": isDark ? "#e0a955" : "#a8742a", "--syn-noun": isDark ? "#f07a55" : "#c9502a", "--syn-adv": isDark ? "#c98ae0" : "#a050a8",
      "--syn-verb": isDark ? "#6fa8f0" : "#3f78c4", "--syn-conj": isDark ? "#74c46e" : "#3f8c3a",
      colorScheme: isDark ? "dark" : "light"
    };
  }
  const FONTS = [
    { id:"avenir",    name:"Avenir Next",     css:"'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" },
    { id:"system",    name:"System (SF Pro)", css:"-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" },
    { id:"helvetica", name:"Helvetica Neue",  css:"'Helvetica Neue', Helvetica, Arial, sans-serif" },
    { id:"georgia",   name:"Georgia",         css:"Georgia, 'Times New Roman', serif" },
    { id:"iowan",     name:"Iowan Old Style", css:"'Iowan Old Style', Palatino, 'Book Antiqua', serif" },
    { id:"mono",      name:"Monospace",       css:"ui-monospace, 'SF Mono', Menlo, Consolas, monospace" }
  ];
  const settingsPop = document.getElementById("settings-pop");
  const settingsBtn = document.getElementById("btn-settings");
  const HEX_RE = /^#[0-9a-f]{6}$/i;
  function currentColorMode(){
    const m = store.ui && store.ui.colorMode;
    if(m === "light" || m === "dark") return m;
    const legacy = LEGACY_THEMES.find(x => x.id === (store.ui && store.ui.theme));
    return legacy ? (legacy.dark ? "dark" : "light") : DEFAULT_COLOR_MODE;
  }
  // Migrates a pre-redesign theme id (11 Farb-Themes, bis 3.8.x) to the new mode+accent pair the
  // first time this account is seen after the redesign — same general feel (hell/dunkel, Akzentton)
  // instead of a jarring hard reset. Only ever runs once: it writes colorMode/accent immediately.
  function currentAccent(){
    const a = store.ui && store.ui.accent;
    if(a && HEX_RE.test(a)) return a;
    const legacy = LEGACY_THEMES.find(x => x.id === (store.ui && store.ui.theme));
    return legacy ? legacy.accent : DEFAULT_ACCENT;
  }
  function currentFont(){ return (store.ui && store.ui.font) || "avenir"; }

  function applyTheme(){
    const mode = currentColorMode();
    const t = Object.assign({ accent: currentAccent() }, GRAYSCALE[mode]);
    const vars = buildThemeVars(t);
    Object.keys(vars).forEach(k => { if(k !== "colorScheme") document.documentElement.style.setProperty(k, vars[k]); });
    document.documentElement.style.colorScheme = vars.colorScheme;
    document.documentElement.dataset.theme = mode;   // kept for the print stylesheet's :root[data-theme] override
    applyBranding(t);
  }

  // Logo/Favicon: Stapel aus drei abgerundeten Karten, die Farbe kommt aus dem Theme-Akzent
  // (nicht aus CSS-Variablen, da ein data:-URI-Favicon vom Browser separat vom Dokument
  // gerendert wird und keine var()-Werte auflöst).
  function stackIconSVG(t){
    // Cards sized/offset so the whole stack sits with equal 3-unit margin on all four sides of
    // the 24-unit box (was 3 top, 1 bottom — the back card crowded the bottom edge).
    const back = mixHex(t.accent, t.bg, 0.65), mid = mixHex(t.accent, t.bg, 0.35);
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">'
      + '<rect x="3" y="8" width="13" height="13" rx="4" fill="'+back+'"/>'
      + '<rect x="5.5" y="5.5" width="13" height="13" rx="4" fill="'+mid+'"/>'
      + '<rect x="8" y="3" width="13" height="13" rx="4" fill="'+t.accent+'"/>'
      + '</svg>';
  }
  function applyBranding(t){
    const svg = stackIconSVG(t);
    const icon = document.getElementById("app-icon");
    if(icon) icon.innerHTML = svg;
    const link = document.getElementById("app-favicon");
    if(link) link.setAttribute("href", "data:image/svg+xml," + encodeURIComponent(svg));
  }
  function applyFont(){
    const f = FONTS.find(x=>x.id===currentFont()) || FONTS[0];
    document.documentElement.style.setProperty("--editor-font", f.css);
  }

  const EDITOR_WIDTHS = [["narrow","Schmal",600], ["normal","Standard",700], ["wide","Breit",860], ["xwide","Sehr breit",1000]];
  const LINE_HEIGHTS = [["compact","Kompakt",1.45], ["normal","Standard",1.65], ["airy","Luftig",1.85]];
  function currentEditorWidth(){ return (store.ui && store.ui.editorWidth) || "normal"; }
  function currentLineHeight(){ return (store.ui && store.ui.lineHeight) || "normal"; }
  function applyEditorLayout(){
    const w = EDITOR_WIDTHS.find(x=>x[0]===currentEditorWidth()) || EDITOR_WIDTHS[1];
    const lh = LINE_HEIGHTS.find(x=>x[0]===currentLineHeight()) || LINE_HEIGHTS[1];

    document.documentElement.style.setProperty("--editor-lh", lh[2]);
  }

  // Einstellungen als Hauptseite + Unterseiten (Schrift, Breite, Zeilenabstand, Weitere, Export, Konto)
  let settingsPage = "main", settingsAnim = "";
  function renderSettings(){
    const mode = currentColorMode(), accent = currentAccent(), font = currentFont();
    const check = '<svg class="check" viewBox="0 0 20 20" fill="none"><path d="M4.5 10.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const customAccent = !ACCENT_SWATCHES.includes(accent);
    const chev = '<svg class="chev" viewBox="0 0 20 20" fill="none"><path d="M8 5l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    const fontName = (FONTS.find(f => f.id === font) || {}).name;
    const widthName = (EDITOR_WIDTHS.find(w => w[0] === currentEditorWidth()) || [])[1];
    const lhName = (LINE_HEIGHTS.find(l => l[0] === currentLineHeight()) || [])[1];
    const pages = {

            '<span class="accent-swatch'+(c===accent?" active":"")+'" data-accent="'+c+'" style="background:'+c+'" title="'+c+'"></span>').join("") +
          '<label class="accent-swatch accent-custom'+(customAccent?" active":"")+'" style="background:'+(customAccent?accent:"var(--surface, var(--bg))")+'" title="Eigene Farbe">' +
            '<input type="color" data-accent-custom value="'+(customAccent?accent:DEFAULT_ACCENT)+'">' +
          '</label>' +
        '</div>' +
        '<div class="set-sep"></div>' +
        nav("font", "Schrift", fontName) + nav("width", "Editor-Breite", widthName) + nav("lineheight", "Zeilenabstand", lhName) +
        '<div class="set-sep"></div>' +
        nav("stil", "Stil", [syntaxOn() ? "Syntax" : "", styleOn() ? "Stilprüfung" : ""].filter(Boolean).join(" · ") || "aus") +
        toggle("sentencefocus", sentenceFocusOn(), "Satzfokus", "im Fokus-Modus") +
        toggle("softcaret", softCaretOn(), "Weicher Cursor") +
        nav("more", "Weitere Optionen") +
        '<div class="set-sep"></div>' +
        nav("export", "Export & Sicherung") +
        nav("account", "Konto & Sync", sync.session ? (sync.session.email || "verbunden") : "nicht verbunden"),
      font: () => back("Schrift") + '<div class="ptrack-v" data-ptrack="font">' +
        FONTS.map(f=>'<div class="opt'+(f.id===font?" active":"")+'" data-font="'+f.id+'" style="font-family:'+f.css+'">'+f.name+check+'</div>').join("") + '</div>',
      width: () => back("Editor-Breite") + '<div class="ptrack-v" data-ptrack="editorwidth">' +
        EDITOR_WIDTHS.map(w=>'<div class="opt'+(w[0]===currentEditorWidth()?" active":"")+'" data-editorwidth="'+w[0]+'">'+w[1]+'<kbd>'+w[2]+'px</kbd>'+check+'</div>').join("") + '</div>',
      lineheight: () => back("Zeilenabstand") + '<div class="ptrack-v" data-ptrack="lineheight">' +
        LINE_HEIGHTS.map(l=>'<div class="opt'+(l[0]===currentLineHeight()?" active":"")+'" data-lineheight="'+l[0]+'">'+l[1]+'<kbd>'+l[2]+'</kbd>'+check+'</div>').join("") + '</div>',
      stil: () => back("Stil") +
        toggle("syntax", syntaxOn(), "Syntax", "⌘⇧S") +
        STIL_SYNTAX.map(([k, label]) => '<div class="opt toggle stil-opt'+(stilOff().includes(k) ? "" : " active")+(syntaxOn() ? "" : " dim")+'" data-stil="'+k+'">' +
          '<i style="background:var(--syn-'+k+')"></i>'+label+'<span class="sw"></span></div>').join("") +
